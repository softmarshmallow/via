# The diagnostic code registry (spec/diagnostics.md section 2; R1: flat TOML keyed by code).
# Every key but `explain` is derived from the chapters' Diagnostics tables by section 2's
# rules; `cargo run -p via-diag --example gen_reference -- --sync` rewrites them and keeps
# `explain`. `explain` is hand-written: what the code means, what to change, one bad and one
# fixed example, in neutral names (the deny-list of spec/vocabulary.md 7 applies).

[asset.bad_footprint]
severity = "error"
chapter = "assets"
milestone = 1
summary = "A declared footprint is not a simple polygon of at least three distinct points, counter-clockwise."
explain = """
A declared footprint is not a simple polygon of at least three distinct points, counter-clockwise.
To fix: Reverse the points, or remove the repeated one.
"""

