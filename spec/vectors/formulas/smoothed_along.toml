# formulas.md case 36: smoothed_along(4) on a 10 m path at spacing 1 over base = "= x".
# The path p runs from [3, 4] to [13, 4] (spec/cases/formulas/c36_smoothed_along). Its samples
# (formulas.md 8.5) are at arc lengths 0 to 10 m, the lattice points [3 + j, 4], each the field's
# value there: v_j = 3 + j, exact on posts. Half-width k = floor(4 / (2 * 1)) = 2; two passes of
# the shrinking moving mean, each sum left to right in doubles, then divided by the count. A post
# on the path at arc length s = j reads u_j exactly (mix at fraction 0, or u_(n-1) at s = L).
# Doubles as numbers.md 10 writes them: bits normative, decimal for reading. The built field is
# 32-bit, so a case compares each post narrowed to 32 bits, ties to even (numbers.md 8).
# Derived by the chapter's rule, not recorded from a build. Form of numbers.md 10, with `fn`
# "smoothed_along" and args [path, length, spacing, sample index]; `via vectors` lists no such fn,
# so the case states these values as its own post checks.

