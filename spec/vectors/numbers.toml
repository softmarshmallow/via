# Test vectors of spec/numbers.md section 10, machine-readable. The chapter's tables are the source;
# this file is their copy in the form section 10 gives, in the order of its tables. Doubles and words
# are bit patterns (`0x` and 16 upper-case hex digits); the bits are normative. Decimals read by
# section 3 are strings of their text, never TOML floats. Integers are millimetres, millidegrees or
# keys. A rejection is `{ code = "<code>" }`.
#
# Read by via-num's tests (crates/via-num/tests/vectors.rs), by `via vectors` (build.md 14) and by
# the SDK's tests. Computed with libm 0.2.16, default-features = false, force-soft-floats.
# `point_at`, `measure` and `samples` are evaluated by via-geom; the rest by via-num, whose null
# digest over them is recorded in spec/vectors/num/null_digest.txt.

