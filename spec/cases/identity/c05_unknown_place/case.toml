format    = "via-case-1"
summary   = "on = { ref = \"lane.edn\" }: identity.unknown_place, hint lane.end, exit 1."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.unknown_place]
code = "identity.unknown_place"
data = { nearest = "lane.end" }
