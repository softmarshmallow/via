format    = "via-case-1"
summary   = "First build in a fresh directory: identity.no_previous; build again: no such message."
milestone = 1
actions   = ["first", "again"]

# Run diagnostics are compared as includes (conformance.md 3.5), so the second build's absence of identity.no_previous is not asserted.

[action.first]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.first.diag.no_previous]
code = "identity.no_previous"
from = "run"

[action.again]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"
