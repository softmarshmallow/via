format    = "via-case-1"
summary   = "Obligation 4: the grid with cells and a thing per cell placed by a step; bend the northmost rib between two crossings; every area and rib name is unchanged, every cell, rest and per-cell instance name outside the bent edge's area is unchanged (3.6's Local guarantee, geometry.md 8.4), and the lamp's edge is not reselected against a baseline that is present."
milestone = 3
actions   = ["program", "trust", "base", "bent", "again"]

# The bent edge is ribs#y170's from [20, 170] to [70, 170]: the rib's vertex at x = 45 is lifted
# 2 m (geometry.md 8.4). 3.6's Local guarantee lets the cells of the areas that edge bounds change,
# and only those: the box [20, 120, 70, 180] is that area, edges excluded (conformance.md, names_kept),
# so a neighbour's cell that only shares the line x = 20, x = 70 or y = 120 is still checked. The
# per-cell instances are checked by origin with the same box. Junction and edge names are not written
# to features.json (geometry.md 8.1): the lamp's selection not reselecting, against a baseline shown
# present, is how an edge name is seen to hold.

[copy.grid]
from = "spec/vectors/cells/grid"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--change", "lamp", "--out", "build/a"]
exit        = 0
diagnostics = "includes"
out         = "build/a"

[action.bent]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--change", "lamp", "--change", "bend", "--out", "build/b"]
exit        = 0
diagnostics = "includes"
out         = "build/b"

[action.bent.check.areas]
fn     = "names_kept"
first  = "build/a/features.json"
second = "build/b/features.json"
prefix = "grid#a"

[action.bent.check.cells]
fn            = "names_kept"
first         = "build/a/features.json"
second        = "build/b/features.json"
prefix        = "plots#"
except_within = [20, 120, 70, 180]

[action.bent.check.homes]
fn            = "names_kept"
first         = "build/a/instances/names.txt"
second        = "build/b/instances/names.txt"
prefix        = "homes#"
except_within = [20, 120, 70, 180]

[action.bent.check.ribs]
fn     = "names_kept"
first  = "build/a/features.json"
second = "build/b/features.json"
prefix = "ribs#"

[action.again]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--change", "lamp", "--change", "bend", "--out", "build/a"]
exit        = 0
diagnostics = "includes"
out         = "build/a"

[action.again.diag.reselected]
code    = "identity.reselected"
from    = "run"
records = 0

# The baseline was there: without it `reselected = 0` would pass for want of a comparison.
[action.again.diag.no_previous]
code    = "identity.no_previous"
from    = "run"
records = 0

[action.again.diag.baseline_missing]
code    = "build.baseline_missing"
from    = "run"
records = 0
