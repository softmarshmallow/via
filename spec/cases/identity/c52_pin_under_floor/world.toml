name       = "hall"
extent     = [0, 0, 64, 64]
resolution = 1
pack       = "pack.toml"
include    = ["surfaces_test"]

[field.height]
role = "surface"
base = 10

# A surface that stands clear of the ground: its kind writes no `cut`.
[feature.stage]
kind   = "roof"
region = [[20, 20], [32, 20], [32, 28], [20, 28]]
eaves  = 14

# On the south edge itself, so each box is half over it.
[run.edge]
asset = "box"
on    = { ref = "stage", span = [0, 0.3] }
count = 6

[change.beside.pin.mark]
asset = "box"
at    = [25, 19.2]

[change.under.pin.mark]
asset = "box"
at    = [25, 20.3]
