format    = "via-case-1"
summary   = "Pack swapped: ford, then a change writing pack to a larger house: the cottage changed with old and new facts, causes asset.house_low.size and world.pack; its ground footprint moved, larger."
milestone = 1
actions   = ["program", "trust", "base", "bigger"]

# assets.md's `Pack swap` row (section 7, 6.2), identity.md case 46 and the plan's ford row
# changes/bigger.toml. The second pack is packs/primitive_large.toml, derived from assets.md 6.1
# with the one line 6.2 changes. Entries sort by table, then name (build.md 11.2): the fields the
# larger pad touches (clearing, height, water), then footprint cottage, then instance cottage.
# Facts compare as manifest.json writes them; `footprint`'s value is not given by a chapter, so
# only `bounds` and `size` are asserted. The cottage is also `moved`: the larger pad levels its
# ground to another mean, so its height differs (assets.md 7, identity.md 5).
#
# Where each cause was written (build.md 11.2: a cause's file and line are the statement's).
# asset.house_low.size is the declared `size` of [asset.house_low] in the second pack, line 15 of
# examples/ford/packs/primitive_large.toml (assets.md 6.1, 6.2), written as a source path:
# documents.md 2.1 gives the pack file the first form that fits, `pack:` and its path relative to
# the pack file's folder, so `pack:primitive_large.toml` (diagnostics.md 1.2: documents.md wins).
# It is in this build's text, `in = "this"`; a declared fact has a line, so neither is null.
# world.pack is written by changes/bigger.toml at line 1, a file under the world's folder, so its
# path. Each entry has these two causes and no other.

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "changes/bigger.toml"]
exit = 0

[action.base]
via       = ["build", "world.toml", "--out", "build/ford"]
out       = "build/ford"
exit      = 0
diagnostics = "includes"
untouched = ["world.toml"]

[action.bigger]
via       = ["build", "world.toml", "--change", "changes/bigger.toml", "--against", "build/ford", "--out", "build/ford+bigger"]
out       = "build/ford+bigger"
exit      = 0
diagnostics = "includes"
untouched = ["world.toml", "build/ford"]

[action.bigger.file.footprint]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/3"
includes = { name = "cottage", table = "footprint", what = ["moved"] }

[action.bigger.file.footprint_facts]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/3/facts"
includes = [
    { fact = "bounds", before = [-4, -3, 0, 4, 3, 4], after = [-5, -4, 0, 5, 4, 4] },
    { fact = "size", before = [8, 6, 4], after = [10, 8, 4] },
]

[action.bigger.file.footprint_cause_size]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/3/causes/0"
includes = { cause = "asset.house_low.size", file = "pack:primitive_large.toml", line = 15, in = "this" }

[action.bigger.file.footprint_cause_pack]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/3/causes/1"
includes = { cause = "world.pack", file = "changes/bigger.toml", line = 1, in = "this" }

[action.bigger.file.cottage]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/4"
includes = { name = "cottage", table = "instance", what = ["moved", "changed"] }

[action.bigger.file.cottage_facts]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/4/facts"
includes = [
    { fact = "bounds", before = [-4, -3, 0, 4, 3, 4], after = [-5, -4, 0, 5, 4, 4] },
    { fact = "size", before = [8, 6, 4], after = [10, 8, 4] },
]

[action.bigger.file.cottage_cause_size]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/4/causes/0"
includes = { cause = "asset.house_low.size", file = "pack:primitive_large.toml", line = 15, in = "this" }

[action.bigger.file.cottage_cause_pack]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/4/causes/1"
includes = { cause = "world.pack", file = "changes/bigger.toml", line = 1, in = "this" }

[action.bigger.check.footprint_two_causes]
fn      = "json_count"
path    = "build/ford+bigger/changes.json"
pointer = "/entries/3/causes"
count   = 2

[action.bigger.check.cottage_two_causes]
fn      = "json_count"
path    = "build/ford+bigger/changes.json"
pointer = "/entries/4/causes"
count   = 2

# The three fields the larger pad touches (entries 0 to 2). build.md 11.2: a field's `keys` are
# `samples` and any key of its manifest entry that differs (none here), never `facts`; `facts` is
# for an instance or footprint, so a field's is `[]`. Its cause may still be the asset's size.
[action.bigger.file.clearing_keys]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/0"
includes = { name = "clearing", table = "field", keys = ["samples"], facts = [] }

[action.bigger.file.height_keys]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/1"
includes = { name = "height", table = "field", keys = ["samples"], facts = [] }

[action.bigger.file.water_keys]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/2"
includes = { name = "water", table = "field", keys = ["samples"], facts = [] }
