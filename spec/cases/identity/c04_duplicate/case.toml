format    = "via-case-1"
summary   = "[feature.x] in the world file and in a layer: one identity.duplicate_id naming both files and lines, exit 1."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.duplicate_id]
code    = "identity.duplicate_id"
records = 1
