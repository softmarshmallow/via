format    = "via-case-1"
summary   = "ford at 1 and 8 threads: same digest."
milestone = 1
actions   = ["program", "trust", "one", "eight"]

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.one]
via         = ["build", "world.toml", "--threads", "1", "--out", "build/one"]
exit        = 0
diagnostics = "includes"
out         = "build/one"

[action.eight]
via         = ["build", "world.toml", "--threads", "8", "--out", "build/eight"]
exit        = 0
diagnostics = "includes"
out         = "build/eight"

[action.eight.same.id]
action = "one"
what   = "id"
