format    = "via-case-1"
summary   = "ford on macOS, Linux (and Windows once allowed): same digest."
milestone = 1
actions   = ["program", "trust", "build"]

# U7: the runner's per-system record holds the build id; `compare` checks two records agree (conformance.md 5.3).

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"
