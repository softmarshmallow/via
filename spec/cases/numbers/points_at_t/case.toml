format    = "via-case-1"
summary   = "The section 10 points-at-t table as instances placed on: positions and along facings as tabled."
milestone = 1
actions   = ["vectors"]

# The section 10 points-at-t table through `via vectors` (fn point_at).

[copy.vectors]
from = "spec/vectors/numbers.toml"
to   = "numbers.toml"

[action.vectors]
via  = ["vectors", "numbers.toml"]
exit = 0

[action.vectors.check.v]
fn   = "vectors_match"
path = "numbers.toml"
fns  = ["point_at"]
