format    = "via-case-1"
summary   = "Path A and the square, counter-clockwise and clockwise; a formula writing sd, d and t: the section 10 measures at those posts."
milestone = 1
actions   = ["vectors"]

# The section 10 measures table through `via vectors` (fn measure).

[copy.vectors]
from = "spec/vectors/numbers.toml"
to   = "numbers.toml"

[action.vectors]
via  = ["vectors", "numbers.toml"]
exit = 0

[action.vectors.check.v]
fn   = "vectors_match"
path = "numbers.toml"
fns  = ["measure"]
