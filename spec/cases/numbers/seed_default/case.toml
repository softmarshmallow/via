format    = "via-case-1"
summary   = "A scatter with no seed; the same with seed = \"<its id>\": same instances."
milestone = 1
actions   = ["plain", "named"]

[action.plain]
via  = ["build", "a/world.toml", "--out", "a/build/w"]
exit = 0
out  = "a/build/w"

[action.named]
via  = ["build", "b/world.toml", "--out", "b/build/w"]
exit = 0
out  = "b/build/w"

[action.named.same.id]
action = "plain"
what   = "id"
