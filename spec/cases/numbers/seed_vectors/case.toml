format    = "via-case-1"
summary   = "spec/vectors/numbers.toml; via vectors: every vector's bits."
milestone = 1
actions   = ["vectors"]

[copy.vectors]
from = "spec/vectors/numbers.toml"
to   = "numbers.toml"

[action.vectors]
via  = ["vectors", "numbers.toml"]
exit = 0

[action.vectors.check.v]
fn   = "vectors_match"
path = "numbers.toml"
