format    = "via-case-1"
summary   = "extent = [0, 0, 2000000, 2000000], resolution = 0.001: num.too_many_posts, exit 1, before any allocation of the grid."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.too_many_posts]
code = "num.too_many_posts"
