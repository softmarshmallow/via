name       = "footprint_ref"
extent     = [0, 0, 32, 16]
resolution = 1
datum      = "sea"
include    = ["marks"]

[field.height]
role = "surface"
base = 0

[field.probe]
base = "= if(inside('a.footprint'), 1, 0)"

[import.a]
file      = "a/world.toml"
at        = [8, 4]
footprint = [[0, 0], [4, 0], [4, 8], [0, 8]]

[feature.rim]
follows = { ref = "a.footprint" }
