format    = "via-case-1"
summary   = "A field derived from the ground in both worlds, the import's ground 2 m below the parent's own after the blend: the parent's water is laid by its depth over its own ground, so the ring is never wetter than either side alone (composition.md 6.2)."
milestone = 6
actions   = ["build"]

# Parent height 4, a's 0, blend 0.5: the ground at (12, 4) is 2. The parent's level is 3 (under its
# own ground: dry), and 5 west of x = 10 (1 m deep). Mixed as levels on the joined ground, the
# level was 2.5 at (12, 4) (0.5 m wet where neither side was) and 3.5 at (9, 4) (1.5 m: deeper than
# the parent alone). Lowered by 2 (its own ground 4 less the joined 2): 1.5 (dry) and 2.5 (0.5 m,
# half the parent's 1 m, a's 0).

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.build.file.ground]
path  = "build/w/fields/height.npy"
post  = [12, 4]
value = 2
[action.build.file.dry]
path  = "build/w/fields/level.npy"
post  = [12, 4]
value = 1.5
[action.build.file.half]
path  = "build/w/fields/level.npy"
post  = [9, 4]
value = 2.5
[action.build.file.outside]
path  = "build/w/fields/level.npy"
post  = [2, 4]
value = 5
