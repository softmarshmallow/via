format    = "via-case-1"
summary   = "a's height from a file h.npy (2), edited in place to 5 between two builds on one store: the brought height is 5, as a fresh build gives (composition.md 12, import:<id> holds the import's input leaves)."
milestone = 4
actions   = ["first", "edit", "edited"]

[action.first]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.first.file.brought]
path  = "build/w/fields/height.npy"
post  = [12, 4]
value = 2

[action.edit]
write = "a/h.npy"
from  = "later/h5.npy"

[action.edited]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.edited.file.brought]
path  = "build/w/fields/height.npy"
post  = [12, 4]
value = 5
