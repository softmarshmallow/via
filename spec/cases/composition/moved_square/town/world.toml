name       = "town"
extent     = [0, 0, 32, 16]
resolution = 1
datum      = "sea"
include    = ["marks"]

[field.height]
role = "surface"
base = 0

[given.districts]
accepts = "features"
kind    = "zone"

[given.squares]
accepts = "features"
kind    = "spot"

[step.lay]
when     = "generate"
command  = ["python", "-m", "viasdk", "steps/lay.py"]
worker   = true
for_each = "given:districts"
