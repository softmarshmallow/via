format    = "via-case-1"
summary   = "Parent datum sea, import datum chart: import.datum_differs, exit 1; with lift = 2 no diagnostic and the import's height 2 m higher in the parent."
milestone = 4
actions   = ["build", "lift", "lifted"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"
[action.build.diag.datum]
code = "import.datum_differs"
data = { datum = "chart", parent_datum = "sea" }

[action.lift]
replace = "world.toml"
find    = "max_grade = 10"
with    = """max_grade = 10
lift = 2"""

[action.lifted]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.lifted.file.h]
path  = "build/w/fields/height.npy"
post  = [12, 4]
value = 2
