format    = "via-case-1"
summary   = "The import's own pack binds box_small to a 1 m box, the parent's to the primitive pack's 2 m box: import.binding_differs, data.id box_small; exit 1."
milestone = 4
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"
[action.build.diag.binding]
code = "import.binding_differs"
data = { id = "box_small" }
