format    = "via-case-1"
summary   = "Neither world declares a datum and the import has no lift: import.no_datum warning with data.write; exit 0."
milestone = 4
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.build.diag.datum]
code     = "import.no_datum"
severity = "warning"
data_has = ["write"]
