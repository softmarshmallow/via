format    = "via-case-1"
summary   = "An import whose field tone comes from its own generate step: the parent's tone reads 3 inside the footprint and 0 outside, as the import alone has it (composition.md 3, 12)."
milestone = 4
pending   = "an import's own steps do not run yet: its graph is not in the parent's (composition.md 12, `<id>.` prefix); TODO From M4 slice 2"
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.build.file.inside]
path  = "build/w/fields/tone.npy"
post  = [12, 4]
value = 3

[action.build.file.outside]
path  = "build/w/fields/tone.npy"
post  = [2, 4]
value = 0
