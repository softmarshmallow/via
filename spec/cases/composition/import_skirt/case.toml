format    = "via-case-1"
summary   = "composition.md 6.1: a cutting face (a strip 1 m wide) brought from 0.5 m posts onto 2 m posts. Written on the 2 m posts itself (`own.toml`) it cuts 3 quads in a staircase, (2, 3), (4, 4), (5, 4), with uncut quads between them across its line. Brought, it cuts as if half a parent quad's diagonal wide: 10 quads in an unbroken chain from (1, 2) to (6, 5), none skipped across the line ((4, 3) stays whole), and its skirt, stroked by the parent's posts, covers them: 58 triangles. Before M7 the import's own skirt was kept over the staircase: 41 triangles, the cut quads open past it (atlas: coast.along_cliff fell 35.5 m at the face's foot)."
milestone = 7
actions   = ["own", "brought"]

[action.own]
via         = ["build", "own.toml", "--lib", "{work}/lib", "--out", "build/own"]
exit        = 0
diagnostics = "includes"
out         = "build/own"

[action.own.file.triangles]
path    = "build/own/manifest.json"
pointer = "/meshes/0/triangles"
value   = 37

[action.own.file.cut]
path  = "build/own/fields/height.cut.npy"
post  = [2, 3]
value = 1

[action.own.file.skipped]
path  = "build/own/fields/height.cut.npy"
post  = [3, 3]
value = 0

[action.brought]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.brought.file.feature]
path    = "build/w/manifest.json"
pointer = "/meshes/0/feature"
value   = "a.wall"

[action.brought.file.triangles]
path    = "build/w/manifest.json"
pointer = "/meshes/0/triangles"
value   = 58

[action.brought.file.first]
path  = "build/w/fields/height.cut.npy"
post  = [1, 2]
value = 1

[action.brought.file.chain]
path  = "build/w/fields/height.cut.npy"
post  = [3, 3]
value = 1

[action.brought.file.last]
path  = "build/w/fields/height.cut.npy"
post  = [6, 5]
value = 1

[action.brought.file.whole]
path  = "build/w/fields/height.cut.npy"
post  = [4, 3]
value = 0
