format    = "via-case-1"
summary   = "A shaped import of height 2 in the world layer and a shaped pad setting 6 across its edge in layer join, rank 1: 6 inside the footprint; join at rank -1: 2."
milestone = 4
actions   = ["build", "lower", "lowered"]

# The ridge straddles the footprint's edge at x = 8, so nesting does not order it; rank does.

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.build.file.join]
path  = "build/w/fields/height.npy"
post  = [9, 4]
value = 6

[action.lower]
replace = "world.toml"
find    = "rank  = 1"
with    = "rank  = -1"

[action.lowered]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.lowered.file.join]
path  = "build/w/fields/height.npy"
post  = [9, 4]
value = 2
