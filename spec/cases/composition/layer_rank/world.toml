name       = "layer_rank"
extent     = [0, 0, 32, 16]
resolution = 1
datum      = "sea"
include    = ["marks"]

# The field lies below every layer that writes it (`documents.md` 5.1): the join layer may be
# lowered to rank -1 and still write it.
[layer.ground]
file  = "layers/ground.toml"
owner = "ground"
rank  = -2

[import.a]
file = "a/world.toml"
at   = [8, 0]
max_grade = 10

[layer.join]
file  = "layers/join.toml"
owner = "join"
rank  = 1
