format    = "via-case-1"
summary   = "A generate step in layer join (rank 1) reads height and a.height and returns a field own equal to the import's height inside the footprint; the layer at rank -1: graph.read_outside."
milestone = 4
actions   = ["program", "trust", "build", "lower", "trust_again", "lowered"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/lib"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.build.file.own]
path  = "build/w/fields/own.npy"
post  = [12, 4]
value = 2

[action.lower]
replace = "world.toml"
find    = "rank  = 1"
with    = "rank  = -1"

[action.trust_again]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/lib"]
exit = 0

[action.lowered]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"
[action.lowered.diag.outside]
code = "graph.read_outside"
