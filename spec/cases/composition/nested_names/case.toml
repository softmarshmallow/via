format    = "via-case-1"
summary   = "p imports m at (8, 0), m imports n at (2, 0), n holds hut at (1, 1): m.n.hut stands at (11, 1), and a guide on m.n.hut resolves."
milestone = 4
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.build.check.hut]
fn    = "instance_at"
build = "build/w"
name  = "m.n.hut"
at    = [11, 1]
