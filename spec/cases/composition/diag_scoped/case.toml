format    = "via-case-1"
summary   = "An import with a feature of an unknown kind: authority.unknown_kind, subject a.feature.bad, file a/world.toml; exit 1."
milestone = 4
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"
[action.build.diag.kind]
code    = "authority.unknown_kind"
subject = "a.feature.bad"
file    = "a/world.toml"
