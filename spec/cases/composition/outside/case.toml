format    = "via-case-1"
summary   = "An 8 m import at (28, 0) in a 32 m parent: import.outside, data.area 32; its instance past the edge is not in the build."
milestone = 4
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.build.diag.outside]
code = "import.outside"
data = { area = 32 }

[action.build.check.gone]
fn     = "names_count"
path   = "build/w/instances/names.txt"
prefix = "a.hut"
count  = 0
