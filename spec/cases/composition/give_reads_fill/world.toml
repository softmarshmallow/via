name       = "give_reads_fill"
extent     = [0, 0, 32, 16]
resolution = 1
datum      = "sea"
include    = ["marks"]

[field.height]
role = "surface"
base = 0

# The parent draws the fill's limits along the fill's own arterial, which reads no given: the
# limits reach `placed:town/arterial` only, never the given node, so there is no loop
# (composition.md 8, "What a give may read"; 12, one placed node per scoped name).
[import.town]
file = "town/world.toml"
at   = [8, 0]
give = { limits = "town_limits" }

[feature.town_limits]
where = "= dist('town.arterial', 8) < 2"
