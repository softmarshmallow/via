format    = "via-case-1"
summary   = "One file imported under two ids, a and b: no import.cycle; both a.hut and b.hut built."
milestone = 4
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "exact"
out         = "build/w"
[action.build.check.a]
fn     = "instance_at"
build  = "build/w"
name   = "a.hut"
at     = [2, 2]
[action.build.check.b]
fn     = "instance_at"
build  = "build/w"
name   = "b.hut"
at     = [18, 2]
