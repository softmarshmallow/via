name       = "routed_over_returned"
extent     = [0, 0, 16, 16]
resolution = 1
include    = ["marks"]

[field.height]
role = "surface"
base = "= 0"

[feature.p_start]
at = [0, 8]

[feature.p_end]
at = [16, 8]

# Routed to keep off marks, which the step `look` of this same layer returns: in the step's view
# there are none, in the build there is one on the straight line.
[feature.course]
starts_at = "p_start"
ends_at   = "p_end"
path      = []
route     = "= 1 + 100 * (1 - smoothstep(1, 3, dist('kind:mark', 4)))"

[step.look]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "steps/look.py"]
