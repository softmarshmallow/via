format    = "via-case-1"
summary   = "A byte flipped in the stored object of a height chunk the change does not touch; build --change downstream: graph.store_corrupt in the run report; that chunk ran; same bytes as clean."
milestone = 1
pending   = "needs an action that flips a byte in the store object a run report names (conformance.md 3.3 flips a path the case knows)"
actions   = ["program", "trust", "base", "changed"]

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "downstream"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--store", "store", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.changed]
via         = ["build", "world.toml", "--store", "store", "--change", "downstream", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.changed.diag.store_corrupt]
code = "graph.store_corrupt"
from = "run"
