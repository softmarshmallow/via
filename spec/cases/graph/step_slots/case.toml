format    = "via-case-1"
summary   = "ford's plain lint checks; alternate with and without downstream, four times: from the third build, the lint never runs."
milestone = 1
actions   = ["program", "trust", "one", "two", "three", "four"]

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "downstream"]
exit = 0

[action.one]
via         = ["build", "world.toml", "--change", "downstream", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.two]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.three]
via         = ["build", "world.toml", "--change", "downstream", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.three.nodes]
not_ran = ["step:checks"]

[action.four]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.four.nodes]
not_ran = ["step:checks"]
