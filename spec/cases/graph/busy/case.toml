format    = "via-case-1"
summary   = "The runner holds <directory>.lock: build: graph.busy, exit 1."
milestone = 1
actions   = ["build"]

[action.build]
via      = ["build", "world.toml", "--out", "build/w"]
exit     = 1
out      = "build/w"
holding  = "build/w.lock"
no_rerun = "a lock held by the runner"

[action.build.diag.busy]
code = "graph.busy"
from = "run"
