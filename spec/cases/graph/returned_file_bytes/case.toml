format    = "via-case-1"
summary   = "graph.md 5.1 and 7: a worker step whose param changes only the bytes of a returned field file, built twice in one store: the second build's field holds the new bytes, as a fresh store would."
milestone = 2
actions   = ["program", "trust", "one", "two"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.one]
via  = ["build", "world.toml", "--out", "build/w"]
exit = 0
out  = "build/w"
[action.one.file.wave]
path  = "build/w/fields/gen#wave.npy"
all   = 1

[action.two]
via  = ["build", "world.toml", "--change", "two", "--out", "build/w"]
exit = 0
out  = "build/w"
[action.two.nodes]
ran_includes = ["step:gen"]
[action.two.file.wave]
path  = "build/w/fields/gen#wave.npy"
all   = 2
[action.two.same.wave]
action = "one"
what   = "build/w/fields/gen#wave.npy"
differ = true
