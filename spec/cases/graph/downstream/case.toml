format    = "via-case-1"
summary   = "ford, then --change downstream into the clean build's directory: ran holds the ford's and its followers' nodes, and none of the far chunks."
milestone = 1
actions   = ["program", "trust", "base", "downstream"]

# graph.md's row: `ran` equals ford_downstream.ran, which is expected/ran.txt (conformance.md 2),
# derived from graph.md 1 and 2, not recorded. Chunks are 4 by 4 of k = 128 posts (513 posts a side);
# chunk (cx, cy) spans x 64cx to 64cx + 64 m. The ford moves on the beck from t = 0.55, about
# (153.6, 115.4), to t = 0.8, about (155.7, 51.6).
# - merge (another change set); no source changed. statements: shape:ford, attr:ford. Placement
#   edges: lane_west and lane_east arrive at the ford; at_ford, to_door, cottage stand on lane_west;
#   in_trees on lane_east; footprint, height of the cottage follow. Name attributes: at_ford and
#   on_bank (toward ford), to_door (toward cottage), in_trees (toward lane_east.end). on_bank's shape
#   stands on the beck, which is unchanged; beck, lane attrs and every select are not touched.
# - rule:trees reads shape:lane_east (near at a candidate's point, formulas.md 6.9) and the
#   surface and keep_out chunks; held:trees and height:trees follow.
# - distance nodes: the moved features' effect windows (fields.md 5.3) after the change: ford
#   (radius 21) chunks (2, 0), (2, 1); lane_west (12) columns 0 to 2, rows 0 to 2; lane_east
#   columns 2, 3, rows 0 to 2; cottage.ground (pad, 4) (1, 1). The beck's are reused.
# - measures: each moved feature's under/smoothed_along, and the beck's bed (it is anchored, so it
#   reads the lanes' and the pad's shaped entries before it, authority.md 4.2) and level (it reads
#   water's base, f('height')). graph.md 1 does not spell <call>, so these end in `*`.
# - height: every chunk a moved window meets before or after (rows 0 to 2), and every chunk the
#   beck meets (columns 1, 2), whose bed measure changed: all but (0, 3) and (3, 3).
# - clearing: what the lanes and the pad meet, rows 0 to 2, and the cottage's chunk in
#   build-nofootprint (rules.md 8.3); the beck's bank has no measure, so row 3 is reused.
# - water: the beck's columns (its level measure), and where height's value changed: (0, 1),
#   (3, 1), (3, 2). (0, 0), (3, 0) and (0, 2) lie beyond every lane's mask (d >= 8 m), so height
#   ran there with an unchanged value and water is reused (early cutoff).
# - step:checks reads the finished build; every write but .previous (graph.md shuffle row).

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "downstream"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.downstream]
via         = ["build", "world.toml", "--change", "downstream", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.downstream.nodes]
ran_file = "expected/ran.txt"
