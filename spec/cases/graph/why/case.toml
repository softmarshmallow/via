format    = "via-case-1"
summary   = "The downstream case; read the run report: every ran node names a cause; shape:ford/v:build's is \"statements\"."
milestone = 1
actions   = ["program", "trust", "base", "downstream"]

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "downstream"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.downstream]
via         = ["build", "world.toml", "--change", "downstream", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.downstream.check.valid]
fn   = "run_report_valid"
path = "build/ford.run.json"

[action.downstream.check.ford]
fn       = "run_node"
path     = "build/ford.run.json"
node     = "shape:ford/v:build"
includes = { status = "ran", cause = { reason = "statements" } }
