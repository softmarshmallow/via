format    = "via-case-1"
summary   = "One vertex of the beck moved: the beck's nodes, then those of downstream, run; the far chunks do not."
milestone = 1
actions   = ["program", "trust", "base", "vertex"]

# graph.md's `vertex` row, the plan's ford row changes/vertex.toml ("Must follow"); its "Must hold"
# is fields/change_windows. `ran` equals ford_vertex.ran, which is expected/ran.txt (conformance.md
# 2), derived from graph.md 1 and 2, not recorded; the downstream case's notes give the chunks and
# the reasons that repeat here. The beck's vertex [160, 90] moves to [164, 90]:
# - source:changes/vertex.toml (a new node), merge; statements: shape:beck, attr:beck. Then
#   on_bank and the ford stand on the beck (the ford moves about 2.8 m east, to about (156.4, 115.3));
#   the lanes, the bookmarks, the cottage, its footprint and the trees follow as in downstream.
# - distance: beck in columns 1 and 2, every row (bbox grown by 16 m stays below x = 192); ford
#   (2, 1), (2, 2); lane_west columns 0 to 2 and lane_east columns 2, 3, rows 1 and 2;
#   cottage.ground (1, 1), (1, 2), since the pad straddles y = 128; so does the cottage's own
#   footprint, so build-nofootprint clearing runs in both.
# - height: the beck's columns and rows 1, 2 of columns 0 and 3. clearing: the same, less (1, 3)
#   and (2, 3): above y = 192 the beck's nearest point is the unmoved vertex (140, 170), so
#   distance:beck there ran with an unchanged value, and the bank has no measure (early cutoff).
#   water: the beck's columns, then (0, 1), (3, 1), (3, 2), as in downstream.

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "changes/vertex.toml"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.vertex]
via         = ["build", "world.toml", "--change", "changes/vertex.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.vertex.nodes]
ran_file = "expected/ran.txt"
