format    = "via-case-1"
summary   = "A path; interpolate(project(p)) for 1000 seeded points: within 1 mm of the exact nearest point."
milestone = 1
actions   = ["project", "feed", "interpolate"]

# in.json: a six-vertex path with right, acute and obtuse turns, and 1000 integer points drawn by
# Python's random.Random(20261115), x in [-8000, 14000], y in [-4000, 16000] mm. `feed` hands each
# projected t to interpolate (conformance.md 3.3 derive); roundtrip_point measures each result
# against the exact nearest point the runner computes in rationals (geometry.md 3.8).

[action.project]
via  = ["kernel", "project", "--in", "in.json", "--out", "projected.json"]
exit = 0

[action.feed]
derive = "back.json"
from   = "projected.json"
as     = "interpolate"
input  = "in.json"

[action.interpolate]
via  = ["kernel", "interpolate", "--in", "back.json", "--out", "out.json"]
exit = 0

[action.interpolate.check.near]
fn    = "roundtrip_point"
path  = "out.json"
input = "in.json"
bound = 1
