format    = "via-case-1"
summary   = "A field below 0 everywhere; where: empty region, geom.mask_empty with the formula and its range, exit 0. A feature on that region: geom.no_length."
milestone = 1
actions   = ["empty", "on"]

[action.empty]
via         = ["build", "a/world.toml", "--out", "a/build/w"]
exit        = 0
diagnostics = "includes"
out         = "a/build/w"

[action.empty.diag.mask_empty]
code     = "geom.mask_empty"
severity = "warning"

[action.on]
via         = ["build", "b/world.toml", "--out", "b/build/w"]
exit        = 1
diagnostics = "includes"
out         = "b/build/w"

[action.on.diag.no_length]
code = "geom.no_length"
