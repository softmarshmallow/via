format    = "via-case-1"
summary   = "ford, then with downstream, then with changes/vertex.toml: no post of height, clearing or water changes outside the moved entries' windows."
milestone = 1
actions   = ["program", "trust", "base", "downstream", "vertex"]

# fields.md's `change windows` row and the plan's ford rows downstream and vertex ("Must hold").
# The named check reads the kinds files the world includes; they are copied out of lib/ into
# kinds/, not into lib/ beside the world, which the build would search first (documents.md 4).

[copy.ford]
from = "examples/ford"
to   = "."

[copy.land]
from = "lib/land/kinds.toml"
to   = "kinds/land.toml"

[copy.water]
from = "lib/water/kinds.toml"
to   = "kinds/water.toml"

[copy.ways]
from = "lib/ways/kinds.toml"
to   = "kinds/ways.toml"

[copy.review]
from = "lib/review/kinds.toml"
to   = "kinds/review.toml"

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "downstream", "--change", "changes/vertex.toml"]
exit = 0

[action.base]
via  = ["build", "world.toml", "--out", "build/ford"]
out  = "build/ford"
exit = 0
diagnostics = "includes"

[action.downstream]
via  = ["build", "world.toml", "--change", "downstream", "--out", "build/ford+downstream"]
out  = "build/ford+downstream"
exit = 0
diagnostics = "includes"

[action.downstream.check.windows]
fn     = "changed_within_windows"
before = "build/ford"
after  = "build/ford+downstream"
fields = ["height", "clearing", "water"]
kinds  = ["kinds/land.toml", "kinds/water.toml", "kinds/ways.toml", "kinds/review.toml"]
world  = "world.toml"

[action.vertex]
via  = ["build", "world.toml", "--change", "changes/vertex.toml", "--out", "build/ford+vertex"]
out  = "build/ford+vertex"
exit = 0
diagnostics = "includes"

[action.vertex.check.windows]
fn     = "changed_within_windows"
before = "build/ford"
after  = "build/ford+vertex"
fields = ["height", "clearing", "water"]
kinds  = ["kinds/land.toml", "kinds/water.toml", "kinds/ways.toml", "kinds/review.toml"]
world  = "world.toml"
