format    = "via-case-1"
summary   = "an array file with extent half the world, outside = -1: posts beyond read -1."
milestone = 1
actions   = ["build"]

# The raster's samples lie at 1 m from (0, 0) to (4, 4) by its `extent`; its own size (5 by 5) never moves them.

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.file.inside]
path  = "build/w/fields/height.npy"
post  = [4, 4]
value = 44

[action.build.file.beyond]
path  = "build/w/fields/height.npy"
post  = [8, 8]
value = -1

[action.build.file.beyond_x]
path  = "build/w/fields/height.npy"
post  = [5, 0]
value = -1
