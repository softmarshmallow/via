format    = "via-case-1"
summary   = "an instance and no surface field: field.role_missing; diagnostics.json written."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.role_missing]
code = "field.role_missing"

[action.build.file.written]
path   = "build/w/diagnostics.json"
exists = true
