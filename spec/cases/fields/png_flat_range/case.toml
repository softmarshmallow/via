format    = "via-case-1"
summary   = "range = [3, 3] on a PNG field: field.file_range, exit 1."
milestone = 2
actions   = ["build"]

# fields.md 4.2: lo == hi is field.file_range (a constant is a `base`). h.png is a 9 by 9 8-bit
# grey ramp.

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
out         = "build/w"
diagnostics = "includes"

[action.build.diag.range]
code = "field.file_range"
line = 9
