format    = "via-case-1"
summary   = "unit = \"dg\": field.unit_unknown, hint deg."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.unit_unknown]
code = "field.unit_unknown"
data = { nearest = "deg" }
