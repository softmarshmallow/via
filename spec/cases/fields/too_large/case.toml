format    = "via-case-1"
summary   = "a header asking for more samples than the post-count limit: field.file_too_large, before any sample is read."
milestone = 1
actions   = ["build"]

# The header asks for 10^16 samples and the file holds none: a reader that read samples before checking would fail otherwise.

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.file_too_large]
code = "field.file_too_large"
