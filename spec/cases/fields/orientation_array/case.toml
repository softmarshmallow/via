format    = "via-case-1"
summary   = "a 2 by 2 array file with 1 in its first row's first value, 0 elsewhere, filter = \"nearest\": post (0, 0) (south-west) reads 1."
milestone = 1
actions   = ["build"]

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.file.sw]
path  = "build/w/fields/height.npy"
post  = [0, 0]
value = 1

[action.build.file.ne]
path  = "build/w/fields/height.npy"
post  = [8, 8]
value = 0
