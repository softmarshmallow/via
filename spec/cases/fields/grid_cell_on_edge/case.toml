format    = "via-case-1"
summary   = "height base = \"= x * x\"; sample at (2, 0) and (8, 0): at (2, 0) the cell is 2 to 3, gx = 5; at (8, 0), the last column, 7 to 8, gx = 15."
milestone = 1
actions   = ["sample"]

# surfaces.md 2.2 and 7: the terrain's place name is its field's name; points in integer millimetres.

[action.sample]
via  = ["query", "world.toml", "sample", "--in", "points.json", "--out", "out.json"]
exit = 0

[action.sample.file.gx]
path    = "out.json"
pointer = "/gx"
value   = [5, 15]

[action.sample.file.inside]
path    = "out.json"
pointer = "/inside"
value   = [true, true]
