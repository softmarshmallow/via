format    = "via-case-1"
summary   = "A PNG with gAMA and tRNS chunks: field.file_profile naming both, exit 0."
milestone = 2
actions   = ["build"]

# fields.md 4.1: gamma, colour profiles and tRNS are not applied; field.file_profile (info) names
# what was ignored. h.png is a 9 by 9 8-bit grey ramp, level 31 * column, with a gAMA chunk and a
# grey tRNS chunk.

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
out         = "build/w"
diagnostics = "includes"

[action.build.diag.profile]
code    = "field.file_profile"
subject = "field.height"
data    = { chunks = ["gAMA", "tRNS"] }
