format    = "via-case-1"
summary   = "planes.npy shape (2, 9, 9); double.npy descr <f8: field.file_format each."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.file_format]
code    = "field.file_format"
subject = "field.a"

[action.build.diag.b]
code    = "field.file_format"
subject = "field.b"
