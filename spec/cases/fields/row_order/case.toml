format    = "via-case-1"
summary   = "rows b (order 0) value 1, a (order 0) value 2, c (order -1) value 3, all mask 1: 1 (c, then a, then b)."
milestone = 1
actions   = ["build"]

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.file.all]
path = "build/w/fields/height.npy"
all  = 1
