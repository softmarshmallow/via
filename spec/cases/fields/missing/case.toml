format    = "via-case-1"
summary   = "file = \"none.npy\": doc.file_missing with the resolved path."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
