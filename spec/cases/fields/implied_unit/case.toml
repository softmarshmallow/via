format    = "via-case-1"
summary   = "surface, no unit: the build index lists unit = \"m\"."
milestone = 1
actions   = ["build"]

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.file.unit]
path    = "build/w/manifest.json"
pointer = "/fields/height/unit"
value   = "m"
