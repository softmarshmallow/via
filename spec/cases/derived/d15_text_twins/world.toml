name       = "derived"
extent     = [0, 0, 8, 8]
resolution = 1

[field.height]
role = "surface"
base = "= min(abs(x - 2) + abs(y - 4), abs(x - 6) + abs(y - 4))"

[feature.lake]
where = "= 1.5 - f('height')"
holds = [2, 4]

[feature.course]
path  = [[0, 0], [2, 1]]
route = 1

[step.found]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "steps/found.py"]
