name       = "derived"
extent     = [0, 0, 8, 8]
resolution = 1
include    = ["edge"]

# The cost is low only on the top row, so the course runs along the extent's edge: (0, 7), (1, 8),
# (7, 8), (8, 7). Smoothed, the curve through those points bulges past y = 8 unless it is held to
# the extent (derived.md 3 step 6); the bed's `smoothed_along` reads the field at every sample.

[field.height]
role = "surface"
base = "= 0.1 * x"

[feature.course]
kind      = "way"
starts_at = "p_start"
ends_at   = "p_end"
path      = []
route     = "= if(y > 7.5, 1, 100)"
smooth    = true

[feature.p_end]
at = [8, 7]

[feature.p_start]
at = [0, 7]
