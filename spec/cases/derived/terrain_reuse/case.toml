format    = "via-case-1"
milestone = 2
summary   = "A step re-runs only when what it read changed (plan, M2): a guide added far from every fact leaves the worker's trace unchanged, so the step is reused; a lake's level edited re-runs it."
actions   = ["program", "trust", "base", "marked", "raised"]

# The terrain library's step (lib/terrain) through the command line. Its program is built with
# `cargo build -p via-terrain`; the case names it as a configured program, as a world's user does.
# The world: land rising north from a sea in the south, a hollow at (200, 560) with a lake stated
# in it at 2.5 m (its ground lies below 2.2 m over most of the region and above 1.4 m all round
# it), and a river stated from the hills to the sea.

[action.program]
via  = ["config", "program", "via-terrain", "{repo}/target/debug/via-terrain"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--lib", "{repo}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.marked]
via         = ["build", "world.toml", "--lib", "{repo}/lib", "--change", "marker", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.marked.nodes]
reused = ["step:terrain"]

[action.raised]
via         = ["build", "world.toml", "--lib", "{repo}/lib", "--change", "marker", "--change", "raise_lake", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.raised.nodes]
ran_includes = ["step:terrain"]

[action.raised.diag.no_lake_perched]
code    = "step.facts.lake_perched"
records = 0

[action.raised.diag.no_lake_dry]
code    = "step.facts.lake_dry"
records = 0

[action.raised.diag.no_lake_level]
code    = "step.facts.lake_level"
records = 0

[action.raised.diag.no_river_uphill]
code    = "step.facts.river_uphill"
records = 0

[action.raised.diag.no_river_leaves]
code    = "step.facts.river_leaves"
records = 0

[action.raised.diag.no_river_lost]
code    = "step.facts.river_lost"
records = 0
