format    = "via-case-1"
summary   = "d01 with holds = [4, 0]: derive.dry, exit 0, an empty region."
milestone = 2
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.build.diag.dry]
code     = "derive.dry"
severity = "warning"
subject  = "feature.lake"
position = [4, 0]

[action.build.check.empty]
fn      = "json_count"
path    = "build/w/features.json"
pointer = "/features/0/pieces"
count   = 0
