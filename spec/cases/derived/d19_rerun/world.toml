name       = "derived"
extent     = [0, 0, 8, 8]
resolution = 1
include    = ["facts"]

[field.height]
role = "surface"
base = "= min(abs(x - 2) + abs(y - 4), abs(x - 6) + abs(y - 4))"

[feature.haven]
kind      = "mark"
authority = "anchored"
at        = [4, 4]

[layer.dress]
file  = "dress.toml"
owner = "the case"
rank  = 1

[change.move.feature.haven]
at = [5, 5]

[step.make]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "steps/make.py"]

[step.facts]
when    = "lint"
worker  = true
command = ["python", "-m", "viasdk", "steps/facts.py"]
checks  = ["make"]
