format    = "via-case-1"
summary   = "holds without where; route on a point feature: derive.holds_alone; derive.route_alone; exit 1."
milestone = 2
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.holds_alone]
code    = "derive.holds_alone"
subject = "feature.pool"
file    = "world.toml"
line    = 11

[action.build.diag.route_alone]
code    = "derive.route_alone"
subject = "feature.trail"
file    = "world.toml"
line    = 15
