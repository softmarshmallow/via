format    = "via-case-1"
summary   = "derive.descend on bowl from (8, 8); then from (4, 4): (8, 8), (7, 7), (6, 6), (5, 5), (4, 4), end pit; then a point feature, end pit."
milestone = 2
actions   = ["program", "trust", "build"]

# The worker lint (steps/probe.py) calls the operation and sends one warning per answer, its
# facts in `data`.

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.build.diag.descend_0]
code = "step.probe.descend_0"
data = { points = [8000, 8000, 7000, 7000, 6000, 6000, 5000, 5000, 4000, 4000], end = "pit", geometry = 1 }

[action.build.diag.descend_1]
code = "step.probe.descend_1"
data = { points = [4000, 4000], end = "pit", geometry = 0 }
