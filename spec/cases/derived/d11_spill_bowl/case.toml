format    = "via-case-1"
summary   = "A worker calling derive.spill on bowl from (4, 4), radius 0, then radius 2: level 16, then 5; dry false both times."
milestone = 2
actions   = ["program", "trust", "build"]

# The worker lint (steps/probe.py) calls the operation and sends one warning per answer, its
# facts in `data`.

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.build.diag.spill_0]
code = "step.probe.spill_0"
data = { level = 16, dry = false }

[action.build.diag.spill_1]
code = "step.probe.spill_1"
data = { level = 5, dry = false }
