name       = "derived"
extent     = [0, 0, 8, 8]
resolution = 1
include    = ["facts"]

[field.height]
role = "surface"
base = "= min(abs(x - 2) + abs(y - 4), abs(x - 6) + abs(y - 4))"

[feature.haven]
kind      = "mark"
authority = "anchored"
at        = [4, 4]

[step.make]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "steps/make.py"]
