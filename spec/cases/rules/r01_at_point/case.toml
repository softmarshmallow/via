format    = "via-case-1"
summary   = "at = [10.5, 20.25]: origin (10500, 20250) mm, z = 20.0, facing 0."
milestone = 1
actions   = ["build"]

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.file.x]
path = "build/w/instances/x.npy"
all  = 10500

[action.build.file.y]
path = "build/w/instances/y.npy"
all  = 20250

[action.build.file.z]
path = "build/w/instances/z.npy"
all  = 20

[action.build.file.f]
path = "build/w/instances/face.npy"
all  = 0
