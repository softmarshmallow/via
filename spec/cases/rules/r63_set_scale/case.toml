format    = "via-case-1"
summary   = "rules.md 4: a set placed with scale = 2 doubles its items' positions and sizes; an item's own scale multiplies."
milestone = 3
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
out         = "build/w"

[action.build.check.a]
fn = "instance_at"
build = "build/w"
name = "pair.a"
at = [106, 100]
scale = 2.0

[action.build.check.b]
fn = "instance_at"
build = "build/w"
name = "pair.b"
at = [94, 100]
scale = 1.0
