face = 90000

[action.build.check.r2]
fn = "instance_at"
build = "build/w"
name = "posts#r2"
at = [62.5, 10]
face = 90000

[action.build.check.r3]
fn = "instance_at"
build = "build/w"
name = "posts#r3"
at = [87.5, 10]
face = 90000

[action.build.check.four]
fn = "instance_at"
build = "build/w"
