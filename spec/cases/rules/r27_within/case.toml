format    = "via-case-1"
summary   = "Scatter within a region; grow the region: only additions."
milestone = 1
actions   = ["base", "grown"]

[action.base]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.grown]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--change", "c", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.grown.check.report]
fn     = "changes_by_prefix"
path   = "build/w/changes.json"
prefix = "trees#"
what   = ["added"]
