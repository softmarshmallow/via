format    = "via-case-1"
summary   = "r20 built at 1 and 8 threads: same bytes."
milestone = 1
actions   = ["one", "eight"]

[action.one]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--threads", "1", "--out", "build/one"]
exit = 0
out  = "build/one"

[action.eight]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--threads", "8", "--out", "build/eight"]
exit = 0
out  = "build/eight"

[action.eight.same.files]
action = "one"
what   = "files"
