format    = "via-case-1"
summary   = "r20, flat, no other instances; change assets: only swaps; no instance moved or removed."
milestone = 1
actions   = ["base", "changed"]

# The draw that picks an asset is its own stream (rules.md 7.4); a change of choices changes only what some draws pick. (open) every entry is `swapped`: one whose draw still picks tree_oak is not in the report.

[action.base]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.changed]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--change", "c", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.changed.check.report]
fn     = "changes_by_prefix"
path   = "build/w/changes.json"
prefix = "trees#"
what   = ["swapped"]
