format    = "via-case-1"
summary   = "clump with keys of both forms, and one with no radius: scatter.clump at each, exit 1."
milestone = 2
actions   = ["build"]

[action.build]
via  = ["build", "world.toml", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.both]
code    = "scatter.clump"
subject = "scatter.trees.clump"

[action.build.diag.no_radius]
code    = "scatter.clump"
subject = "scatter.bushes.clump"
