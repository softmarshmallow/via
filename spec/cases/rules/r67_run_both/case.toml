format    = "via-case-1"
summary   = "rules.md 5.1 and 11: spacing = 3, ends = both on a 30 m stretch: 11 members, at 10000 to 40000 mm every 3000."
milestone = 3
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
out         = "build/w"

