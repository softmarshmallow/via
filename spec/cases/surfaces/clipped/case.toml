format    = "via-case-1"
summary   = "surfaces.md Conformance, clipped: a crossing whose deck bound reaches 3 m past the extent's east edge: surface.clipped with the share lost."
milestone = 3
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.build.diag.clipped]
code = "surface.clipped"
subject = "feature.mill_bridge"

[action.build.diag.clipped.data]
share = 0.375
