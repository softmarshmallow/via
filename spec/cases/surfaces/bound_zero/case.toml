format    = "via-case-1"
summary   = "surfaces.md Conformance, bound_zero: a crossing with width = 0: surface.bound with the value, exit 1."
milestone = 3
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
