format    = "via-case-1"
summary   = "ford; a point on a cell edge, one on a post, one on the extent's east edge, the north-east corner; sample: equal to the vector, bit for bit; the edge points use the west and south cell."
milestone = 1
pending   = "the vector of sampled values owed with the case (surfaces.md Conformance: spec/vectors/surfaces/ moves to the case's folder) is not yet written"
actions   = ["program", "trust", "q"]

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.q]
via         = ["query", "world.toml", "sample", "--in", "in.json", "--out", "out.json"]
exit        = 0
diagnostics = "includes"
