name       = "yard"
extent     = [0, 0, 128, 128]
resolution = 1
pack       = "pack.toml"
include    = ["surfaces_test"]

[field.height]
role = "surface"
base = 10

[instance.wall]
asset = "panel"
at    = [60, 60]

[instance.tall]                  # the same piece twice the size: its port 10 m up
asset = "panel"
at    = [80, 60]
scale = 2

[feature.line]                   # a run 5 m above the ground, ending at the wall's port
kind    = "flight"
z0      = 15
z1      = 15
path    = [[60, 80]]
ends_at = "wall.port"

[feature.high]
kind    = "flight"
z0      = 20
z1      = 20
path    = [[80, 80]]
ends_at = "tall.port"
