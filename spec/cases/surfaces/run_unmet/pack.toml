# A pipe piece with a mount at each end, 5 m up, its length along its front (surfaces.md 3.3,
# R76): a run turns its members to face along the line they stand on.
[taxon."structure"]

[asset.both]
primitive = "box"
size      = [0.4, 3.6, 0.4]
taxon     = "structure"
solidity  = "passable"
[asset.both.mount.a]
at        = [0, -2]
face      = 180
connector = "pipe"
rise      = 5
[asset.both.mount.b]
at        = [0, 2]
face      = 0
connector = "pipe"
rise      = 5
