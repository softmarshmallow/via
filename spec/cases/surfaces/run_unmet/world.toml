name       = "yard"
extent     = [0, 0, 128, 128]
resolution = 1
pack       = "pack.toml"
include    = ["surfaces_test"]
[field.height]
role = "surface"
base = 10

# A run of pipe pieces along a lane, one every 4 m: each one's east end is the next one's west.
[feature.lane]
kind = "lane"
path = [[40, 40], [56, 40]]

[run.row]
asset = "both"
on    = { ref = "lane" }
count = 4
