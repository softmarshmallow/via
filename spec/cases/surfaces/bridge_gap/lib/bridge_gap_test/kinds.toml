# bridge_gap_test: surfaces.md 6.3 without the crossing's `heads` effect, for the case `bridge_gap`.

[kind.pad.effect.level]
field  = "role:surface"
value  = "= under('mean')"
radius = 3

[kind.lane]
connector = "way"

[kind.rail]
connector = "rail"

[kind.footpath]
connector = "foot"

[kind.marker]

[kind.crossing]
authority = "anchored"
requires  = ["deck_z"]
defaults  = { width = 5, camber = 0.02 }

[kind.crossing.surface.deck]
base  = "= deck_z - camber * d"
bound = "= width / 2"

[kind.crossing.mount.west_deck]
t       = 0
surface = "deck"
face    = 180
meets   = "west_head"
[kind.crossing.mount.west_head]
t         = 0
face      = 0
connector = "way"
[kind.crossing.mount.east_deck]
t       = 1
surface = "deck"
face    = 0
meets   = "east_head"
[kind.crossing.mount.east_head]
t         = 1
face      = 180
connector = "way"

