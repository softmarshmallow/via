format    = "via-case-1"
summary   = "surfaces.md Conformance, fold: a crossing whose path bends with inner radius 1 m, width 5: surface.fold with the position and the largest bound."
milestone = 3
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.fold]
code = "surface.fold"
subject  = "feature.mill_bridge"
position = [120, 102]

# The legs lie 2 m apart: a bound of 1 m touches itself, so 0.999 m is the largest that holds.
[action.build.diag.fold.data]
bound  = 2.5
widest = 0.999
