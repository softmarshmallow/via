# Two pipe pieces whose ends join, and a post with a plain mount (surfaces.md 3.3).
[taxon."structure"]

[asset.left]
primitive = "box"
size      = [3.6, 0.4, 0.4]
taxon     = "structure"
solidity  = "passable"
[asset.left.mount.b]
at        = [2, 0]
face      = 90
connector = "pipe"
rise      = 5

[asset.right]
primitive = "box"
size      = [3.6, 0.4, 0.4]
taxon     = "structure"
solidity  = "passable"
[asset.right.mount.a]
at        = [-2, 0]
face      = 270
connector = "pipe"
rise      = 5

[asset.post]
primitive = "box"
size      = [3.6, 0.4, 0.4]
taxon     = "structure"
solidity  = "passable"
[asset.post.mount.b]
at        = [2, 0]
face      = 90
rise      = 5

