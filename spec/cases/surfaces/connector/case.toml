format    = "via-case-1"
summary   = "surfaces.md Conformance, connector: a lane kind with connector rail ending at a way head: surface.connector."
milestone = 5
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/build"]
exit        = 1
diagnostics = "includes"
out         = "build/build"

[action.build.diag.connector]
code    = "surface.connector"
subject = "feature.lane_west"
