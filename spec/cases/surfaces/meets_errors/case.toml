format    = "via-case-1"
summary   = "surfaces.md Conformance, meets_errors: meets to a missing mount, to itself, and a mount in two pairs: surface.unknown_mount, surface.meets_self, surface.meets_twice."
milestone = 3
pending   = "owed: no world.toml; the code is in (kind surfaces and mounts, M5 slice 1), the world from surfaces.md Conformance is not written (M5 slice 2 review: 14 such cases, TODO From M5 slice 2)"
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
