format    = "via-case-1"
summary   = "surfaces.md Conformance, meets_errors: meets to a missing mount, to itself, and a mount in two pairs: surface.unknown_mount, surface.meets_self, surface.meets_twice."
milestone = 3
pending   = "owed: kind surfaces and kind mounts (`[kind.<k>.surface.<name>]`, `meets`, surfaces.md 1 and 3) are not implemented; the world, from section 6.3's kinds, is written with that code"
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.unknown_mount]
code = "surface.unknown_mount"

[action.build.diag.meets_self]
code = "surface.meets_self"

[action.build.diag.meets_twice]
code = "surface.meets_twice"
