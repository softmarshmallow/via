name       = "mill"
extent     = [0, 0, 256, 256]
resolution = 1
pack       = "pack.toml"
include    = ["surfaces_test"]

[field.height]
role = "surface"
base = 22

[feature.mill_bridge]
kind   = "crossing"
path   = [[132, 168], [152, 168]]
deck_z = 24.5

# Returns `gen#mast`, reaching through the deck, and `gen#spare`.
[step.gen]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "steps/gen.py"]

