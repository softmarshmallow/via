format    = "via-case-1"
summary   = "surfaces.md Conformance, name_clash: a kind with surface deck and mount deck: surface.name_clash."
milestone = 3
actions   = ["build"]

# The kinds are the case's own (lib/name_clash_test).

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.name_clash]
code = "surface.name_clash"
