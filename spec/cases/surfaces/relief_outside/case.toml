format    = "via-case-1"
summary   = "surfaces.md Conformance, relief_outside: a footprint half off the deck: surface.off_bound, share exactly 0.5."
milestone = 3
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.build.diag.off_bound]
code = "surface.off_bound"
subject = "instance.crate"

[action.build.diag.off_bound.data]
share   = 0.5
surface = "mill_bridge.deck"
