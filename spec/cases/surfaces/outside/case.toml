format    = "via-case-1"
summary   = "surfaces.md Conformance, outside: an instance on the deck with offset = 4: surface.outside, not placed."
milestone = 3
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.outside]
code    = "surface.outside"
subject = "instance.crate"
