format    = "via-case-1"
summary   = "surfaces.md Conformance, apart: meets between mounts at t = 0 and t = 0.1: surface.apart."
milestone = 3
actions   = ["build"]

# The kinds are the case's own (lib/apart_test).

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.apart]
code = "surface.apart"
