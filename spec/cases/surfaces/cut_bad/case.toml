format    = "via-case-1"
summary   = "surfaces.md Conformance, cut_bad: hall_g with headroom = -1, so its floor's cut is -1: surface.cut with the value; exit 1."
milestone = 5
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/build"]
exit        = 1
diagnostics = "includes"
out         = "build/build"

[action.build.diag.cut]
code    = "surface.cut"
subject = "feature.hall_g"
