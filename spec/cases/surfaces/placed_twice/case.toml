format    = "via-case-1"
summary   = "surfaces.md Conformance, placed_twice: surface written with on: surface.placed_twice."
milestone = 5
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/build"]
exit        = 1
diagnostics = "includes"
out         = "build/build"

[action.build.diag.twice]
code    = "surface.placed_twice"
subject = "instance.desk"
