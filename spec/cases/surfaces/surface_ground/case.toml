format    = "via-case-1"
summary   = "surfaces.md Conformance, surface_ground: the desk on hall_1.floor with ground = pad: surface.ground_off_terrain."
milestone = 5
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/build"]
exit        = 1
diagnostics = "includes"
out         = "build/build"

[action.build.diag.ground]
code    = "surface.ground_off_terrain"
subject = "instance.desk"
