format    = "via-case-1"
summary   = "surfaces.md 4.1 (R65): a height in at chooses among the kind surfaces of its own layer and below: the upper floor, declared in a layer above the desk, is no candidate, so the desk stands on the lower floor at 10.3."
milestone = 5
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/build"]
exit        = 0
diagnostics = "includes"
out         = "build/build"

[action.build.file.z]
path = "build/build/instances/z.npy"
all  = 10.3

[action.build.file.count]
path    = "build/build/manifest.json"
pointer = "/instances/count"
value   = 1
