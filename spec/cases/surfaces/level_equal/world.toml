name       = "hall"
extent     = [0, 0, 64, 64]
resolution = 1
pack       = "pack.toml"
include    = ["surfaces_test"]

[field.height]
role = "surface"
base = 10

# Two kind surfaces of two features over one stretch of plan (x 28 to 32): a floor at 13.3 and a
# ledge beside it, at 14 in the base.
[feature.hall_1]
kind   = "storey"
region = [[20, 20], [32, 20], [32, 28], [20, 28]]
level  = 13.3

[feature.ledge]
kind   = "roof"
region = [[28, 20], [40, 20], [40, 28], [28, 28]]
eaves  = 14

# A box on each, 0.5 m apart: their footprints overlap by half.
[instance.on_floor]
asset   = "box"
at      = [30, 24]
surface = "hall_1.floor"

[instance.on_ledge]
asset   = "box"
at      = [30.5, 24]
surface = "ledge.garden"

# The ledge at the floor's height: one level (rules.md 8.1, R70).
[change.same.feature.ledge]
eaves = 13.3

# 0.4 mm above it: 13 300 mm on the lattice, the same height.
[change.near.feature.ledge]
eaves = 13.3004

# 0.4 mm below it: 13 300 mm on the lattice too, since a height goes to the nearest millimetre.
[change.under.feature.ledge]
eaves = 13.2996

# 1 mm above it: another height, two levels.
[change.off.feature.ledge]
eaves = 13.301
