name       = "hall"
extent     = [0, 0, 64, 64]
resolution = 1
pack       = "pack.toml"
include    = ["surfaces_test"]

[field.height]
role = "surface"
base = 10

# A ground floor (`cut`) over the west part of the plan, x 16 to 30.
[feature.hall_g]
kind   = "storey"
region = [[16, 16], [30, 16], [30, 32], [16, 32]]
level  = 10

# The floor above (`cut`) overhangs it to the east, x 30 to 40.
[feature.hall_1]
kind   = "storey"
region = [[16, 16], [40, 16], [40, 32], [16, 32]]
level  = 13

# A deck whose kind writes no `cut`, lower than the ground floor, over the same west part.
[feature.deck]
kind   = "roof"
region = [[16, 16], [30, 16], [30, 32], [16, 32]]
eaves  = 8

# Four pairs: a box on a surface and a box on the terrain (two numbers) half over it.

[instance.up_in]                 # on the upper floor, over the ground floor
asset   = "box"
at      = [20, 20]
surface = "hall_1.floor"

[instance.t_in]
asset = "box"
at    = [20.4, 20.2]

[instance.up_over]               # on the upper floor's overhang, where no floor lies under it
asset   = "box"
at      = [36, 20]
surface = "hall_1.floor"

[instance.t_over]
asset = "box"
at    = [36.4, 20.2]

[instance.on_g]                  # on the ground floor, with the lower deck under it
asset   = "box"
at      = [24, 26]
surface = "hall_g.floor"

[instance.t_g]
asset = "box"
at    = [24.4, 26.2]

[instance.on_deck]               # on the deck
asset   = "box"
at      = [26, 20]
surface = "deck.garden"

[instance.t_deck]
asset = "box"
at    = [26.4, 20.2]
