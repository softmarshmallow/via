format    = "via-case-1"
summary   = "surfaces.md Conformance, ground_on_deck: an instance on the deck with offset = 1 and ground = pad: surface.ground_off_terrain."
milestone = 3
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.ground_off_terrain]
code    = "surface.ground_off_terrain"
subject = "instance.crate"
