format    = "via-case-1"
summary   = "surfaces.md Conformance, owner_shape: a crossing kind on a point feature: surface.owner_shape, exit 1."
milestone = 3
actions   = ["build"]

[copy.lib]
from = "spec/vectors/surfaces/lib"
to   = "lib"

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.owner_shape]
code    = "surface.owner_shape"
subject = "feature.mill_bridge"
