name       = "hall"
extent     = [0, 0, 64, 64]
resolution = 1
pack       = "pack.toml"
include    = ["surfaces_test"]

[field.height]
role = "surface"
base = 10

# A ground floor level with the terrain (rules.md 8.1, M5 slice 2): a storey has `cut`, so the
# terrain and its floor are one level.
[feature.hall_g]
kind   = "storey"
region = [[16, 16], [40, 16], [40, 32], [16, 32]]
level  = 10

# A hut on the ground floor (6 m by 4 m).
[instance.inside]
asset   = "hut"
at      = [24, 24]
surface = "hall_g.floor"

# Shrubs on the terrain over the whole extent: none grows inside the hut.
[scatter.bush]
assets  = ["shrub"]
spacing = 2

# A second hut on the terrain, its footprint over the first's by 3 m.
[change.second.instance.outside]
asset = "hut"
at    = [27, 24]
