format    = "via-case-1"
summary   = "surfaces.md Conformance, mount_face: a kind mount with face = along: surface.mount_face, exit 1."
milestone = 3
actions   = ["build"]

# The kinds are the case's own (lib/mount_face_test).

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.mount_face]
code = "surface.mount_face"
