format    = "via-case-1"
summary   = "surfaces.md Conformance, unknown_surface: a kind mount with surface = dek: surface.unknown_surface listing the kind's surfaces, exit 1."
milestone = 3
actions   = ["build"]

# The kinds are the case's own (lib/unknown_surface_test).

[copy.pack]
from = "spec/vectors/surfaces/pack.toml"
to   = "pack.toml"

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/lib", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.unknown_surface]
code = "surface.unknown_surface"
