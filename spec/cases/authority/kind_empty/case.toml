format    = "via-case-1"
summary   = "A feature with `kind = \"\"`: authority.unknown_kind, whose hint says to leave `kind` out for a feature of no kind (authority.md 1)."
milestone = 7
actions   = ["build"]

# M7 close (task `mill`, the second model family): viasdk's `out.feature` always wrote `kind`, so
# a kindless walk point came back as `kind = ""` and the message read "`` names no kind of this
# world", with a hint to include a library. Messages are not compared (diagnostics.md 1.3); this
# case reads the hint from the diagnostics document, so it fails on the old hint.

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.empty]
code    = "authority.unknown_kind"
subject = "feature.spot"

[action.build.file.hint]
path    = ".diag/build.json"
pointer = "/diagnostics/0/hint"
value   = "leave `kind` out for a feature of no kind, or name a kind"
