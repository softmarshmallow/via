format    = "via-case-1"
summary   = "A pad on a slope past its max_change: authority.max_change at the largest move; entry applied in full; exit 1."
milestone = 1
actions   = ["build"]

# On `0.2 * x` the pad's mean is 1.6 (x from 3 to 13); at x = 3 and x = 13 it moves the ground
# by 1.0, past 0.5. Which post is largest is a tie between the two edges, broken by post order; the
# position is not asserted.

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.max_change]
code = "authority.max_change"
