format    = "via-case-1"
summary   = "A shaped ford on a shaped beck, two shaped lanes arriving at the ford: digits beck, then lanes, then ford; no authority.order_cycle."
milestone = 1
actions   = ["build"]

# authority.md's order cases: each entry writes `value = "= v * 10 + k"` with mask 1 at its
# shape (`1 - smoothstep(0, 1, d)`, so 1 on the shape and 0 by 1 m off it), on a field whose base is
# 0; the post's value spells the order. The kinds are the case's own library `tiers` (libs/).
# No relation links the lanes to the beck, so they follow place name (beck < lane_east < lane_west); the ford stands on the beck and owns the lanes' meeting.

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.file.order]
path  = "build/w/fields/height.npy"
post  = [8, 8]
value = 1234
