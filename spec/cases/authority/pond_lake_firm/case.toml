actions   = ["build"]

# authority.md 9 as written: the world is the section's text, its `water` library the
# section's kinds, beside the world in lib/water. The repository's lib/ (VIA_LIB) also holds a
# `water`, so the beside one is used with doc.include_shadowed (documents.md 4).
# The counts (133 posts) are in `data`, whose member names the chapter does not fix; the position is asserted.

[action.build]
via  = ["build", "world.toml", "--change", "firm", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.diag.shadowed]
code     = "doc.include_shadowed"
severity = "info"

[action.build.diag.squeezed]
code     = "authority.squeezed"
subject  = "feature.pond"
position = [71, 37]
