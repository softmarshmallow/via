format    = "via-case-1"
summary   = "Links that disagree: a lane ending at an instance, a spur starting at the lane's end inside the instance's footprint; authority.order_cycle naming the field and the three; exit 1."
milestone = 1
actions   = ["build"]

# authority.md 4.3 and its order_cycle row. `lane` ends at `yard` (arrival: `yard.ground` later);
# `spur` starts at `lane.end` (arrival: `lane` later); `spur` lies wholly inside `yard`'s 10 m
# block footprint, from (8, 8) to (11, 8), and is not linked to it in writing (containment:
# `spur` later). No shape reads another in a loop, so no graph.cycle comes first.

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.order_cycle]
code = "authority.order_cycle"
data = { field = "height", features = ["lane", "spur", "yard.ground"] }
