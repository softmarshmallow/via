format    = "via-case-1"
summary   = "A kind with names = [\"toward\"] and no toward in defaults or requires: authority.names_undeclared."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.names_undeclared]
code = "authority.names_undeclared"
file = "lib:tiers/kinds.toml"
line = 3
