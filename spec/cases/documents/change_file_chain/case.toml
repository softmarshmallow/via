format    = "via-case-1"
summary   = "A change file's clear naming a scatter the same file adds, within a region of layer 1: both declared in that layer, no doc.upward_ref."
milestone = 3
actions   = ["merge"]

[action.merge]
via  = ["merge", "world.toml", "--change", "changes/edits.toml"]
exit = 0

[action.merge.file.clear]
stream  = "stdout"
pointer = "/clear/gap/@layer"
value   = "dressing"

[action.merge.file.scatter]
stream  = "stdout"
pointer = "/scatter/under/@layer"
value   = "dressing"
