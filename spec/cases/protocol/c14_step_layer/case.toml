format    = "via-case-1"
summary   = "A returned row on a field of a higher layer: field.step_layer, at its line."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.row]
code = "field.step_layer"
file = "step:gen/document.toml"
line = 1
