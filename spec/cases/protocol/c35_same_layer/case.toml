format    = "via-case-1"
summary   = "Two workers in one layer; one reads the other's returned feature by name: graph.read_outside."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"
diagnostics = "includes"

[action.build.diag.outside]
code = "graph.read_outside"
subject = "step.b"
