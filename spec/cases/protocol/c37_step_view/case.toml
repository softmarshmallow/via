format    = "via-case-1"
summary   = "A worker reading height's full view and returning a row on it: authority.step_view."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"
diagnostics = "includes"

[action.build.diag.view]
code = "authority.step_view"
subject = "step.gen"
