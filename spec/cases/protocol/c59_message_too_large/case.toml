format    = "via-case-1"
summary   = "A frame over 16 MiB: protocol.message_too_large."
milestone = 2
actions   = ["program", "trust", "build"]

# The raw worker (conformance.md 3.7) answers step.call with one frame of 16 MiB + 1 bytes
# (protocol.md 3.1); data.bytes is that length.

[copy.raw]
from = "tools/conformance/raw_worker.py"
to   = "steps/raw.py"

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.code]
code    = "protocol.message_too_large"
subject = "step.gen"
data    = { bytes = 16777217 }
