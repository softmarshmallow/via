format    = "via-case-1"
summary   = "A committed result whose trace no longer matches (the field it read changed): protocol.untrusted_stale naming the read, exit 1; nothing runs."
milestone = 2
actions   = ["program", "trust", "base", "commit", "stale"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
out         = "build/w"
diagnostics = "includes"

[action.commit]
via         = ["step", "commit", "world.toml", "--out", "build/c"]
exit        = 0
diagnostics = "includes"

[action.stale]
via         = ["build", "world.toml", "--change", "steeper", "--out", "build/s"]
env         = { VIA_CONFIG_DIR = "{work}/.untrusted" }
exit        = 1
out         = "build/s"
diagnostics = "includes"

[action.stale.diag.stale]
code    = "protocol.untrusted_stale"
subject = "step.gen"
