format    = "via-case-1"
summary   = "protocol.md 7.1: a worker generate step that raises a warning of its own is committed; an untrusted build that uses the committed result reports the same warning as the trusted build, beside protocol.untrusted_result, and has the trusted build's id."
milestone = 2
actions   = ["program", "trust", "base", "commit", "untrusted"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
out         = "build/w"
diagnostics = "includes"

[action.base.diag.dry]
code     = "step.gen.dry"
severity = "warning"
subject  = "world"

[action.commit]
via         = ["step", "commit", "world.toml", "--out", "build/c"]
exit        = 0
diagnostics = "includes"

[action.untrusted]
via         = ["build", "world.toml", "--out", "build/u"]
env         = { VIA_CONFIG_DIR = "{work}/.untrusted" }
exit        = 0
out         = "build/u"
diagnostics = "includes"

[action.untrusted.diag.dry]
code     = "step.gen.dry"
severity = "warning"
subject  = "world"

[action.untrusted.diag.used]
code     = "protocol.untrusted_result"
severity = "info"
subject  = "step.gen"

[action.untrusted.diag.not_stale]
code    = "protocol.untrusted_stale"
records = 0

[action.untrusted.same.id]
action = "base"
what   = "id"
