format    = "via-case-1"
summary   = "A worker reading by name a feature of a higher layer: graph.read_outside naming that layer, and no other diagnostic."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.outside]
code = "graph.read_outside"
subject = "step.gen"
