format    = "via-case-1"
summary   = "A returned key equal to a name the step sees: protocol.key_shadows at its line in document.toml; nothing joins."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.shadows]
code = "protocol.key_shadows"
file = "step:gen/document.toml"
line = 1
