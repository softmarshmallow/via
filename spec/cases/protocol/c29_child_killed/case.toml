format    = "via-case-1"
summary   = "A worker with a child, killed by the engine (deadline): no child remains, on every system."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--step-deadline", "2", "--out", "build/w"]
exit = 1
out  = "build/w"
pids_gone = "pids.txt"
no_rerun = "the step sleeps past its deadline on every run"

[action.build.diag.late]
code = "protocol.deadline"
