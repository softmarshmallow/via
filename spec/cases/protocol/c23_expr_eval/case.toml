format    = "via-case-1"
summary   = "expr.eval of a formula over a window: each value, rounded to f32 ties to even, equals the field the formula builds; length and post order as 3.3."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.diag.same]
code = "step.look.compared"
data = { same = true, n = 81 }
