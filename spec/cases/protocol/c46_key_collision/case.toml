format    = "via-case-1"
summary   = "Two items of one for_each returning one key: identity.key_collision naming both items."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"
diagnostics = "includes"

[action.build.diag.same]
code = "identity.key_collision"
subject = "step.gen"
