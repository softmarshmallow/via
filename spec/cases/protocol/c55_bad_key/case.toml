format    = "via-case-1"
summary   = "A returned key that is not an id: identity.bad_key at its line in document.toml, the repaired key in the hint."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.bad]
code = "identity.bad_key"
file = "step:gen/document.toml"
line = 1
