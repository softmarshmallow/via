format    = "via-case-1"
summary   = "protocol.md 7.1, case 49: via step commit on a world with an error: protocol.commit_refused, exit 1, gen/ not written."
milestone = 2
actions   = ["program", "trust", "commit"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.commit]
via         = ["step", "commit", "world.toml", "--out", "build/c"]
exit        = 1
diagnostics = "includes"

[action.commit.diag.refused]
code = "protocol.commit_refused"

[action.commit.file.gen]
path   = "gen"
exists = false
