format    = "via-case-1"
summary   = "One attribute has two types across the selected kinds: protocol.column_mixed, naming both kinds."
milestone = 1
actions   = ["program", "trust", "build"]

# A plain lint is handed every feature in one feature list (protocol.md 2.2, 4.3): `width` is a number on kind a and text on kind b.

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.column_mixed]
code = "protocol.column_mixed"
