format    = "via-case-1"
summary   = "for_each = tag:x; then kind:x with no x feature: protocol.for_each_form; then graph.for_each_empty and the step did not run."
milestone = 2
actions   = ["program", "trust", "tag", "to_kind", "empty"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.tag]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.tag.diag.form]
code = "protocol.for_each_form"
subject = "step.gen"

[action.to_kind]
replace = "world.toml"
find    = '''for_each = "tag:x"'''
with    = '''for_each = "kind:none"'''

[action.empty]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.empty.diag.empty]
code = "graph.for_each_empty"
subject = "step.gen"

# M7 close (task `mill`, the second model family; the first put `lay` a layer up): `lay` beside
# the step that returned its building matched nothing, and the hint named only "at or below the
# step's layer". It now says a sibling step's returns are not in the view. Messages are not
# compared (diagnostics.md 1.3); this reads the hint from the diagnostics document (record 0 is
# identity.no_previous).
[action.empty.file.hint]
path    = ".diag/empty.json"
pointer = "/diagnostics/1/hint"
value   = "add a feature of kind `none` at or below the step's layer, or remove the step; a feature another step of this layer returns is not in its view; put this step in a layer above that step (authority.md 4.4)"
