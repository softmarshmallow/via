format    = "via-case-1"
summary   = "A column blob whose size does not match its dtype and shape: protocol.blob_header."
milestone = 2
actions   = ["program", "trust", "build"]

# The raw worker (conformance.md 3.7) calls expr.eval with an i32 column of shape [2] whose blob,
# correctly named, holds 4 bytes (protocol.md 4.2, 4.3). The engine refuses the call (-32002) and
# reports protocol.blob_header itself, as it reports graph.read_outside (3.3); the worker then fails
# the call as the SDK would, and that -32010 is not a second report (one fault, one message).

[copy.raw]
from = "tools/conformance/raw_worker.py"
to   = "steps/raw.py"

[copy.blake3]
from = "tools/conformance/via_conformance/blake3.py"
to   = "steps/blake3.py"

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.code]
code    = "protocol.blob_header"
subject = "step.gen"
