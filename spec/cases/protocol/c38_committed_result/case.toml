format    = "via-case-1"
summary   = "protocol.md 7.1, case 38: a committed gen/<id>/ for an untrusted step; build: protocol.untrusted_result and the trusted build's id; then a param edited: protocol.untrusted_stale, exit 1."
milestone = 2
actions   = ["program", "trust", "base", "commit", "untrusted", "edited"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.base]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
out         = "build/w"
diagnostics = "includes"

[action.commit]
via         = ["step", "commit", "world.toml", "--out", "build/c"]
exit        = 0
diagnostics = "includes"

[action.untrusted]
via         = ["build", "world.toml", "--out", "build/u"]
env         = { VIA_CONFIG_DIR = "{work}/.untrusted" }
exit        = 0
out         = "build/u"
diagnostics = "includes"

[action.untrusted.diag.used]
code    = "protocol.untrusted_result"
subject = "step.gen"

[action.untrusted.same.id]
action = "base"
what   = "id"

[action.edited]
via         = ["build", "world.toml", "--change", "further", "--out", "build/e"]
env         = { VIA_CONFIG_DIR = "{work}/.untrusted" }
exit        = 1
out         = "build/e"
diagnostics = "includes"

[action.edited.diag.stale]
code    = "protocol.untrusted_stale"
subject = "step.gen"
