format    = "via-case-1"
summary   = "A worker answering initialize with via-step-2: protocol.version, exit status 1."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.version]
code = "protocol.version"
data = { engine = "via-step-1", worker = "via-step-2" }
