format    = "via-case-1"
summary   = "A worker that runs cat as a subprocess with no stdin argument: the build succeeds; cat reads nothing."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.diag.cat]
code = "step.look.cat"
data = { bytes = 0 }
