format    = "via-case-1"
summary   = "A worker that does not use the launcher and writes hello to descriptor 1 after initialize: protocol.framing."
milestone = 2
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--lib", "{work}/libs"]
exit = 0

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 1
out  = "build/w"

[action.build.diag.framing]
code = "protocol.framing"
subject = "step.look"
