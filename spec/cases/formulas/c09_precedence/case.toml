format    = "via-case-1"
summary   = "A tiny world, base = \"= -2 * 3 + 4 / 2 - 1\": -5 at every post."
milestone = 1
actions   = ["w"]

[action.w]
via  = ["build", "w/world.toml", "--lib", "{work}/libs", "--out", "w/build/w"]
exit = 0
out  = "w/build/w"

[action.w.file.all]
path = "w/build/w/fields/f.npy"
all  = -5
