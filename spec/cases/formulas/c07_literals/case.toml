format    = "via-case-1"
summary   = ".5, 5., 1e, 2e5x, 1.e3, 1_0, 1e400, 1e-400 as a base: formula.syntax each; \"= 1e-3\": the bits of 0.001, narrowed."
milestone = 1
actions   = ["n0", "n1", "n2", "n3", "n4", "n5", "n6", "n7", "milli"]

[action.n0]
via         = ["build", "n0/world.toml", "--lib", "{work}/libs", "--out", "n0/build/w"]
exit        = 1
diagnostics = "includes"
out         = "n0/build/w"

[action.n0.diag.syntax]
code = "formula.syntax"

