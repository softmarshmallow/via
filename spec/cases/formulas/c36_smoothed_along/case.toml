format    = "via-case-1"
summary   = "smoothed_along(4) on a 10 m path at spacing 1 over base = \"= x\": the values of the vector table written with the code (M1)."
milestone = 1
actions   = ["build"]

[action.build]
via  = ["build", "world.toml", "--lib", "{work}/libs", "--out", "build/w"]
exit = 0
out  = "build/w"

# The values are spec/vectors/formulas/smoothed_along.toml's, derived by formulas.md 8.5's rule (see
# that file): at each post [3 + j, 4] on the path the effect's mask 1 - smoothstep(0, 1, d) is 1, so
# the post is u_j exactly (fields.md 5.1), narrowed to 32 bits. Posts at d >= 1 keep base x: the two
# ends' neighbours [2, 4] and [14, 4], and [8, 5] beside the path.

[action.build.file.p3]
path  = "build/w/fields/height.npy"
post  = [3, 4]
value = 4.5

[action.build.file.p4]
path  = "build/w/fields/height.npy"
post  = [4, 4]
value = 4.875

[action.build.file.p5]
path  = "build/w/fields/height.npy"
