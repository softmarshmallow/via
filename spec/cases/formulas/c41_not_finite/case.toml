format    = "via-case-1"
summary   = "\"= sqrt(x - 100)\" in a base: formula.not_finite at sqrt, at the first post in post order with x < 100, its world position; no field written."
milestone = 1
actions   = ["w"]

[action.w]
via         = ["build", "w/world.toml", "--lib", "{work}/libs", "--out", "w/build/w"]
exit        = 1
diagnostics = "includes"
out         = "w/build/w"

[action.w.diag.not_finite]
code     = "formula.not_finite"
position = [0, 0]

[action.w.file.none]
path   = "w/build/w/fields/f.npy"
exists = false
