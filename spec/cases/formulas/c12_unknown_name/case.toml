format    = "via-case-1"
summary   = "d in a field base: formula.unknown_name, saying d exists in a kind effect."
milestone = 1
actions   = ["w"]

[action.w]
via         = ["build", "w/world.toml", "--lib", "{work}/libs", "--out", "w/build/w"]
exit        = 1
diagnostics = "includes"
out         = "w/build/w"

[action.w.diag.unknown_name]
code = "formula.unknown_name"
data = { name = "d" }
