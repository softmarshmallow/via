format    = "via-case-1"
summary   = "A density reading f('height'): builds; each candidate reads the field at its own point (fields.md 1.2)."
milestone = 1
actions   = ["w"]

# (open) the value read at each candidate is not in any build file; the case holds that the density's field read builds.

[action.w]
via         = ["build", "w/world.toml", "--out", "w/build/w"]
exit        = 0
diagnostics = "includes"
out         = "w/build/w"
