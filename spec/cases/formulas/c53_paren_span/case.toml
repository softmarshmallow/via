format    = "via-case-1"
summary   = "\"= 1 / (x - x)\" in a base: formula.not_finite at the division, its bytes running to the closing parenthesis of its parenthesised operand."
milestone = 1
actions   = ["w"]

# formulas.md, "Every failure is located": the bytes of the faulty sub-expression. The division's
# right operand is the whole `(x - x)`, parentheses included, so the span is `1 / (x - x)`.

[action.w]
via         = ["build", "w/world.toml", "--lib", "{work}/libs", "--out", "w/build/w"]
exit        = 1
diagnostics = "includes"
out         = "w/build/w"

[action.w.diag.not_finite]
code     = "formula.not_finite"
subject  = "field.f.base"
file     = "world.toml"
line     = 7
column   = 11
bytes    = [102, 113]
position = [0, 0]

[action.w.file.none]
path   = "w/build/w/fields/f.npy"
exists = false
