format    = "via-case-1"
summary   = "& in where (hint and); x = 1 (hint ==); **, %, ?:; a selector in double quotes: formula.operator each."
milestone = 1
actions   = ["amp", "eq", "pow", "mod", "ternary", "dquote"]

[action.amp]
via         = ["build", "amp/world.toml", "--lib", "{work}/libs", "--out", "amp/build/w"]
exit        = 1
diagnostics = "includes"
out         = "amp/build/w"

[action.amp.diag.operator]
code = "formula.operator"

[action.eq]
via         = ["build", "eq/world.toml", "--lib", "{work}/libs", "--out", "eq/build/w"]
