format    = "via-case-1"
summary   = "The noise vectors of 8.2: the engine computes them, bit for bit."
milestone = 1
actions   = ["vectors"]

[copy.vectors]
from = "spec/vectors/numbers.toml"
to   = "numbers.toml"

[action.vectors]
via  = ["vectors", "numbers.toml"]
exit = 0

[action.vectors.check.noise]
fn   = "vectors_match"
path = "numbers.toml"
fns  = ["noise", "draw"]
