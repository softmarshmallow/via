format    = "via-case-1"
summary   = "A value set by a change file over a layer; build with an error on it: span is the change file's line, chain is the layer's entry then the change's."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--change", "changes/bad.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.unknown_name]
code  = "formula.unknown_name"
file  = "changes/bad.toml"
line  = 2
chain = [{ through = "layer", name = "top" }, { through = "change", name = "bad" }]
