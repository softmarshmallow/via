format    = "via-case-1"
summary   = "A lint step that sends one code as warning and as error: one diag.malformed, no record of that code."
milestone = 1
actions   = ["program", "trust", "build"]

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.malformed]
code    = "diag.malformed"
records = 1
