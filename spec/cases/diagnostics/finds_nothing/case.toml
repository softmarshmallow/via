format    = "via-case-1"
summary   = "A lint step that finds nothing: the summary and lints list it with zero counts."
milestone = 1
actions   = ["program", "trust", "build"]

# (open) the `lints` member of diagnostics.md 7's document is not asserted here: its form is that chapter's section 7; the lint runs and the build exits 0 with no record.

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"
