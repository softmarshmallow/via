format    = "via-case-1"
summary   = "ford with four independent bad edits: authority.conflict, formula.unknown_name, graph.cycle, asset.unknown, all four in one run, exit 1."
milestone = 1
actions   = ["program", "trust", "bad"]

# diagnostics.md's Conformance item and the plan's ford row "The four bad_* files together": each
# of the four has code, subject, file, line and hint (U2 checks the hint on every record); the clash
# and the unknown asset also a position.
#
# authority.conflict (authority.md 5): the firm pad under the cottage and the beck are both
# anchored. The footprint is that of an instance placed `on` the beck, so it stands on the beck and
# comes later (4.3, 4.5): B, the subject. A footprint feature has no id of its own and is named by
# its instance (identity.md 5, build.md 8), so the subject is `instance.cottage` (authority.md 5).
# The record gives each one's `authority` line, the kind's when inherited: the footprint's is
# `firm_pad`'s, lib:land/kinds.toml line 30; the beck's, world.toml line 20, is in `related`. The
# post of largest difference lies where both masks are 1: inside the pad (10 m by 8 m around the
# cottage at beck t = 0.3, 2 m left of travel, near (143.0, 178.4)) and within the floor (toe 2 m)
# of the beck's line. Its exact post depends on measured ground, so it is boxed, not pinned.
#
# asset.unknown (assets.md 9, rules.md): subject the instance, as assets/unknown_asset; the span is
# the value of `asset` at line 2. Its position is the shed's plan origin: lane_east from the ford
# (beck t = 0.55, (153.63, 115.48), build.md 11.2's example) to (256, 140), at t = 0.5, 10 m right of
# travel (geometry.md 2: offset is to the left): about (207.14, 118.02). Boxed for the same reason
# of rounding, 2 m each way.

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "changes/bad_anchor.toml", "--change", "changes/bad_typo.toml", "--change", "changes/bad_cycle.toml", "--change", "changes/bad_asset.toml"]
exit = 0

[action.bad]
via         = ["build", "world.toml", "--change", "changes/bad_anchor.toml", "--change", "changes/bad_typo.toml", "--change", "changes/bad_cycle.toml", "--change", "changes/bad_asset.toml", "--out", "build/ford"]
out         = "build/ford"
exit        = 1
diagnostics = "includes"

[action.bad.diag.conflict]
code            = "authority.conflict"
subject         = "instance.cottage"
file            = "lib:land/kinds.toml"
line            = 30
related         = [{ file = "world.toml", line = 20 }]
position_within = [135, 170, 151, 187]

[action.bad.diag.typo]
code    = "formula.unknown_name"
subject = "scatter.trees.density"
file    = "changes/bad_typo.toml"
line    = 2
column  = 67
bytes   = [82, 84]
data    = { name = "xx", nearest = "x" }

[action.bad.diag.cycle]
code    = "graph.cycle"
subject = "field.loop_a"
file    = "changes/bad_cycle.toml"
line    = 2

[action.bad.diag.asset]
code            = "asset.unknown"
subject         = "instance.shed"
file            = "changes/bad_asset.toml"
line            = 2
position_within = [205, 116, 209, 120]
data            = { nearest = "shed_gable" }

[action.bad.file.nothing_else]
path    = "build/ford"
listing = ["diagnostics.json", ".previous"]
