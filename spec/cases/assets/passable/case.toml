format    = "via-case-1"
summary   = "solidity = \"passable\": pack check exit 0; pack list gives solidity passable (M5; assets.md 2.4)."
milestone = 5
actions   = ["check", "list"]

[action.check]
via  = ["pack", "check", "pack.toml"]
exit = 0

[action.list]
via  = ["pack", "list", "pack.toml"]
exit = 0

[action.list.file.solidity]
stream  = "stdout"
line    = 1
pointer = "/solidity"
value   = "passable"
