format    = "via-case-1"
summary   = "connector = \"wall\" on an asset mount: exit 0; the mount's connector is wall (M5; assets.md 2.7)."
milestone = 5
actions   = ["check", "list"]

[action.check]
via  = ["pack", "check", "pack.toml"]
exit = 0

[action.list]
via  = ["pack", "list", "pack.toml"]
exit = 0

[action.list.file.connector]
stream  = "stdout"
line    = 1
pointer = "/mounts/side/connector"
value   = "wall"
