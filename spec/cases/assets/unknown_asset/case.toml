format    = "via-case-1"
summary   = "A world on the primitive pack naming house_lo: asset.unknown, hint house_low, exit 1."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.unknown]
code    = "asset.unknown"
subject = "instance.hut"
data    = { nearest = "house_low" }
