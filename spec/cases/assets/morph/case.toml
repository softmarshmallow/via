format    = "via-case-1"
summary   = "A cube with a morph target and default weights = [1]: bounds of the base positions."
milestone = 2
actions   = ["list"]

[action.list]
via         = ["pack", "list", "pack.toml"]
exit        = 0
diagnostics = "includes"

[action.list.file.bounds]
stream  = "stdout"
pointer = "/bounds"
line    = 1
value   = [-0.5, -0.5, 0, 0.5, 0.5, 1]
