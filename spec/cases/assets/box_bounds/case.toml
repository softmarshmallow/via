format    = "via-case-1"
summary   = "primitive box, size [1.001, 2, 3]: bounds [-0.5, -1, 0, 0.501, 1, 3], origin [0, 0, 0]."
milestone = 1
actions   = ["list"]

[action.list]
via  = ["pack", "list", "pack.toml"]
exit = 0

[action.list.file.bounds]
stream  = "stdout"
pointer = "/bounds"
line    = 1
value   = [-0.5, -1, 0, 0.501, 1, 3]

[action.list.file.origin]
stream  = "stdout"
pointer = "/origin"
line    = 1
value   = [0, 0, 0]
