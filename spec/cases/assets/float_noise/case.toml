format    = "via-case-1"
summary   = "The glTF axes cube with one vertex at 1.5000001: the same bounds as the clean cube."
milestone = 2
actions   = ["list"]

[action.list]
via         = ["pack", "list", "pack.toml"]
exit        = 0
diagnostics = "includes"

[action.list.file.bounds]
stream  = "stdout"
pointer = "/bounds"
line    = 1
value   = [-1.5, -0.5, 0, -0.5, 0.5, 1]
