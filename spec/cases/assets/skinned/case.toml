format    = "via-case-1"
summary   = "A skinned cube whose glTF node is translated 5 m: bounds as the unskinned cube under that glTF node."
milestone = 2
actions   = ["list"]

[action.list]
via         = ["pack", "list", "pack.toml"]
exit        = 0
diagnostics = "includes"

[action.list.file.bounds]
stream  = "stdout"
pointer = "/bounds"
line    = 1
value   = [-5.5, -0.5, 0, -4.5, 0.5, 1]
