format    = "via-case-1"
summary   = "A pack whose unused asset has size [-1, 1, 1]: pack.range, exit 1: pack-wide (8.3)."
milestone = 1
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 1
diagnostics = "includes"
out         = "build/w"

[action.build.diag.range]
code    = "pack.range"
subject = "asset.junk.size"
