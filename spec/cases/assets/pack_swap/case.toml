format    = "via-case-1"
summary   = "ford on the primitive pack, then changes/bigger.toml against it: cottage moved and changed (its pad levels it to another mean), footprint cottage moved, both with old and new facts; world text untouched."
milestone = 1
actions   = ["program", "trust", "base", "bigger"]

# assets.md's `Pack swap` row (section 7, 6.2), identity.md case 46 and the plan's ford row
# changes/bigger.toml. The second pack is packs/primitive_large.toml, derived from assets.md 6.1
# with the one line 6.2 changes. Entries sort by table, then name (build.md 11.2): the fields the
# larger pad touches (clearing, height, water), then footprint cottage, then instance cottage.
# Facts compare as manifest.json writes them; `footprint`'s value is not given by a chapter, so
# only `bounds` and `size` are asserted. The cottage is also `moved`: the larger pad levels its
# ground to another mean, so its height differs (assets.md 7, identity.md 5).

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "changes/bigger.toml"]
exit = 0

[action.base]
via       = ["build", "world.toml", "--out", "build/ford"]
out       = "build/ford"
exit      = 0
diagnostics = "includes"
untouched = ["world.toml"]

[action.bigger]
via       = ["build", "world.toml", "--change", "changes/bigger.toml", "--against", "build/ford", "--out", "build/ford+bigger"]
out       = "build/ford+bigger"
exit      = 0
diagnostics = "includes"
untouched = ["world.toml", "build/ford"]

[action.bigger.file.footprint]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/3"
includes = { name = "cottage", table = "footprint", what = ["moved"] }

[action.bigger.file.footprint_facts]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/3/facts"
includes = [
    { fact = "bounds", before = [-4, -3, 0, 4, 3, 4], after = [-5, -4, 0, 5, 4, 4] },
    { fact = "size", before = [8, 6, 4], after = [10, 8, 4] },
]

[action.bigger.file.footprint_cause_size]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/3/causes/0"
includes = { cause = "asset.house_low.size" }

[action.bigger.file.footprint_cause_pack]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/3/causes/1"
includes = { cause = "world.pack" }

[action.bigger.file.cottage]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/4"
includes = { name = "cottage", table = "instance", what = ["moved", "changed"] }

[action.bigger.file.cottage_facts]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/4/facts"
includes = [
    { fact = "bounds", before = [-4, -3, 0, 4, 3, 4], after = [-5, -4, 0, 5, 4, 4] },
    { fact = "size", before = [8, 6, 4], after = [10, 8, 4] },
]

[action.bigger.file.cottage_cause_size]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/4/causes/0"
includes = { cause = "asset.house_low.size" }

[action.bigger.file.cottage_cause_pack]
path     = "build/ford+bigger/changes.json"
pointer  = "/entries/4/causes/1"
includes = { cause = "world.pack" }

# What runs (graph.md 1, the frame): `pack` is not a key of the frame (the `world` statement), so
# swapping it reruns only the nodes made from `world.pack` (those that resolve asset names: the
# hand instance, the scatter rule) or from the changed `asset:house_low`, and what reads their
# changed values. Every shape, the attributes of features that name nothing on the cottage, the
# selections and the distances of unchanged features read neither, so none of them runs. The
# chunks below follow from edges whose values changed and are left out of the exact list: only
# the nodes the rule decides are asserted.
[action.bigger.nodes]
ran_includes = [
    "merge",
    "source:changes/bigger.toml",
    "instance:cottage/v:build",
    "footprint:cottage/v:build",
    "height:cottage/v:build",
    "distance:cottage.ground/*",
    "rule:trees/v:build",
]
not_ran = [
    "shape:*",
    "attr:beck",
    "attr:ford",
    "attr:at_ford",
    "attr:on_bank",
    "attr:in_trees",
    "attr:lane_west",
    "attr:lane_east",
    "select:*",
    "distance:beck/*",
    "distance:ford/*",
    "distance:lane_west/*",
    "distance:lane_east/*",
    "source:world.toml",
]

# A hand instance's `via` ends at its `instance:` node, never at `height:` (only a pin's may,
# build.md 11.2). The cottage's node is made from `asset:house_low` and `world.pack` (graph.md 1),
# so each chain is that one node, both ends included.
[action.bigger.file.cottage_via_size]
path    = "build/ford+bigger/changes.json"
pointer = "/entries/4/causes/0/via"
value   = ["instance:cottage/v:build"]

[action.bigger.file.cottage_via_pack]
path    = "build/ford+bigger/changes.json"
pointer = "/entries/4/causes/1/via"
value   = ["instance:cottage/v:build"]
