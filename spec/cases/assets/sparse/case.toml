format    = "via-case-1"
summary   = "A cube whose positions are a sparse accessor moving one corner 1 m out: bounds include the moved corner."
milestone = 2
actions   = ["list"]

[action.list]
via         = ["pack", "list", "pack.toml"]
exit        = 0
diagnostics = "includes"

[action.list.file.bounds]
stream  = "stdout"
pointer = "/bounds"
line    = 1
value   = [-1.5, -0.5, 0, 0.5, 0.5, 1]
