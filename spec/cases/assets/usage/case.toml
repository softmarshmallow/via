format    = "via-case-1"
summary   = "A pack of three assets, a build placing two of them: via pack list PACK --build DIR gives instances on each line, the two counts and 0 for the third; nothing built."
milestone = 2
actions   = ["build", "list"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
out         = "build/w"
diagnostics = "includes"

[action.list]
via         = ["pack", "list", "pack.toml", "--build", "build/w"]
exit        = 0
diagnostics = "includes"
untouched   = ["build/w"]

[action.list.file.a]
stream  = "stdout"
pointer = "/instances"
line    = 1
value   = 2

[action.list.file.b]
stream  = "stdout"
pointer = "/instances"
line    = 2
value   = 1

[action.list.file.c]
stream  = "stdout"
pointer = "/instances"
line    = 3
value   = 0
