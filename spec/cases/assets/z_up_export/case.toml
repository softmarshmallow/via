format    = "via-case-1"
summary   = "The same cube exported Z-up, centred at model (1, 0, 0.5), up = \"+z\", front = \"-y\", pivot = \"origin\": bounds [-1.5, -0.5, 0, -0.5, 0.5, 1]."
milestone = 2
actions   = ["list"]

[action.list]
via         = ["pack", "list", "pack.toml"]
exit        = 0
diagnostics = "includes"

[action.list.file.bounds]
stream  = "stdout"
pointer = "/bounds"
line    = 1
value   = [-1.5, -0.5, 0, -0.5, 0.5, 1]
