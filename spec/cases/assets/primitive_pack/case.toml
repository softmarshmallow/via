format    = "via-case-1"
summary   = "A world on lib/packs/primitive.toml, no model files: exit 0; triangles box 12, prism 8, cylinder 60, cone 30, sphere 224."
milestone = 1
actions   = ["build", "list"]

# assets.md 6.1's nine assets sort by id: box_small, bush_round, fence_post, fern_low, house_low,
# lamp_post, rock_a, shed_gable, tree_oak; every shape is used. The build places one of each of
# seven, 7 m apart, so no two overlap.

[copy.pack]
from = "lib/packs/primitive.toml"
to   = "primitive.toml"

[action.build]
via  = ["build", "world.toml", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.list]
via  = ["pack", "list", "primitive.toml"]
exit = 0

[action.list.file.t_box_small]
stream  = "stdout"
pointer = "/triangles"
line    = 1
value   = 12

[action.list.file.t_bush_round]
stream  = "stdout"
pointer = "/triangles"
line    = 2
value   = 224

[action.list.file.t_fern_low]
stream  = "stdout"
pointer = "/triangles"
line    = 4
value   = 30

[action.list.file.t_house_low]
stream  = "stdout"
pointer = "/triangles"
line    = 5
value   = 12

[action.list.file.t_lamp_post]
stream  = "stdout"
pointer = "/triangles"
line    = 6
value   = 60

[action.list.file.t_shed_gable]
stream  = "stdout"
pointer = "/triangles"
line    = 8
value   = 8

[action.list.file.t_tree_oak]
stream  = "stdout"
pointer = "/triangles"
line    = 9
value   = 224

[action.list.file.id_box_small]
stream  = "stdout"
pointer = "/id"
line    = 1
value   = "box_small"

[action.list.file.id_bush_round]
stream  = "stdout"
pointer = "/id"
line    = 2
value   = "bush_round"

[action.list.file.id_fern_low]
stream  = "stdout"
pointer = "/id"
line    = 4
value   = "fern_low"

[action.list.file.id_house_low]
stream  = "stdout"
pointer = "/id"
line    = 5
value   = "house_low"

[action.list.file.id_lamp_post]
stream  = "stdout"
pointer = "/id"
line    = 6
value   = "lamp_post"

[action.list.file.id_shed_gable]
stream  = "stdout"
pointer = "/id"
line    = 8
value   = "shed_gable"

[action.list.file.id_tree_oak]
stream  = "stdout"
pointer = "/id"
line    = 9
value   = "tree_oak"
