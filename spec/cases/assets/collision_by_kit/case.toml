format    = "via-case-1"
summary   = "[taxon.\"building\"] defaults = { collision = \"mesh\" }, a house under it, a primitive box with collision = \"box\": via pack list gives mesh for the house, box for the box; no asset.declared_measured."
milestone = 2
actions   = ["list"]

[action.list]
via         = ["pack", "list", "pack.toml"]
exit        = 0
diagnostics = "includes"

[action.list.file.box]
stream  = "stdout"
pointer = "/collision"
line    = 1
value   = "box"

[action.list.file.house]
stream  = "stdout"
pointer = "/collision"
line    = 2
value   = "mesh"

[action.list.diag.declared_measured]
code    = "asset.declared_measured"
records = 0
