format    = "via-case-1"
summary   = "Accepted; model re-exported with more triangles, same bounds: asset.remodelled with old and new triangles; no instance moved in the change report."
milestone = 2
actions   = ["accept", "base", "remodel", "build"]

[action.accept]
via         = ["pack", "accept", "pack.toml"]
exit        = 0
diagnostics = "includes"

[action.base]
via         = ["build", "world.toml", "--out", "build/base"]
exit        = 0
out         = "build/base"
diagnostics = "includes"

[action.remodel]
write = "cube.gltf"
from  = "later/more.gltf"

[action.build]
via         = ["build", "world.toml", "--against", "build/base", "--out", "build/next"]
exit        = 0
out         = "build/next"
diagnostics = "includes"

[action.build.diag.remodelled]
code    = "asset.remodelled"
subject = "asset.cube"
data    = { old_triangles = 12, new_triangles = 24 }

[action.build.diag.revised]
code    = "asset.revised"
records = 0

[action.build.check.unmoved]
fn           = "changes_absent"
path         = "build/next/changes.json"
entry_names  = ["a", "b"]
