format    = "via-case-1"
summary   = "--stand-ins on a pack with model assets and no facts file: build.no_facts, exit 1."
milestone = 2
actions   = ["stand_ins"]

[action.stand_ins]
via         = ["build", "world.toml", "--stand-ins", "--out", "build/stand"]
exit        = 1
out         = "build/stand"
diagnostics = "includes"

[action.stand_ins.diag.no_facts]
code = "build.no_facts"
from = "run"
