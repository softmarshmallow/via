format    = "via-case-1"
summary   = "Every case, run as a test user and host whose names the runner makes unique: no JSON or text file the build writes holds an absolute path, the user or host name; no .. but in locations and source paths."
milestone = 1
actions   = ["program", "trust", "build"]

# U5 runs on every action of every case; this case runs it on demand on ford.

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.build]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.build.check.u5]
fn = "no_absolute_path"
