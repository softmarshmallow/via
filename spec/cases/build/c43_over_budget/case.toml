format    = "via-case-1"
summary   = "Six assets of 1000 triangles and fifty of 10 in one chunk, budget triangles 5000: one build.over_budget naming heavy at 92%, exit 1, no outputs; with instances 40 as well, a second record naming light at 89%."
milestone = 6
actions   = ["build", "both"]

[action.build]
via         = ["build", "world.toml", "--out", "build/yard"]
exit        = 1
diagnostics = "exact"
out         = "build/yard"

[action.build.diag.triangles]
code = "build.over_budget"
file = "world.toml"
line = 235
data = { chunk = [0, 0], measure = "triangles", value = 6500, limit = 5000, asset = "heavy", share = 92, instances = 6 }

[action.build.file.listing]
path    = "build/yard"
listing = [".previous", "diagnostics.json"]

[action.both]
via         = ["build", "both.toml", "--out", "build/both"]
exit        = 1
diagnostics = "exact"
out         = "build/both"

[action.both.diag.triangles]
code = "build.over_budget"
data = { chunk = [0, 0], measure = "triangles", value = 6500, limit = 5000, asset = "heavy", share = 92, instances = 6 }

[action.both.diag.instances]
code = "build.over_budget"
data = { chunk = [0, 0], measure = "instances", value = 56, limit = 40, asset = "light", share = 89, instances = 50 }
