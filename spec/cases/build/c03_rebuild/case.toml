format    = "via-case-1"
summary   = "ford built twice into one directory: the second writes nothing into the directory; diagnostics.json byte-identical."
milestone = 1
actions   = ["program", "trust", "first", "second"]

# That the run report holds no run diagnostic is not asserted: run diagnostics compare as includes (conformance.md 3.5).

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes"]
exit = 0

[action.first]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"

[action.second]
via         = ["build", "world.toml", "--out", "build/ford"]
exit        = 0
diagnostics = "includes"
out         = "build/ford"
untouched   = ["build/ford"]

[action.second.same.d]
action = "first"
what   = "diagnostics"
