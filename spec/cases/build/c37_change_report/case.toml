format    = "via-case-1"
summary   = "ford, then ford with downstream into one directory: changes.json lists every entry the plan's downstream row names, each with its cause."
milestone = 1
actions   = ["program", "trust", "base", "downstream"]

# build.md case 37 and the plan's ford row `downstream` ("Must follow, and be reported").
# Entries are sorted by table, then name (build.md 11.2): the seven written features that follow the
# ford (beck is the one untouched: ~6, changed 4, 1 untouched), then the fields clearing, height, water, the cottage's footprint, the cottage, and
# the trees. Every entry's one cause is the one edited statement, feature.ford.on, written in
# world.toml line 74. The positions of entries past the cottage are the trees', not asserted here.
#
# Nothing beyond what follows is listed (build.md 11.2's worked example, derived, not recorded):
# - Features: lane_west, lane_east and in_trees stand on or arrive at the ford, so they moved;
#   at_ford and to_door moved and changed (their `toward` names the ford, the cottage); on_bank
#   stands on the beck, which did not move, so it only changed (its `toward` names the ford).
#   in_trees moved, and changed too: its `toward` names lane_east.end, whose plan is the same but
#   whose ground the lane's bed, laid again from the moved ford, sets to another height, and
#   features.json writes that place's `at` with its height (build.md 11.2: heights count). The ford moved. So ~6, changed 4; beck has no entry and is the
#   1 untouched.
# - Fields: height, clearing and water all changed (the ford's approach, the pad); 0 untouched.
# - The cottage stands on lane_west, so it and its footprint moved (~1 each). Trees have no
#   `ground`, so no footprint row of theirs.
# - Rows sort by maker, null first, then table (build.md 11.2): four written rows, then `trees`.
#   Its counts are measured, so only what the spec fixes is asserted: instances, nothing swapped
#   or changed (a scatter's draws are not redrawn, identity.md 4.1).
# - Every entry past the cottage (index 11) is a tree: instance `trees#...`.
# - Each cause's `via` is one chain from the node reading feature.ford.on (shape:ford) to the
#   thing's nearest node: instance:cottage for the cottage, footprint:cottage for its footprint
#   (graph.md 1, build.md 11.2).

[copy.ford]
from = "examples/ford"
to   = "."

[action.program]
via  = ["config", "program", "python", "{python}"]
exit = 0

[action.trust]
via  = ["trust", "world.toml", "--yes", "--change", "downstream"]
exit = 0

[action.base]
via  = ["build", "world.toml", "--out", "build/ford"]
out  = "build/ford"
exit = 0
diagnostics = "includes"

[action.downstream]
via  = ["build", "world.toml", "--change", "downstream", "--out", "build/ford"]
out  = "build/ford"
exit = 0
diagnostics = "includes"

[action.downstream.file.at_ford]
path     = "build/ford/changes.json"
pointer  = "/entries/0"
includes = { name = "at_ford", table = "feature", what = ["moved", "changed"], keys = ["attrs.toward"] }

[action.downstream.file.ford]
path     = "build/ford/changes.json"
pointer  = "/entries/1"
includes = { name = "ford", table = "feature" }

[action.downstream.file.in_trees]
path     = "build/ford/changes.json"
pointer  = "/entries/2"
includes = { name = "in_trees", table = "feature" }

[action.downstream.file.lane_east]
path     = "build/ford/changes.json"
pointer  = "/entries/3"
includes = { name = "lane_east", table = "feature" }

[action.downstream.file.lane_west]
path     = "build/ford/changes.json"
pointer  = "/entries/4"
includes = { name = "lane_west", table = "feature" }

[action.downstream.file.on_bank]
path     = "build/ford/changes.json"
pointer  = "/entries/5"
includes = { name = "on_bank", table = "feature" }

[action.downstream.file.to_door]
path     = "build/ford/changes.json"
pointer  = "/entries/6"
includes = { name = "to_door", table = "feature" }

[action.downstream.file.clearing]
path     = "build/ford/changes.json"
pointer  = "/entries/7"
includes = { name = "clearing", table = "field", what = ["changed"] }

[action.downstream.file.height]
path     = "build/ford/changes.json"
pointer  = "/entries/8"
includes = { name = "height", table = "field", what = ["changed"], keys = ["samples"] }

[action.downstream.file.water]
path     = "build/ford/changes.json"
pointer  = "/entries/9"
includes = { name = "water", table = "field", what = ["changed"] }

[action.downstream.file.footprint]
path     = "build/ford/changes.json"
pointer  = "/entries/10"
includes = { name = "cottage", table = "footprint" }

[action.downstream.file.cottage]
path     = "build/ford/changes.json"
pointer  = "/entries/11"
includes = { name = "cottage", table = "instance" }

# Each with its cause: for the first twelve entries, the one cause feature.ford.on at its line.
[action.downstream.file.cause_at_ford]
path     = "build/ford/changes.json"
pointer  = "/entries/0/causes/0"
includes = { cause = "feature.ford.on", file = "world.toml", in = "this", line = 74, via = ["shape:ford/v:build", "attr:at_ford"] }

[action.downstream.file.cause_height]
path     = "build/ford/changes.json"
pointer  = "/entries/8/causes/0"
includes = { cause = "feature.ford.on", file = "world.toml", in = "this", line = 74 }

[action.downstream.file.cause_ford]
path     = "build/ford/changes.json"
pointer  = "/entries/1/causes/0"
includes = { cause = "feature.ford.on", file = "world.toml", in = "this", line = 74 }

[action.downstream.file.cause_cottage]
path     = "build/ford/changes.json"
pointer  = "/entries/11/causes/0"
includes = { cause = "feature.ford.on", file = "world.toml", in = "this", line = 74 }

[action.downstream.file.format]
path    = "build/ford/changes.json"
pointer = "/format"
value   = "via-changes-0"

[action.downstream.file.via_cottage_first]
path    = "build/ford/changes.json"
pointer = "/entries/11/causes/0/via/0"
value   = "shape:ford/v:build"

[action.downstream.check.via_cottage]
fn       = "json_list"
path     = "build/ford/changes.json"
pointer  = "/entries/11/causes/0/via"
at_least = 2
last     = "instance:cottage/v:build"

[action.downstream.file.cause_footprint]
path     = "build/ford/changes.json"
pointer  = "/entries/10/causes/0"
includes = { cause = "feature.ford.on", file = "world.toml", in = "this", line = 74 }

[action.downstream.check.via_footprint]
fn       = "json_list"
path     = "build/ford/changes.json"
pointer  = "/entries/10/causes/0/via"
at_least = 2
last     = "footprint:cottage/v:build"

[action.downstream.check.one_cause_cottage]
fn      = "json_count"
path    = "build/ford/changes.json"
pointer = "/entries/11/causes"
count   = 1

[action.downstream.check.trees_after_cottage]
fn       = "json_list"
path     = "build/ford/changes.json"
pointer  = "/entries"
from     = 12
at_least = 1
includes = { table = "instance" }
starts   = { name = "trees#" }

[action.downstream.check.beck_untouched]
fn          = "changes_absent"
path        = "build/ford/changes.json"
entry_names = ["beck"]

[action.downstream.check.summary_rows]
fn      = "json_count"
path    = "build/ford/changes.json"
pointer = "/summary"
count   = 5

[action.downstream.file.summary_feature]
path    = "build/ford/changes.json"
pointer = "/summary/0/line"
value   = "feature (written): +0 -0 ~6 swapped 0 changed 4, 1 untouched"

[action.downstream.file.summary_field]
path    = "build/ford/changes.json"
pointer = "/summary/1/line"
value   = "field (written): +0 -0 ~0 swapped 0 changed 3, 0 untouched"

[action.downstream.file.summary_footprint]
path    = "build/ford/changes.json"
pointer = "/summary/2/line"
value   = "footprint (written): +0 -0 ~1 swapped 0 changed 0, 0 untouched"

[action.downstream.file.summary_instance]
path    = "build/ford/changes.json"
pointer = "/summary/3/line"
value   = "instance (written): +0 -0 ~1 swapped 0 changed 0, 0 untouched"

[action.downstream.file.summary_trees]
path     = "build/ford/changes.json"
pointer  = "/summary/4"
includes = { maker = "trees", table = "instance", swapped = 0, changed = 0 }

# Every written entry's cause has a non-empty `via` (build.md 11.2: both ends included). Its first
# node is not asserted for these: both shape:ford and attr:ford read feature.ford.on (graph.md 6.4
# row 3), so the shortest chain may start at either; at_ford's, the cottage's and its footprint's
# are asserted whole or by their last node above.

[action.downstream.check.via_ford]
fn       = "json_list"
path     = "build/ford/changes.json"
pointer  = "/entries/1/causes/0/via"
at_least = 1

[action.downstream.check.via_in_trees]
