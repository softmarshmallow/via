format    = "via-case-1"
summary   = "Three materials of equal weight at one post: bytes 85, 85, 85. Two of equal weight: 128 and 127, the 128 on the lower id. One at weight 1e-4 beside one at 1: no plane for the first."
milestone = 1
actions   = ["build"]

# Weights fields with no role, so `paint` names any id (fields.md 5.2). a, then b at 0.5, then c at
# 1/3 leaves a = b = c = 1/3; a then b at 0.5 leaves 0.5 each; a then b at 1e-4 leaves 0.9999 and
# 1e-4, whose byte is 0 (0.0255 floored, the remainder given to a), so its plane is dropped.

[action.build]
via  = ["build", "world.toml", "--out", "build/w"]
exit = 0
out  = "build/w"

[action.build.file.three_0]
path  = "build/w/weights/three/0_0.npy"
post  = [4, 4]
plane = 0
value = 85

[action.build.file.three_1]
path  = "build/w/weights/three/0_0.npy"
post  = [4, 4]
plane = 1
value = 85

[action.build.file.three_2]
path  = "build/w/weights/three/0_0.npy"
post  = [4, 4]
plane = 2
value = 85

[action.build.file.two_a]
path  = "build/w/weights/two/0_0.npy"
post  = [4, 4]
plane = 0
value = 128

[action.build.file.two_b]
path  = "build/w/weights/two/0_0.npy"
post  = [4, 4]
plane = 1
value = 127

[action.build.file.tiny]
path  = "build/w/weights/tiny/0_0.npy"
shape = [1, 9, 9]
