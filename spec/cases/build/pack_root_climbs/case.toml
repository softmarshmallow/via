format    = "via-case-1"
summary   = "A pack in a subfolder (`packs/top.toml`) whose `root` climbs to the world's folder (`..`), the world built from its own folder: the manifest's pack_root resolves, and no build.pack_root_far (F6's review: the climb to the working directory was taken for no path)."
milestone = 7
actions   = ["build"]

[action.build]
via         = ["build", "world.toml", "--out", "build/w"]
exit        = 0
diagnostics = "includes"
out         = "build/w"

[action.build.check.root]
fn    = "pack_root_resolves"
build = "build/w"

[action.build.diag.not_far]
code    = "build.pack_root_far"
records = 0
