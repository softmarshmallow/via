# The function table, machine copy (R33). Source: spec/formulas.md section 8, whose table is
# normative; a workspace check holds the two equal and generates from this file the
# evaluator's dispatch (crates/via-expr), the reference page (docs/reference/) and the SDK's
# function list. One table per function, keyed by its name; `order` is its place in section 8,
# which the reference page follows. Text is copied from the chapter's columns as written.

format = "via-functions-1"

[function.abs]
order = 1
section = "8.1"
signatures = ["abs(a)"]
parameters = "number"
result = "number"
rate = "none"
halo = "none"
where = "any"
meaning = "Absolute value."
milestone = 1

[function.sqrt]
order = 2
section = "8.1"
signatures = ["sqrt(a)"]
parameters = "number"
result = "number"
rate = "none"
halo = "none"
where = "any"
meaning = "Square root. `a < 0` is non-finite (section 9)."
milestone = 1

[function.pow]
order = 3
section = "8.1"
signatures = ["pow(a, b)"]
parameters = "number, number"
result = "number"
rate = "none"
halo = "none"
where = "any"
meaning = "`a` to the power `b`."
milestone = 1

[function.exp]
order = 4
section = "8.1"
signatures = ["exp(a)"]
parameters = "number"
result = "number"
rate = "none"
halo = "none"
where = "any"
meaning = "e to the power `a`."
milestone = 1

[function.floor]
order = 5
section = "8.1"
signatures = ["floor(a)"]
parameters = "number"
result = "number"
rate = "none"
halo = "none"
where = "any"
meaning = "Largest whole number not above `a`."
milestone = 1

