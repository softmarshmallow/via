# The vocabulary, machine copy (R33). Source: spec/vocabulary.md, which is normative; the
# deny-list test (vocabulary.md 7) reads [deny] and [allow] from here, and a workspace check
# holds this file equal to the chapter. Machine files of protocol.md 6 (config.toml,
# trust.toml) are not listed (R33).

format = "via-vocabulary-1"

# Section 7. A hit is a whole word or its plural in s or es; a two-word entry matches two words
# in a row. Identifiers split at `_`, `::` and lower-to-upper case changes; string literals at
# every character that is not a letter; comments are not read.
[deny]
words = [
    "road",
    "lane",
    "street",
    "main way",
    "crossing",
    "ford",
    "bridge",
    "deck",
    "river",
    "beck",
    "lake",
    "water",
    "shore",
    "district",
    "square",
    "axis",
    "ward",
    "lot",
    "block",
    "building",
    "storey",
    "room",
    "door",
    "window",
    "stair",
    "wall",
    "roof",
    "pad",
    "tree",
    "plant",
    "bookmark",
    "poi",
    "waterfront",
    "expect",
    "profile",
    "reach",
    "headroom",
    "cliff",
    "trail",
    "wood",
    "spawn zone",
]
crates = ["via-num", "via-diag", "via-doc", "via-expr", "via-geom", "via-raster", "via-graph", "via-model", "via-proto", "via-cli", "via-step"]
excluded = ["via-terrain"]

# Section 7: words the test passes, allowed in the core in this sense only; review checks it.
[allow.window]
sense = "An evaluation window over a field (doctrine section 7)."

[allow.axis]
sense = "A coordinate axis."

[allow.block]
sense = "Blocking input and output; a block of code."

[allow.wall]
sense = "Wall-clock time."

[allow.square]
sense = "Squaring a number."

[allow.tree]
sense = "`BTreeMap` (R19's ordered maps); a spatial index tree."

[allow.expect]
sense = "Rust's `expect` on `Option` and `Result`."

[allow.pad]
sense = "Padding bytes or text."

[allow.lane]
sense = "A lane of a vector instruction."

[allow.reach]
sense = "Reachability in a graph."

[allow.crossing]
sense = "Where two segments or paths cross (geometry), as in `geom.self_crossing`, `geom.unowned_crossing`."

[allow.profile]
sense = "A picture's colour profile, `field.file_profile`; a Cargo build profile."

