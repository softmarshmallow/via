[package]
name = "via-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The via command line and the build directory it writes."
build = "build.rs"

[[bin]]
name = "via"
path = "src/main.rs"

[dependencies]
via-num = { workspace = true }
via-diag = { workspace = true }
via-doc = { workspace = true }
via-raster = { workspace = true }
via-graph = { workspace = true }
via-model = { workspace = true }
via-geom = { workspace = true }
via-proto = { workspace = true }
via-expr = { workspace = true }
# The worker's messages (protocol.md 3), as via-proto speaks them.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# `config.toml` and `trust.toml` (protocol.md 6.3), files of the machine the command line writes.
toml = "1.1"
# Ctrl+C and SIGTERM while a step runs (protocol.md 6.2), as via-proto uses it.
libc = "0.2"

[lints]
workspace = true
