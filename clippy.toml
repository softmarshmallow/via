# R26 and spec/numbers.md section 8: outside via-num, a core crate calls only the float operations
# that are exact or correctly rounded on every system. Each method below differs between platform
# maths libraries, fuses a rounding (mul_add), rounds ties away (round), or leaves signed zero
# unspecified (min, max, clamp), so it is denied by the workspace lint `clippy::disallowed_methods`.
# The list follows numbers.md 8, and its "every other method of f32 or f64": every stable method
# that computes a value and is not on the allow-list is here (to_degrees and to_radians, for one,
# are not correctly rounded and would bypass via-num's RAD_PER_DEGREE). Left off on purpose: the
# exact predicates and bit views (is_infinite, is_normal, is_subnormal, classify,
# is_sign_positive, to_*_bytes), which compute nothing. A method stabilised after Rust 1.92 is
# added here when the toolchain moves. "No crate but via-num depends on a maths library" is
# `cargo run -p xtask -- check --only maths-deps`.
disallowed-methods = [
    { path = "f64::powf", reason = "use via_num" },
    { path = "f64::powi", reason = "use via_num" },
    { path = "f64::exp", reason = "use via_num" },
    { path = "f64::exp2", reason = "use via_num" },
    { path = "f64::ln", reason = "use via_num" },
    { path = "f64::log", reason = "use via_num" },
    { path = "f64::log2", reason = "use via_num" },
    { path = "f64::log10", reason = "use via_num" },
    { path = "f64::sin", reason = "use via_num" },
    { path = "f64::cos", reason = "use via_num" },
    { path = "f64::tan", reason = "use via_num" },
    { path = "f64::sin_cos", reason = "use via_num" },
