# The land library: the ground and what is levelled into it (docs/plan.md, "Ford's libraries").
#
# Conventions this library documents for a world that includes it:
# - The terrain is a field with role `surface`, owned by the world (R25, R31); a world names it as
#   it likes (`ford` calls it `height`). Libraries write it as `role:surface`, never by name.
# - "Not here" for scatters and props is a field with role `keep_out` (rules.md 7.1). A world that
#   wants pads to clear their ground declares one (`ford`'s `clearing`, `base = "= 0"`).
# - Ground paint is a world's `weights` field, role `material`, its rows in this order: `grass`
#   (no mask), `rock` (on slope), `gravel` (at water), `earth` (on lanes); lib/land/ground.md gives
#   the masks. A library declares no field and no kind here paints (`authority.no_field`).
#
# A pad is lent to an instance by `ground = "pad"` (rules.md 2.1): the footprint grown by `margin`
# becomes a region feature of this kind, so the ground under a house is level and clear.
#
# The bank (asked by `glade`, `relief`, `vale`): the ground under the footprint is levelled to its
# mean, and outside it the ground is held within `grade` (rise over run) of that level, so a pad on
# a slope meets the land at a walkable bank and only as far out as it must; ground already within
# the grade is left as it lies. The bank holds the grade out to 10 m; where the ground still lies
# off that band there (a hillside steeper than `grade`), the bank fades into the ground over the
# next 15 m, `1.5 * max_cut / grade`, so the fade adds at most `grade` to the ground's own slope
# and never leaves a step. Levelling that moves the ground more than `max_cut` metres anywhere,
# which is the gap at 10 m when the bank has not met the ground, is `authority.max_change`, naming
# the house (authority.md 2.2). A world on steep land lowers `grade` or raises `max_cut` per
# instance only by choosing another ground kind; the defaults are the library's.
#
# The clearing (asked by `vale`): keep_out is tested at a tree's trunk (rules.md 7.1), so a pad
# holds it at 1 out past a crown's reach and fades beyond, as lib/ways' verge does: a tree whose
# crown would reach over the house has no chance. The reach is the widest pack tree's crown
# (starter's `tree_oak_large`, 4 m, 5.2 m at the scatters' largest scale 1.3) with a little to
# spare: 5.5 m from the footprint and its margin.

[kind.pad]
authority = "shaped"
radius    = 26                            # the bank's 10 m and its 15 m fade

[kind.pad.defaults]
grade   = 0.3                             # the steepest bank, rise over run (17 degrees)
max_cut = 3                               # metres the pad may cut or bank the ground, at most

[kind.pad.effect.level]                   # the ground under the footprint at its mean (surfaces.md 6.1)
field      = "role:surface"
value      = "= clamp(v, under('mean') - grade * d, under('mean') + grade * d)"
mask       = "= 1 - smoothstep(10, 25, d)"
max_change = "= max_cut"

[kind.pad.effect.clear]                   # no tree on the footprint, and no crown over it
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(5.5, 7.5, d)"

[kind.firm_pad]                           # the firm pad of authority.md 1.3: a pad that holds
authority = "anchored"
radius    = 8                             # the clearing's 7.5 m; the ring (fields.md 5.3) stays clear

[kind.firm_pad.effect.level]
field = "role:surface"
value = "= under('mean')"
mask  = "= 1 - smoothstep(0, 3, d)"

[kind.firm_pad.effect.clear]                # as the pad's: past a crown's reach
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(5.5, 7.5, d)"

# A cliff (M2, `vale`): a path along the foot of a rock face, the high ground on its left (`sd`
# above 0, numbers.md 5.5: walk the path with the face on your left hand). The face is `drop`
# metres high and about 2 m wide. Half of it is the land above lifted, half the land below lowered,
# and both halves fade back into the land over `back` metres, so the cliff is a scarp in the slope:
# no ridge behind it and no wall standing on flat ground. It tapers to nothing over the first and
# last tenth of the path, so its ends run into the hillside. Boulders at its foot are a scatter's,
# by `sdist('<cliff>', cap)` (rules.md 7.2): the cliff writes no "rock" field of its own
# (principle 10).
[kind.cliff]
authority = "shaped"
radius    = 54                            # the farthest `back`, 50 m, and the face

[kind.cliff.defaults]
drop = 9                                  # metres from the foot to the top of the face
back = 30                                 # metres over which each side fades into the land (at most 50)

[kind.cliff.effect.face]
field = "role:surface"
value = "= v + drop * smoothstep(0, 0.1, t) * (1 - smoothstep(0.9, 1, t)) * (smoothstep(-1, 1, sd) - 0.5) * (1 - smoothstep(back / 3, back, d))"
mask  = "= 1 - smoothstep(back, back + 2, d)"

# A sheer cliff (M5, `coast`; TODO "sheer faces draw stair-stepped at 1 m posts"): a cliff that
# says "sheer" owns its face. The path runs along the face, the high ground on its left (`sd` above
# 0), as `cliff`'s. The face is the kind surface `face`, a strip `2 * lip` wide that rises from
# `foot_z` on its right edge to `top_z` on its left. A kind surface's mesh has vertices across the
# strip only on its outline (spec/build.md 10), so the face is drawn along the path's own line at
# atan(drop / (2 * lip)) (87 degrees for a 20 m face at the 0.5 m default), never stair-stepped at
# the posts as the terrain's step is. Its `cut` removes every terrain quad whose centre is on the
# strip (surfaces.md 1.3): the terrain's own step, a post wide, is not drawn. Keep `lip` at least
# 0.71 of the world's resolution, so every quad the step crosses has its centre on the strip.
#
# `step` writes the terrain to `foot_z` on the right of the line and `top_z` on its left, flat to
# `lip + 2` m and fading into the land by `back`: the land each side meets the face's edges level.
# A cut quad reaches up to 0.71 of a post past the strip, so a sliver that thin is open at the
# face's foot and brink; the library's rocks, or the engine, close it (surfaces.md 5).
#
# The face, not the terrain's step, tapers to `foot_z` over the first and last `taper` of the
# length, so an end written at a place by name meets it at `foot_z`: a cave's jamb (`cave`, below)
# holds the face open at the mouth. Material `rock`, which both shipped packs have.
#
# A face whose foot and brink climb along it (M5 slice 3, `monastery`'s gorge: its floor rises 0.15
# m a metre and its rim 0.17): the foot is `foot_z + foot_rise * t` and the brink `top_z + top_rise
# * t`, so `foot_rise` and `top_rise` are the metres each gains from the start to the end. A face
# that does not climb straight is written as pieces, each straight in both, end to end, with a
# `taper` near 0 (a piece's two ends then meet its neighbour's at full height, not at the foot).
# Past its ends a piece's `step` would write its own foot or brink over its neighbour's (a post
# beyond the end is on whichever side the last segment's line puts it), so pieces set `beyond = 0`.
# `side = -1` puts the high ground on the right of travel: a face written along a feature by
# `follows`, which takes that feature's direction, may have the high ground on either side (the
# gorge's two walls). A kind surface's `base` cannot read the terrain (surfaces.md 1.1), so the
# heights are numbers the world writes, as `deck_z` is; the `step` effect brings the land each side
# to them.
[kind.sheer_cliff]
authority = "shaped"
requires  = ["foot_z", "top_z"]
radius    = 14                            # `back` and the fade

[kind.sheer_cliff.defaults]
lip   = 0.5                               # half the face's width in plan, metres
back  = 12                                # metres from the line by which the land is its own again
taper = 0.02                              # share of the length at each end over which the face comes down
side  = 1                                 # 1: the high ground on the left of travel; -1: on the right
foot_rise = 0                             # metres the foot climbs from the start to the end
top_rise  = 0                             # metres the brink climbs from the start to the end
beyond    = 1                             # 1: the step reaches past the ends, fading by `back`; 0: it
                                          # stops at them (`t` strictly between 0 and 1: pieces end to end)

[kind.sheer_cliff.surface.face]
base     = "= foot_z + foot_rise * t + (top_z + top_rise * t - (foot_z + foot_rise * t)) * clamp((side * sd + lip) / (2 * lip), 0, 1) * smoothstep(0, taper, t) * (1 - smoothstep(1 - taper, 1, t))"
bound    = "= lip"
cut      = "= max(top_z, top_z + top_rise) - min(foot_z, foot_z + foot_rise)"
material = "rock"

[kind.sheer_cliff.effect.step]
field = "role:surface"
value = "= if(side * sd < 0, foot_z + foot_rise * t, top_z + top_rise * t)"
mask  = "= (1 - smoothstep(lip + 2, back, d)) * if(t > 0 and t < 1, 1, beyond)"

# A cave (M5, `coast`; surfaces.md 6.5): a path from its mouth inward. Its floor is a kind surface
# that rises from `z0` at the mouth to `z1` at the end, under the terrain: `surfaces_at` inside
# lists the terrain above the floor (surfaces.md 1, rule 7). `cut` opens the terrain within
# `headroom` of the floor, so the hill's quads at the mouth are not drawn and its top is whole.
# The mouth is a meeting with the ground in front of it (`mouth`, `mouth_ground`), held at gap 0 by
# `sill`, which writes `z0` on the posts within a metre of the mouth (anchored, so after a shaped
# cliff's step there). Write the mouth on a post. Its two jambs, `left_jamb` and `right_jamb`, lie
# on the floor's edge at the mouth (2 m either side, the default `width`): a sheer cliff ends at
# one by name and starts at the other, so the face stays open where the cave moves. The rock round
# the passage is assets a library places (surfaces.md 1.3, 5): none yet.
[kind.cave]
authority = "anchored"
requires  = ["z0", "z1"]
radius    = 2

[kind.cave.defaults]
width    = 4                              # metres; the jambs are written at 2 m, so keep it 4
headroom = 3                              # metres of terrain cleared over the floor

[kind.cave.surface.floor]
base     = "= z0 + (z1 - z0) * t"
bound    = "= width / 2"
cut      = "= headroom"
material = "rock"

[kind.cave.mount.mouth]
t       = 0
surface = "floor"
face    = 180                             # out of the cave
meets   = "mouth_ground"

[kind.cave.mount.mouth_ground]
t    = 0
face = 0                                  # into it

[kind.cave.mount.left_jamb]
t       = 0
offset  = 2
surface = "floor"

[kind.cave.mount.right_jamb]
t       = 0
offset  = -2
surface = "floor"

[kind.cave.effect.sill]
field = "role:surface"
value = "= z0"
mask  = "= (1 - smoothstep(0.5, 1, d)) * (1 - smoothstep(0.02, 0.04, t))"
