# The town library: streets, the blocks they bound, the lots along a block's frontage, and a house
# on each lot facing its street (docs/plan.md, M3; R13: block, lot and frontage are library words,
# the core's are network, area and cell, geometry.md 8).
#
# How a world uses it (geometry.md 8.4 is the same pattern on a grid):
#
#     include = ["land", "town"]
#
#     [feature.old_town]                        # the district the local streets fill
#     region = [[60, 60], [440, 60], [440, 380], [60, 380]]
#
#     [feature.high_street]                     # a main way: what it connects, routed over the land (R16)
#     kind      = "main_street"
#     starts_at = "west_gate"
#     ends_at   = "east_gate"
#     path      = []
#     route     = "= 1 + 40 * slope('height')"
#
#     [step.streets]                            # local streets inside the district (lib/town/streets.py)
#     when    = "generate"
#     worker  = true
#     command = ["python", "-m", "viasdk", "lib:town/streets.py"]
#     params  = { district = "old_town" }
#
#     [network.blocks]                          # the core nodes them; every area is a block
#     from   = ["kind:main_street", "kind:street"]    # (not `streets`: a step owns that id)
#     within = "old_town"
#     kind   = "block"
#
#     [cells.lots]                              # the core cuts lots along each block's street sides
#     within   = "blocks"
#     frontage = ["kind:main_street", "kind:street"]
#     spacing  = 9
#     depth    = 16
#     min_length = 5
#     kind     = "lot"
#
# and, in a layer above (a step reads a cells table only from above it, geometry.md 8.3):
#
#     [step.houses]                             # one house per lot, facing its street (lib/town/houses.py)
#     when    = "generate"
#     worker  = true
#     command = ["python", "-m", "viasdk", "lib:town/houses.py"]
#     params  = { lots = "lots", ground = "pad" }
#
#     [step.review]                             # streets reads `high_street`, a stated fact: a lint
#     when    = "lint"                          # must check it, or `authority.unchecked`
#     worker  = true
#     command = ["python", "-m", "viasdk", "lib:review/checks.py"]
#     checks  = ["streets", "houses"]
#
# Streets meet only where the network nodes them: every crossing of two of its inputs is owned by
# the network (geometry.md 8.1, "Meetings"), so no street needs `starts_at` or `ends_at` on another.
# A street the step lays ends on another street or runs past the district's outline (cut there by
# the network's `within`): never a dead end of its own making (TODO, "Dead ends tripled").
#
# The bed of both street kinds (ours, written for this library after quay's walk): level across to
# `edge` (half the width and the footway) at the height smoothed along the way, cambered; past `edge`
# the ground is held within a bank of `grade` (rise over run, 0.5: no steeper than 1:2) from the
# bed's edge, so a cut of 3 m makes a bank 6 m wide and a cut of 0.3 m one of 0.6 m: the bank grows
# with the cut instead of fading over a fixed width, which left 2 to 4 m walls at 40 to 50 degrees
# on quay's contour streets. Where the ground already lies within the bank the mask is 0 (nothing
# written). A cut deeper than `grade * (radius - edge)` meets the radius: `field.effect_cut` says so.
# With `length` (metres, the path's own; the streets step writes it, 0 leaves it off), the bed fades
# to the ground over its last metres (over the width, or three times the cut, whichever is longer,
# so the fade along the way is no steeper than 1:2 either) and does nothing past its ends: no round
# cap cut into the land beyond a street's end. A routed main way has no `length` an author can
# write; the core naming a path's length in formulas is owed (lib/town TODO), so a main way's ends
# keep the round cap, now with a 1:2 bank.
#
# A town street is a carriageway `width` metres wide with a footway `footway` metres wide each side
# (the bed is level across both). Both street kinds keep the carriageway and the footways clear
# (`role:keep_out`, `verge`), fading to 0 over half a metre past the footway: a house stands at the
# footway's back edge (lib/town/houses.py rule 4 reads this keep_out to set each row's setback), and
# no tree stands on the way. That is narrower than lib/ways' road, which keeps a crown's reach (3 m)
# past its edge: a tree's crown may reach over a town footway, as it does in a town. (quay, M3 slice
# 2: the verge reached `width / 2 + 5`, so every house stood 7.5 m back and a street read as a 15 m
# gap between detached houses.) Like a road, the
# bed reads the ground `k` metres along the way (`smoothed_along(k)`): keep a street `k` metres
# inside the world's extent (40 m for a main street, 16 m for a street), or its smoothing window
# reads outside the field (`formula.outside_field`).

[kind.main_street]                          # a way between named places, through the town
authority = "shaped"
radius    = 24                              # a 1:2 bank from the edge (5.25 m) holds a cut of 9.4 m

[kind.main_street.defaults]
width   = 6.5                               # metres, kerb to kerb of the carriageway
footway = 2                                 # metres of footway each side, to the house fronts
camber = 0.02                               # fall from the crown to each edge, per metre
grade  = 0.5                                # the bank past the bed's edge, rise over run (1:2)
length = 0                                  # metres of path; above 0, the bed fades out at its ends

[kind.main_street.let]
edge  = "= width / 2 + footway"
level = "= smoothed_along(40) - camber * min(d, edge)"
bank  = "= grade * max(d - edge, 0)"
ends  = "= if(length > 0, smoothstep(0, max(width, 3 * abs(v - level)), min(t, 1 - t) * length), 1)"

[kind.main_street.effect.bed]               # cut and filled, smoothed along a long run, crowned
field = "role:surface"
value = "= clamp(v, level - bank, level + bank)"
mask  = "= ends * if(abs(v - level) > bank, 1, 0)"

[kind.main_street.effect.verge]
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(width / 2 + footway, width / 2 + footway + 0.5, d)"

# A local street follows the land where it is steep (streets.py), so it is laid along the contour
# and its bed has little to cut; it is smoothed along a shorter run than a main street, so it keeps
# the bends a contour has.
[kind.street]
authority = "shaped"
radius    = 20                              # a 1:2 bank from the edge (3.75 m) holds a cut of 8 m

[kind.street.defaults]
width   = 4.5                               # metres, kerb to kerb
footway = 1.5                               # metres each side
camber = 0.02
grade  = 0.5
length = 0                                  # the streets step writes each street's own

[kind.street.let]
edge  = "= width / 2 + footway"
level = "= smoothed_along(16) - camber * min(d, edge)"
bank  = "= grade * max(d - edge, 0)"
ends  = "= if(length > 0, smoothstep(0, max(width, 3 * abs(v - level)), min(t, 1 - t) * length), 1)"

[kind.street.effect.bed]
field = "role:surface"
value = "= clamp(v, level - bank, level + bank)"
mask  = "= ends * if(abs(v - level) > bank, 1, 0)"

[kind.street.effect.verge]
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(width / 2 + footway, width / 2 + footway + 0.5, d)"

# A block is an area of the street network (`[network.<id>] kind = "block"`), a lot a cell along a
# block's frontage (`[cells.<id>] kind = "lot"`). Neither writes a field: they are named regions,
# so text and steps can say "this block", "the lot at [x, y]" (`{ of, class, near }`, identity.md
# 3) and a check can ask whether a house has a street. A lot does not level its ground; the house
# on it does, through the pad it is lent (`ground = "pad"`, lib/land), so a lot on a slope is
# terraced only under its house (TODO, "Local streets and lots ignore the land").
# A terrace: the level ground under one row of houses (lib/town/houses.py, `terrace`), a region the
# houses step returns round each run of houses standing wall to wall. It levels the run at `level`
# when `set_level` is 1 (the houses step writes the footway's height in front of the doors, and
# carries the region a metre out over the door apron, so a door opens level onto its footway and
# the bank behind takes up the fall: quay-walk found 91 of 123 doors more than 1 m off the footway
# when each terrace stood at its own mean), else at its mean, so the houses of a row stand on one
# floor; one pad per house (lib/land `pad`, lent by
# `ground`) levelled each house at its own mean, and on a fall two neighbours 1 cm apart each
# banked the other's footprint: quay had 50 `place.relief` of 0.6 to 1 m, all between neighbours.
# Past the run the ground is held within a bank of `grade` (0.7, 35 degrees: no steeper, TODO
# "banks over 35 degrees") and the hold fades out between 4 and 8 m, so the footway in front is
# barely touched. It keeps nothing out (no `keep_out`): it is ground, and its houses stand on it.
# Ours, written for quay.
[kind.terrace]
authority = "shaped"
radius    = 9                               # the fade's 8 m and a post

[kind.terrace.defaults]
grade   = 0.7                               # the bank, rise over run (35 degrees)
max_cut = 3                                 # metres it may cut or bank the ground, at most
level   = 0                                 # metres: the floor, read only with `set_level = 1`
set_level = 0                               # 1: level at `level`; 0: at the ground's mean

[kind.terrace.let]
top = "= if(set_level > 0, level, under('mean'))"

[kind.terrace.effect.level]
field      = "role:surface"
value      = "= clamp(v, top - grade * d, top + grade * d)"
mask       = "= if(d > 0, if(inside('kind:terrace'), 0, 1 - smoothstep(4, 8, d)), 1)"
max_change = "= max_cut"

[kind.block]
authority = "derived"

[kind.lot]
authority = "derived"

# A ward: an area of a town's skeleton, the main ways (and the water, the crossings, the town's
# limits) noded into one network (`[network.wards] kind = "ward"`). Like a block it writes no field;
# it is a named region, so a check can say which wards an edit to one main way touched (`city`).
[kind.ward]
authority = "derived"

# A waterfront owns the bank (R18): a path along the water's edge, the land on its left (`sd`
# above 0, numbers.md 5.5: walk it with the water on your right hand). Streets end on its line, and
# a network that selects it (`kind:waterfront`) nodes them there; lots may face it (`frontage`).
# The line is the landward edge of a deck `width` metres wide, level at `level` (metres, the
# world's: a little above its water); past the deck's water side the ground falls `wall` metres
# at once, a quay wall, and stays at or below that. On the land side the deck's level fades into
# the ground over `bank` metres, so streets arriving from the slope run down onto the deck.
# Anchored: a street's bed and a house's pad give way to it (authority.md 3). The streets step
# lays streets down to it with `shore` (lib/town/streets.py, step 6). Ours, written for `quay`.
#
# Its ends (M3 slice 5; R16, R18: an end is a meeting too, and a kind that owns a line owns how it
# stops). The wall fades over the first and last `end_fade` of the line (a fraction of `t`, as
# lib/ways' crossing fades its heads: a path's length has no name in a formula), so it is `wall`
# deep along the line and nothing at each end, and it asserts nothing there (its mask fades with
# it); the deck's own mask fades over the first and last quarter of that stretch (`toe`), so at an
# end the deck asserts nothing either and what the end meets holds it (a crossing's deck and head:
# both masks at 1 there was `authority.conflict` on `townland`'s first try). Past an end (`t` at 0
# or 1) the waterfront writes nothing, so the wall no longer runs round the end in a ring
# (`townland`: a 65 to 69 degree face into a dry pit beside the river at the south end). The deck
# may rise at an end to a level a named thing gives: `level_start`, `level_end` (metres; default
# `level`), reached over the first or last `rise` of `t`. A waterfront that meets a crossing's end
# names it (`starts_at = "old_bridge.end"`, R18) and takes its level (`level_start = "=
# old_bridge.deck_z"`); the crossing, arrived at, holds its head (authority.md 6).
#
# `ends`: a way that ends on the deck is brought to the deck's level at no more than `end_grade`
# (rise over run, 1:5) over as many metres as the drop needs, out to `reach` (M3 slice 5: quay's
# main way fell 2.4 m in its last 3 m, a step its walker could not take; `d35` and `d175` ended at
# 0.47 m a metre). On the land side within `reach` of the line the ground is held within a band of
# the deck's level that widens at `end_grade` from the line and at 1:2 sideways from the edge of a
# way's bed (`main_edge`, `street_edge`: half the carriageway and a footway, lib/town's defaults):
# so the hold follows the ways that arrive and leaves the ground between them as it lies, and no
# cone is cut into the land. A way that runs along the deck within `reach` is held too. It reads
# `kind:main_street` and `kind:street`: a world with a waterfront and no ways of one of those kinds
# says `formula.empty_selection` (warning) and the hold leaves the ground. The hold fades with the
# wall over the ends (`tip`): what meets the waterfront's end owns that meeting (a crossing holds its
# head, and two anchored holds there disagree: `authority.conflict`, `townland`'s first try).
[kind.waterfront]
authority = "anchored"
requires  = ["level"]
radius    = 30

[kind.waterfront.defaults]
width = 8                                   # metres of deck, from the line to the wall's face
wall  = 4                                   # metres the ground drops at the deck's water side
bank  = 12                                  # metres over which the deck fades into the land
apron = 3                                   # metres of open quayside kept clear on the land side
end_fade = 0.1                              # of `t`: the wall fades out over each end's stretch
level_start = "= level"                     # metres: the deck's level at its start
level_end   = "= level"                     # metres: at its end
rise  = 0.25                                # of `t`: the stretch over which the deck reaches them
end_grade = 0.2                             # rise over run of a way's bed onto the deck (1:5)
reach = 24                                  # metres from the line the way's hold reaches
main_edge   = 5.25                          # metres from a main street's line to its bed's edge
street_edge = 3.75                          # from a street's

[kind.waterfront.let]
tip  = "= smoothstep(0, end_fade, t) * smoothstep(0, end_fade, 1 - t)"
toe  = "= smoothstep(0, end_fade / 4, t) * smoothstep(0, end_fade / 4, 1 - t)"
deck = "= level + (level_start - level) * (1 - smoothstep(0, rise, t)) + (level_end - level) * (1 - smoothstep(0, rise, 1 - t))"
side = "= min(max(dist('kind:main_street', reach) - main_edge, 0), max(dist('kind:street', reach) - street_edge, 0))"
band = "= end_grade * max(sd, 0) + 0.5 * side"

[kind.waterfront.effect.deck]
field = "role:surface"
value = "= if(sd < -width, min(v, deck - wall * tip), deck)"
mask  = "= if(t > 0 and t < 1, if(sd < -width, tip * (1 - smoothstep(width + 6, width + 10, d)), toe * (1 - smoothstep(0, bank, sd))), 0)"

[kind.waterfront.effect.ends]               # a way's bed onto the deck at `end_grade` (above)
field = "role:surface"
value = "= clamp(v, deck - band, deck + band)"
mask  = "= if(sd > 0, tip * (1 - smoothstep(reach, reach + 2, sd)), 0)"

[kind.waterfront.effect.clear]              # nothing on the deck, nor on `apron` metres of quayside
field = "role:keep_out"                     # behind it (a house facing the quay stands there:
value = "= 1"                               # houses.py rule 4); 3 to 5 m past the wall, over the water
mask  = "= 1 - if(sd > 0, smoothstep(apron, apron + 0.5, sd), smoothstep(3, 5, -sd - width))"

# An enclosure: a walled yard (a monastery's court, a castle ward, a farmyard), a region. Its ground
# is levelled at its mean, and outside it the ground is held within a bank of `grade` (rise over
# run; 0.4 is walkable at lib/review's walker's 0.5) out to 10 m, fading back into the land by
# 20 m; levelling that moves the ground more than `max_cut` metres is `authority.max_change`. A wall
# `wall` metres high and `thick` metres thick stands just inside the outline, all round, except
# within `gate_width / 2` of a `gate`: a point of that kind placed on the outline by `on` (`on = {
# ref = "court", t = 0.99 }`), so the gap moves with the outline and a second gate is a second
# point. The wall opens at any gate within that distance, the enclosure's own or a neighbour's.
#
# `wall`: STAND-IN, as lib/ways' crossing deck is. Kind surfaces (surfaces.md) are `doc.not_yet`, so
# the wall is written on the terrain: the ground stands `wall` metres above the yard across its
# thickness and falls sheer on both sides. On foot it shuts the yard (lib/review's reach reads it as
# a rise no walker takes); a loader draws it as a grassed bank, not as masonry, until walls are an
# asset run or a surface (TODO).
#
# Anchored, so a way that ends at the gate (its bed and its round cap) and a house's pad inside the
# yard give way to the level and the wall (authority.md 3). Ours, written for `monastery` (M3).
[kind.enclosure]
authority = "anchored"
radius    = 22                              # the bank's 20 m fade and a post

[kind.enclosure.defaults]
grade      = 0.4                            # the bank outside the yard, rise over run (22 degrees)
max_cut    = 6                              # metres the yard may cut or bank the ground, at most
wall       = 4                              # metres the wall stands above the yard
thick      = 1.5                            # metres of wall, inward from the outline
gate_width = 4                              # metres of gap at each gate

[kind.enclosure.let]
top  = "= under('mean')"
gate = "= 1 - smoothstep(gate_width / 2, gate_width / 2 + 0.5, dist('kind:gate', 8))"

[kind.enclosure.effect.level]               # the yard at its mean, a walkable bank outside
field      = "role:surface"
value      = "= clamp(v, top - grade * d, top + grade * d)"
mask       = "= 1 - smoothstep(10, 20, d)"
max_change = "= max_cut"

[kind.enclosure.effect.wall]                # stand-in: the wall on the terrain (above)
field = "role:surface"
value = "= top + wall"
mask  = "= if(sd >= 0, (1 - smoothstep(thick, thick + 0.25, sd)) * (1 - gate), 0)"

[kind.gate]                                 # a point on an enclosure's outline where its wall opens
radius = 1                                  # it writes no field

# Where a way from outside comes into a town built apart: an exit (composition.md 7). A parent that
# imports the town must answer it by name (a road that ends at it, or a deliberate end); built
# alone, nothing answers it and nothing is said. It writes no field. Ours, written for `county`.
[kind.entry]
exit   = true
radius = 1
