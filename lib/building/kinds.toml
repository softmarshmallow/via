# The building library: a building as storeys, rooms, doorways and flights over the core's region
# and path features, kind surfaces and meetings (docs/plan.md, M5; R13: building, storey, room,
# doorway, flight and roof are library words, the core's are region, path, surface, mount and
# meeting; spec/surfaces.md 1.3, 3.3, 4.1, 4.4, 6.4 to 6.6). The design note is README.md.
#
# How a world uses it: it writes buildings and restates the library's two steps (a library declares
# no step, protocol.md 1):
#
#     include = ["building"]
#
#     [feature.hall]
#     kind     = "building"
#     region   = [[20, 20], [32, 20], [32, 28], [20, 28]]     # counter-clockwise; t = 0 its first point
#     storeys  = 2
#     doors    = [{ storey = 0, t = 0.4, width = 1 }]          # t along the outline, as `on` takes it
#     stair    = { t = 0.025, width = 1, run = 5 }             # where the flights climb, along the wall
#     rooms    = [{ storey = 0, shares = [2, 1] }]             # the floor cut across its long side
#     kit      = "building/kit/brick"                          # walls, corners, fillers, door leaves
#
#     [step.lay]                                 # one call per building: storeys, rooms, flights,
#     when     = "generate"                      # doorways, footpaths, wall runs, the roof
#     worker   = true
#     for_each = "kind:building"
#     command  = ["python", "-m", "viasdk", "lib:building/lay.py"]
#
#     [step.check]                               # a lint reads the finished build (R29); lay
#     when    = "lint"                           # reads a stated fact (the building), so a lint
#     worker  = true                             # must name it (`authority.unchecked`)
#     checks  = ["lay"]
#     command = ["python", "-m", "viasdk", "lib:building/check.py"]
#
# Every height is world metres (surfaces.md 9, item 11): `lay` reads the ground under the outline
# and writes each storey's `level`, so moving the building re-runs it for that building only.

[kind.building]                          # the one feature a world writes; it owns no surface
authority = "anchored"

[kind.building.defaults]                 # every attribute a building takes is declared here
storeys  = 1                             # how many storeys; 0: its walls alone, on the ground (a yard)
storey_h = 0                             # metres from one floor to the next; 0: the kit's first stated storey, else 3.2
ground_h = 0                             # the ground storey's height; 0: as storey_h
top_h    = 0                             # the top storey's height (of two or more); 0: as storey_h
plinth   = -1                            # the ground floor above the mean ground under the outline; -1: the kit's stated plinth, else 0.3
porch    = 2                             # metres a doorway runs out from the wall
walk_out = 3                             # metres of footpath beyond each doorway (0: none)
doors    = []                            # [{ storey, side, at, width }] or `t` for side and at; storey 0, and no `at` the side's middle, by default
stair    = {}                            # { t, width, run }: needed from two storeys
rooms    = []                            # [{ storey, shares }]
kit      = ""                            # a taxon path of wall pieces; "" places none
roof     = ""                            # "flat", "gable", "hip": from the kit's pieces; "garden": a walkable roof; else the kit's `role:roof`
bays     = []                            # [{ storey, side, at, variant }]: one bay's variant, by a point along a side
fill     = []                            # [{ storeys, sides, pattern }]: the bays' variants in turn along each wall
setback  = []                            # [{ storey, sides, by }]: from that storey up, those sides stand `by` metres inside the outline
overhang = []                            # [{ storey, sides, by }]: the same, outside it
colonnade = []                           # [{ sides, depth }]: on those sides the walls stand `depth` metres inside the outline, behind the kit's posts
ground   = ""                            # "level": a plot under the building, levelled at the ground its floor was reckoned from (lay.py rule 19)
max_cut  = 3                             # with `ground = "level"`: the most its plot may cut or bank the land, metres (kind.plot)
grade    = 0.3                           # with `ground = "level"`: its plot's bank, rise over run (kind.plot)
faces    = []                            # a word for each side of the outline, in order: what it faces ("front", "party", "back", "end"); `fill` may choose by it

[kind.row]                               # buildings side by side along a frontage, written in bays (row.py)
authority = "anchored"

[kind.row.defaults]                      # a point, `at`: where the row starts
to       = []                            # [x, y]: where its frontage ends; buildings on the left of the way there, fronts to its right
along    = ""                            # or the name of a line: the frontage is that line, start to end (row.py rule 10)
reverse  = false                         # with `along`: the line end to start, for the side right of a street
kit      = ""                            # the kit every building of the row is laid from
depth    = 0                             # bays deep; 0: the rows step's `params.depth`, else 4 (row.py rule 12)
lots     = []                            # [{ bays, storeys, door }]: the buildings in order along the path
widths   = []                            # or bays a lot may be wide: lots fill the frontage (row.py rule 11)
heights  = []                            # storeys a lot takes when it writes none: never its neighbour's
storeys  = 1                             # a lot's storeys with no `heights`
storey_h = 0                             # these thirteen are each building's (kind.building, above)
ground_h = 0
top_h    = 0
plinth   = -1
porch    = 2
walk_out = 3
roof     = ""
fill     = []
setback  = []
overhang = []
ground   = ""                            # these three too: "level", a plot under each building (lay.py rule 19)
max_cut  = 3
grade    = 0.3

[kind.court]                             # a walled yard and the halls in it, written about one axis (court.py)
authority = "anchored"

[kind.court.defaults]                    # a point, `at`: the middle of the gate, on the yard wall's outer face
to       = []                            # [x, y]: any other point on the axis, further into the court
kit      = ""                            # the kit the hall and the wings are laid from
yard     = {}                            # { kit, bays = [across, along], storey_h }: the wall round the court, its gate on the axis
hall     = {}                            # { bays = [across, deep], from, veranda, fill }: across the axis, facing the gate
wings    = []                            # [{ bays = [along, deep], from, off, veranda, fill }]: each laid twice, mirror images about the axis
storey_h = 0                             # these five are the hall's and each wing's (kind.building, above)
plinth   = -1
porch    = 2
walk_out = 3
roof     = ""
ground   = ""                            # "level": one plot under the whole court (court.py rule 9)
max_cut  = 3                             # with `ground = "level"`: the most its plot may cut or bank the land, metres
grade    = 0.3                           # with `ground = "level"`: its plot's bank, rise over run

[kind.pipe]                              # a pipe between two kits, written by its points and their heights (pipe.py)
authority = "anchored"

[kind.pipe.defaults]                     # a point, `at`: where the pipe starts
to       = []                            # [[x, y], ...]: the points it goes on through, in order
heights  = []                            # one for `at` and each point of `to`: metres above the ground at `at`; `[arriving, leaving]` is a riser
kit      = ""                            # the pipe kit's taxon
ends     = ["flange", "flange"]          # what stands on the first and the last point: "flange" (a plug) or "cap"

[kind.pipe_leg]                          # one level leg of a pipe: a path owning the surface its pieces stand on
connector = "pipe"                       # a riser's `top` says the same word (pipe.py rule 3)
requires  = ["level"]
defaults  = { width = 0.3 }

[kind.pipe_leg.surface.line]             # the pipe's middle line, level
base  = "= level"
bound = "= width / 2"

[kind.storey]                            # one floor of a building: a region and its floor
authority = "anchored"
requires  = ["level"]
defaults  = { headroom = 2.6 }

[kind.storey.surface.floor]
base = "= level"
cut  = "= headroom"                      # no terrain shows inside the room (surfaces.md 1.3)

[kind.footing]                           # the top of the wall below, where a storey has no floor under an
authority = "anchored"                   # outer wall (beside a stairwell): what that wall stands on
requires  = ["level"]

[kind.footing.surface.top]
base = "= level"

[kind.platform]                             # the floor under a colonnade: the building's whole outline at the
authority = "anchored"                   # ground storey's level (lay.py rule 16). The room inside has its own
requires  = ["level"]                    # storey over part of it, at the same height.

[kind.platform.surface.floor]
base = "= level"

# A plot: the ground a building or a court stands on, levelled (lay.py rule 19, court.py rule 9).
# Under its region the ground is `level`; outside, the ground is held within `grade` (rise over run)
# of that level out to 10 m and fades into the land by 25 m, as lib/land's pad does, whose formula
# this is with the level stated in place of the mean the core would find: the step that returns
# the plot has already reckoned its floors from that number. Levelling that moves the ground more
# than `max_cut` metres is `authority.max_change`, naming the plot; the building or the court that
# returned it takes `grade` and `max_cut` and passes them on. Shaped, with `order = 1`: applied
# after every shaped entry of order 0 whatever its layer (authority.md 4.2: nesting first, then
# `order`, then layer rank), so a way's bed, a street's, a pad or a trail, in a layer above or
# below, gives way to it, and the ground under the building is the level its floors were reckoned
# from. A doorway's sill (shaped, `order = 3`) holds on it. What still overrides it: an anchored
# kind (a ford, an `enclosure`, a `firm_pad`), a kind nested after it (one standing `on` it, or
# lying wholly inside it), an entry of a higher `order`, and a second plot over the same ground
# (the later by layer rank, then name). `check` says where the ground under a building on a plot
# is not what its floor was reckoned from (check.py rule 12, `plot_lost`).
[kind.plot]
authority = "shaped"
requires  = ["level"]
radius    = 26                              # the bank's 10 m and its 15 m fade

[kind.plot.defaults]
grade   = 0.3                               # the steepest bank, rise over run (17 degrees)
max_cut = 3                                 # metres the plot may cut or bank the ground, at most

[kind.plot.effect.level]
field      = "role:surface"
value      = "= clamp(v, level - grade * d, level + grade * d)"
mask       = "= 1 - smoothstep(10, 25, d)"
max_change = "= max_cut"
order      = 1                              # after a way's bed (0), before its own flat (2) and a doorway's sill (3)

# Its outline again, level, after every plot's bank (T1 of docs/plan-fixes.md): two plots side by
# side (a row's houses, each level, stepping with the land) each banked over the other's apron where
# they meet, and the later by name won, so the earlier house's wall stood on its neighbour's bank
# (`plot_lost` at both ends of every party wall). Now each plot's own ground is its level, and the
# step between two lies on the line they share.
[kind.plot.effect.flat]
field      = "role:surface"
value      = "= level"
mask       = "= if(d > 0, 0, 1)"
max_change = "= max_cut"
order      = 2

[kind.yard]                              # the outline of a building of no storeys (lay.py rule 18): its walls
authority = "anchored"                   # stand round it on the terrain. It owns no surface and writes no field.

[kind.room]                              # a named space on a storey; the storey's floor is its floor
authority = "anchored"
requires  = ["storey"]
names     = ["storey"]

[kind.doorway]                           # a path through the wall line, outside to inside, on the terrain
authority = "shaped"                     # with `order` below: a way's bed beside the door gives way to the sill (K11)
connector = "foot"
requires  = ["sill_z"]
defaults  = { flat = 1.5 }

[kind.doorway.effect.sill]               # the ground along it held at the floor: the meeting's gap is 0
field  = "role:surface"                  # flat to `flat` metres off the path, so every post round
value  = "= sill_z"                      # its end reads `sill_z` (lay sets `flat` to at least the
mask   = "= 1 - smoothstep(flat, flat + 1.5, d)"   # posts' diagonal)
radius = 5
order  = 3                               # after every other shaped entry on the ground, whatever its layer: a
                                         # road's bed, a street's, a pad, a plot. Derived, as it was until K11,
                                         # the sill gave way to all of them, and a door beside a way was
                                         # `surface.gap` (examples/realm, "Before"). Not anchored: two doors
                                         # that face each other across a street would then be judged against
                                         # each other (`authority.squeezed`, four a build in examples/village),
                                         # and a door on an anchored yard would be `authority.conflict`.

[kind.flight]                            # a stair or a ramp: a path owning one sloping surface
connector = "foot"
requires  = ["z0", "z1"]
defaults  = { width = 1 }

[kind.flight.surface.tread]
base  = "= z0 + (z1 - z0) * t"
bound = "= width / 2"

[kind.footpath]                          # the walk from a doorway out to where a way passes
connector = "foot"

[kind.roof]                              # a walkable roof (a garden); a pitched roof is an asset
authority = "anchored"
requires  = ["eaves"]

[kind.roof.surface.garden]
base = "= eaves"
