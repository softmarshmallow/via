# The ways library: lanes and the places they cross water (docs/plan.md, "Ford's libraries").
#
# A lane keeps trees off its bed and its verges (`role:keep_out`). keep_out only multiplies a
# scatter's chance (rules.md 7.1), so the verge holds it at 1 out past a crown's reach and fades
# beyond: a tree whose crown reaches the lane's edge has no chance, and one in the fade stands
# with its crown clear of the lane. The reach is the tallest pack tree's crown (primitive's
# `tree_oak`, 2.5 m), with half a metre to spare.
#
# A way meets another thing only at its ends (geometry.md 2.7). Where a lane meets water, a named
# thing owns the meeting (R18): the lane ends at a `ford` (`ends_at = "ford"`), and the next lane
# starts there. The ford is a point placed on the water (`on = { ref = "beck", t = 0.55 }`).

[kind.lane]
authority = "shaped"
radius    = 12

[kind.lane.defaults]
width  = 4                                # metres
camber = 0.02                             # fall from the crown to each edge, per metre

# The lane's bed cuts through rises and never fills: run down into a valley, its smoothing would
# otherwise build a bank across the water at the ford.
[kind.lane.effect.bed]                    # a road bed smoothed along the lane, crowned across it
field = "role:surface"
value = "= min(v, smoothed_along(24) - camber * d)"
mask  = "= 1 - smoothstep(width / 2, width / 2 + 6, d)"

[kind.lane.effect.verge]                  # no tree on the lane, nor so near that its crown hangs over it
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(width / 2 + 3, width / 2 + 5, d)"   # 1 out to 5 m, 0.5 at 6 m, 0 by 7 m

[kind.ford]
authority = "anchored"
radius    = 21                             # the mask fades by 20; the ring (fields.md 5.3) stays clear

[kind.ford.defaults]
grade = 0.25                              # the steepest approach, rise over run, from the ford's bed;
                                          # a feature may set its own
beck_reach = 8                            # metres from a beck within which the beck's banks stand

# The ford cuts any ground that stands above a slope of `grade` rising from its bed (the ground at
# the ford, `under('mean')`), so the banks come down to the bed within 16 m; it never fills.
#
# Where the beck writes the ground, the ford must agree with it (authority.md 5 and 6). Within
# `beck_reach` of a beck (lib/water: its bank's cut has run out to the ground by `reach`, 7.5 m at
# its defaults) the ford keeps the ground the beck left (`v`): the beck's banks are cut from the
# ground beside them, so on a hillside the high bank stands at the hill's slope plus the beck's
# `bank_grade`, which may be steeper than `grade`, and cutting it would make the two anchored
# statements disagree. Past `beck_reach` the approach is no steeper than `grade`. A beck wider or
# deeper than the defaults reaches further: give the ford a larger `beck_reach`, or
# `authority.conflict` names both.
[kind.ford.effect.approach]
field = "role:surface"
value = "= min(v, under('mean') + grade * d + 1000 * (1 - smoothstep(beck_reach, beck_reach + 2, dist('kind:beck', 40))))"
mask  = "= 1 - smoothstep(16, 20, d)"

# Roads and trails (M2, `vale`, `relief`, `massif`). A road is the valley's way: wider than a lane,
# its bed smoothed along a longer run, and laid in both directions, cut through rises and built over
# dips, since a road that only cuts follows every hollow of a valley floor. A trail is a path
# trodden into the hillside: narrow, cut only, following the ground closely. A way that branches
# from another ends at it by name (`starts_at = "valley_road"`, geometry.md 2.7); where a way meets
# water a named thing owns the meeting, as the lane's ford does (R18).
#
# Road and lane keep trees off the bed and verges (`role:keep_out`, out past a crown's reach). A
# trail keeps only its tread clear, to `width / 2 + 0.5`, fading by `width / 2 + 2`: it is walked
# through trees, so crowns may meet over it, and a tree may stand 2 m from its line (asked by
# `relief`). A world that wants the sky open over a trail writes a `road`, or a wood that ends short
# of it.
#
# Keep clear of the edge (asked by `massif`). `smoothed_along(k)` reads the ground `k` metres along
# the way on each side, so a way's line should stay `k` metres inside the world's extent: 40 m for a
# road, 24 m for a lane, 8 m for a trail. Nearer, its smoothing window reads outside the field and
# the bed is `formula.outside_field` at those nodes. The 40 m is for a way running along the edge.
# A way that leaves the world crosses it: it ends on the extent's outline, never runs along it, and
# the 40 m does not apply to it: in the M4 slice 4 fresh-agent run (`hamlet`) a road ending 2 m from
# the edge built with no `formula.outside_field`.

[kind.road]
authority = "shaped"
radius    = 16

[kind.road.defaults]
width  = 5                                # metres
camber = 0.02                             # fall from the crown to each edge, per metre

[kind.road.effect.bed]                    # a bed smoothed along the road, crowned across it, cut and filled
field = "role:surface"
value = "= smoothed_along(40) - camber * d"
mask  = "= 1 - smoothstep(width / 2 + 1, width / 2 + 9, d)"   # the shoulders run out 9 m past the edge

[kind.road.effect.verge]
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(width / 2 + 3, width / 2 + 5, d)"

[kind.trail]
authority = "shaped"
radius    = 8

[kind.trail.defaults]
width = 2.2                               # metres

[kind.trail.effect.bed]                   # trodden in: cut a little below the ground smoothed along it
field = "role:surface"
value = "= min(v, smoothed_along(8))"
mask  = "= 1 - smoothstep(width / 2, width / 2 + 3, d)"

[kind.trail.effect.verge]                 # a trail is walked through trees; only its tread is kept clear
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(width / 2 + 0.5, width / 2 + 2, d)"

# A crossing: the named thing that owns where a way meets running water too deep to ford (R18,
# surfaces.md 3.5 and 6.3). It is a straight path from bank to bank; it owns its deck and its two
# ends, and ways arrive at those ends by name (`ends_at = "old_bridge.start"`, `starts_at =
# "old_bridge.end"`), so no way is graded across the bed and no way lays a deck of its own: one deck
# per crossing, never one per way that happens to cross (the three overlapping decks of challenge
# 63). `crosses` names the water it crosses, so the core counts the crossing of the two lines as owned
# (geometry.md 2.7). A world writes its two ends as points on the water (`on = { ref = "river", t,
# offset }`), so the crossing stands square to the water and moves with it.
#
# `heads`: each bridgehead is raised by the crossing's own effect, in the document and under
# authority (TODO "Bridgeheads are raised by a step writing height"): behind each end, and under
# the deck's first and last metres, the ground is held within a band of `deck_z` that widens at
# `approach` (rise over run, 1:10) out to `head` metres from the deck's edge and at `grade` (1:2)
# past it, out to `head + 4` and fading by `head + 6`. So a way arriving over lower or higher
# ground is brought to the deck at `approach`, never more steeply: a way 0.6 m off at 6 m reaches
# the deck over 6 m, not in a 1:2 lip in its last metre (M3 slice 5: `example`'s lane 0.61 m off
# the straight line between the deck and 12 m back, `monastery`'s approach 0.37 m). R16: an end is
# level with what it meets, and the meeting is owned by the crossing (R18). The hold is a half disc
# behind each end, not the arriving way's corridor (a kind cannot tell which way arrives; the
# ways in `lib/town` are not this library's kinds): ground behind a head on a slope steeper than
# `approach` is cut or banked into a bowl round the head, as a bridge approach is. Beside the deck
# (where `t` lies strictly between 0 and 1) the hold keeps the 1:2 bank and reaches only a metre
# past the deck's edge: out to `head` there it filled the gap the crossing spans with a 1:2 bank
# on either side of the deck, a ramp a walker took down into `monastery`'s gorge (lib/review reach,
# `not_sealed`), and a bank built into `townland`'s river beside the deck.
#
# `deck`: the crossing's kind surface (surfaces.md 1, 6.3), `width` metres wide over its path,
# `deck_z` on its line and falling `camber` a metre to each edge (over the heads' hold, `lift`
# instead: below). It is not the terrain: the ground
# and the water under it are left alone, so the water runs beneath and `surfaces_at` at the middle
# of the river gives the bed, the water's level and the deck. Each end of the path (`<crossing>.start`,
# `.end`) lies on the deck (surfaces.md 3.3: a path end lies on its kind's one surface), so a way
# arriving there meets the deck, and `heads` brings the ground to `deck_z` at the end for the gap of
# 0 (surfaces.md 3.4). M3 to M5 slice 1 wrote the deck on the terrain (a stand-in effect, the ground
# `deck_z` across the strip): it read as a causeway, the water stood either side and not under it,
# and two effects (`water`, `pass`) were needed to keep it dry and to stop it pooling the water;
# both went with it (M5 slice 2). Ours, after surfaces.md 6.3.
#
# `heads` holds the ground at exactly `deck_z` within `width / 2` of the path for the first `hold`
# of its length at each end (and behind each end within `width / 2`), fading by `hold + 0.12`: so
# every post round an end that is not on a post reads `deck_z`, and the meeting's gap is 0 wherever
# the world put the end. `hold` must cover a quad's diagonal: `hold * length >= resolution * 1.42`
# (a crossing 18 m long at 1 m: 0.08 or more). Under the deck's first and last metres the ground is
# the bridgehead's abutment.
#
# Under the deck the hold is not `deck_z` across the whole width (M5 slice 3's on-foot review: the
# ground held level stood up to `camber * width / 2` over the cambered deck, 0.13 m on `city`'s
# 13 m decks, and drew the deck's ends notched where it showed through). It is `deck_z` within
# `crown` of the line, so the posts round an end still read `deck_z` and the gap stays 0 (keep
# `crown` at least 1.42 times the world's resolution: a quad's diagonal), and past `crown + 1` it
# is the deck's own fall less `sink`, so the ground stays under the deck. Over the hold (`ends`)
# the deck has no camber: it rises `lift` a metre from its line out to `crown + 1`, so the ground
# held at `deck_z` within `crown` lies under it everywhere but on the line itself (where the gap is
# taken). With the camber kept there, that ground stood `camber * crown` over the deck (0.06 m on
# `city`) and drew a notch 2 m into each end, seen on the slice 3 fix's sheet.
# Behind each end the band stays centred on `deck_z` (radial `d` there: centred on the deck's
# fall, a way arriving on the line dipped 0.05 m and met the deck at 0.165, test_crossing_world),
# so along the end's own line the ground stands up to `camber * width / 2` over the deck's corners.
# `beneath` keeps the ground under the deck along its whole span, not only at its heads: where
# the land stands above the deck's fall less `sink` (`crown` kept only within the heads' hold),
# it is cut down to it out to a metre past the edge along the span (so the ground drawn between
# the posts each side of the edge stays under it; within the heads' hold the bank starts at the
# edge, where a quay may meet the deck: `townland`'s embankment, anchored, conflicted with the
# metre), banked at `grade` past that and fading by `width / 2 + 2`; lower ground and
# the water are left alone. Seen in M5 slice 3: `monastery`'s deck, 28 m over a 10 m gorge, had
# the rim 0.41 m over its edge 19 to 23 m along; `townland`'s 0.17 m in the hold's fade.
#
# The parapet is a run along each edge of the deck (lib/ways/parapet.py, a generate step), and the
# lint `lib/ways/check.py` judges that the water passes beneath (sampled under the deck's middle)
# with `freeboard` to spare, that each end is met by a way with a gap of 0, and that no way ends
# within 1 m in plan of another kind of path's end with no meeting between them (`end_unjoined`,
# M7 close: a bridgehead not named). A world restates both:
#
#     [step.parapet]
#     when     = "generate"
#     worker   = true
#     for_each = "kind:crossing"
#     command  = ["python", "-m", "viasdk", "lib:ways/parapet.py"]
#     params   = { asset = "fence_post", spacing = 2 }
#
#     [step.crossings]
#     when    = "lint"
#     worker  = true
#     command = ["python", "-m", "viasdk", "lib:ways/check.py"]
[kind.crossing]
authority = "anchored"
requires  = ["deck_z", "crosses"]            # metres: the deck's level; the water it crosses
names     = ["crosses"]
radius    = 20                              # `head`, its 1:2 run-out and 2 m fade, and a post

[kind.crossing.defaults]
width = 6                                   # metres of deck, parapet to parapet
head  = 12                                  # metres behind each end the bridgehead holds the ground
grade = 0.5                                 # the bridgehead's bank beside the deck and past `head` (1:2)
approach = 0.1                              # rise over run at which an arriving way meets the deck
camber = 0.02                               # fall from the deck's line to each edge, per metre
hold  = 0.08                                # share of the length at each end held at `deck_z` (above)
crown = 1.5                                 # metres either side of the line held at `deck_z` (above)
sink  = 0.05                                # metres the held ground stands under the deck past `crown + 1`
lift  = 0.01                                # rise a metre from the line of the deck over the heads' hold (above)
freeboard = 0.5                             # metres the deck stands over the water under its middle,
                                            # at least (lib/ways/check.py, `low_deck`)
flow  = 0.3                                 # read by nothing since the deck left the terrain (it fed
                                            # `pass`); kept so the worlds that write it still build

[kind.crossing.let]
ends = "= max(1 - smoothstep(hold, hold + 0.12, t), smoothstep(1 - hold - 0.12, 1 - hold, t))"
bank = "= grade * max(d - width / 2, 0)"
under = "= deck_z - (camber * d + sink) * smoothstep(crown, crown + 1, d)"
reach = "= approach * min(max(d - width / 2, 0), head) + grade * max(d - width / 2 - head, 0)"

[kind.crossing.surface.deck]
base  = "= deck_z - camber * d * (1 - max(1 - smoothstep(hold, hold + 0.12, t), smoothstep(1 - hold - 0.12, 1 - hold, t))) + lift * min(d, crown + 1) * max(1 - smoothstep(hold, hold + 0.12, t), smoothstep(1 - hold - 0.12, 1 - hold, t))"
bound = "= width / 2"

[kind.crossing.effect.heads]
field = "role:surface"
value = "= if(t > 0 and t < 1, clamp(v, under - bank, under + bank), clamp(v, deck_z - reach, deck_z + reach))"
mask  = "= ends * (1 - smoothstep(head + 4, head + 6, d)) * if(t > 0 and t < 1, 1 - smoothstep(width / 2, width / 2 + 1, d), 1)"

[kind.crossing.effect.beneath]              # the ground under the span never above the deck
field = "role:surface"
value = "= min(v, deck_z - (camber * d + sink) * max(smoothstep(crown, crown + 1, d), 1 - ends) + grade * max(d - width / 2 - (1 - ends), 0))"
mask  = "= if(t > 0 and t < 1, 1 - smoothstep(width / 2 + 1, width / 2 + 2, d), 0)"

[kind.crossing.effect.clear]                # nothing stands on the deck or its heads
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(width / 2 + 0.5, width / 2 + 1, d)"

# A freeway (M3, `city`): a main way for through traffic, wider than a town's main street and
# graded along a longer run, cut and filled, its bed held within a 1:2 bank of `grade` past its
# edge (lib/town's main street, scaled). Written by what it connects, as any main way (R16): it
# runs between named places and meets an arterial only at a named `interchange`, where both arrive
# by name (R18). Its shoulders keep props off (`role:keep_out`). Keep its line 80 m inside the
# extent (`smoothed_along(80)`, as the road's 40 m above). A freeway is not a town street: no lot
# fronts it (a world's `[cells]` leaves it out of `frontage`).
#
# Where it passes over another way it is not a freeway but a `viaduct` (below): the freeway's pieces
# end at the viaduct's two ends by name, as a way arrives at a crossing (M5 slice 3). Ours, written
# for `city`.
[kind.freeway]
authority = "shaped"
radius    = 30                              # a 1:2 bank from the edge (12 m) holds a cut of 9 m

[kind.freeway.defaults]
width    = 20                               # metres, both carriageways and the median
shoulder = 2                                # metres each side, kept clear
grade    = 0.5                              # the bank past the bed's edge (1:2)

[kind.freeway.let]
edge  = "= width / 2 + shoulder"
level = "= smoothed_along(80)"
bank  = "= grade * max(d - edge, 0)"

[kind.freeway.effect.bed]
field = "role:surface"
value = "= clamp(v, level - bank, level + bank)"
mask  = "= if(abs(v - level) > bank, 1, 0)"

[kind.freeway.effect.verge]
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(width / 2 + shoulder, width / 2 + shoulder + 1, d)"

# An interchange (M3, `city`; levels M5 slice 3): the named place where a freeway passes over an
# arterial (R18). A point: the arterial's pieces arrive at it by name (`ends_at = "ix_central"`,
# `starts_at = "ix_central"`), and the freeway passes over it on a `viaduct` (below) whose ends its
# pieces meet. It holds a level plate `plate` metres round its point at `level` metres, past it a
# bank of `grade` (1:10, the crossing's `approach`, so every way arriving is brought to the plate as
# gently) out to `reach`, fading over 4 m; anchored, so the ways' beds give way to it (authority.md
# 3). `level` is a number the world writes (the ground there, or below it: an arterial taken down
# under the viaduct for headroom), not the ground read (`under('mean')` until M5 slice 3), so a
# thing that meets the plate can name it (`= ix_central.level`). A plate wide enough for the ramps
# to land on (56 m) took 55 of the city's houses with its bank; the ramps land beside it instead.
[kind.interchange]
authority = "anchored"
requires  = ["level"]                       # metres: the plate's height
radius    = 110                             # `reach` and the 4 m fade

[kind.interchange.defaults]
plate = 16                                  # metres of level plate round the point
grade = 0.1                                 # the bank past the plate, rise over run
reach = 50                                  # metres from the point the bank holds the ground (at most 104)

[kind.interchange.let]
bank  = "= grade * max(d - plate, 0)"

[kind.interchange.effect.plate]
field = "role:surface"
value = "= clamp(v, level - bank, level + bank)"
mask  = "= 1 - smoothstep(reach, reach + 4, d)"

[kind.interchange.effect.clear]
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(plate, plate + 1, d)"

# A viaduct (M5 slice 3, `city`; challenge 38): a way carried over what lies under it on its own
# deck. A straight path between two named ends (as a crossing's); the freeway's pieces end at its
# `.start` and start at its `.end`. Its deck is a kind surface (surfaces.md 1, 6.3), `width` metres
# wide, so the ground and the ways under it are left alone: the arterial runs on at grade beneath.
# The deck is at `z_start` at its start, rises over the first `rise` of its length (a smoothstep, so
# its steepest grade is `1.5 (deck_z - z_start) / (rise * length)`) to `deck_z`, is level at
# `deck_z` over its middle, and comes down to `z_end` over the last `rise`. Level is exact there
# (the `if`): a ramp leaving the middle starts at `deck_z` and meets it at a gap of 0.
#
# `heads` holds the ground at the end's level at each end, as the crossing's do (its first and last
# `hold` of the length within `width / 2`, and behind each end, banked at `approach` out to `head`):
# the freeway arriving there meets the deck at a gap of 0. `hold * length` must cover a quad's
# diagonal (1.42 resolution; 300 m at 2 m: 0.01). `width` is the freeway's 20 m and its shoulders.
# A ramp names the deck as a place (`starts_at = "<viaduct>.deck"`, surfaces.md 3.3) at any point
# of its level middle. What passes under is not a meeting (3.5); a world puts the viaduct and the
# ways it passes over in one network (`[network.wards]`) so the crossing of the two lines is owned
# (geometry.md 2.7). Headroom is `deck_z` less the ground beneath, measured by the world. Ours.
[kind.viaduct]
authority = "anchored"
requires  = ["z_start", "z_end", "deck_z"]  # metres: the ground at each end, the level of its middle
radius    = 20                              # `head`, the run-out and a post

[kind.viaduct.defaults]
width    = 24                               # metres of deck
rise     = 0.3                              # share of the length at each end over which the deck climbs
head     = 12                               # metres behind each end the ground is held
approach = 0.1                              # rise over run of the ground behind an end
hold     = 0.03                             # share of the length at each end held at the end's level

[kind.viaduct.let]
ends  = "= max(1 - smoothstep(hold, hold + 0.02, t), smoothstep(1 - hold - 0.02, 1 - hold, t))"
reach = "= approach * min(max(d - width / 2, 0), head) + 0.5 * max(d - width / 2 - head, 0)"

[kind.viaduct.surface.deck]
base  = "= if(t < rise, z_start + (deck_z - z_start) * smoothstep(0, rise, t), if(t > 1 - rise, z_end + (deck_z - z_end) * (1 - smoothstep(1 - rise, 1, t)), deck_z))"
bound = "= width / 2"

[kind.viaduct.effect.heads]
field = "role:surface"
value = "= if(t < 0.5, clamp(v, z_start - reach, z_start + reach), clamp(v, z_end - reach, z_end + reach))"
mask  = "= ends * (1 - smoothstep(head + 4, head + 6, d)) * if(t > 0 and t < 1, 1 - smoothstep(width / 2, width / 2 + 1, d), 1)"

[kind.viaduct.effect.clear]                 # nothing stands under the deck's edge nor on its heads
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(width / 2 + 0.5, width / 2 + 1, d)"

# A ramp (M5 slice 3, `city`; challenge 38): a way between two levels on its own deck, a kind
# surface `width` metres wide that runs from `z0` at its start to `z1` at its end (a smoothstep in
# `t`, so it leaves and lands level: its steepest grade is `1.5 |z1 - z0| / length`). It is written
# by what it joins (R16): it starts at a deck by name, the deck as a place (`starts_at =
# "<viaduct>.deck"`, surfaces.md 3.3, its first point written on the deck's level middle), and ends
# at a place on the ground by name. `z0` names the deck's level (`z0 = "= fly.deck_z"`), so the
# start meets at a gap of 0 and moves with it; `z1` is the ground at its foot (a number the world
# writes, as a crossing's `deck_z`), and `foot` holds the ground at exactly `z1` under its last
# `land` of the length and within `width / 2` round its end (anchored, as a crossing's heads), so
# the foot meets the ground at a gap of 0. A loop ramp is a path that turns through 270 degrees: one
# surface over it, no fold while its radius exceeds `width / 2` (surfaces.md 1.2). Ours.
[kind.ramp]
authority = "anchored"
requires  = ["z0", "z1"]                    # metres: the levels at its start and its end
radius    = 8                               # `width / 2`, the 2 m fade and a post

[kind.ramp.defaults]
width = 8                                   # metres of deck, one lane and its shoulders
land  = 0.03                                # share of the length at its foot over which the ground is held

[kind.ramp.surface.deck]
base  = "= z0 + (z1 - z0) * smoothstep(0, 1, t)"
bound = "= width / 2"

[kind.ramp.effect.foot]
field = "role:surface"
value = "= z1"
mask  = "= smoothstep(1 - land - 0.02, 1 - land, t) * (1 - smoothstep(width / 2, width / 2 + 2, d))"

# A slipway: where a ferry lands, a point on a shore (M4, `strait`). It is an exit (composition.md
# 7): a world built apart that has one says a way leaves it here, over the water, and a parent that
# imports the world must answer it by name (a `ferry` that starts or ends at it, or a deliberate
# end). Built alone, nothing answers it and nothing is said. It holds a level apron round its point
# at `level` metres over the datum (a firm decision of the world that has it: anchored, so a parent
# that blends the world's ground keeps it, composition.md 6.4): land above it is cut back at `grade`
# out to `reach`, and what lies below it is filled only behind a face of `drop` (rise over run), so
# the apron does not build a bank out over the sea bed. A 1:2 bank below the water did: it held
# `strait`'s sea floor up 13 m out, a 0.74 grade where it faded in the island alone and 1.04 where
# the parent's blend met it. Its output `slipway` tells a game where boats put in. Ours, written
# for `strait`.
[kind.slipway]
authority = "anchored"
exit      = true
output    = "slipway"
radius    = 16                              # `reach` and the 4 m fade

[kind.slipway.defaults]
level = 1                                   # metres over the datum: a step above the water
plate = 4                                   # metres of level apron round the point
grade = 0.5                                 # the cut back into higher land, rise over run
reach = 10                                  # metres from the point the apron holds the ground
drop  = 2                                   # the apron's face toward the water, rise over run

[kind.slipway.let]
bank = "= grade * max(d - plate, 0)"
fill = "= drop * max(d - plate, 0)"

[kind.slipway.effect.apron]
field = "role:surface"
value = "= clamp(v, level - fill, level + bank)"
mask  = "= 1 - smoothstep(reach, reach + 4, d)"

[kind.slipway.effect.clear]
field = "role:keep_out"
value = "= 1"
mask  = "= 1 - smoothstep(plate, plate + 1, d)"

# A ferry: a line over water between two places, written by what it connects (`starts_at`,
# `ends_at`; R16), most often two slipways. It changes no field: the water is not built on, so it
# is derived and gives way to everything (authority.md 3). Its output `ferry` hands the line to the
# game, which runs the boat. Ours, written for `strait`.
[kind.ferry]
output = "ferry"

[kind.ferry.defaults]
minutes = 5                                 # the crossing's time, for the game's timetable
