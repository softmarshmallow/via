# Rock kinds: ground that is more than a surface. Both work on a volume field named `solid`, which the
# world declares (`[field.solid]` with `type = "volume"`); without it they do nothing.
# Inside an effect on a volume: z is the height, `steep` the slope of the ground in degrees, `crest`
# the highest ground nearby, and for a 3D path pd is the distance in plan and pz the path's height.
#
# Attributes a feature may set, with the defaults below:
#   rockwork  rough, bulk, ledge, bed_m, flute, flute_m, notch_depth, foot. The feature also gives the
#             box itself: a region, `z = [low, high]`, and optionally `apron` (m, default 6).
#   cave      width, rise (m, half-sizes at the narrowest). The feature gives a `path3`.

[kind.rockwork]          # a box of ground that may be more than a surface
hosts = "solid"
[kind.rockwork.defaults]
rough = 7.0              # small-scale breakage
bulk = 6.0               # broad swells and hollows
ledge = 2.4              # horizontal bedding that weathers back in steps
bed_m = 6.0              # thickness of one bed
flute = 0.0              # vertical columns, as in basalt
flute_m = 5.0
notch_depth = -12.0      # the sea's notch at the foot
foot = 0.0               # a broader base, where fallen rock has not been cleared away
[kind.rockwork.let]
face = "smoothstep(28, 52, steep)"
beds = "sin(z * 6.2832 / bed_m + 2.2 * fbm3(30, 2, seed=8) + 0.05 * x)"
columns = "fbm2(flute_m, 2, seed=9) + 0.5 * fbm2(flute_m * 0.4, 1, seed=10)"
notch = "face * (1 - smoothstep(1.0, 3.0, abs(z - 0.8)))"
[[kind.rockwork.effect]]
field = "solid"
value = "min(v + face * (rough * fbm3(11, 3, seed=1) + bulk * fbm3(38, 2, seed=7) + ledge * beds + flute * columns + foot * (1 - smoothstep(0, 9, z))) + notch_depth * notch, crest + 0.4)"
mask = 1.0

[kind.cave]              # a passage along a 3D path. Not a tube: wider than tall, flared at its mouths,
                         # opening into a chamber, with a level floor of rubble and walls that follow the beds.
[kind.cave.defaults]
width = 4.2              # half-width at the narrowest
rise = 3.0               # half-height at the narrowest
[kind.cave.let]
flare = "1 + 1.5 * (1 - smoothstep(0.0, 0.2, t)) + 1.2 * smoothstep(0.78, 1.0, t)"
chamber = "1 + 1.1 * (1 - smoothstep(0.0, 0.12, abs(t - 0.52)))"
squeeze = "1 - 0.35 * (1 - smoothstep(0.0, 0.07, abs(t - 0.33)))"
across = "pd / (width * flare * chamber * squeeze)"
up = "(z - pz - 0.4) / (rise * chamber * squeeze * (0.75 + 0.3 * flare))"
hollow = "(sqrt(across * across + up * up) - 1) * 3.4 + 2.0 * fbm3(8, 3, seed=2) + 0.8 * sin(z * 1.05 + 2.4 * fbm3(28, 2, seed=8) + 0.06 * x)"
floor = "(pz - 1.1 + 0.55 * fbm3(3.2, 2, seed=5) + 0.5 * fbm3(9, 2, seed=6)) - z"
[[kind.cave.effect]]
field = "solid"
value = "min(v, max(hollow, floor))"
mask = 1.0
[[kind.cave.effect]]     # nothing grows over the mouths
field = "#vegetation"
value = 0.0
mask = "1 - smoothstep(3, 8, d)"
[kind.cave.map]
color = [0.15, 0.12, 0.10]
width = 2
