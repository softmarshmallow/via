# Review kinds: points the tooling reads, not things a player sees.
#
# Attributes a feature may set. Neither kind has defaults; the tooling reads these from the feature:
#   bookmark  eye (m above the ground, 1.7), look (a point, or a place on a path), look_height (m, 1.5),
#             fov (degrees, 55), note, `in` (a room: it then stands on that room's floor),
#             under (stand beneath the ground), cut_z (cut the view at this height)
#   poi       label. A place the reach lint and the player's map can name.

[kind.bookmark]          # read by the review tooling: an eye, a target, a lens
[[kind.bookmark.effect]] # a viewpoint is a small clearing
field = "#vegetation"
value = 0.0
mask = "1 - smoothstep(9, 17, d)"

[kind.poi]
[kind.poi.map]
color = [0.95, 0.35, 0.25]
