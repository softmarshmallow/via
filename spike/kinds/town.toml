# Town library: the words a settlement is planned in. None of them does anything to the ground; they
# are intent that a street tool and a lot tool read. The compiler knows none of these names.
#
#   district   a region with a character. Earlier districts win where two overlap.
#              pattern    "grid", "organic" (a grid bent out of true) or "radial" (rings and spokes)
#              block      metres between parallel streets
#              bearing    degrees the grid is turned; left out, it follows the nearest main way
#              around     radial only: the square its rings centre on
#              buildings  places in the pack's taxonomy the lots may take, e.g. ["@building/city/row"]
#              floors     [lowest, highest]; the highest is reached only where it is most built up
#              density    0..1, how built up; left out, the field `urban` says
#   square     an open, paved place that streets cross and lots keep off. `landmark` names an asset to stand on it
#   axis       a line the settlement grows along
#   ward       written by the street tool: one piece of a district between main ways, for the lot tool

[kind.district]
[kind.district.map]
color = [0.85, 0.55, 0.25]
width = 1
[kind.square]
[kind.square.map]
color = [0.9, 0.85, 0.6]
width = 2
[kind.axis]
[kind.ward]

# A main way and a crossing are intent too, read by the skeleton tool (kinds/tools/main_ways.py):
#   main_way   a way stated by where it goes: `starts_at` and `ends_at`, each the id of a point,
#              `path = []`, and `via = [...]` for places it must pass. Its course is found over the land.
#              width, sidewalk
#   crossing   a point on a watercourse, usually `on = { feature = "<the course>", t = ... }`. It owns its
#              bridge: one straight deck square to the water, named `<id>_deck`, between two raised
#              bridgeheads. A main way that names it in `via` crosses there; one that starts or ends
#              at it starts or ends at the bridgehead on its own side.
#              width (of the deck), setback (bridgehead from the water's edge), clear (under the deck),
#              lead (how far a way runs in line with the deck before it may turn), shoulder (run of the raised ground)
#   waterfront a street along the bank of a watercourse: `along = "<the course>"`, and a region that says
#              which stretch of the banks (a `where` condition will do: near the course, inside a district).
#              `sides = "both"` (or "left" / "right", looking downstream). Streets that reach the water
#              end on it, and it passes each crossing's bridgehead. Lowered by the street tool.
#              setback (from the water's edge), width, sidewalk
[kind.waterfront]
[kind.waterfront.defaults]
setback = 17.0
width = 9.0
sidewalk = 3.0
[kind.main_way]
[kind.main_way.defaults]
width = 12.0
sidewalk = 3.5
[kind.crossing]
[kind.crossing.defaults]
width = 19.0
setback = 8.0
clear = 1.3
lead = 36.0
shoulder = 38.0
[kind.crossing.map]
color = [0.55, 0.45, 0.32]
width = 2
