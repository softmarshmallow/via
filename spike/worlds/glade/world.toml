# Glade: one small place built twice from the same assets, to judge placement by eye.
# The base world scatters evenly, as a first attempt would. The variant `by_cause` places the same
# things where they would gather: trees in groups, undergrowth under the trees and along walls and
# water, dead wood at the wood's edge, stones on the bank and below steep ground.
#
#   uv run python -m worldc worlds/glade/world.toml
#   uv run python -m worldc worlds/glade/world.toml --variant by_cause

include = ["../../kinds/terrain.toml", "../../kinds/review.toml"]

[world]
name = "Glade"
extent = [0.0, 0.0, 192.0, 192.0]
resolution = 0.5
chunk = 64
seed = 14
pack = "../../packs/primitive.toml"

[export]
fields = ["water", "grass"]

[look]
sun_azimuth = 215.0
sun_elevation = 34.0
haze = 0.35
sky = "summer"

[kind.pad.defaults]
skirt = 3.0

[kind.beck]                  # a stream bed cut along a path
reach = 14
[kind.beck.defaults]
depth = 2.2
bed = 2.0
bank = 5.0
[[kind.beck.effect]]
field = "height"
value = "v - depth * (1 - smoothstep(bed, bed + bank, d))"
mask = "1 - smoothstep(bed + bank, bed + bank + 4, d)"
[[kind.beck.effect]]
field = "ground"
paint = "shore"
mask = "1 - smoothstep(bed * 0.6, bed + 1.5, d)"

[field.height]
unit = "m"
base = "20 + 0.07 * y + 0.03 * x + 5 * fbm(110, 3, seed=2) + 0.7 * fbm(24, 3, seed=3)"

[field.water]
unit = "m"
base = -100.0

[field.clear]
base = 0.0

[field.forest]               # a wood round a clearing
tags = ["vegetation"]
base = """
  smoothstep(34, 58, glade) * smoothstep(-0.25, 0.15, fbm(80, 3, seed=5))
  * (1 - smoothstep(26, 34, slope('height')))
"""
[field.forest.let]
glade = "sqrt((x - 96) ** 2 + (y - 90) ** 2) + 14 * fbm(40, 2, seed=6)"

[field.grass]
tags = ["vegetation"]
base = "1 - 0.6 * f('forest')"

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.1, 0.25, fbm(50, 3, seed=7)) * (1 - f('forest'))" },
    { paint = "forest", mask = "0.9 * smoothstep(0.3, 0.75, f('forest'))" },
    { paint = "scree", mask = "smoothstep(27, 34, slope('height'))" },
]

[[feature]]
id = "stream"
kind = "beck"
path = [[150.0, 200.0], [138.0, 150.0], [150.0, 100.0], [136.0, 50.0], [146.0, -10.0]]

[[feature]]
id = "track"
kind = "road"
width = 2.6
path = [[-10.0, 70.0], [50.0, 78.0], [88.0, 84.0]]

[[instance]]
id = "cottage"
asset = "house.small"
kind = "pad"
on = { feature = "track", t = 1.0, offset = 0.0 }
face = 200.0

[[instance]]
id = "shed"
asset = "barn"
kind = "pad"
at = [108.0, 104.0]
yaw = 250.0

# ---- the first attempt: everything spread evenly where it is allowed
[[scatter]]
id = "trees"
spacing = 6.0
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 2 }, { id = "tree.great", weight = 0.4 }]
scale = [0.8, 1.2]
seed = 1

[[scatter]]
id = "bushes"
spacing = 6.0
density = "0.28"
assets = [{ id = "bush" }]
scale = [0.8, 1.2]
seed = 2

[[scatter]]
id = "logs"
spacing = 14.0
density = "0.3"
assets = [{ id = "log" }]
seed = 3

[[scatter]]
id = "stones"
spacing = 10.0
density = "0.3"
assets = [{ id = "rock.boulder", weight = 2 }, { id = "rock.large", weight = 1 }]
scale = [0.6, 1.2]
seed = 4

[[feature]]
id = "bm_yard"
kind = "bookmark"
at = [70.0, 70.0]
look = [98.0, 96.0]
eye = 2.0
note = "The cottage and shed from the track."

[[feature]]
id = "bm_wood"
kind = "bookmark"
at = [60.0, 120.0]
look = [30.0, 150.0]
eye = 2.0
note = "Into the wood from the clearing's edge."

[[feature]]
id = "bm_stream"
kind = "bookmark"
at = [128.0, 82.0]
look = [146.0, 110.0]
eye = 2.2
note = "Up the stream."

[[feature]]
id = "bm_over"
kind = "bookmark"
at = [150.0, 6.0]
look = [96.0, 96.0]
eye = 75.0
note = "The whole glade."

# ---- the same things, placed by cause. Counts are kept close to the first attempt's.
[variant.by_cause]
scatter = [
    # trees gather: fewer seeds, each the middle of a group that thins and shrinks outward
    { id = "trees", spacing = 12.0, density = "f('forest')", scale = [0.9, 1.35], clump = { size = [2, 5], radius = 6.5, shrink = 0.4 } },
    # undergrowth: under and beside the trees, along the walls, on the stream's banks; none in the open
    { id = "bushes", spacing = 3.2, density = """
        0.55 * around('trees', 5.0) * smoothstep(0.1, 0.5, fbm(18, 2, seed=31))
        + 0.9 * smoothstep(0.04, 0.2, f('clear')) * (1 - smoothstep(0.3, 0.48, f('clear')))
        + 0.5 * smoothstep(3, 5, dist('stream')) * (1 - smoothstep(6, 10, dist('stream')))
      """, scale = [0.6, 1.3], clump = { size = [0, 2], radius = 1.6, shrink = 0.3 } },
    # dead wood: at the wood's edge, where trees fall into the light
    { id = "logs", spacing = 7.0, density = "0.5 * around('trees', 7.0) * smoothstep(0.15, 0.4, f('forest')) * (1 - smoothstep(0.55, 0.8, f('forest')))" },
    # stones: on the stream's bed and banks, and below steep ground
    { id = "stones", spacing = 3.6, density = """
        0.7 * (1 - smoothstep(1.5, 6.5, dist('stream'))) * smoothstep(0.2, 0.7, fbm(9, 2, seed=41))
        + 0.5 * smoothstep(20, 28, slope('height'))
      """, scale = [0.4, 1.4], clump = { size = [0, 3], radius = 2.2, shrink = 0.5 } },
]
