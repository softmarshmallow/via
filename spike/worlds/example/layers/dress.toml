# Dress layer: growth, small things, gameplay data and review views. It is above the moisture step,
# so it can read the `wet` field that step wrote.

[field.forest]
tags = ["vegetation"]        # kinds clear every field with this tag where they build
base = """
  smoothstep(0.25, 0.6, f('wet') + 0.3 * fbm(70, 3, seed=5))
  * (1 - smoothstep(26, 34, slope('height')))
  * (1 - smoothstep(treeline - 8, treeline, f('height')))
  * smoothstep(8, 24, dist('orchard'))
"""

[field.grass]
tags = ["vegetation"]
base = "1 - 0.7 * f('forest')"

# ---- rules that lower to explicit instances
[[scatter]]
id = "woods"
spacing = 7.0
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 1 }]
scale = [0.8, 1.3]
seed = 1

[[scatter]]
id = "orchard_trees"         # tight spacing and full density inside an outline reads as planted rows
spacing = 8.0
density = "where(sdist('orchard') < -2, 1.0, 0.0)"
assets = [{ id = "tree.broadleaf" }]
scale = [0.45, 0.55]
seed = 2

[[scatter]]
id = "fallen_rock"           # boulders gather under the crag
spacing = 6.0
density = "0.7 * smoothstep(-22, -6, sdist('crag')) * (1 - smoothstep(-5, -1, sdist('crag')))"
assets = [{ id = "rock.boulder", weight = 2 }, { id = "rock.large", weight = 1 }]
scale = [0.6, 1.5]
seed = 3

[[dress]]                    # small things on top of a placed thing
id = "wares"
atop = "stalls.1"
assets = [{ id = "crates" }, { id = "barrel" }]
count = 2

# ---- gameplay data: kinds the compiler knows nothing about, carried to the build
[[feature]]
id = "wolf_ground"
kind = "spawn_zone"          # this project's kind: it raises the `danger` field
creature = "wolf"
max_alive = 3
ellipse = { center = [212.0, 208.0], size = [64.0, 46.0] }

[[feature]]
id = "inn_door"
kind = "poi"                 # a point of interest: it appears on the player's map
name = "The Tarn Inn"
on = { feature = "green", t = 0.62, offset = -1.0 }

[[feature]]
id = "crag_top"
kind = "poi"
name = "Wolf Crag"
at = [222.0, 232.0]

# ---- review views: the agent's and the reviewer's eyes
[[feature]]
id = "bm_over"
kind = "bookmark"
at = [240.0, 6.0]
look = [118.0, 128.0]
eye = 120.0
note = "The whole hollow from the south-east."

[[feature]]
id = "bm_lane"
kind = "bookmark"
on = { feature = "lane_west", t = 0.08 }
look = { feature = "lane_west", t = 0.5 }
eye = 1.8
note = "Arriving along the lane."

[[feature]]
id = "bm_green"
kind = "bookmark"
at = [118.0, 76.0]
look = [92.0, 100.0]
eye = 4.0
note = "The green, the stalls and the inn."

[[feature]]
id = "bm_bridge"
kind = "bookmark"
at = [136.0, 96.0]
look = [160.0, 116.0]
eye = 5.0
note = "The footbridge over the beck."

# ---- what must stay true, in the project's own terms. Checked by `--lint reach`.
[[expect]]
by = "on_foot"
from = "bm_lane"
to = ["cottage_a", "cottage_b", "square.well", "church", "mill"]
why = "the village is one place"

# The east row and the farm are reached over the footbridge. The reach lint reads the ground only
# and does not see bridges, so that expectation is not written here: it would fail for the wrong reason.
