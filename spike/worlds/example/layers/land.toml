# Land layer: the shape of the ground and the ways across it.

[[feature]]
id = "tarn_site"             # a point other things measure from
kind = "guide"
at = [70.0, 190.0]

[[feature]]
id = "tarn"                  # derived: the ground is filled until it spills, and the shore is whatever results
kind = "lake"
at = [70.0, 190.0]
flood = { field = "height", level = "spill", fence = 46.0, max_depth = 4.0, freeboard = 0.3 }

[[feature]]
id = "beck"                  # this project's own kind (kinds.toml)
kind = "gully"
path = [[150.0, 266.0], [146.0, 180.0], [160.0, 110.0], [150.0, -10.0]]

[[feature]]
id = "crag"                  # a shared kind with two attributes changed
kind = "cliff"
drop = 9.0
back = 46.0
path = [[176.0, 250.0], [214.0, 226.0], [246.0, 186.0]]

# ---- ways. The lane is two roads and a bridge: a way that leaves the ground is its own feature.
[[feature]]
id = "lane_west"
kind = "road"
width = 3.5
ends_at = "footbridge.start"   # the lane meets the bridge wherever the bridge begins
path = [[-10.0, 120.0], [60.0, 112.0]]

[[feature]]
id = "footbridge"
kind = "bridge"
width = 4.0
over = ["beck"]              # what it must clear, and by how much; the compiler measures it
clear = 1.5
path = [[140.0, 116.0], [180.0, 117.0]]

[[feature]]
id = "lane_east"
kind = "road"
width = 3.5
starts_at = "footbridge.end"
path = [[215.0, 122.0], [266.0, 136.0]]

[[feature]]
id = "church_path"
kind = "road"
width = 2.0
shoulder = 3.0
joins = ["lane_west"]        # declared: one end of this path meets that one. Checked.
path = [[92.0, 114.0], [96.0, 138.0], [104.0, 156.0]]

# ---- open ground with a purpose
[[feature]]
id = "green"                 # a level, paved court: the world gives way to it
kind = "terrace"
max_cut = 3.0
region = [[70.0, 78.0], [124.0, 80.0], [122.0, 106.0], [72.0, 106.0]]

[[feature]]
id = "barley"
kind = "plot"
crop = "barley"              # the compiler does not know this word; it reaches the build untouched
region = [[188.0, 58.0], [252.0, 62.0], [250.0, 104.0], [190.0, 100.0]]

[[feature]]
id = "fallow"
kind = "plot"
crop = "none"
region = [[192.0, 14.0], [250.0, 16.0], [252.0, 52.0], [190.0, 50.0]]

[[feature]]
id = "orchard"               # an outline for the dress layer to plant in
kind = "guide"
ellipse = { center = [36.0, 62.0], size = [56.0, 44.0] }
