# ------------------------------------------------------------------------------------------------ dressing
# Three tools carry most of it. A set is a group in one frame, placed as a unit. A run repeats one
# asset along a stretch of wall. A dress strews small things on top of something already placed.
# `against` stands a thing with its back to the wall; `mount` hangs it that far above the floor.

[set.round_table]
items = [
    { name = "table", asset = "table.round" },
    { name = "stool_a", asset = "stool", offset = [0.0, 0.95] },
    { name = "stool_b", asset = "stool", offset = [-0.82, -0.47] },
    { name = "stool_c", asset = "stool", offset = [0.82, -0.47] },
    { name = "plate_a", asset = "plate", atop = "table", offset = [0.0, 0.40] },
    { name = "plate_b", asset = "plate", atop = "table", offset = [-0.34, -0.20] },
    { name = "plate_c", asset = "plate", atop = "table", offset = [0.34, -0.20] },
    { name = "mug_a", asset = "mug", atop = "table", offset = [0.20, 0.36] },
    { name = "mug_b", asset = "mug", atop = "table", offset = [-0.14, -0.30] },
    { name = "candle", asset = "candle", atop = "table" },
]

[set.long_table]
items = [
    { name = "table", asset = "table" },
    { name = "chair_a", asset = "chair", offset = [-0.4, 0.78] },
    { name = "chair_b", asset = "chair", offset = [0.4, 0.78] },
    { name = "chair_c", asset = "chair", offset = [-0.4, -0.78] },
    { name = "chair_d", asset = "chair", offset = [0.4, -0.78] },
    { name = "plate_a", asset = "plate", atop = "table", offset = [-0.4, 0.3] },
    { name = "plate_b", asset = "plate", atop = "table", offset = [0.4, 0.3] },
    { name = "plate_c", asset = "plate", atop = "table", offset = [-0.4, -0.3] },
    { name = "plate_d", asset = "plate", atop = "table", offset = [0.4, -0.3] },
    { name = "mug_a", asset = "mug", atop = "table", offset = [-0.2, 0.36] },
    { name = "mug_b", asset = "mug", atop = "table", offset = [0.58, -0.34] },
    { name = "bread", asset = "bread", atop = "table", offset = [0.05, 0.0] },
    { name = "candle", asset = "candle", atop = "table", offset = [-0.22, 0.0] },
]

[set.bunk]
items = [
    { name = "frame", asset = "bunk" },
    { name = "pillow", asset = "pillow", atop = "frame", offset = [0.7, 0.0] },
    { name = "chest", asset = "chest", offset = [0.0, -0.85] },
]

