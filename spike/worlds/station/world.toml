# Station: the lighthouse and its keeper's cottage, inside. Written from a cutaway concept image.
# A first pass at interiors: rooms on levels, openings on their outlines, stairs between levels.

# Rooms, doors, windows, stairs and lamps are shared kinds; `guide` comes with the terrain ones.
include = ["../../kinds/terrain.toml", "../../kinds/building.toml", "../../kinds/review.toml"]

[world]
name = "Station"
extent = [0.0, 0.0, 64.0, 64.0]
resolution = 0.5
chunk = 64
seed = 5
pack = "../../packs/primitive.toml"

[look]
sun_azimuth = 240.0
sun_elevation = 22.0
ambient = 0.45
haze = 0.3

[field.height]
unit = "m"
base = "0.05 * fbm(20, 2, seed=1)"
layers = [               # the ground rises to meet the front door's threshold
    { value = 0.28, mask = "1 - smoothstep(1.0, 6.0, dist('porch'))" },
]

[field.ground]
type = "material"
layers = [{ paint = "dry_grass" }, { paint = "path", mask = "1 - smoothstep(1.5, 3.5, dist('walk'))" }]

# A level is a frame: a named floor height. Rooms, doors and furniture are placed on one.
[[level]]
id = "ground"
z = 0.30
height = 3.0
wall = "plaster"
floor = "stone"
[[level]]
id = "first"
z = 3.55
height = 2.9
[[level]]
id = "second"
z = 6.70
height = 2.9
[[level]]
id = "lantern"
z = 9.85
height = 3.0

[[feature]]
id = "walk"
kind = "guide"
path = [[52.0, 31.5], [41.0, 31.5]]

