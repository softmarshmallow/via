# Dress layer: growth by cause, ground and views. Nothing is placed by coordinate except two views.

[field.dry]
base = "where(f('water') > f('height') - 0.15, 0.0, 1.0)"

[field.forest]               # woods on the valley sides and the hills, off the town
tags = ["vegetation"]
base = """
  smoothstep(0.2, 0.55, f('damp') + 0.5 * fbm(240, 3, seed=5) + 0.02 * slope('height'))
  * (1 - smoothstep(0.05, 0.3, f('urban')))
  * smoothstep(2.5, 6, f('height')) * f('dry')
"""

[field.grass]
tags = ["vegetation"]
base = "(1 - 0.7 * f('forest')) * f('dry')"

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.1, 0.3, fbm(160, 3, seed=7)) * (1 - f('forest'))" },
    { paint = "forest", mask = "0.9 * smoothstep(0.3, 0.75, f('forest'))" },
    { paint = "sand", mask = "1 - smoothstep(0.5, 2.2, f('height'))" },
]

[[scatter]]
id = "woods"
spacing = 20.0
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 2 }, { id = "tree.great", weight = 0.4 }]
scale = [0.9, 1.4]
clump = { size = [2, 5], radius = 9.0, shrink = 0.4 }
seed = 1

[[scatter]]
id = "town_trees"
spacing = 26.0
density = "0.5 * f('dry') * smoothstep(0.1, 0.4, f('urban')) * (1 - f('clear'))"
assets = [{ id = "tree.broadleaf" }]
scale = [0.8, 1.2]
seed = 2

