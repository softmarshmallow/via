# Town layer: how built up, and the districts. It is above the skeleton step, so it can measure from
# the main ways' found courses (`kind:axis`). Earlier districts win where two overlap.

[field.urban]                # a core at the market, arms along the main ways, nothing in the sea or on steep ground
base = "clamp(max(core, 0.7 * arm), 0, 1) * smoothstep(1.0, 2.5, f('height')) * (1 - smoothstep(8, 14, slope('height')))"
[field.urban.let]
core = "1 - smoothstep(170, 520, dist('market') + 90 * fbm(230, 3, seed=21))"
arm = "(1 - smoothstep(40, 200, dist('kind:axis') + 60 * fbm(120, 2, seed=22))) * (1 - smoothstep(520, 860, dist('market')))"

[[feature]]
id = "old_town"
kind = "district"
where = "(dist('market') + 45 * fbm(130, 2, seed=31) < 230) & (f('height') > 1.5)"
pattern = "organic"
block = 46.0
buildings = ["@building/city/row", "@building/city/mid"]
floors = [3, 6]
density = 0.9

[[feature]]
id = "close"
kind = "district"
where = "(dist('cathedral') < 150) & (f('height') > 1.5)"
pattern = "radial"
around = "cathedral_square"
block = 50.0
buildings = ["@building/city/row"]
floors = [3, 4]
density = 0.8

[[feature]]
id = "quayside"
kind = "district"
where = "(dist('quay') + 40 * fbm(150, 2, seed=33) < 250) & (f('height') > 1.2)"
pattern = "grid"
block = 76.0
buildings = ["@building/city/shed"]
floors = [3, 4]
density = 0.7

[[feature]]
id = "rows"                  # wherever else is built up at all; it thins with `urban`
kind = "district"
where = "(f('urban') > 0.14) | (dist('river_course') < 16)"      # the river runs through it; it does not part it
pattern = "grid"
block = 46.0
buildings = ["@building/city/row"]
floors = [3, 4]

[[feature]]
id = "town_limits"           # nobody draws this: it is wherever a district is
kind = "guide"
where = "sdist('kind:district') < 8"

[[feature]]
id = "embankment"            # the river's banks are a frontage: a street along each, where the town is
kind = "waterfront"
along = "river_course"
where = "(dist('river_course') < 70) & (sdist('kind:district') < 0)"
