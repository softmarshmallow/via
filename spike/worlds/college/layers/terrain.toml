# Terrain layer: the hill, its courts and its ways. Everything else stands on this.
include = ["../../../kinds/terrain.toml", "../../../kinds/review.toml"]

[field.height]
unit = "m"
base = "1.5 + 0.068 * y + 0.012 * (x - 160) + 1.4 * fbm(90, 3, seed=1) + 0.3 * fbm(18, 2, seed=2)"

[field.trees]
tags = ["vegetation"]
base = "smoothstep(0.0, 0.3, fbm(60, 3, seed=11)) * (1 - smoothstep(18, 26, slope('height')))"

[field.grass]
tags = ["vegetation"]
base = "(1 - smoothstep(24, 32, slope('height')))"

[field.clear]
base = 0.0

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "0.7 * smoothstep(-0.1, 0.25, fbm(70, 3, seed=12))" },
    { paint = "rock", mask = "smoothstep(30, 40, slope('height'))" },
]

# Courts are `terrace` and `lawn` features and ways are `road` features, all from the shared library.
# The college's ways are lanes and flights of steps, narrower than the library's road and graded
# over a longer run, so this layer overrides those defaults and nothing else.
[kind.road.defaults]
width = 4.0
grade = 44.0
max_grade = 24.0

# ---- courts
[[feature]]
id = "garden_court"
kind = "terrace"
region = [[112.0, 62.0], [208.0, 62.0], [208.0, 124.0], [112.0, 124.0]]
[[feature]]
id = "main_court"
kind = "terrace"
region = [[108.0, 142.0], [240.0, 136.0], [240.0, 208.0], [116.0, 202.0]]
[[feature]]
id = "hall_terrace"
kind = "terrace"
region = [[122.0, 216.0], [208.0, 216.0], [208.0, 262.0], [122.0, 262.0]]
[[feature]]                  # the gatehouse and lodge share one level
id = "gate_court"
kind = "terrace"
bank = 3.0
region = [[136.0, 32.0], [170.0, 32.0], [170.0, 48.0], [136.0, 48.0]]
[[feature]]
id = "garth_lawn"
kind = "lawn"
region = [[146.0, 80.0], [176.0, 80.0], [176.0, 110.0], [146.0, 110.0]]
[[feature]]
id = "garth"
kind = "poi"
at = [161.0, 95.0]

