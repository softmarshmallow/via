# Buildings layer: what is built on the terrain. May shape the terrain under it.
include = ["../../../kinds/terrain.toml"]

# Buildings stand on the shared `pad` kind. These two defaults are the values the college was laid
# out with; the library's own would move the ground round every building.
[kind.pad.defaults]
skirt = 5.0
max_cut = 3.0
trodden = 0.0            # these buildings stand on paving and turf, not on worn earth

