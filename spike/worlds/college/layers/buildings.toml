# ---- kit runs: bays of one module, end to end, on one pad
[[kitrun]]                   # the cloister's north, west and east walks; the south is open to the gate
id = "cloister_north"
bay = "kit.cloister_bay"
from = [143.0, 113.0]
to = [179.0, 113.0]
faces = "right"
[[kitrun]]
id = "cloister_west"
bay = "kit.cloister_bay"
from = [143.0, 77.0]
to = [143.0, 113.0]
faces = "right"
[[kitrun]]
id = "cloister_east"
bay = "kit.cloister_bay"
from = [179.0, 113.0]
to = [179.0, 83.0]
faces = "right"
[[kitrun]]                   # the east range of the main court
id = "east_wing"
