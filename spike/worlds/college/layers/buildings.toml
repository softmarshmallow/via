faces = "right"


# ---- each building's own walk to its door. A walk belongs with its building, so it is in this
# layer: it starts where a way in the terrain layer ends, and ends at the door, wherever that is.
[[feature]]
id = "hall_walk"
kind = "road"
width = 6.0
starts_at = "hall_steps.end"
ends_at = "hall.door"

[[feature]]
id = "chapel_walk"
kind = "road"
width = 2.5
starts_at = "dorm_lane.end"
ends_at = "chapel.door"

[[feature]]
id = "armoury_walk"
kind = "road"
width = 2.5
joins = ["east_way"]
ends_at = "armoury.door"
path = [[248.0, 108.0]]
