# College: a hillside college that grew court by court. A gate at the foot, a cloistered garden court,
# a paved main court above it, and the hall on the highest terrace. A dormitory lane climbs the west.
# The test: many hand-placed footprints close together, kit pieces that must close, and level changes.
# It defines no kind and includes none: each layer includes the shared kinds it uses.

[world]
name = "College"
extent = [0.0, 0.0, 320.0, 320.0]
resolution = 0.5
chunk = 64
seed = 61
pack = "../../packs/primitive.toml"

[export]
fields = ["grass"]

[budget]
max_source_tris_per_chunk = 1_500_000

[look]
sun_azimuth = 150.0
sun_elevation = 40.0
haze = 0.4

# One world, several documents. Lowest first: a layer may refer down, never up.
[[layer]]
id = "terrain"
file = "layers/terrain.toml"
[[layer]]
id = "buildings"
file = "layers/buildings.toml"
[[layer]]
id = "dressing"
file = "layers/dressing.toml"
[[layer]]
id = "people"
file = "layers/people.toml"
[[layer]]
id = "review"
file = "layers/review.toml"

[profile.on_foot]
max_slope_deg = 30.0
max_wade_m = 0.3

[[expect]]
from = "arrival"
to = ["hall", "chapel", "bell_tower", "armoury", "pavilion", "garth", "dorm_low.0", "dorm_high.0", "east_wing.0"]
by = "on_foot"
why = "every entrance"

