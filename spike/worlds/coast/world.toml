# Coast: a beach cove with sea stacks offshore, a headland with a sea cave through it, and a long
# point to the east that steps down to a lighthouse.
# The second example world. It exists to test what one height per point cannot hold.

include = ["../../kinds/terrain.toml", "../../kinds/rock.toml", "../../kinds/review.toml"]

[world]
name = "Coast"
extent = [0.0, 0.0, 704.0, 560.0]
resolution = 0.5
chunk = 64
seed = 23
pack = "../../packs/primitive.toml"

[params]
sea = 0.0
snowline = 400.0
treeline = 300.0

[export]
fields = ["water", "grass"]

[look]
sun_azimuth = 236.0
sun_elevation = 17.0
sun_color = [1.0, 0.86, 0.66]
sun_energy = 1.75
sky_top = [0.30, 0.44, 0.62]
sky_horizon = [0.80, 0.80, 0.76]
fog_color = [0.66, 0.72, 0.78]
ambient = 0.8
haze = 0.45
horizon = "sea"          # the sea runs on past the world's edge
surf = 0.7
water_deep = [0.04, 0.14, 0.23]
water_shallow = [0.20, 0.42, 0.44]
rock_a = [0.42, 0.27, 0.14]      # darker beds
rock_b = [0.80, 0.60, 0.36]      # paler beds
rock_tint = 0.85
rock_band_m = 6.0

# What the reach lint is allowed to assume. It runs only on request, and checks only what is expected.
[profile.on_foot]
max_slope_deg = 34.0
max_wade_m = 0.7

[[expect]]                 # the map's promise to a player on foot
from = "arrival"
to = ["headland_top", "cave_mouth", "lighthouse", "keepers_house"]
by = "on_foot"
why = "main route"

[[expect]]                 # intended: the stacks are scenery, seen from the shore and not walked on
from = "arrival"
to = ["stack_a", "stack_c"]
by = "on_foot"
reach = false
why = "scenery only"

# Parts: worlds built by themselves, placed here as units.
[[part]]                   # seam: the college brings its own hill, courts and buildings
id = "college"
file = "../college/world.toml"
at = [360.0, 278.0]
footprint = [40.0, 0.0, 280.0, 266.0]
apron = 30.0
max_step = 11.0              # raised on purpose: its terraces stand proud of the hill on the west side
joins_at = [160.0, 2.0]      # its arrival point is where it meets the land
expects = "land"

[[part]]                   # portal: the station's interior, hung on its front door
id = "station"
file = "../station/world.toml"
pack = "../../packs/primitive.toml"
portal = { door = "front_door", at = [556.0, 150.0] }

# ------------------------------------------------------------------------------------------------ fields

[field.height]
unit = "m"
base = """
  where(inland > 0,
        0.3 + 0.075 * min(inland, 26) + 20 * smoothstep(18, 120, inland) + 4 * fbm(70, 3, seed=3) * smoothstep(20, 80, inland),
        -0.16 * min(-inland, 70) - 2.5 * smoothstep(8, 60, -inland))
  + 0.5 * fbm(16, 2, seed=4)
  + 0.066 * clamp(y - 282, 0, 262) * smoothstep(10, 90, inland) * smoothstep(330, 420, x)
"""
layers = [               # the headland: a plateau that ends in a steep face over the sea
    { value = "max(v, 23 + 3 * fbm(48, 2, seed=5))", mask = "1 - smoothstep(-7, 2, sdist('headland') + 4 * fbm(22, 2, seed=6))" },
    # the point: three benches stepping down to its end
    { value = "max(v, bench + 1.4 * fbm(40, 3, seed=7))", mask = "1 - smoothstep(-6, 2, sdist('point') + 4 * fbm(26, 2, seed=8))" },
]
[field.height.let]
bench = "22 + 9 * smoothstep(104, 120, y - 0.2 * x + 104) + 9 * smoothstep(170, 190, y - 0.2 * x + 104)"
inland = "-sdist('mainland') + 7 * fbm(60, 2, seed=2)"

[field.water]
unit = "m"
base = "sea"             # the sea is the water field's own base

[field.solid]            # exists only inside features whose kind hosts it; base is the ground itself
type = "volume"
cell = 0.75
base = "ground"

[field.forest]
tags = ["vegetation"]
base = """
  smoothstep(-0.1, 0.2, fbm(90, 3, seed=21)) * smoothstep(6, 12, f('height'))
  * (1 - smoothstep(26, 34, slope('height'))) * smoothstep(10, 50, dist('point'))
"""

[field.grass]
tags = ["vegetation"]
base = "(1 - smoothstep(26, 34, slope('height'))) * (1 - 0.7 * f('forest')) * smoothstep(2.0, 4.0, f('height') - f('water'))"

[field.clear]
base = 0.0

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.15, 0.2, fbm(60, 3, seed=11))" },
    { paint = "forest", mask = "0.85 * smoothstep(0.35, 0.8, f('forest'))" },
    { paint = "dry_grass", mask = "0.9 * (1 - smoothstep(0, 30, dist('point')))" },
    { paint = "sand", mask = "1 - smoothstep(2.2, 3.6, f('height') - f('water') + 0.6 * fbm(18, 2, seed=15))" },
    { paint = "rock", mask = "smoothstep(34, 42, slope('height'))" },
]

# ------------------------------------------------------------------------------------------------ kinds

# The kinds come from the shared library. This coast differs from it only in numbers, so it overrides
# defaults and redefines nothing. These are the values its ways and pads were laid out with; with the
# library's own, the graded ground and the pads' cut limits would move.
[kind.road.defaults]
width = 4.0
grade = 44.0
max_grade = 24.0
[kind.pad.defaults]
skirt = 5.0
max_cut = 3.0
trodden = 0.0            # these buildings stand on paving and turf, not on worn earth

