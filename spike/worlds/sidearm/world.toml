# ---- the mechanism in another state: the slide drawn back. Each part that moves is moved by hand.
[variant.racked]
feature = [
    { id = "slide", cx = 15.3 },
    { id = "rear_sight", cx = 6.4 },
    { id = "sight_notch", cx = 6.4 },
    { id = "serrations", cx = 8.3 },
    { id = "ejection_port", cx = 15.8 },
    { id = "front_sight", cx = 24.4 },
]
