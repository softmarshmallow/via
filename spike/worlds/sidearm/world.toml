# Sidearm: a stress test, not a use case. Can the world model hold a small mechanical object?
# One unit is one centimetre here. Every part is a feature; a kind says whether it adds or cuts;
# a variant is the mechanism in another state. See FINDINGS, "A hard-surface stress test".

include = ["../../kinds/review.toml"]

[world]
name = "Sidearm"
extent = [-20.0, -24.0, 64.0, 48.0]
resolution = 0.5
chunk = 16
seed = 1
pack = "../../packs/primitive.toml"

[look]
sun_azimuth = 200.0
sun_elevation = 48.0
haze = 0.1

[field.height]
unit = "m"
base = 0.0

[field.ground]
type = "material"
layers = [{ paint = "paving" }]

[field.solid]                # the object is a solid: positive inside, cut and added to by features
type = "volume"
cell = 0.15
base = "ground"

# ---- kinds: what a part does to the solid. All adds are applied before all cuts.
[kind.bench]                 # the box of space the object is modelled in
hosts = "solid"

[kind.add_block]             # a box, optionally leaning in x as it rises
[kind.add_block.defaults]
lean = 0.0
[kind.add_block.let]
s = "min(min(hx - abs(x - cx - lean * (z - cz)), hy - abs(y - cy)), hz - abs(z - cz))"
[[kind.add_block.effect]]
field = "solid"
value = "max(v, s)"

[kind.add_rod]               # a cylinder along x
[kind.add_rod.let]
s = "min(hx - abs(x - cx), r - sqrt((y - cy) ** 2 + (z - cz) ** 2))"
[[kind.add_rod.effect]]
field = "solid"
value = "max(v, s)"

[kind.add_ring]              # a loop in the x-z plane
[kind.add_ring.let]
s = "min(th - abs(sqrt((x - cx) ** 2 + (z - cz) ** 2) - r), hy - abs(y - cy))"
[[kind.add_ring.effect]]
field = "solid"
value = "max(v, s)"

[kind.cut_block]
[kind.cut_block.defaults]
lean = 0.0
[kind.cut_block.let]
s = "min(min(hx - abs(x - cx - lean * (z - cz)), hy - abs(y - cy)), hz - abs(z - cz))"
[[kind.cut_block.effect]]
field = "solid"
value = "min(v, -s)"

[kind.cut_rod]
[kind.cut_rod.let]
s = "min(hx - abs(x - cx), r - sqrt((y - cy) ** 2 + (z - cz) ** 2))"
[[kind.cut_rod.effect]]
field = "solid"
value = "min(v, -s)"

[kind.cut_grooves]           # a row of grooves across both flanks
[kind.cut_grooves.let]
band = "min(hx - abs(x - cx), hz - abs(z - cz))"
flank = "abs(y - cy) - inner"
s = "min(min(band, flank), 0.5 * sin(6.2832 * x / pitch))"
[[kind.cut_grooves.effect]]
field = "solid"
value = "min(v, -s)"

# ---- the bench
[[feature]]
id = "bench"
kind = "bench"
z = [-1.0, 23.0]
apron = 0.4
region = [[2.0, 2.0], [42.0, 2.0], [42.0, 22.0], [2.0, 22.0]]

# ---- parts that add. `at` only gives each part a place on the plan; its size is in its attributes.
