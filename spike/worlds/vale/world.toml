# Vale: a mountain valley with a road, a tarn, a hamlet and a cliff.
# Metres. +x east, +y north, heights up. Positions are world coordinates unless given `on` a feature.

# What its features do to the fields is not written here: the kinds come from the shared library.
include = ["../../kinds/terrain.toml", "../../kinds/review.toml"]

[world]
name = "Vale"
extent = [0.0, 0.0, 512.0, 512.0]
resolution = 0.5
chunk = 64
seed = 11
pack = "../../packs/primitive.toml"

[params]
snowline = 150.0
treeline = 118.0

[budget]
max_instances_per_chunk = 400
max_source_tris_per_chunk = 1_500_000

[export]
fields = ["water", "grass"]

[look]
sun_azimuth = 215.0      # where the light comes from, degrees clockwise from north
sun_elevation = 38.0
haze = 0.5
sky = "summer"

# ------------------------------------------------------------------------------------------------ fields
# A field is a function over the world. `base` is an expression; `let` names sub-expressions.
# Features of a declared kind then apply their effects on top, in the order the library declares the kinds.

[field.height]
unit = "m"
base = """
  16 + 20 * y / 512
  + 82 * pow(smoothstep(18, 310, wall), 1.2) * (0.78 + 0.22 * fbm(340, 2, seed=4))
  + 26 * (1 - smoothstep(40, 330, x - 0.25 * y))
  + 7 * fbm(95, 4, seed=5) * smoothstep(10, 90, wall)
  + 1.2 * fbm(21, 3, seed=6) * smoothstep(30, 110, wall)
  + 5 * ridged(60, 3, seed=7) * smoothstep(60, 110, f_rough)
"""
layers = [               # a rough hollow around the tarn's site; the water finds its own shore in it
    { value = "25.6 - 3.4 * (1 - smoothstep(0, 52, hollow)) + 1.5 * fbm(30, 3, seed=9) + 1.9 * ridged(40, 2, seed=10) * smoothstep(10, 34, hollow)", mask = "1 - smoothstep(34, 84, hollow)" },
]
[field.height.let]
wall = "dist('valley') + 46 * fbm(190, 3, seed=2)"
f_rough = "dist('valley') + 30 * fbm(120, 2, seed=8)"
hollow = "dist('tarn_site') + 24 * fbm(50, 3, seed=19)"

[field.water]
unit = "m"
base = -100.0            # no water anywhere until a feature says so

[field.forest]
tags = ["vegetation"]
base = """
  smoothstep(-0.12, 0.22, fbm(130, 3, seed=21) + 0.25 * smoothstep(30, 120, dist('valley')) - 0.1)
  * (1 - smoothstep(27, 35, slope('height')))
  * (1 - smoothstep(treeline - 22, treeline, f('height')))
  * smoothstep(0.6, 2.0, f('height') - f('water'))
"""

[field.grass]
tags = ["vegetation"]
base = """
  (1 - smoothstep(26, 34, slope('height'))) * (1 - 0.75 * f('forest'))
  * (1 - smoothstep(snowline - 14, snowline - 4, f('height')))
  * smoothstep(0.3, 1.2, f('height') - f('water'))
"""

[field.clear]
base = 0.0               # raised by roads and pads; assets that `avoid` it stay out

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.15, 0.2, fbm(75, 3, seed=11)) * (1 - 0.6 * smoothstep(60, 140, dist('valley')))" },
    { paint = "forest", mask = "0.85 * smoothstep(0.35, 0.8, f('forest'))" },
    { paint = "shore", mask = "1 - smoothstep(0.25, 1.1, f('height') - f('water'))" },
    { paint = "scree", mask = "smoothstep(27, 34, slope('height') + 5 * fbm(14, 2, seed=12))" },
    { paint = "rock", mask = "smoothstep(35, 43, slope('height') + 4 * fbm(9, 2, seed=13))" },
    { paint = "snow", mask = "smoothstep(snowline - 7, snowline + 7, f('height') + 7 * fbm(38, 2, seed=14)) * (1 - smoothstep(44, 56, slope('height')))" },
]

# ------------------------------------------------------------------------------------------------ features

[[feature]]
id = "valley"
kind = "guide"
path = [[200.0, -40.0], [215.0, 90.0], [262.0, 200.0], [300.0, 300.0], [352.0, 400.0], [410.0, 552.0]]

[[feature]]
id = "north_cliff"
kind = "cliff"
path = [[70.0, 250.0], [112.0, 318.0], [170.0, 372.0], [236.0, 418.0]]

[[feature]]
id = "tarn_site"
kind = "guide"
at = [338.0, 186.0]

[[feature]]                # scenery: a point and a rule. Its shape is whatever the ground holds.
id = "tarn"
kind = "lake"
at = [338.0, 186.0]
flood = { field = "height", level = "spill", fence = 92.0, max_depth = 7.0, freeboard = 0.35 }

[[feature]]                # a landmark: the shape is exact and the ground conforms to it
id = "mill_pond"
kind = "lake"
authority = "anchored"
depth = 2.2
shore = 7.0
rim = 16.0
region = [[352.0, 322.0], [362.0, 316.0], [376.0, 318.0], [384.0, 327.0], [382.0, 339.0], [371.0, 344.0], [363.0, 338.0], [355.0, 340.0], [348.0, 333.0]]

[[feature]]
id = "valley_road"
kind = "road"
path = [[186.0, -10.0], [200.0, 80.0], [232.0, 160.0], [252.0, 240.0], [292.0, 318.0], [338.0, 400.0], [392.0, 522.0]]

[[feature]]
id = "east_trail"
kind = "road"
width = 2.2
shoulder = 3.5
grade = 16.0
max_grade = 32.0
joins = ["valley_road"]      # declared intent: one end of this path meets that feature
path = [[262.0, 262.0], [318.0, 262.0], [376.0, 246.0], [424.0, 214.0], [462.0, 170.0]]

[[feature]]
id = "pass"
kind = "poi"
on = { feature = "valley_road", t = 0.96 }
label = "North Pass"

[[feature]]
id = "tarn_shore"
kind = "poi"
on = { feature = "tarn", t = 0.30, offset = 3.0 }     # wherever the shore turns out to be
label = "The Tarn"

[[feature]]                # nothing here knows what a spawn zone is; it reaches the engine untouched
id = "wolf_ground"
kind = "spawn_zone"
ellipse = { center = [110.0, 180.0], size = [90.0, 70.0] }
table = "wolves"
max_alive = 4

[[feature]]
id = "bm_road_south"
kind = "bookmark"
on = { feature = "valley_road", t = 0.10 }
look = { feature = "valley_road", t = 0.30 }
eye = 1.8
note = "Arriving from the south: the road, the valley walls, the hamlet ahead."

[[feature]]
id = "bm_hamlet"
kind = "bookmark"
on = { feature = "valley_road", t = 0.33, offset = -9.0 }
look = { feature = "valley_road", t = 0.44 }
eye = 2.2
note = "The hamlet from the road."

[[feature]]
id = "bm_tarn"
kind = "bookmark"
on = { feature = "tarn", t = 0.02, offset = 5.0 }
look = [338.0, 186.0]
eye = 2.2
look_height = 0.0
note = "Across the tarn to the north cliff."

[[feature]]
id = "bm_cliff"
kind = "bookmark"
at = [176.0, 334.0]
look = [128.0, 352.0]
eye = 1.8
look_height = 9.0
note = "Under the cliff."

[[feature]]
id = "bm_overlook"
kind = "bookmark"
on = { feature = "east_trail", t = 0.95 }
look = [250.0, 250.0]
eye = 3.0
look_height = 0.0
note = "The valley from the end of the east trail."

[[feature]]
id = "bm_tarn_above"
kind = "bookmark"
at = [400.0, 120.0]
look = [338.0, 190.0]
eye = 45.0
look_height = 0.0
note = "The tarn's shore from above."

[[feature]]
id = "bm_mill"
kind = "bookmark"
on = { feature = "mill_pond", t = 0.80, offset = 14.0 }
look = [366.0, 330.0]
eye = 2.0
look_height = 1.0
note = "The mill pond and the mill beside it."

[[feature]]
id = "bm_aerial"
kind = "bookmark"
at = [470.0, 30.0]
look = [250.0, 270.0]
eye = 150.0
look_height = 0.0
fov = 50.0
note = "The whole world from the south-east."

# ------------------------------------------------------------------------------------------------ instances
# An instance with a kind lends its footprint to that kind as a region.

[[instance]]
id = "cottage_a"
asset = "house.small"
kind = "pad"
on = { feature = "valley_road", t = 0.40, offset = 13.0 }

[[instance]]
id = "cottage_b"
asset = "house.small"
kind = "pad"
on = { feature = "valley_road", t = 0.455, offset = -12.5 }

[[instance]]
id = "barn"
asset = "barn"
kind = "pad"
on = { feature = "valley_road", t = 0.47, offset = 15.0 }
turn = 12.0

[[instance]]
id = "cottage_c"
asset = "house.small"
kind = "pad"
on = { feature = "valley_road", t = 0.51, offset = -14.0 }
turn = -8.0

[[instance]]               # beside the landmark, in the landmark's own frame
id = "mill"
asset = "barn"
kind = "pad"
on = { feature = "mill_pond", t = 0.50, offset = 12.0 }
over = ["mill_pond"]       # both are anchored and their aprons meet: the mill's floor wins

# ------------------------------------------------------------------------------------------------ producers
# A producer lowers a density to plain instances. The compiled world lists them like any other.

[[scatter]]
id = "woods"
spacing = 6.5
density = "f('forest')"
assets = [
    { id = "tree.broadleaf", weight = 5 },
    { id = "tree.conifer", weight = 3 },
    { id = "tree.great", weight = 0.5 },
]
scale = [0.75, 1.3]
seed = 1

[[scatter]]
id = "high_conifers"
spacing = 9.0
density = "0.5 * smoothstep(treeline - 40, treeline - 15, f('height')) * (1 - smoothstep(treeline, treeline + 12, f('height'))) * (1 - smoothstep(28, 36, slope('height')))"
assets = [{ id = "tree.conifer" }]
scale = [0.6, 0.95]
seed = 2

[[scatter]]
id = "underbrush"
spacing = 5.0
density = "0.45 * f('forest') + 0.12 * f('grass') * smoothstep(0.1, 0.4, fbm(40, 2, seed=51))"
assets = [{ id = "bush" }]
scale = [0.7, 1.5]
seed = 3

[[scatter]]
id = "cliff_fall"            # boulders gather at the foot of the cliff
spacing = 5.5
density = "0.75 * smoothstep(-26, -6, sdist('north_cliff')) * (1 - smoothstep(-5, -2, sdist('north_cliff'))) * smoothstep(0.08, 0.3, along('north_cliff')) * (1 - smoothstep(0.7, 0.92, along('north_cliff'))) * near('north_cliff', 30)"
assets = [{ id = "rock.boulder", weight = 3 }, { id = "rock.large", weight = 1 }]
scale = [0.6, 1.5]
tint = [0.92, 1.05]
seed = 4

[[scatter]]
id = "scree_rocks"
spacing = 11.0
density = "0.35 * smoothstep(24, 32, slope('height')) * (1 - smoothstep(40, 46, slope('height')))"
assets = [{ id = "rock.boulder" }]
scale = [0.4, 1.1]
tint = [0.92, 1.05]
seed = 5

[[scatter]]
id = "deadwood"
spacing = 16.0
density = "0.5 * f('forest')"
assets = [{ id = "log" }]
scale = [0.8, 1.2]
tint = [0.9, 1.05]
seed = 6

# ------------------------------------------------------------------------------------------------ variants
# A variant is an overlay: the same document shape, merged over the base.

[variant.winter.params]
snowline = 34.0
[variant.winter.look]
sky = "winter"
sun_elevation = 22.0
haze = 0.75
[variant.winter.field.grass]
base = "0.0"
