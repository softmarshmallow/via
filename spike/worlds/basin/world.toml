# Basin: a few stated facts, and an erosion model that settles the land around them.
#
# The author writes: the sea is to the south, the ground rises loosely to the north, a lake exists
# at a level, a river runs from a spring to a haven. Nothing else about the land is written. A
# generate step hands those facts to the Rust terrain stage in this repository (crates/via-terrain)
# as its fixed conditions; it cuts the valleys and tributaries and hands back the ground.
#
#   cargo build --release -p via            (once, from the repository root)
#   uv run python -m worldc worlds/basin/world.toml
#   uv run python -m worldc worlds/basin/world.toml --overlay worlds/basin/changes/move_haven.toml --out basin_moved
#   uv run python -m worldc worlds/basin/world.toml --overlay worlds/basin/changes/two_ends.toml --out basin_two_ends
#   uv run python -m worldc worlds/basin/world.toml --overlay worlds/basin/changes/cannot_hold.toml --out basin_cannot

include = ["../../kinds/terrain.toml", "../../kinds/review.toml", "kinds.toml"]

[world]
name = "Basin"
extent = [0.0, 0.0, 3200.0, 3200.0]
resolution = 2.5
chunk = 256
seed = 31
pack = "../../packs/primitive.toml"

[params]
sea = 0.0

[export]
fields = ["water", "grass", "wet", "damp", "silt"]

[look]
sun_azimuth = 225.0
sun_elevation = 32.0
haze = 0.3
sky = "summer"

[[layer]]
id = "facts"                 # what the author states. The terrain step reads this layer's build and nothing above it.
file = "layers/facts.toml"
[[layer]]
id = "dress"                 # growth and views; changing it never reruns the terrain
file = "layers/dress.toml"

# ---- the starting surface: high ground stated loosely. The model works from here.
[field.height]
unit = "m"
base = """
  -14 + 0.040 * y
  + 70 * smoothstep(1300, 3000, y) * (0.55 + 0.45 * fbm(1100, 3, seed=1))
  + 16 * fbm(420, 3, seed=2) * smoothstep(200, 900, y)
"""

[field.water]
unit = "m"
base = -100.0

[field.clear]
base = 0.0

[field.ground]
type = "material"
layers = [ { paint = "grass" } ]

# ---- the simulation, as a step. It reruns only when the facts layer, its parameters, this script
#      or the engine binary change.
[[step]]
id = "terrain"
at = "generate"
after = "facts"
run = ["python", "tools/terrain.py"]
inputs = ["../../../target/release/via"]
[step.params]
engine = "../../../target/release/via"
cell = 12.5                  # the model's grid; the world's posts are finer and take it by interpolation
margin = 16                  # cells simulated beyond each edge, so the model's own edge is out of sight
steps = 160
dt_years = 1000.0
erodibility = 8.0e-6
diffusivity = 0.006
deposition = 1.0
incise = 2.0                 # how far below the starting ground a river begins
hold_cells = 3               # a stated river is grooved below all ground within this many cells of its line
min_fall = 0.003             # the least a stated river falls, m per m
valley = 70.0                # run of the slope either side of a stated river's groove, m
max_bank = 3.0               # the most a lake's shore may be raised to hold its water before it is a dam
level_within = 1.5           # how far from its stated level the model may leave a lake
follow_within = 50.0         # how far the water may stray from a stated river's line
max_cut = 22.0               # a river that must cut deeper than this through high ground is reported
min_catchment = 0.08         # a river that gathers less of the land than this is reported
detail = 0.45                # metres of fine relief added below the model's grid

[[step]]
id = "facts_hold"
at = "lint"
run = ["python", "tools/facts_hold.py"]
