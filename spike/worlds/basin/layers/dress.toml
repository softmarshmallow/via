# Dress layer: growth, ground and views. It is above the terrain step, so it reads what the model
# made: `wet` (how much water passes), `damp` (the valley floors), `silt` (where sediment settled),
# and `river_course` (where the water actually runs). Nothing here is placed by coordinate except views.

[field.dry]                  # 1 on land, 0 under water
base = "where(f('water') > f('height') - 0.15, 0.0, 1.0)"

[field.forest]               # woods keep to the valley sides and floors, off the steep ground and the shore
tags = ["vegetation"]
base = """
  smoothstep(0.18, 0.5, f('damp') + 0.35 * fbm(260, 3, seed=5))
  * (1 - smoothstep(24, 32, slope('height')))
  * smoothstep(2.5, 6, f('height'))
  * f('dry')
"""

[field.grass]
tags = ["vegetation"]
base = "(1 - 0.7 * f('forest')) * f('dry')"

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.1, 0.3, fbm(180, 3, seed=7)) * (1 - f('forest'))" },
    { paint = "dry_grass", mask = "0.8 * (1 - smoothstep(0.02, 0.12, f('damp'))) * smoothstep(40, 90, f('height'))" },
    { paint = "forest", mask = "0.9 * smoothstep(0.3, 0.75, f('forest'))" },
    { paint = "shore", mask = "smoothstep(0.55, 0.8, f('wet')) + 0.8 * smoothstep(0.15, 0.6, f('silt'))" },
    { paint = "scree", mask = "smoothstep(26, 34, slope('height'))" },
    { paint = "sand", mask = "1 - smoothstep(0.6, 2.6, f('height'))" },
]

# ---- growth by cause
[[scatter]]
id = "woods"
spacing = 24.0
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 2 }, { id = "tree.great", weight = 0.4 }]
scale = [0.9, 1.4]
clump = { size = [2, 5], radius = 9.0, shrink = 0.4 }
seed = 1

[[scatter]]
id = "brush"                 # under the trees and along the streams
spacing = 14.0
density = "f('dry') * (0.5 * around('woods', 8.0) + 0.6 * smoothstep(0.5, 0.8, f('wet')))"
assets = [{ id = "bush" }]
scale = [0.7, 1.3]
seed = 2

[[scatter]]
id = "stones"                # in the stream beds and below steep ground
spacing = 16.0
density = "f('dry') * (0.6 * smoothstep(0.6, 0.85, f('wet')) + 0.6 * smoothstep(24, 32, slope('height')))"
assets = [{ id = "rock.boulder", weight = 2 }, { id = "rock.large", weight = 1 }]
scale = [0.6, 1.4]
seed = 3

# ---- views. Those on the river follow it when it moves.
[[feature]]
id = "bm_bank"
kind = "bookmark"
on = { feature = "river_course", t = 0.55, offset = 14.0 }
look = { feature = "river_course", t = 0.40 }
eye = 1.8
note = "On the bank, looking up the valley."

[[feature]]
id = "bm_over"
kind = "bookmark"
at = [2950.0, 150.0]
look = [1500.0, 1800.0]
eye = 420.0
note = "The whole basin from over the sea."

[[feature]]
id = "bm_valley"
kind = "bookmark"
on = { feature = "river_course", t = 0.80, offset = 40.0 }
look = { feature = "river_course", t = 0.35 }
eye = 60.0
note = "Up the river valley from above its lower reach."

[[feature]]
id = "bm_tarn"
