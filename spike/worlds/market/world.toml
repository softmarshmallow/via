# ------------------------------------------------------------------------------------------------ landmarks, by hand

[[instance]]
id = "inn"
asset = "town.inn"              # stands on the square's own level, so it asks for no ground of its own
on = { feature = "market_square", t = 0.86, offset = -6.5 }
face = "in"

[[instance]]
id = "hall"
asset = "town.hall"
on = { feature = "market_square", t = 0.585, offset = -10.5 }
face = "in"

[[instance]]
id = "church"
asset = "town.church"
kind = "pad"
on = { feature = "church_street", t = 0.30, offset = -17.0 }
face = "toward"

[[instance]]
id = "steeple"
asset = "town.steeple"
beside = "church"
offset = [0.0, 13.6]

[[instance]]
id = "well"
asset = "town.well"
at = [116.0, 124.0]

