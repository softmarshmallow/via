# ------------------------------------------------------------------------------------------------ country

[[scatter]]
id = "woods"
spacing = 7.0
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 4 }, { id = "tree.conifer", weight = 1 }]
scale = [0.8, 1.35]
seed = 1

[[scatter]]
id = "garden_trees"
spacing = 14.0
density = "0.35 * (1 - f('clear')) * (1 - f('forest'))"
assets = [{ id = "tree.broadleaf" }]
scale = [0.6, 0.95]
seed = 2

