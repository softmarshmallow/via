# Market: a small town on a slope. A first pass at the dogfood district from the city study.
# Streets come first. Rows of houses are kit runs that stand `along` a street, so they follow it
# when it moves. The kit is a proof kit: boxes with roofs, every row piece one 5 m module wide.

include = ["../../kinds/terrain.toml", "../../kinds/review.toml"]

[world]
name = "Market"
extent = [0.0, 0.0, 256.0, 256.0]
resolution = 0.5
chunk = 64
seed = 41
pack = "../../packs/primitive.toml"

[export]
fields = ["water", "grass"]

[look]
sun_azimuth = 205.0
sun_elevation = 36.0
haze = 0.4
sky = "summer"

[kind.pad.defaults]
skirt = 3.0
max_cut = 3.0

[kind.road.defaults]
shoulder = 4.0

# ------------------------------------------------------------------------------------------------ land

[field.height]
unit = "m"
base = "16 + 0.055 * y + 0.018 * x + 3.0 * fbm(140, 3, seed=2) + 0.5 * fbm(28, 3, seed=3)"

[field.water]
unit = "m"
base = -100.0

[field.clear]
base = 0.0

[field.forest]
tags = ["vegetation"]
base = "smoothstep(0.05, 0.4, fbm(70, 3, seed=5)) * smoothstep(40, 75, town)"
[field.forest.let]
town = "min(min(dist('main_street'), dist('mill_street')), min(dist('church_street'), dist('back_lane')))"

[field.grass]
tags = ["vegetation"]
base = "1 - 0.7 * f('forest')"

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.1, 0.25, fbm(60, 3, seed=7))" },
    { paint = "forest", mask = "0.85 * smoothstep(0.35, 0.8, f('forest'))" },
]

# ------------------------------------------------------------------------------------------------ streets

[[feature]]
id = "main_street"
kind = "road"
width = 7.0
path = [[-10.0, 52.0], [60.0, 62.0], [118.0, 86.0], [160.0, 134.0], [174.0, 200.0], [178.0, 266.0]]

[[feature]]
id = "mill_street"          # leaves the main street below the bend and climbs north-west
kind = "road"
width = 5.0
joins = ["main_street"]
path = [[92.0, 73.0], [80.0, 120.0], [66.0, 180.0], [58.0, 266.0]]

[[feature]]
id = "church_street"        # east from the top of the bend
kind = "road"
width = 5.0
joins = ["main_street"]
path = [[163.0, 142.0], [205.0, 136.0], [266.0, 128.0]]

[[feature]]
id = "back_lane"            # closes the block between the mill street and the main street
kind = "road"
width = 3.5
joins = ["mill_street", "main_street"]
path = [[70.0, 164.0], [120.0, 178.0], [173.0, 196.0]]

[[feature]]
id = "market_square"        # a paved court in the crook of the bend
kind = "terrace"
max_cut = 3.5
region = [[104.0, 92.0], [142.0, 118.0], [128.0, 160.0], [78.0, 142.0]]

# ------------------------------------------------------------------------------------------------ rows
# `at` is where a row starts, as a fraction of its street; `bays` is how many modules it holds.

