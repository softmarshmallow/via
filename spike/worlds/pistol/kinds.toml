# Kinds for modelling a solid object. A part is a feature with no place on a plan (`plan = false`):
# its size and position are its attributes. Every block and rod carries its own faces as formulas,
# so another part can say `slide.top` or `frame.back`. All adds are applied before all cuts.

[kind.bench]                 # the box of space an object is modelled in
hosts = "solid"

[kind.mount]                 # a named place for something else to attach to; it makes nothing
plan = false

[kind.add_block]             # a box; `lean` shifts it in x as it rises
plan = false
[kind.add_block.defaults]
lean = 0.0
top = "= cz + hz"
bottom = "= cz - hz"
front = "= cx + hx"
back = "= cx - hx"
[kind.add_block.let]
s = "min(min(hx - abs(x - cx - lean * (z - cz)), hy - abs(y - cy)), hz - abs(z - cz))"
[[kind.add_block.effect]]
field = "solid"
value = "max(v, s)"

[kind.add_rod]               # a cylinder along x
plan = false
[kind.add_rod.defaults]
front = "= cx + hx"
back = "= cx - hx"
[kind.add_rod.let]
s = "min(hx - abs(x - cx), r - sqrt((y - cy) ** 2 + (z - cz) ** 2))"
[[kind.add_rod.effect]]
field = "solid"
value = "max(v, s)"

[kind.add_ring]              # a loop in the x-z plane
plan = false
[kind.add_ring.let]
s = "min(th - abs(sqrt((x - cx) ** 2 + (z - cz) ** 2) - r), hy - abs(y - cy))"
[[kind.add_ring.effect]]
field = "solid"
value = "max(v, s)"

[kind.cut_block]
plan = false
[kind.cut_block.defaults]
lean = 0.0
[kind.cut_block.let]
s = "min(min(hx - abs(x - cx - lean * (z - cz)), hy - abs(y - cy)), hz - abs(z - cz))"
[[kind.cut_block.effect]]
field = "solid"
value = "min(v, -s)"

[kind.cut_rod]
plan = false
[kind.cut_rod.let]
s = "min(hx - abs(x - cx), r - sqrt((y - cy) ** 2 + (z - cz) ** 2))"
[[kind.cut_rod.effect]]
field = "solid"
value = "min(v, -s)"

[kind.cut_grooves]           # a row of grooves across both flanks
plan = false
[kind.cut_grooves.let]
band = "min(hx - abs(x - cx), hz - abs(z - cz))"
flank = "abs(y - cy) - inner"
s = "min(min(band, flank), 0.5 * sin(6.2832 * x / pitch))"
[[kind.cut_grooves.effect]]
field = "solid"
value = "min(v, -s)"
