# Accessory: a reflex sight. It attaches to `optic_mount` and knows nothing else about the pistol.
[[feature]]
id = "optic_base"
kind = "add_block"
hx = 1.5
hy = "= slide.hy"
hz = 0.3
cx = "= optic_mount.x"
cy = "= mid_y"
cz = "= optic_mount.z + hz"

[[feature]]
id = "optic_hood"
kind = "add_block"
hx = 0.22
hy = "= slide.hy"
hz = 1.0
cx = "= optic_base.front - hx"
cy = "= mid_y"
cz = "= optic_base.top + hz"

[[feature]]
id = "optic_window"
kind = "cut_block"
hx = 0.5
hy = "= optic_hood.hy - 0.22"
hz = "= optic_hood.hz - 0.22"
cx = "= optic_hood.cx"
cy = "= mid_y"
cz = "= optic_hood.cz"
