# Accessory: a light under the frame. It attaches to `rail_mount`.
[[feature]]
id = "light_body"
kind = "add_block"
hx = 2.2
hy = "= slide.hy * 0.95"
hz = 1.0
cx = "= rail_mount.x"
cy = "= mid_y"
cz = "= rail_mount.z - hz"

[[feature]]
id = "light_head"
kind = "add_rod"
hx = 0.5
r = 1.05
cx = "= light_body.front + hx - 0.1"
cy = "= mid_y"
cz = "= light_body.cz"

[[feature]]
id = "light_lens"
kind = "cut_rod"
hx = 0.3
r = 0.8
cx = "= light_head.front"
cy = "= mid_y"
cz = "= light_head.cz"
