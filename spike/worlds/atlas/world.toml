# Atlas: every place we have built, in one map. This file owns the sea, the plain, a tidal creek and
# the roads and bridge between neighbours. It edits none of the places; each still compiles alone.
#
#   uv run python -m worldc worlds/atlas/world.toml
#   ./explore.sh atlas
#
# Not here: `coast` (it has parts of its own, and parts do not nest; its two pieces are here instead).

include = ["../../kinds/terrain.toml", "../../kinds/ways.toml", "../../kinds/town.toml", "../../kinds/review.toml"]

[world]
name = "Atlas"
extent = [0.0, 0.0, 3040.0, 2400.0]
resolution = 1.25            # the city's spacing; the smaller places are sampled onto it
chunk = 160
seed = 2
pack = "../../packs/primitive.toml"

[params]
sea = 0.0
shore_y = 330.0

[export]
fields = ["water", "grass"]      # without this the viewer is handed no water: the rivers drew dry

[look]
horizon = "sea"
sun_azimuth = 215.0
sun_elevation = 38.0
haze = 0.2

# ---- the places. `at` puts one down; `outer` is how far the plain reaches to meet its edge.
# `lift` raises or lowers a place whole, so that its lowest edge stands just clear of the sea; each
# was built with its own idea of where zero is. (`joins_at` does it by naming one spot that must meet the plain.)
# `ground_as` carries a material the atlas does not have as one it does (the output holds eight).

[[part]]
id = "city"
file = "../city/world.toml"
at = [300.0, 420.0]
apron = 30.0
lift = -14.0
max_step = 8.0               # the river comes in across the limits: its bed is the step
footprint = "city_limits"                              # the city is cut to the land this map gives it,
give = { limits = "city_limits", urban = "urban", districts = "kind:district", squares = "kind:square" }      # and is built from this map's plan for it
ground_as = { asphalt = "rock" }

[[part]]
id = "college"
file = "../college/world.toml"
at = [2090.0, 440.0]
apron = 10.0
lift = 1.5
outer = 70.0

[[part]]
id = "market"
file = "../market/world.toml"
at = [2060.0, 850.0]
apron = 10.0
lift = -14.5
outer = 40.0                 # short on purpose: the creek runs 45 m from its west edge

[[part]]
id = "example"
file = "../example/world.toml"
at = [2440.0, 960.0]
apron = 10.0
lift = -24.5
outer = 90.0
ground_as = { dry_grass = "meadow" }

[[part]]
id = "glade"
file = "../glade/world.toml"
variants = ["by_cause"]
at = [2790.0, 1020.0]
apron = 10.0
lift = -18.0
outer = 80.0

[[part]]
id = "relief"
file = "../relief/world.toml"
at = [2040.0, 1240.0]
apron = 10.0
lift = -26.5
outer = 90.0

[[part]]
id = "massif"
file = "../massif/world.toml"
at = [2010.0, 1660.0]
apron = 10.0
outer = 150.0
joins_at = [330.0, 2.0]

[[part]]
id = "vale"
file = "../vale/world.toml"
at = [2480.0, 1420.0]
apron = 10.0
lift = -19.0
outer = 160.0
ground_as = { snow = "rock" }

[[part]]
id = "monastery"
file = "../monastery/world.toml"
at = [1640.0, 2050.0]          # moved 80 m east when the river was given its way in; its road followed
apron = 10.0
lift = -10.5
outer = 160.0
ground_as = { dry_grass = "meadow" }

[[part]]                     # an interior, hung on its front door at the end of the halt road
id = "station"
file = "../station/world.toml"
portal = { door = "front_door", at = [2600.0, 690.0] }
max_relief = 0.6

# ---- the atlas's own kind: a tidal creek, cut below the sea so the sea fills it
[kind.creek]
reach = 40
[kind.creek.defaults]
bed = 9.0
bank = 14.0
depth = 2.6
[[kind.creek.effect]]
field = "height"
value = "-depth"
mask = "1 - smoothstep(bed, bed + bank, d + 4 * fbm(40, 2, seed=6))"
[[kind.creek.effect]]
field = "ground"
paint = "shore"
mask = "1 - smoothstep(bed + bank * 0.4, bed + bank, d)"
[[kind.creek.effect]]
field = "#vegetation"
value = 0.0
mask = "1 - smoothstep(bed, bed + bank, d)"
[kind.creek.map]
color = [0.35, 0.55, 0.80]
width = 3

[[feature]]
id = "creek"
kind = "creek"
path = [[1990.0, 250.0], [1996.0, 520.0], [1984.0, 760.0], [1992.0, 960.0], [1982.0, 1070.0]]

# ---- connectors. Each end is a place's own road end, by name; the points between are the atlas's.
# The city declares its exits, and every one must be answered here or the build stops. Three carry on
# to a neighbour, one leaves the map, three lead nowhere and say so (`fade`), and the river's two are
# answered with water.

[[feature]]
id = "creek_bridge"          # the city's harbour boulevard carries on to the market's main street
kind = "bridge"
authority = "anchored"
width = 9.0
rise = 3.0
ramp = 60.0
clear = 3.0
over = ["creek"]
starts_at = "city.harbor_road_east"
ends_at = "market.main_street.start"

[[feature]]
id = "coast_road"
kind = "road"
width = 6.0
starts_at = "market.main_street.start"
path = [[2046.0, 800.0], [2044.0, 560.0], [2070.0, 410.0], [2170.0, 384.0]]
ends_at = "college.approach.start"

[[feature]]
id = "halt_road"
kind = "road"
width = 5.0
starts_at = "college.approach.start"
path = [[2330.0, 392.0], [2470.0, 420.0], [2640.0, 560.0], [2636.0, 676.0], [2608.0, 690.0]]

[[feature]]
id = "halt_yard"             # level ground for the station to stand on
kind = "terrace"
max_cut = 3.0
region = [[2562.0, 672.0], [2616.0, 672.0], [2616.0, 712.0], [2562.0, 712.0]]

[[feature]]
id = "east_road"
kind = "road"
width = 5.0
starts_at = "market.church_street.end"
path = [[2380.0, 1010.0]]
ends_at = "example.lane_west.start"

[[feature]]
id = "glade_track"
kind = "road"
width = 4.0
starts_at = "example.lane_east.end"
path = [[2745.0, 1100.0]]
ends_at = "glade.track.start"

[[feature]]
id = "vale_road"
kind = "road"
width = 5.0
starts_at = "example.lane_east.end"
path = [[2726.0, 1180.0], [2700.0, 1300.0]]
ends_at = "vale.valley_road.start"

[[feature]]
id = "massif_road"
kind = "road"
width = 5.0
starts_at = "market.main_street.end"
path = [[2290.0, 1170.0], [2350.0, 1230.0], [2362.0, 1500.0]]
ends_at = "massif.lane.start"

[[feature]]
id = "relief_track"
kind = "road"
width = 4.0
starts_at = "city.central_road_east"
path = [[1970.0, 1262.0]]
ends_at = "relief.track.start"

[[feature]]
id = "abbey_road"
kind = "road"
width = 5.0
starts_at = "city.north_road_east"
path = [[1950.0, 1880.0], [1960.0, 2000.0]]
ends_at = "monastery.road_up.start"

[[feature]]
id = "west_highway"          # the crosstown carries on west, off the map
kind = "road"
width = 14.0
starts_at = "city.motorway_west"
path = [[150.0, 1424.0], [-10.0, 1416.0]]

[[feature]]
id = "west_road_end"         # nothing lies west yet: the avenue becomes a track and stops
kind = "fade"
width = 13.0
starts_at = "city.central_road_west"
onward = 150.0

[[feature]]
id = "north_road_end"
kind = "fade"
width = 13.0
starts_at = "city.grand_road_north"
onward = 170.0

[[feature]]
id = "east_stub"             # the crosstown's unbuilt eastern leg, short of the creek
kind = "fade"
width = 20.0
track = 4.0
starts_at = "city.motorway_east"
onward = 48.0

[[feature]]
id = "river_mouth"           # the city's river reaches the sea
kind = "creek"
bed = 20.0
bank = 14.0
starts_at = "city.river_out"
path = [[1260.0, 330.0], [1264.0, 230.0]]

[[feature]]
id = "river_upper"           # and comes down to the city from the north, west of the monastery's hill
kind = "creek"
bed = 20.0
bank = 14.0
path = [[1300.0, 2410.0], [1330.0, 2260.0], [1430.0, 2130.0], [1530.0, 2070.0]]
ends_at = "city.river_in"

# ---- the city, from this map's side, at three strengths. Nothing below is a street, a block or a house.
#   anchored   two squares and the axes the city grows along
#   shaped     districts: where each is, loosely, and its character. Earlier ones win where two overlap
#   derived    the limits (wherever a district is), then every street, lot and building, by the city's own tools
# Move a square or change a reach here and the city settles again.

[[feature]]
id = "city_room"             # the ground the city's own map covers. A given thing cannot ask a part for this
kind = "guide"
region = [[330.0, 450.0], [1870.0, 450.0], [1870.0, 1990.0], [330.0, 1990.0]]

[[feature]]
id = "city_centre"
kind = "guide"
at = [1150.0, 1040.0]

[[feature]]
id = "market_square"         # the old heart, on the west bank
kind = "square"
ellipse = { center = [1200.0, 1560.0], size = [70.0, 54.0] }
landmark = "town.well"

[[feature]]
id = "cathedral_square"      # across the river
kind = "square"
ellipse = { center = [1730.0, 1490.0], size = [80.0, 80.0] }
landmark = "town.church"

[[feature]]                  # the ways out that building follows. By coordinates: the city's main ways are the
id = "axis_north"            # city's own, and a given thing cannot read a part
kind = "axis"
path = [[1010.0, 1040.0], [1030.0, 1500.0], [1060.0, 1980.0]]
[[feature]]
id = "axis_west"
kind = "axis"
path = [[1150.0, 1222.0], [700.0, 1220.0], [340.0, 1220.0]]
[[feature]]
id = "axis_east"
kind = "axis"
path = [[1150.0, 1222.0], [1500.0, 1215.0], [1860.0, 1238.0]]
[[feature]]
id = "axis_north_east"
kind = "axis"
path = [[1060.0, 1670.0], [1450.0, 1710.0], [1860.0, 1720.0]]

[field.urban]                # how built up: a core, arms along the axes, nothing off the city's own ground
base = "clamp(max(core, 0.6 * arm), 0, 1) * room"
[field.urban.let]
core = "1 - smoothstep(200, 620, dist('city_centre') + 110 * fbm(260, 3, seed=21))"
arm = "(1 - smoothstep(50, 230, dist('kind:axis') + 70 * fbm(130, 2, seed=22))) * (1 - smoothstep(620, 980, dist('city_centre')))"
room = "smoothstep(0, 60, -sdist('city_room'))"

[[feature]]
id = "old_town"
kind = "district"
where = "dist('market_square') + 50 * fbm(140, 2, seed=31) < 270"
pattern = "organic"
bearing = 28.0
block = 46.0
buildings = ["@building/city/row", "@building/city/mid"]
floors = [3, 6]
density = 0.9

[[feature]]
id = "cathedral_close"
kind = "district"
where = "(dist('cathedral_square') < 190) & (sdist('city_room') < -30)"
pattern = "radial"
around = "cathedral_square"
block = 52.0
buildings = ["@building/city/row"]
floors = [3, 4]
density = 0.8

[[feature]]
id = "downtown"
kind = "district"
where = "dist('city_centre') + 40 * fbm(160, 2, seed=32) < 300"
pattern = "grid"
block = 92.0
buildings = ["@building/city/tower", "@building/city/mid"]
floors = [6, 45]
density = 1.0

[[feature]]
id = "harbour"               # the low ground toward the sea
kind = "district"
where = "(y < shore_y + 360) & (dist('city_centre') < 720) & (sdist('city_room') < -30)"
pattern = "grid"
block = 76.0
buildings = ["@building/city/shed"]
floors = [3, 4]
density = 0.7

[[feature]]
id = "suburbs"               # wherever else is built up at all; it thins with `urban`
kind = "district"
where = "f('urban') > 0.14"
pattern = "grid"
block = 46.0
buildings = ["@building/city/row"]
floors = [3, 4]

[[feature]]
id = "city_limits"           # nobody draws this: it is wherever a district is
kind = "guide"
where = "sdist('kind:district') < 8"

# ---- fields

[field.height]
unit = "m"
base = """
  where(inland > 0,
        0.6 + 0.02 * min(inland, 60) + 0.0016 * inland + 2.2 * smoothstep(40, 300, inland) * (0.5 + 0.5 * fbm(260, 3, seed=1)),
        -0.045 * min(-inland, 160) - 0.6)
  + 0.25 * fbm(30, 2, seed=2)
"""
[field.height.let]
inland = "y - shore_y + 50 * fbm(420, 3, seed=3)"

[field.water]
unit = "m"
base = "sea"

[field.clear]
base = 0.0

[field.forest]               # the plain's own copses; inside a place the place's own values are carried in
tags = ["vegetation"]
base = """
  smoothstep(0.15, 0.5, fbm(180, 3, seed=8))
  * smoothstep(2.0, 4.0, f('height'))
  * (1 - smoothstep(22, 32, slope('height')))
"""

[field.grass]
tags = ["vegetation"]
base = "smoothstep(1.0, 2.5, f('height')) * (1 - 0.7 * f('forest'))"

[field.ground]
type = "material"
layers = [
    { paint = "shore" },
    { paint = "grass", mask = "smoothstep(0.8, 1.8, f('height'))" },
    { paint = "meadow", mask = "smoothstep(1.2, 2.2, f('height')) * smoothstep(-0.1, 0.3, fbm(140, 3, seed=9))" },
    { paint = "forest", mask = "f('forest')" },
    { paint = "scree", mask = "smoothstep(24, 32, slope('height'))" },
    { paint = "rock", mask = "smoothstep(34, 44, slope('height'))" },
]

[[scatter]]
id = "copses"
spacing = 16.0
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 1 }]
scale = [0.9, 1.4]
seed = 1

