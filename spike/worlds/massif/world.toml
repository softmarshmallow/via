# Massif: a hillside whose shape is the user's own code, with the compiler's road and houses on it.
# A first pass at user code joining a build. Three steps: one makes the land before anything is
# compiled, one weathers it after the terrain layer, and one checks the finished build.

include = ["../../kinds/terrain.toml", "../../kinds/review.toml"]

[world]
name = "Massif"
extent = [0.0, 0.0, 384.0, 384.0]
resolution = 0.5
chunk = 64
seed = 23
pack = "../../packs/primitive.toml"

[export]
fields = ["water", "grass", "wet", "talus"]

[look]
sun_azimuth = 140.0
sun_elevation = 34.0
haze = 0.45
sky = "summer"

[[layer]]
id = "terrain"
file = "layers/terrain.toml"
[[layer]]
id = "dressing"
file = "layers/dressing.toml"

# ---- the user's code. `run` is a command, relative to this file; `python` is the compiler's own.

[[step]]                 # before anything is compiled: it is handed the frame and its parameters only
id = "massif"
at = "generate"
run = ["python", "tools/massif.py"]
[step.params]
cell = 2.0               # the land is eroded on a 2 m grid, then refined to the world's posts
relief = 70.0
erosion_rounds = 45

[[step]]                 # after the terrain layer: it is handed that layer's build, road and pads included
id = "weather"
at = "generate"
after = "terrain"
run = ["python", "tools/weather.py"]
[step.params]
repose_deg = 34.0
rounds = 60

[[step]]                 # on the finished build
id = "homes"
at = "lint"
run = ["python", "tools/homes_near_road.py"]
[step.params]
assets = ["house.small", "house.large", "barn"]
road_kind = "road"
max_m = 30.0
