# Terrain layer: written by hand over the land the `massif` step made.

[field.water]
unit = "m"
base = -100.0

[field.clear]
base = 0.0

[field.forest]
tags = ["vegetation"]
base = "smoothstep(0.25, 0.6, f('wet') + 0.2 * fbm(90, 3, seed=3)) * (1 - smoothstep(26, 34, slope('height')))"

[field.grass]
tags = ["vegetation"]
base = "(1 - smoothstep(26, 34, slope('height'))) * (1 - 0.7 * f('forest'))"

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(0.3, 0.55, f('wet'))" },
    { paint = "forest", mask = "0.8 * smoothstep(0.4, 0.8, f('forest'))" },
    { paint = "shore", mask = "1 - smoothstep(1.5, 5.0, dist('beck'))" },
    { paint = "scree", mask = "smoothstep(27, 34, slope('height'))" },
    { paint = "rock", mask = "smoothstep(35, 43, slope('height'))" },
]

# A lane up the stream's valley. Its line was drawn after looking at the land the step made.
[[feature]]
id = "lane"
kind = "road"
width = 3.0
grade = 14.0
max_grade = 18.0
path = [[330.0, -10.0], [292.0, 22.0], [266.0, 52.0], [270.0, 90.0], [280.0, 124.0], [264.0, 160.0], [242.0, 196.0]]

[[instance]]
id = "cottage_a"
asset = "house.small"
kind = "pad"
on = { feature = "lane", t = 0.42, offset = 13.0 }

[[instance]]
id = "cottage_b"
asset = "house.small"
kind = "pad"
on = { feature = "lane", t = 0.62, offset = -13.0 }

[[instance]]                # stands well off the lane, which this project's own lint objects to
id = "high_barn"
asset = "barn"
kind = "pad"
at = [150.0, 150.0]
