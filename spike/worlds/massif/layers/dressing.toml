# Dressing layer: above the `weather` step, so it can read the `talus` field that step wrote.

[[scatter]]
id = "woods"
spacing = 7.0
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 4 }, { id = "tree.conifer", weight = 2 }]
scale = [0.75, 1.3]
seed = 1

[[scatter]]
id = "fallen_rock"          # boulders lie where the weathering step says material came to rest
spacing = 5.0
density = "0.8 * smoothstep(0.15, 0.6, f('talus'))"
assets = [{ id = "rock.boulder", weight = 3 }, { id = "rock.large", weight = 1 }]
scale = [0.5, 1.4]
seed = 2

[[feature]]
id = "bm_lane"
kind = "bookmark"
on = { feature = "lane", t = 0.25 }
look = { feature = "lane", t = 0.5 }
eye = 1.8
note = "Up the lane to the cottages, on land made by the massif step."

[[feature]]
id = "bm_over"
kind = "bookmark"
on = { feature = "lane", t = 0.95, offset = 10.0 }
look = { feature = "lane", t = 0.45 }
eye = 6.0
note = "Down the valley from the head of the lane."
