# Relief: a world whose land and cover come from pictures the author already has.
# A picture becomes a field, and a field is used like any other: in an expression, by name.
# The pictures are made by `make_inputs.py`, so no artwork is committed.

include = ["../../kinds/terrain.toml", "../../kinds/review.toml"]

[world]
name = "Relief"
extent = [0.0, 0.0, 256.0, 256.0]
resolution = 0.5
chunk = 64
seed = 3
pack = "../../packs/primitive.toml"

[export]
fields = ["water", "grass"]

[look]
sun_azimuth = 150.0
sun_elevation = 36.0
haze = 0.4
sky = "summer"

# ---- pictures as fields

[field.survey]               # a 16-bit heightmap, 257 pixels across a world of 513 posts
file = "inputs/height16.png"
unit = "m"
range = [8.0, 74.0]          # what black and white stand for
filter = "cubic"

[field.woods]                # one channel of a painted mask
file = "inputs/cover.png"
channel = "r"

[field.stone]
file = "inputs/cover.png"
channel = "g"

[field.hollow]               # a small stamp, placed where it is wanted and nothing outside it
file = "inputs/hollow.png"
extent = [150.0, 60.0, 214.0, 124.0]
outside = 0.0

# ---- the world's own fields read them by name

[field.height]
unit = "m"
base = "f('survey') - 6.0 * f('hollow') + 0.25 * fbm(9, 3, seed=5)"

[field.water]
unit = "m"
base = -100.0

[field.clear]
base = 0.0

[field.forest]
tags = ["vegetation"]
base = "smoothstep(0.3, 0.7, f('woods')) * (1 - smoothstep(26, 34, slope('height')))"

[field.grass]
tags = ["vegetation"]
base = "(1 - smoothstep(26, 34, slope('height'))) * (1 - 0.7 * f('forest')) * (1 - f('stone'))"

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "forest", mask = "0.85 * smoothstep(0.3, 0.7, f('woods'))" },
    { paint = "scree", mask = "smoothstep(27, 34, slope('height'))" },
    { paint = "rock", mask = "max(f('stone'), smoothstep(35, 43, slope('height')))" },
    { paint = "shore", mask = "smoothstep(0.5, 0.9, f('hollow'))" },
]

# ---- and the compiler's own features sit on top, as on any land

[[feature]]
id = "tarn"
kind = "lake"
at = [182.0, 92.0]
flood = { field = "height", level = "spill", fence = 40.0, max_depth = 5.0, freeboard = 0.3 }

[[feature]]
id = "track"
kind = "road"
width = 2.6
max_grade = 20.0
path = [[-10.0, 40.0], [50.0, 58.0], [100.0, 66.0], [140.0, 110.0]]

[[instance]]
id = "bothy"
asset = "house.small"
kind = "pad"
on = { feature = "track", t = 0.55, offset = 12.0 }

[[scatter]]
id = "woods"
spacing = 6.5
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 2 }]
scale = [0.75, 1.3]
seed = 1

[[feature]]
id = "bm_track"
kind = "bookmark"
on = { feature = "track", t = 0.3 }
look = { feature = "track", t = 0.7 }
eye = 1.8
note = "Along the track, on land read from a 16-bit heightmap."
