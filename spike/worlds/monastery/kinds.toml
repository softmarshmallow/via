# This project's own kinds.

[kind.gorge]                 # a stream in a rock cut: a narrow bed, steep banks, a thread of water
reach = 22
[kind.gorge.defaults]
depth = 8.0
bed = 2.5                    # half width of the bed
bank = 9.0                   # run of each bank
flow = 0.25                  # depth of water in the bed, m
width = 5.0                  # what a bridge over it must clear
[kind.gorge.let]
taper = "smoothstep(0.0, 0.03, t)"      # the cut opens gradually below the tarn's lip
[[kind.gorge.effect]]
field = "height"
value = "v - depth * taper * (1 - smoothstep(bed, bed + bank, d))"
mask = "1 - smoothstep(bed + bank, bed + bank + 4, d)"
max_change = "depth + 0.5"
[[kind.gorge.effect]]
field = "water"
value = "f('height') + flow"
mask = "where(flow > 0, 1 - smoothstep(bed * 0.6, bed, d), 0)"
[[kind.gorge.effect]]
field = "ground"
paint = "rock"
mask = "taper * (1 - smoothstep(bed + bank * 0.6, bed + bank, d))"
[[kind.gorge.effect]]
field = "ground"
paint = "shore"
mask = "1 - smoothstep(bed * 0.6, bed + 1, d)"
[[kind.gorge.effect]]
field = "#vegetation"
value = 0.0
mask = "1 - smoothstep(bed + bank - 3, bed + bank + 2, d)"
[kind.gorge.map]
color = [0.30, 0.52, 0.82]
width = 2

[kind.stone_bridge]          # a narrow stone deck; the shared `bridge` is a concrete road bridge
deck = { surface = "stone", thickness = 0.9, parapet = 0.9, pier_every = 0.0 }
[kind.stone_bridge.defaults]
width = 4.0
rise = 0.8
clear = 3.0
max_grade = 12.0
[kind.stone_bridge.map]
color = [0.82, 0.80, 0.76]
width = 4

[kind.garden_terrace]        # a tilled strip levelled into the slope behind a low retaining lip
reach = 10
[kind.garden_terrace.defaults]
lip = 2.0
max_cut = 3.0
[[kind.garden_terrace.effect]]
field = "height"
value = "base"
mask = "1 - smoothstep(0, lip, d)"
max_change = "max_cut"
[[kind.garden_terrace.effect]]
field = "ground"
paint = "dry_grass"
mask = "1 - smoothstep(-0.5, 0.5, sd)"
[[kind.garden_terrace.effect]]
field = "#vegetation"
value = 0.0
mask = "1 - smoothstep(0, 4, d)"
[[kind.garden_terrace.effect]]
field = "crop"
value = 1.0
mask = "1 - smoothstep(-1.5, -0.5, sd)"
[kind.garden_terrace.map]
color = [0.78, 0.70, 0.40]
width = 1

[kind.flagged_walk]          # a line of flags across a court: paint only, the ground is left alone
authority = "anchored"
reach = 6
[kind.flagged_walk.defaults]
width = 2.4
[[kind.flagged_walk.effect]]
field = "ground"
paint = "path"
mask = "1 - smoothstep(width / 2 - 0.3, width / 2 + 0.3, d)"
[kind.flagged_walk.map]
color = [0.70, 0.60, 0.45]
width = 1
