# Compound layer: what is built. Everything stands by the court's outline or by a way.

[kind.pad.defaults]
skirt = 4.0

# ---- the wall: 49 pieces of 6 m from the gate's north jamb round to its south jamb
[[run]]
id = "wall"
on = "court"
from = 0.0
to = 0.98
count = 49
asset = "hedge"              # the pack has no solid wall; a hedge at scale 2 stands in (6 x 2 x 2.2 m)
scale = 2.0
role = "wall"

[[instance]]
id = "gatehouse"
asset = "college.gatehouse"  # not solid: a walker passes under it
on = { feature = "court", t = 0.99, offset = 0.0 }
face = "in"
scale = 0.6

# ---- inside
[[instance]]
id = "hall"                  # the main hall, against the west wall, looking east across the court
asset = "college.chapel"
on = { feature = "court", t = 0.48, offset = -12.0 }
face = "in"

[[instance]]
id = "bell_tower"            # the landmark
asset = "college.bell_tower"
on = { feature = "court", t = 0.17, offset = -9.0 }
face = "in"
scale = 1.5                  # 30 m: it must stand above the hall (22 m) to be the landmark

[[run]]
id = "cells"                 # a row of monks' cells along the south wall
on = "court"
from = 0.6667
to = 0.80
count = 8
offset = -7.5
face = "in"
asset = "town.house_low"
role = "cell"

[[feature]]
id = "court_walk"            # gate to hall door, wherever the hall stands
kind = "flagged_walk"
over = ["court"]
starts_at = "approach.end"
ends_at = "hall.door"

[set.well_court]
items = [
    { name = "well", asset = "town.well" },
    { name = "bench_a", asset = "bench.stone", offset = [3.2, 0.0], turn = 90.0 },
    { name = "bench_b", asset = "bench.stone", offset = [-3.2, 0.0], turn = 90.0 },
]
[[instance]]
id = "wellcourt"
set = "well_court"
on = { feature = "court_walk", t = 0.45, offset = -9.0 }

# ---- outside
[[run]]
id = "lamps"                 # along the last stretch
on = "approach"
from = 0.05
to = 0.95
count = 4
offset = -3.0
asset = "lamp"

[[instance]]
id = "hut_a"
asset = "house.small"
kind = "pad"
on = { feature = "road_up", t = 0.31, offset = 11.0 }
role = "pilgrim_hut"

[[instance]]
id = "hut_b"
asset = "house.small"
kind = "pad"
on = { feature = "road_up", t = 0.49, offset = -11.0 }
role = "pilgrim_hut"

[[instance]]
id = "hut_c"
asset = "house.small"
kind = "pad"
on = { feature = "road_up", t = 0.665, offset = 11.0 }
role = "pilgrim_hut"

[[instance]]
id = "chockstone"            # a boulder jammed in the tarn's outflow lip: without it the lip is a ford round the bridge
asset = "rock.large"
on = { feature = "stream", t = 0.0 }
scale = 1.6
