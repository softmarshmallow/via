# Land layer: the ground, the water, the ways, the court.

[[feature]]
id = "stream_line"           # the valley axis the base height measures from; no effect of its own
kind = "guide"
path = [[190.0, 330.0], [192.0, 218.0], [198.0, 150.0], [204.0, 80.0], [200.0, -10.0]]

[[feature]]
id = "tarn_site"
kind = "guide"
on = { feature = "stream_line", t = 0.25 }

[[feature]]
id = "tarn"                  # a flood needs a typed `at` (VOCABULARY: "Needs `at`; fails with `on`")
kind = "lake"
at = [191.0, 245.0]
flood = { field = "height", level = "spill", fence = 44.0, max_depth = 4.0, freeboard = 0.3 }

[[feature]]
id = "stream"                # this project's own kind: the gorge
kind = "gorge"
path = [[192.0, 233.0], [198.0, 150.0], [204.0, 80.0], [200.0, -10.0]]

# ---- the court: a levelled terrace. Its outline starts at the gate's north jamb, so the gate gap is
# the last 6 m of the outline (t 0.98 .. 1.0) and every wall piece ends on a corner.
[[feature]]
id = "court"
kind = "terrace"
max_cut = 10.0             # on purpose: 60 m of court across a 12 degree slope
bank = 5.0
region = [[145.0, 196.0], [145.0, 220.0], [55.0, 220.0], [55.0, 160.0], [145.0, 160.0], [145.0, 190.0]]

# ---- ways
[[feature]]
id = "bridge"
kind = "stone_bridge"
over = ["stream"]
path = [[217.0, 195.0], [175.0, 193.0]]

[[feature]]
id = "road_up"               # enters the map at the south-east and climbs in switchbacks
kind = "road"
width = 4.0
shoulder = 5.0
max_grade = 16.0
grade = 45.0
ends_at = "bridge.start"
path = [[326.0, 26.0], [244.0, 52.0], [304.0, 72.0], [240.0, 116.0], [300.0, 146.0]]

[[feature]]
id = "approach"              # the last stretch, bridge to gate
kind = "road"
width = 4.0
shoulder = 4.0
starts_at = "bridge.end"
path = [[146.0, 193.0]]

[[feature]]
id = "road_entry"            # where the road enters the map
kind = "guide"
on = { feature = "road_up", t = 0.03 }

[[feature]]
id = "bridge_foot_east"
kind = "guide"
on = { feature = "road_up", t = 0.99 }

[[feature]]
id = "bridge_foot_west"
kind = "guide"
on = { feature = "approach", t = 0.05 }
