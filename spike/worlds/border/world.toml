# Border: a college and the wild, built apart, meeting by ground. This file says where each stands and
# what the bare ground between them is. Everything about the meeting itself is in layers/join.toml,
# which has its own owner.
#
#   ../college/world.toml    the built place, unchanged
#   wild/world.toml          the wild, built apart; it keeps a corner clear and knows only its outline
#   layers/join.toml         the ridge, its two openings, the walks through them, the growth across
#   changes/move_college.toml   the college moved 30 m; nothing in the join is edited
#
#   uv run python -m worldc worlds/border/world.toml --lint reach
#   uv run python -m worldc worlds/border/world.toml --lint reach --overlay worlds/border/changes/move_college.toml --out border_moved

include = ["../../kinds/terrain.toml", "../../kinds/review.toml"]

[world]
name = "Border"
extent = [0.0, 0.0, 560.0, 560.0]
resolution = 1.0
chunk = 64
seed = 31
pack = "../../packs/primitive.toml"

[look]
sun_azimuth = 200.0
sun_elevation = 38.0
haze = 0.4

# ---- the two maps. Making their ground agree where they meet is this project's job, done by hand:
# both were built to the same slope (the master's `height` below), and each is taken at a stated lift.
[[part]]
id = "wild"
file = "wild/world.toml"
at = [0.0, 0.0]
footprint = [[0.0, 0.0], [560.0, 0.0], [560.0, 230.0], [250.0, 230.0], [250.0, 560.0], [0.0, 560.0]]   # an L: all but the kept corner
apron = 24.0
lift = 0.0
max_step = 40.0              # raised on purpose: four of its six sides are the world's edge, where nothing meets it

[[part]]
id = "college"
file = "../college/world.toml"
at = [250.0, 270.0]
footprint = [40.0, 0.0, 280.0, 266.0]
apron = 24.0
lift = 10.0

[[layer]]
id = "join"
file = "layers/join.toml"
after = "parts"              # it is laid on the joined ground, so neither map blends it away

# ---- the bare ground of the corner: the slope both maps were built to
[field.height]
unit = "m"
base = "11.5 + 0.068 * (y - 270) + 0.012 * (x - 410) + 0.4 * fbm(40, 3, seed=2)"

[field.clear]
base = 0.0

[field.trees]                # carried in from both maps where they have it; in between, see the join layer
tags = ["vegetation"]
base = "f('fringe')"

[field.grass]
tags = ["vegetation"]
base = 1.0

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.1, 0.3, fbm(50, 3, seed=7))" },
]

[[feature]]
id = "bm_over"
kind = "bookmark"
at = [70.0, 40.0]
look = [330.0, 320.0]
eye = 190.0
note = "Both maps and the ridge between them."
