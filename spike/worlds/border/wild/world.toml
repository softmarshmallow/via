# The wild: hills, a beck and woods, built and checked by itself. It keeps a corner clear for a place
# that someone else builds; all it knows of that place is the outline `meet` and the slope the ground
# has there. Its two trails end short of that corner, for whoever joins them.
#
#   uv run python -m worldc worlds/border/wild/world.toml

include = ["../../../kinds/terrain.toml", "../../../kinds/review.toml"]

[world]
name = "The wild"
extent = [0.0, 0.0, 560.0, 560.0]
resolution = 1.0
chunk = 64
seed = 23
pack = "../../../packs/primitive.toml"

[kind.road.defaults]
width = 2.4
grade = 40.0
max_grade = 30.0

[kind.beck]                  # a stream bed cut along a path
reach = 14
[kind.beck.defaults]
depth = 1.8
bed = 2.0
bank = 6.0
[[kind.beck.effect]]
field = "height"
value = "v - depth * (1 - smoothstep(bed, bed + bank, d))"
mask = "1 - smoothstep(bed + bank, bed + bank + 4, d)"
[[kind.beck.effect]]
field = "ground"
paint = "shore"
mask = "1 - smoothstep(bed * 0.6, bed + 1.5, d)"
[[kind.beck.effect]]
field = "#vegetation"
value = 0.0
mask = "1 - smoothstep(bed, bed + 3, d)"

# ---- the ground: near the corner it is the agreed slope; away from it, this map's own hills
[field.height]
unit = "m"
base = "max(agreed, 5.0) + away * (9 + 15 * fbm(170, 4, seed=1)) + 0.5 * fbm(22, 3, seed=2) * smoothstep(0, 30, dist('meet'))"
[field.height.let]
agreed = "11.5 + 0.068 * (y - 270) + 0.012 * (x - 410)"
away = "smoothstep(20, 180, dist('meet'))"

[field.clear]
base = 0.0

[field.trees]                # woods on the damp, gentle ground; thinner towards the corner
tags = ["vegetation"]
base = """
  smoothstep(-0.2, 0.25, fbm(90, 3, seed=5) + 0.5 * (1 - smoothstep(10, 70, dist('beck'))))
  * (1 - smoothstep(22, 30, slope('height')))
  * (0.35 + 0.65 * smoothstep(0, 120, dist('meet')))
"""

[field.grass]
tags = ["vegetation"]
base = "1 - 0.6 * f('trees')"

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.1, 0.25, fbm(60, 3, seed=7)) * (1 - f('trees'))" },
    { paint = "forest", mask = "0.9 * smoothstep(0.3, 0.75, f('trees'))" },
]

# ---- features
[[feature]]
id = "meet"                  # the corner kept for the other map; nothing of ours is drawn from inside it
kind = "guide"
region = [[250.0, 230.0], [560.0, 230.0], [560.0, 560.0], [250.0, 560.0]]

[[feature]]
id = "beck"
kind = "beck"
path = [[20.0, 570.0], [90.0, 430.0], [140.0, 300.0], [200.0, 170.0], [330.0, 110.0], [470.0, 60.0], [570.0, 30.0]]

[[feature]]
id = "south_trail"           # up from the ford towards the corner's south side
kind = "road"
path = [[372.0, 20.0], [396.0, 110.0], [410.0, 202.0]]

[[feature]]
id = "west_trail"            # in from the west towards the corner's west side
kind = "road"
path = [[20.0, 250.0], [120.0, 286.0], [222.0, 322.0]]

[[feature]]
id = "ford"
kind = "poi"
name = "The ford"
on = { feature = "south_trail", t = 0.3 }

[[feature]]
id = "far_wood"
kind = "poi"
name = "The far wood"
at = [70.0, 470.0]

# ---- growth, by cause
[[scatter]]
id = "woods"                 # trees gather: each kept one is the middle of a group
spacing = 13.0
density = "f('trees')"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 2 }, { id = "tree.great", weight = 0.4 }]
scale = [0.9, 1.35]
clump = { size = [2, 5], radius = 6.5, shrink = 0.4 }
seed = 1

[[scatter]]
id = "brush"                 # under and beside the trees, and on the beck's banks; none in the open
spacing = 4.0
density = """
  0.5 * around('woods', 5.0) * smoothstep(0.1, 0.5, fbm(18, 2, seed=31))
  + 0.5 * smoothstep(3, 5, dist('beck')) * (1 - smoothstep(7, 11, dist('beck')))
"""
assets = [{ id = "bush" }]
scale = [0.6, 1.3]
clump = { size = [0, 2], radius = 1.6, shrink = 0.3 }
seed = 2

[[scatter]]
id = "stones"                # in the beck and on its banks
spacing = 4.0
density = "0.6 * (1 - smoothstep(1.5, 7, dist('beck'))) * smoothstep(0.2, 0.7, fbm(9, 2, seed=41))"
assets = [{ id = "rock.boulder", weight = 2 }, { id = "rock.large", weight = 1 }]
scale = [0.4, 1.3]
seed = 3

[[feature]]
id = "bm_wild"
kind = "bookmark"
at = [30.0, 30.0]
look = [220.0, 260.0]
eye = 110.0
note = "The wild by itself, the kept corner beyond."

[profile.on_foot]
max_slope_deg = 30.0
max_wade_m = 0.3

[[expect]]
from = "ford"
to = ["far_wood"]
by = "on_foot"
why = "the wild is one walk"
