# The join: everything about where the college meets the wild, and nothing else. Its owner edits
# neither map. It names their places and edges, so it follows when either one moves.

[kind.ridge]                 # a bank too steep to walk: a crest, and a flank falling away on each side
reach = 16
[kind.ridge.defaults]
rise = 7.0
crest = 2.5
flank = 6.0
[[kind.ridge.effect]]
field = "height"
value = "v + rise * (0.85 + 0.15 * fbm(14, 2, seed=9)) * (1 - smoothstep(crest, crest + flank, d))"
mask = "1 - smoothstep(crest + flank, crest + flank + 3, d)"
[[kind.ridge.effect]]
field = "ground"
paint = "rock"
mask = "1 - smoothstep(crest + 1, crest + flank, d)"
[[kind.ridge.effect]]
field = "#vegetation"
value = 0.0
mask = "1 - smoothstep(crest, crest + flank + 2, d)"
[kind.ridge.map]
color = [0.35, 0.33, 0.30]
width = 3

# ---- the funnel: a ridge along the two sides of the wild that face the college, open where the walks pass
[[feature]]
id = "ridge"
kind = "ridge"
path = ["wild.edge.2", "wild.edge.3"]     # the kept corner's south side, then its west side
outset = 14.0                             # metres outside the wild's edge, on the corner's bare ground
open_at = ["south_walk", "west_walk"]
gap = 26.0

[[feature]]
id = "south_walk"            # from where the college's approach begins to where the wild's trail ends
kind = "road"
width = 3.0
starts_at = "college.approach.start"
ends_at = "wild.south_trail.end"

[[feature]]
id = "west_walk"             # from the dormitory lane to the wild's west trail
kind = "road"
width = 2.4
starts_at = "college.bm_lane.at"
ends_at = "wild.west_trail.end"

# ---- growth across the join. The wild's own trees stop at its edge and the college plants none
# outside its courts; this is the wood thinning out over the bare ground towards the college.
[field.fringe]
base = """
  (1 - smoothstep(0, 70, outside('wild'))) * (0.3 + 0.7 * smoothstep(-0.2, 0.3, fbm(45, 3, seed=4)))
  * (1 - 0.8 * inside('college'))
"""

[[scatter]]
id = "fringe_trees"          # the wild's own mix and spacing, so its edge does not show
spacing = 13.0
density = "f('trees') * where(inside('wild') > 0, 0, 1) * where(inside('college') > 0.6, 0, 1)"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 2 }]
scale = [0.8, 1.25]
clump = { size = [1, 4], radius = 6.0, shrink = 0.4 }
seed = 11

[[scatter]]
id = "fringe_brush"          # under those trees, and creeping a little way into the college's lawns
spacing = 4.0
density = "0.5 * around('fringe_trees', 5.0) + 0.25 * (1 - smoothstep(0, 30, outside('wild'))) * where(inside('wild') > 0, 0, 1)"
assets = [{ id = "bush" }]
scale = [0.6, 1.2]
seed = 12

# ---- the views a reviewer needs
[[feature]]
id = "bm_south_gate"
kind = "bookmark"
on = { feature = "south_walk", t = 0.02 }
look = { feature = "south_walk", t = 0.9 }
eye = 2.0
note = "Leaving the college by the south opening."

[[feature]]
id = "bm_west_gate"
kind = "bookmark"
on = { feature = "west_walk", t = 0.98 }
look = { feature = "west_walk", t = 0.2 }
eye = 2.0
note = "Coming in from the wild by the west opening."

[[feature]]
id = "bm_ridge"
kind = "bookmark"
on = { feature = "south_walk", t = 0.6 }
look = { feature = "west_walk", t = 0.6 }
eye = 40.0
note = "Along the ridge from above the south opening."

# ---- what must stay true of the funnel
[[expect]]
from = "college.arrival"
to = ["wild.ford", "wild.far_wood"]
by = "on_foot"
why = "the wild is reached from the college"

[[expect]]
from = "college.arrival"
to = ["wild.ford", "wild.far_wood"]
by = "on_foot"
closed = ["ridge.gap.0", "ridge.gap.1"]
reach = false
why = "with both openings shut there is no way out: every route passes one of them"

[[expect]]
from = "college.arrival"
to = ["wild.far_wood"]
by = "on_foot"
closed = ["ridge.gap.0"]
why = "either opening alone is enough"
