# A trial, kept to show what a hand edit can and cannot reach in a generated city.
#   uv run python -m worldc worlds/city/world.toml --overlay worlds/city/changes/hand_edits.toml --out city_edits
[[clear]]                    # empty one lot the lot tool filled
at = [1032.5, 102.4]
radius = 20.0

[[pin]]                      # stand a well where that building was
id = "kiosk"
asset = "town.well"
at = [1032.5, 102.4]

[[override]]                 # the same lot, by the id the tool happened to give it
id = "lots_979.0"
remove = true

[[instance]]                 # something placed on a street the tool made, by the name it happened to get
id = "kiosk_on_street"
asset = "town.well"
on = { feature = "st_40", t = 0.5, offset = 7.0 }
