# Arterials layer: the lines drawn by hand. Freeways, the arterials, and labels for the districts
# and interchanges. Local streets, bridges and ramps are not here: the road step works them out.
#
# The city's edge is the city's business, and where that edge runs is whoever places the city's to say:
# see `[given.limits]` and `[given.urban]` in world.toml. Nothing local is drawn here beyond the limits.
# Built alone, the limits are the whole map and the road step closes it with a ring street 50 m inside
# the boundary. The few ways that do leave carry on to the boundary, and each is declared at the foot
# of this file as an exit: a promise to whoever places this city in a larger map.

[[feature]]
id = "west_ave"
kind = "street"
width = 13.0
sidewalk = 4.0
arterial = 1
path = [[330.0, 50.0], [330.0, 1550.0]]

[[feature]]
id = "grand_ave"
kind = "street"
width = 13.0
sidewalk = 4.0
arterial = 1
path = [[700.0, 50.0], [700.0, 700.0], [720.0, 1000.0], [760.0, 1610.0]]      # leaves to the north

[[feature]]
id = "east_ave"
kind = "street"
width = 13.0
sidewalk = 4.0
arterial = 1
path = [[1320.0, 50.0], [1320.0, 700.0], [1338.7, 1550.0]]

[[feature]]
id = "harbor_blvd"
kind = "street"
width = 13.0
sidewalk = 4.0
arterial = 1
path = [[50.0, 420.0], [700.0, 420.0], [1000.0, 440.0], [1610.0, 470.0]]      # leaves to the east

[[feature]]
id = "central_ave"
kind = "street"
width = 13.0
sidewalk = 4.0
arterial = 1
path = [[-10.0, 800.0], [700.0, 800.0], [960.0, 790.0], [1610.0, 820.0]]      # leaves both ways

[[feature]]
id = "north_blvd"
kind = "street"
width = 13.0
sidewalk = 4.0
arterial = 1
path = [[50.0, 1250.0], [760.0, 1250.0], [1150.0, 1290.0], [1610.0, 1300.0]]      # leaves to the east

[[feature]]
id = "river_drive"
kind = "street"
width = 13.0
sidewalk = 4.0
arterial = 1
path = [[1164.0, 1550.0], [1118.0, 1300.0], [1040.0, 1050.0], [980.0, 800.0], [960.0, 500.0], [900.0, 250.0], [884.6, 50.0]]

[[feature]]
id = "old_road"
kind = "street"
width = 13.0
sidewalk = 4.0
arterial = 1
path = [[330.0, 420.0], [700.0, 800.0], [1040.0, 1050.0]]

# ---- freeways: on a viaduct through the city. The crosstown leaves the map both ways; the harbour
# freeway comes down to the ring street at the docks and ends there.
[[feature]]
id = "crosstown"
kind = "freeway"
width = 20.0
rise = 8.5
ramp = 115.0
over = ["west_ave", "grand_ave", "east_ave", "river_drive", "old_road", "river"]
path = [[-10.0, 1010.0], [200.0, 1000.0], [900.0, 1000.0], [1000.0, 960.0], [1090.0, 860.0], [1180.0, 760.0], [1300.0, 680.0], [1610.0, 600.0]]

[[feature]]
id = "harbor_fwy"           # leaves the crosstown at a T and runs south
kind = "freeway"
width = 16.0
from_on = "crosstown"
rise = 0.0
settle = 140.0          # it holds the crosstown's height and comes down to the ground only at its end
over = ["central_ave", "harbor_blvd"]
path = [[500.0, 1000.0], [500.0, 900.0], [500.0, 200.0], [500.0, 50.0]]

[[feature]]
id = "connector_west"       # the two curves of the T
kind = "ramp"
from_on = "crosstown"
to_on = "harbor_fwy"
path = [[410.0, 988.0], [452.0, 985.0], [484.0, 962.0], [489.0, 910.0]]

[[feature]]
id = "connector_east"
kind = "ramp"
from_on = "crosstown"
to_on = "harbor_fwy"
path = [[590.0, 988.0], [548.0, 985.0], [516.0, 962.0], [511.0, 910.0]]

# ---- interchanges: a point, and which two ways meet there. `loop` names a quadrant to give a loop ramp.
[[feature]]
id = "ix_grand"
kind = "interchange"
at = [712.0, 1000.0]
freeway = "crosstown"
cross = "grand_ave"

[[feature]]
id = "ix_east"
kind = "interchange"
at = [1322.0, 672.0]
freeway = "crosstown"
cross = "east_ave"
loop = [1, 1]

[[feature]]
id = "ix_central"
kind = "interchange"
at = [500.0, 800.0]
freeway = "harbor_fwy"
cross = "central_ave"

[[feature]]
id = "ix_harbor"
kind = "interchange"
at = [500.0, 420.0]
freeway = "harbor_fwy"
cross = "harbor_blvd"
loop = [-1, 1]

# ---- parks: a point inside a face between main ways makes that face a park
[[feature]]
id = "hill_park"
kind = "seed"
at = [1470.0, 1460.0]
zone = "park"

[[feature]]
id = "riverside"
kind = "seed"
at = [1180.0, 620.0]
zone = "park"

[[feature]]
id = "fair"
kind = "seed"
at = [600.0, 1420.0]
zone = "park"

[[feature]]
id = "bank_mid"
kind = "seed"
at = [990.0, 614.0]
zone = "park"

[[feature]]
id = "bank_north"
kind = "seed"
at = [1059.0, 1040.0]
zone = "park"

[[feature]]
id = "bank_top"
kind = "seed"
at = [1168.0, 1443.0]
zone = "park"


# ---- exits: where the city's ways leave it. Each stands on the end of its way. Alone, the city
# builds without them meaning anything; placed in a larger map, that map must answer every one.
[[feature]]
id = "harbor_road_east"
kind = "exit"
on = { feature = "harbor_blvd", t = 1.0 }
class = "arterial"
width = 13.0

[[feature]]
id = "central_road_east"
kind = "exit"
on = { feature = "central_ave", t = 1.0 }
class = "arterial"
width = 13.0

[[feature]]
id = "central_road_west"
kind = "exit"
on = { feature = "central_ave", t = 0.0 }
class = "arterial"
width = 13.0

[[feature]]
id = "north_road_east"
kind = "exit"
on = { feature = "north_blvd", t = 1.0 }
class = "arterial"
width = 13.0

[[feature]]
id = "grand_road_north"
kind = "exit"
on = { feature = "grand_ave", t = 1.0 }
class = "arterial"
width = 13.0

[[feature]]
id = "motorway_west"
kind = "exit"
on = { feature = "crosstown", t = 0.0 }
class = "motorway"
width = 20.0

[[feature]]
id = "motorway_east"
kind = "exit"
on = { feature = "crosstown", t = 1.0 }
class = "motorway"
width = 20.0

[[feature]]
id = "river_in"              # the river is a region, so its two exits are plain points just past the boundary
kind = "exit"
at = [1262.0, 1610.0]
class = "river"
width = 70.0

[[feature]]
id = "river_out"
kind = "exit"
at = [958.0, -10.0]
class = "river"
width = 70.0
