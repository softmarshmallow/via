# B, the far island: one island, built and checked by itself. It knows nothing of the strait it will stand in.
#
#   uv run python -m worldc worlds/strait/b/world.toml

include = ["../../../kinds/terrain.toml", "../../../kinds/review.toml"]

[world]
name = "B, the far island"
extent = [0.0, 0.0, 224.0, 224.0]
resolution = 1.0
chunk = 64
seed = 47
pack = "../../../packs/primitive.toml"

[params]
sea = 0.0

[field.height]
unit = "m"
base = """
  where(inland > 0,
        0.5 + 0.09 * min(inland, 30) + 6 * smoothstep(22, 70, inland) + 1.5 * fbm(40, 3, seed=2) * smoothstep(10, 40, inland),
        -0.22 * min(-inland, 25))
"""
[field.height.let]
inland = "-sdist('isle') + 6 * fbm(50, 2, seed=1)"

[field.water]
unit = "m"
base = "sea"

[field.clear]
base = 0.0

[field.forest]
tags = ["vegetation"]
base = "smoothstep(0.0, 0.3, fbm(60, 3, seed=5)) * smoothstep(3, 6, f('height')) * (1 - smoothstep(24, 32, slope('height')))"

[field.ground]
type = "material"
layers = [
    { paint = "grass" },
    { paint = "meadow", mask = "smoothstep(-0.1, 0.25, fbm(50, 3, seed=7))" },
    { paint = "sand", mask = "1 - smoothstep(1.2, 2.4, f('height') - f('water'))" },
    { paint = "rock", mask = "smoothstep(30, 38, slope('height'))" },
]

[[feature]]
id = "isle"
kind = "guide"
ellipse = { center = [112.0, 108.0], size = [170.0, 150.0] }

[[feature]]
id = "landing"               # the master's bridge ends wherever this road begins
kind = "road"
width = 5.0
path = [[30.0, 104.0], [90.0, 108.0], [150.0, 120.0]]

[[instance]]
id = "farm"
asset = "barn"
kind = "pad"
on = { feature = "landing", t = 0.55, offset = 13.0 }

[[instance]]
id = "cottage"
asset = "town.house_low"
kind = "pad"
on = { feature = "landing", t = 0.8, offset = -11.0 }

[[feature]]
id = "beacon"                # a place the master may name: b.beacon.at
kind = "poi"
name = "The Beacon"
at = [150.0, 150.0]


[[scatter]]
id = "woods"
spacing = 7.0
density = "f('forest')"
assets = [{ id = "tree.broadleaf", weight = 3 }, { id = "tree.conifer", weight = 1 }]
scale = [0.8, 1.3]
