# The starter pack with two assets revised: a copy of lib/packs/starter.toml whose root is the
# shipped models, accepted as it was (starter_revised.facts.toml, by `via pack accept`), then
# edited below, so a build with changes/revised.toml reports `asset.revised` for each and names
# every instance it affects (assets.md 4.2).

root = "../../../lib/packs/starter"

[taxon."building/house"]
[taxon."building/shed"]
[taxon."building"]
defaults = { collision = "box", max_relief = 0.6 }

[taxon."plant/tree"]
defaults = { collision = "hull" }

[taxon."plant/bush"]
[taxon."plant/fern"]
[taxon."plant"]
defaults = { solidity = "none" }

[taxon."rock"]
defaults = { collision = "hull" }

[taxon."prop/box"]
[taxon."prop/lamp"]
[taxon."prop/fence"]
[taxon."prop"]
defaults = { collision = "box" }

[asset.house_low]
file      = "house_low.glb"
taxon     = "building/house"
footprint = [[-4.6, -3.6], [4.6, -3.6], [4.6, 3.6], [-4.6, 3.6]]   # REVISED: the walls with the new porch and eaves

[asset.house_low.mount.door]
at = [0, 3]

[asset.house_wide]
file      = "house_wide.glb"
taxon     = "building/house"
footprint = [[-5.5, -3.5], [5.5, -3.5], [5.5, 3.5], [-5.5, 3.5]]

[asset.house_wide.mount.door]
at = [0, 3.5]

[asset.shed_gable]
file  = "shed_gable.glb"
taxon = "building/shed"

[asset.tree_oak]
file      = "tree_oak.glb"
detail    = ["tree_oak_low.glb"]
taxon     = "plant/tree"
solidity  = "solid"
footprint = [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]]   # the trunk, not the crown

[asset.tree_oak_large]
file      = "tree_oak_large.glb"
taxon     = "plant/tree"
solidity  = "solid"
footprint = [[-0.6, -0.6], [0.6, -0.6], [0.6, 0.6], [-0.6, 0.6]]
tags      = ["landmark"]

[asset.tree_pine]
file      = "tree_pine.glb"
taxon     = "plant/tree"
solidity  = "solid"
footprint = [[-0.9, -0.9], [0.9, -0.9], [0.9, 0.9], [-0.9, 0.9]]   # REVISED: the trunk and its root flare
tags      = ["winter"]

[asset.bush_round]
file  = "bush_round.glb"
taxon = "plant/bush"

[asset.bush_wide]
file  = "bush_wide.glb"
taxon = "plant/bush"

[asset.fern_low]
file  = "fern_low.glb"
taxon = "plant/fern"

[asset.rock_a]
file  = "rock_a.glb"
taxon = "rock"

[asset.rock_b]
file  = "rock_b.glb"
taxon = "rock"

[asset.box_small]
file  = "box_small.glb"
taxon = "prop/box"

[asset.lamp_post]
file  = "lamp_post.glb"
taxon = "prop/lamp"

[asset.fence_post]
file  = "fence_post.glb"
taxon = "prop/fence"

[material.grass]
colour = [0.2, 0.4, 0.1]

[material.rock]
colour = [0.45, 0.43, 0.4]

# The starter pack's paints that lib/land/ground.md's shore, shingle and track rows use.
[material.gravel]
colour = [0.36, 0.33, 0.28]

[material.earth]
colour = [0.3, 0.22, 0.14]
