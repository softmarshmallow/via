# What a college build must measure (docs/plan.md, M5; challenges 20 and 48; R13, R15). Measures,
# never bytes (R15): each row names a measure of measure.py and the band it falls in. Taken by
#
#   python3 examples/college/measure.py BUILD                       # base
#   python3 examples/college/measure.py BUILD+<c> --base BUILD      # a change, built with --against
#   python3.11 examples/college/measure.py BUILD+<c> --base BUILD --check <c>    # 3.11+, tomllib
#
# Protocol: Apple M4 Pro, macOS arm64, a `via` release binary built 2026-11-16 from the rewrite
# branch's working tree (after 0e57aae, with the M5 slice 1 core, spec and lib/building changes of
# that hour uncommitted, and this slice's step-view meetings columns and `surface.unmet` hint),
# VIA_LIB=lib, Python 3.12 (sdk/python/.venv) for the steps, one fresh store, base built cold on it,
# each change with --against base, default threads, a machine shared with other builds. One build
# each, so a band is the measured number, widened only where the row says why.

# ------------------------------------------------------------------------------------------ base

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]                             # the gatehouse astride the approach (keep_out) and the wing bay's pitch
measure = "warnings"
band    = [2, 2]

[base.keep_out]                             # the gatehouse stands on the approach's verge: rules.md 8.3 reads no `passable`
measure = "place.keep_out"
band    = [1, 1]

[base.doors]                                # lodge, pavilion, chapel, armoury, hall: an `entry` mount with connector `foot`
measure = "doors"
band    = [5, 5]

[base.doors_met]                            # each the end of its walk, gap 0, connectors equal
measure = "doors_met"
band    = [5, 5]

[base.unmet]
measure = "surface.unmet"
band    = [0, 0]

[base.connector]
measure = "surface.connector"
band    = [0, 0]

[base.door_gap]                             # mm
measure = "door_gap_max"
band    = [0, 0]

[base.door_turn]                            # degrees: the pavilion's walk comes in 36.5 off square, the rest square
measure = "door_turn_max"
band    = [36, 37]

[base.turn_lint]                            # lib/building's check: no turn over its 45 degrees
measure = "step.check.turn"
band    = [0, 0]

[base.walk_end]                             # mm between each walk's end and its door as the pack and the instance put it
measure = "walk_end_off"
band    = [0, 0]

[base.walk_rise]                            # m: the chapel's door 0.58 m below the court its walk leaves (its pad's mean)
measure = "walk_rise_max"
band    = [0, 0.6]

[base.reach]                                # 4 places and 5 doors from the arrival
measure = "reach_held"
band    = [9, 9]

[base.reach_pairs]
measure = "reach_pairs"
band    = [9, 9]

[base.door_views]                           # a view at every door
measure = "door_views"
band    = [5, 5]

[base.kit_joints]                           # 6 runs: 9 + 8 + 7 cloister, 8 wing, 9 + 5 dormitory bays; 40 joints
measure = "kit_joints"
band    = [40, 40]

[base.kit_gap]                              # mm: every line a whole number of pitches, so no joint gapes
measure = "kit_gap_max"
band    = [0, 0]

[base.kit_overlap]                          # mm: only the wing's, 0.44 m at each of its 7 joints
measure = "kit_overlap_max"
band    = [440, 440]

[base.kit_overlap_wing]
measure = "kit_overlap_wing"
band    = [440, 440]

[base.kit_pitch_lint]                       # lib/building's check names the wing bay
measure = "step.check.kit_pitch"
band    = [1, 1]

[base.overlap]
measure = "place.overlap"
band    = [0, 0]

[base.crowded]                              # the three cloister runs meet at their corners without overlapping
measure = "place.crowded"
band    = [0, 0]

# ------------------------------------------------------------------------------------------ move_and_turn

[move_and_turn.errors]
measure = "errors"
band    = [0, 0]

[move_and_turn.warnings]
measure = "warnings"
band    = [2, 2]

[move_and_turn.doors_met]
measure = "doors_met"
band    = [5, 5]

[move_and_turn.unmet]
measure = "surface.unmet"
band    = [0, 0]

[move_and_turn.walk_end]                    # the walk ends at the moved and turned door, to the millimetre
measure = "walk_end_off"
band    = [0, 0]

[move_and_turn.door_turn]                   # turned to face the walk's start: every walk now square
measure = "door_turn_max"
band    = [0, 0]

[move_and_turn.moved]                       # the pavilion alone
measure = "instances_moved"
band    = [1, 1]

[move_and_turn.moved_hand]
measure = "moved_hand"
band    = [0, 0]

[move_and_turn.added]
measure = "instances_added"
band    = [0, 0]

[move_and_turn.removed]
measure = "instances_removed"
band    = [0, 0]

[move_and_turn.features_moved]              # its walk alone
measure = "features_moved"
band    = [1, 1]

[move_and_turn.features_moved_other]
measure = "features_moved_other"
band    = [0, 0]

[move_and_turn.meets_kept]                  # 19 of 20 meetings as they were; the pavilion's door is the one changed
measure = "meets_kept"
band    = [19, 19]

[move_and_turn.reach]
measure = "reach_held"
band    = [9, 9]

# ------------------------------------------------------------------------------------------ no_walk

[no_walk.errors]                            # a forgotten walk is a warning: the build goes on
measure = "errors"
band    = [0, 0]

[no_walk.unmet]                             # on the chapel, naming chapel.entry and connector foot
measure = "surface.unmet"
band    = [1, 1]

[no_walk.unmet_hint]                        # the hint holds the line to write: ends_at = "chapel.entry"
measure = "unmet_hint_writes"
band    = [1, 1]

[no_walk.doors_met]
measure = "doors_met"
band    = [4, 4]

[no_walk.moved]                             # nothing else moved
measure = "instances_moved"
band    = [0, 0]

[no_walk.features_moved]
measure = "features_moved"
band    = [0, 0]

[no_walk.meets_kept]                        # the chapel walk's two meetings gone, the other 18 as they were
measure = "meets_kept"
band    = [18, 18]
