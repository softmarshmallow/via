# What a realm build measures (docs/plan-kits.md, K11: the fantasy map). Our own design and our own
# names. Measures, never bytes (R15): each row names a measure of `measure.py` and the band it must
# fall in. Taken by
#
#   python3 examples/realm/measure.py BUILD --world examples/realm/world.toml --run BUILD.run.json   # base
#   python3 examples/realm/measure.py BUILD+<c> --base BUILD --run BUILD+<c>.run.json            # a change, built with --against
#   python3 examples/realm/measure.py WARM --base BUILD --run WARM.run.json                       # the base again, unchanged, on its store
#   python3.11 examples/realm/measure.py ... --check <section>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the tree at 8c9ba2c (no
# engine change since), VIA_LIB=lib, Python 3.12 (sdk/python/.venv) for the steps, lib/building
# of the working tree with K11's mends (a plot under a building or a court, lay.py rule 19 and
# court.py rule 9; a doorway's sill shaped and ordered after every other shaped entry) and K11's
# review fix pass (the plot ordered after the ways, `order = 1`; check.py rule 12, `plot_lost`).
# One fresh store: the base, then each change with --against the base, one build each, then the
# base again unchanged on that store (`warm`). Measured 2026-11-24 in one run and checked in a
# second. The fix pass moved three rows: `yard_z_mm` 65 to 0 in the base and 27 to 0 in
# `larger_court`, and `no_ford`'s `moved` 5 to 0 (the yard wall's pieces by the gate): the road
# that ends before the gate no longer cuts the court's plot. It added `plot_off_mm`, `plot_lost`
# and the case `shrine`. A band is the measured number: not a target, it says where someone looks. A time's band
# is wide: it is the machine's, and the row says only that the build finished in that time.

# The fix plan's F2 (docs/plan-fixes.md), 2026-11-24: check.py's rules 13 and 14 (R78) say what
# nothing said before. Every change's `warnings` grew by exactly its new `ground_over` and
# `in_water` and by nothing else, and those two rows were added: five houses of the village rows
# with ground over their floor at their uphill wall (up to 0.255 m), eleven once the village is
# moved, six on the new seed's land; the two houses `flood` puts in water. Measured with the release
# `via` of c759f02 and the working tree's lib/building, one fresh store, one build each.

# The fix plan's F3 (docs/plan-fixes.md), 2026-11-24: a building takes its kit's storey and plinth,
# a door on its side's middle needs no `at`, and a door's `storey` is 0 unless written, so the
# world no longer writes them. The written numbers fell; nothing built moved.

# ------------------------------------------------------------------------------------------ base
# The realm as written: 29 feature tables and 141 numbers, 104 of them in the places and the
# ways. The steps return 87 features (15 buildings, 20 storeys, 17 doorways, 15 roofs, 2 plots...;
# the temple is the sixteenth building, written by hand) and 1511 instances. Every door met; the
# court's halls on one floor level and its plot level to the millimetre away from the doors'
# sills (`plot_off_mm`; 117 mm before the review's fix, where the road that ends before the gate
# cut its apron); the temple on its plot, its wall's foot 0.9 m over the ground all round and its
# base 0.9 m deep. A walker makes all four stated walks. Said: the two roads cross the beck at the
# ford they end on (TODO, spec/geometry.md).

