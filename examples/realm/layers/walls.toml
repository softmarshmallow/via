# The walls layer: the steps that read the buildings the places layer wrote or returned.

[step.lay]                                    # one call per building (lib/building/kinds.toml)
when     = "generate"
worker   = true
for_each = "kind:building"
command  = ["python", "-m", "viasdk", "lib:building/lay.py"]

[step.check]
when    = "lint"
worker  = true
checks  = ["lay", "rows", "courts"]
command = ["python", "-m", "viasdk", "lib:building/check.py"]
# No `kits`: check judges every kit a building names (the fix plan's F3), the four here.
