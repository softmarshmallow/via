# The places layer: what stands on the land the uplands step makes (world.toml).

# ------------------------------------------------------------------------------------------ Marrowick, the village

[feature.north_row]                           # the uphill side of the street, west to east
kind     = "row"
at       = [340, 238]
to       = [388.6, 238]
kit      = "structure/village"
depth    = 2
lots     = [{ bays = 3, storeys = 2 }, { bays = 2 }, { bays = 3, storeys = 2 }, { bays = 2 }, { bays = 3, storeys = 2 }, { bays = 2 }]
storey_h = 2.7
walk_out = 0                                 # the doorway comes to the footway's back edge
roof     = "gable"
fill     = [{ faces = ["front", "back", "end"], pattern = ["window", "wall"] }]

[feature.south_row]                           # the downhill side, east to west
kind     = "row"
at       = [386, 226]
to       = [347, 226]
kit      = "structure/village"
depth    = 2
lots     = [{ bays = 2 }, { bays = 3, storeys = 2 }, { bays = 2 }, { bays = 3, storeys = 2 }, { bays = 2 }]
storey_h = 2.7
walk_out = 0                                 # the doorway comes to the footway's back edge
roof     = "gable"
fill     = [{ faces = ["front", "back", "end"], pattern = ["window", "wall"] }]

# ------------------------------------------------------------------------------------------ Senhal, the court

[feature.senhal]
kind     = "court"
at       = [672, 362]                         # the middle of the gate
to       = [672, 372]                         # the axis: north
kit      = "structure/timber"
storey_h = 3.6
plinth   = 0.6
roof     = "hip"
ground   = "level"                           # one plot under the whole court (lib/building/court.py rule 9)
yard     = { kit = "structure/yard", bays = [13, 12] }
hall     = { bays = [5, 3], from = 24, veranda = 1, fill = [{ sides = [0], pattern = ["doors"] }, { sides = [1, 3], pattern = ["lattice"] }] }
wings    = [{ bays = [3, 2], from = 9, off = 9, fill = [{ sides = [0], pattern = ["lattice"] }, { sides = [1], pattern = ["doors", "wall"] }, { sides = [2], pattern = ["lattice", "wall", "wall"] }] }]

[feature.senhal_gate]                         # where the road arrives, before the gate
at = [672, 353]

# ------------------------------------------------------------------------------------------ Quillow Fane, the temple

[feature.fane]
kind      = "building"
region    = [[189.8, 503.1], [204.2, 503.1], [204.2, 522.9], [189.8, 522.9]]
storey_h  = 9.0
plinth    = 0.9
roof      = "gable"
ground    = "level"                          # a plot under the temple (lib/building/lay.py rule 19)
kit       = "structure/order"
colonnade = [{ sides = "all", depth = 2.7 }]
doors     = [{ storey = 0, side = 0, at = 7.2 }]
fill      = [{ sides = [1, 2, 3], pattern = ["wall", "niche"], mirror = true }]

[feature.fane_foot]                           # where the path arrives, before the steps
at = [197, 496]

# ------------------------------------------------------------------------------------------ steps

[step.rows]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "lib:building/row.py"]

[step.courts]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "lib:building/court.py"]
