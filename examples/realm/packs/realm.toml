# The realm's pack: the kits of three other examples, each taken in whole under a prefix
# (spec/assets.md 2.8). A kit is edited in its own pack; this one names it and nothing else.
# `door`, `tile` and `base` are an asset of all three, so each kit's ids are under its prefix:
# the village's door is `v_door` here. Nothing in a kit names a piece by id (lib/building reads a
# kit by its taxon and each piece by its `role:` tag, docs/design/kit-contract.md).
#
#   via pack accept examples/realm/packs/realm.toml      # after a kit changes

# A folder that holds every included pack and its models: the examples folder.
root = "../.."

[include.v]
pack = "../../village/packs/village.toml"

[include.t]
pack = "../../court/packs/timber.toml"

[include.o]
pack = "../../temple/packs/order.toml"

# The land's paints (lib/land/ground.md names them; the colours are lib/packs/starter.toml's), and
# `ground`, which the kits' own worlds paint each in its own colour: here it is the trodden earth
# of a yard, and stands over theirs.
[material.grass]
colour = [0.2, 0.4, 0.1]

[material.rock]
colour = [0.45, 0.43, 0.4]

[material.gravel]
colour = [0.36, 0.33, 0.28]

[material.earth]
colour = [0.3, 0.22, 0.14]

[material.sand]
colour = [0.76, 0.7, 0.5]

[material.ground]
colour = [0.5, 0.5, 0.45]
