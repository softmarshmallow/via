# The realm's pack: the kits of three other examples as one pack. WRITTEN BY
# packs/make_pack.py: edit the kits' own packs, or that script, and run it again.
#
#   village/packs/village.toml: 16 assets, ids under `v_`
#   court/packs/timber.toml: 17 assets, ids under `t_`
#   temple/packs/order.toml: 12 assets, ids under `o_`

root = "../.."

[taxon.structure.defaults]
collision = "box"

[taxon."structure/village".defaults.shared]
module = 3.0
wall = 0.3
storey = 2.7
door = 1.0
base = 1.5

[taxon."structure/village".defaults.shared.stair]
lane = 1.5
width = 1.3
run = 4.5
landing = 1.5

[taxon.prop]

[taxon."structure/timber".defaults.shared]
unit = 0.15
wall = 0.15
storey = 3.6
door = 1.5
base = 0.6
eaves = 1.35

[taxon."structure/yard".defaults.shared]
wall = 0.3
storey = 2.4
door = 2.4

[taxon."structure/order".defaults.shared]
unit = 0.9
wall = 0.9
storey = 9.0
door = 1.8
base = 0.9

[asset.v_frame]
file = "village/packs/village/frame.glb"
taxon = "structure/village"
tags = ["role:wall"]
params = { pitch = 3.0 }

[asset.v_frame_window]
file = "village/packs/village/frame_window.glb"
taxon = "structure/village"
tags = ["role:wall", "variant:window"]
params = { pitch = 3.0 }

