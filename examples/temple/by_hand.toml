name       = "temple_by_hand"
extent     = [0, 0, 48, 48]                   # metres: x east, y north
resolution = 0.5
seed       = 7
include    = ["building", "review"]
pack       = "packs/order.toml"               # the order kit, beside the world (packs/make_kit.py)

# The temple as an author writes it with what the building library had before K8 of
# docs/plan-kits.md (README.md, "Before"). The library walls a building's own outline and nothing
# else, so the room inside the colonnade (the cella) is the `building`, and every column and
# every lintel between two columns is an instance written by hand, its place worked out from the
# column's width (0.9 m) and the 2.7 m from one column's middle to the next. They stand on the
# terrain: a height written outside the cella is `surface.none_at` (no surface holds the point),
# 48 errors on the first try, so the temple has no podium and its floor is the ground's height.
# It is kept beside world.toml, the same temple with its colonnade stated, so that what the build
# says of this one can be measured again.
#
# The temple's outline is 14.4 by 19.8 m (five column bays by seven, and one column's width); the
# cella stands 2.7 m inside it on every side, 9.0 by 14.4 m. Its front is to the south.

# ------------------------------------------------------------------------------------------ fields

[field.height]                                # level ground: the kit, not the land, is the subject
role = "surface"
base = "= 10"

[field.ground]
type = "weights"
role = "material"

[field.ground.then.ground]
paint = "ground"

# ------------------------------------------------------------------------------------------ the cella

[feature.cella]
kind     = "building"
region   = [[19.5, 14.7], [28.5, 14.7], [28.5, 29.1], [19.5, 29.1]]
plinth   = 0                          # no podium: nothing outside the cella can stand at its height
roof     = "gable"
doors    = [{ side = 0 }]
kit      = "structure/order"
fill     = [{ sides = [1, 2, 3], pattern = ["wall", "niche"] }]

# ------------------------------------------------------------------------------------------ the colonnade
# 24 columns: one on each corner, four more along the front and the back, six more along each
# flank. Each stands with its middle 0.45 m inside the outline.

[instance.col_e1]
asset = "column"
at    = [30.75, 15.15]

[instance.col_e2]
