# ------------------------------------------------------------------------------------------ steps

[step.lay]                                    # one call per building (lib/building/kinds.toml)
when     = "generate"
worker   = true
for_each = "kind:building"
command  = ["python", "-m", "viasdk", "lib:building/lay.py"]

[step.check]
when    = "lint"
worker  = true
checks  = ["lay"]
command = ["python", "-m", "viasdk", "lib:building/check.py"]
params  = { kits = ["structure/order"] }

# ------------------------------------------------------------------------------------------ views

[feature.look_temple]
at = [24, 21.9]

[feature.front]                               # the front from the south, at eye height
kind   = "bookmark"
at     = [24, 1]
toward = "look_temple"

[feature.corner]                              # the south-west corner, above
kind       = "bookmark"
at         = [4, 2]
toward     = "look_temple"
eye_height = 14

[feature.over]                                # from the south, above
kind       = "bookmark"
at         = [24, 0.5]
toward     = "look_temple"
eye_height = 30
