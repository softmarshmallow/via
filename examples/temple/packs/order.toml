# The order kit (examples/temple): pieces of one unit, made by packs/make_kit.py.
# Its facts file, order.facts.toml, is written by `via pack accept examples/temple/packs/order.toml`.
#
# Every model is glTF's convention: +Y up, front +Z, origin at the base centre (packgen's).
# lib/building's `lay` reads a piece's part from its `role:` tag and the length it repeats at from
# `params.pitch` (docs/design/kit-contract.md).

root = "order"

[taxon."structure"]
defaults = { collision = "box" }

# What the kit's pieces share, stated once (spec/assets.md 2.5; lib/building/lay.py rule 11).
[taxon."structure/order".defaults.shared]
unit   = 0.9                     # a column's width: every size of the kit is a whole number of it
wall   = 0.9                     # every wall piece's thickness
storey = 9.0                     # a storey: the column and its entablature
door   = 1.8                     # the doorway the door frame is made for
base   = 0.9                     # how far the base reaches below the floor: the podium

# ---- the cella: the room inside the colonnade

# The bay: two units of wall, one thick, a storey high.
[asset.wall]
file   = "wall.glb"
taxon  = "structure/order"
tags   = ["role:wall"]
params = { pitch = 1.8 }

# The same bay with a niche in its front.
[asset.wall_niche]
file   = "wall_niche.glb"
taxon  = "structure/order"
tags   = ["role:wall", "variant:niche"]
params = { pitch = 1.8 }

# The half bay: one unit of wall, for a side that is an odd number of units between its corners.
[asset.wall_half]
file   = "wall_half.glb"
taxon  = "structure/order"
tags   = ["role:filler"]
params = { pitch = 0.9 }

[asset.corner]
file  = "corner.glb"
taxon = "structure/order"
tags  = ["role:corner"]

# The door frame: four units of wall with an opening two wide and six high.
[asset.door]
file   = "door.glb"
taxon  = "structure/order"
tags   = ["role:door"]
params = { pitch = 3.6 }

# The floor tile: one unit square.
[asset.tile]
file   = "tile.glb"
taxon  = "structure/order"
tags   = ["role:floor"]
params = { pitch = 0.9 }
sink   = 0.3

# ---- the roof: a slope two units along the eave and eight in plan to the ridge, climbing three,
# for a temple sixteen units wide; and half a pediment.

[asset.roof_slope]
file   = "roof_slope.glb"
taxon  = "structure/order"
tags   = ["role:roof_slope"]
params = { pitch = 1.8, span = 7.2 }

[asset.roof_gable]
file   = "roof_gable.glb"
taxon  = "structure/order"
tags   = ["role:roof_gable"]
params = { span = 7.2 }

# ---- the base: the podium's face under the outline, each piece sunk by its own height so its
# top is the floor (lay.py rule 13).

[asset.base]
file   = "base.glb"
taxon  = "structure/order"
tags   = ["role:wall", "storey:base"]
params = { pitch = 1.8 }
sink   = 0.9

[asset.base_corner]
file  = "base_corner.glb"
taxon = "structure/order"
tags  = ["role:corner", "storey:base"]
sink  = 0.9

# ---- the colonnade: the column, a post, which also stands on each corner; and the lintel from
# one column to the next, two units long at a place that repeats every three.

[asset.column]
file  = "column.glb"
taxon = "structure/order"
tags  = ["role:post", "role:corner", "storey:colonnade"]

[asset.lintel]
file   = "lintel.glb"
taxon  = "structure/order"
tags   = ["role:wall", "storey:colonnade"]
params = { pitch = 2.7 }
pivot  = "origin"                # the beam is at the storey's top: placed by the floor under it

[material.ground]
colour = [0.5, 0.5, 0.45]
