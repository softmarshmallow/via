# What a temple build measures (docs/plan-kits.md, K8: the classical half). Our own design: the
# research found no developer's account of classical building (docs/research/Modular kit failures
# in studios.md, section 12). Measures, never bytes (R15): each row names a measure of
# `measure.py` and the band it must fall in. Taken by
#
#   python3 examples/temple/measure.py BUILD --world examples/temple/world.toml        # base
#   python3 examples/temple/measure.py BUILD+<c> --base BUILD                          # a change, built with --against
#   python3 examples/temple/measure.py HAND --world examples/temple/by_hand.toml       # by_hand.toml, built alone
#   python3.11 examples/temple/measure.py BUILD+<c> --base BUILD --check <c>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the tree at 26cb33f,
# VIA_LIB=lib, Python 3.12 (sdk/python/.venv) for the steps, lib/building's `lay` and `check` of
# the working tree with K8's first slice (posts and bays, lay.py rule 15; the colonnade, rule 16;
# a mirrored `fill`, rule 8; a kit's unit, check.py rule 11) and the mends of K8's one review
# (lib/building/test_k8fix.py). One fresh store: the base, then each
# change with --against the base, one build each; by_hand.toml in a store of its own. Measured
# 2026-11-23. A band is the measured number: not a target, it says where someone looks.

# ------------------------------------------------------------------------------------------ base
# The temple with its colonnade stated (lay.py rule 16): one `building` table, 17 numbers. 24
# columns and 24 lintels stand on its outline, on the podium; the walls stand one bay inside; one
# gable roof covers the whole outline once; the podium's top is covered edge to edge; the door
# on the axis is 1.8 m clear between the two middle columns; and nothing is said.

