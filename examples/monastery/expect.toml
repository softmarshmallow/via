# What a monastery build must measure (docs/plan.md, M3; R13, R15, R16, R18). Measures, never bytes
# (R15): each row names a measure of measure.py and the band it falls in. Taken by
#
#   python3 examples/monastery/measure.py BUILD                       # base
#   python3 examples/monastery/measure.py BUILD+<c> --base BUILD      # a change, built with --against
#   sdk/python/.venv/bin/python examples/monastery/measure.py BUILD+<c> --base BUILD --check <c>   # 3.11+
#
# Protocol: Apple M4 Pro, macOS arm64, a `via` release binary built at 2026-11-15 18:34 KST from the
# rewrite branch's working tree (after 9b1e23c, with the other M3 agents' uncommitted core, lib/town,
# lib/ways and lib/review changes of that hour), VIA_LIB=lib, Python 3.12 (sdk/python/.venv), one
# fresh store, base built cold on it (3.1 s wall), each change with --against base (2.4 to 2.5 s),
# default threads, a machine shared with other builds. One build each, so a band is the measured
# number, widened only where the row says why: where someone looks, not a target.
# Re-taken 2026-11-15 (M3 slice 4) for the road's rows after its first turn moved to (228, 12) and
# the place (240, 26) was added: same machine and protocol, a release binary of the working tree of
# that hour (epoch 2), base 3 s, each change 2 to 3 s; every other row measured unchanged.
# Re-taken 2026-11-17 (M5 slice 3: the gorge's walls as sheer faces, the court's wall a run of wall
# bays): same machine, a release binary of the working tree at 01:03 KST (after 8ca8e83, with other
# M5 slice 3 agents' uncommitted changes), VIA_LIB=lib, Python 3.12, one fresh store, base 1.4 s
# wall, each change with --against base. The HEAD build (8ca8e83, a worktree, same binary) gave the
# "before" numbers the rows quote. Rows marked OWED fail on purpose until the fix they name lands.

# ------------------------------------------------------------------------------------------ base

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]                             # 2 measured: the 2 crossings of the bridge over the gorge's
measure = "warnings"                        # faces (`unowned`); 9 with the 7 unreached while reach walked
band    = [2, 2]                            # the terrain only (M5 slice 2 to 3)

[base.reach]                                # all held: lib/review's reach walks the deck (a kind surface
measure = "reach_held"                      # since slice 2) through its meetings (surfaces.md 4.4, M5);
band    = [10, 10]                          # 3 of 10 when it walked the terrain only

[base.reach_pairs]
measure = "reach_pairs"
band    = [10, 10]

[base.not_sealed]
measure = "not_sealed"
band    = [0, 0]

[base.unreached]                            # 7 when reach walked the terrain only
measure = "unreached"
band    = [0, 0]

[base.road_grade]                           # the steepest 10 m of the built road, %; 10.14 measured (11.21 before slice 4, where the first two legs crossed)
measure = "road_grade_max"
band    = [0, 11.5]

[base.road_over_10]                         # metres of road whose 10 m climbs over 10 %; 6 measured
measure = "road_over_10"
band    = [0, 10]

[base.road_turns]                           # six written turns; 7 counted (one turn counted twice by the 15 m heading test)
measure = "road_turns"
band    = [6, 7]

[base.road_self_near]                       # station pairs 40 m apart along the road closer than 6 m; 13 measured, all at the
measure = "road_self_near"                  # (300, 44) turn, legs 4.8 m apart (0.8 m between beds); 199 before slice 4 (legs 1 and 2 on top of each other)
band    = [0, 13]

[base.decks]
measure = "decks"
band    = [1, 1]

[base.deck_wet]                             # the stream runs under the deck since slice 2 (a kind surface, not a
measure = "deck_wet"                        # causeway): 11 wet posts (15 at HEAD; the faces' step now holds the
band    = [8, 16]                           # floor beside the walls at their foot)

[base.head_grade]                           # R16 (M3 slice 5): the steepest metre of the last 20 m of a way
measure = "head_grade"                      # ending on the bridge (measure.py "meetings"); 0.31 before
band    = [0, 0.1]                          # (the approach), now the crossing's `approach` (lib/ways)

[base.face_pool]                            # the stream's depth 1 m off a face of the deck less its depth
measure = "face_pool"                       # 15 m off: 0.22 m before (pooled on the gorge floor)
band    = [-0.3, 0.1]

[base.unowned]                              # the bridge's line crosses the east and the west face: a deck over a
measure = "geom.unowned_crossing"           # face is no meeting, and a crossing names only the water it crosses
band    = [2, 2]                            # (geometry.md 2.7; TODO). Piece to piece the faces start at each other by name: 0 there

[base.wall_low]                             # no metre of wall, away from the gate, uncovered by a wall bay (or the old ground 3.5 m up)
measure = "wall_low"
band    = [0, 0]

[base.wall_members]                         # the run `court_wall`: 295 m of outline, 3 m spacing; 98 measured, none gave way
measure = "wall_members"
band    = [98, 98]

[base.gate_open]                            # metres of outline no bay covers at the gate: the span's 5 m and a bay's corner; 5.1 measured
measure = "gate_open_m"                     # (the terrain wall's gap, sampled the same way at HEAD: 12.0, every sample uncovered)
band    = [4.5, 5.5]

[base.gorge_step]                           # the largest span of a terrain quad left drawn within 20 m of the stream (not
measure = "gorge_step_max_m"                # under the bridge or the tarn): 21.15 m at HEAD (the wall from post to post),
band    = [0, 3]                            # 2.81 measured: the hollow's floor round the tarn falling away from the faces' foot

[base.gorge_steep]                          # those quads with a span over 2 m: 606 at HEAD, 68 measured, all 4 to 6 m off a face in the
measure = "gorge_steep"                     # tarn's head, where the step's flat foot (2.75 m) fades into the hollow
band    = [0, 80]

[base.faces]                                # layers/gorge.toml: 7 pieces east, 9 west
measure = "faces"
band    = [16, 16]

[base.face_cut]                             # cut quads on the faces' lines; 979 measured
measure = "face_cut"
band    = [900, 1100]

[base.face_gap]                             # piece to piece, mm
measure = "face_gap_max_mm"
band    = [0, 0]

[base.gate_step]                            # cm between the court and the ground across the gate; 31 measured (walker's step 20 cm, its grade 0.5)
measure = "gate_step"
band    = [0, 40]

[base.tarn]                                 # the fill step's lake
measure = "lakes"
band    = [1, 1]

[base.relief]
measure = "place.relief"
band    = [0, 0]

# ------------------------------------------------------------------------------------------ guesthouse

[guesthouse.errors]
measure = "errors"
band    = [0, 0]

[guesthouse.added]
measure = "instances_added"
band    = [1, 1]

[guesthouse.removed]
measure = "instances_removed"
band    = [0, 0]

[guesthouse.reach]                          # the guesthouse's door reached from the road over the bridge (3 of 11 on the terrain only)
measure = "reach_held"
band    = [11, 11]

[guesthouse.reach_pairs]
measure = "reach_pairs"
band    = [11, 11]

[guesthouse.road_kept]                      # the road's course unchanged, every point
measure = "road_kept"
band    = [2393, 2393]

# ------------------------------------------------------------------------------------------ move_bridge

[move_bridge.errors]
measure = "errors"
band    = [0, 0]

[move_bridge.decks]
measure = "decks"
band    = [1, 1]

[move_bridge.deck_wet]                      # as base: the stream under the deck; 10 measured
measure = "deck_wet"
band    = [8, 16]

[move_bridge.head_grade]                    # R16 at the moved bridge's heads
measure = "head_grade"
band    = [0, 0.1]

[move_bridge.face_pool]
measure = "face_pool"
band    = [-0.3, 0.1]

[move_bridge.unowned]                       # as base: the moved bridge over the two faces
measure = "geom.unowned_crossing"
band    = [2, 2]

[move_bridge.reach]                         # all held (3 of 10 on the terrain only)
measure = "reach_held"
band    = [10, 10]

[move_bridge.reach_pairs]
measure = "reach_pairs"
band    = [10, 10]

[move_bridge.road_kept]                     # the course up to the last turn kept (2082 of the base's 2393 points); only the last leg is found again
measure = "road_kept"
band    = [2000, 2100]

[move_bridge.road_grade]
measure = "road_grade_max"
band    = [0, 11.5]

[move_bridge.removed]
measure = "instances_removed"
band    = [0, 0]

# ------------------------------------------------------------------------------------------ no_bridge

[no_bridge.errors]
measure = "errors"
band    = [0, 0]

[no_bridge.decks]
measure = "decks"
band    = [0, 0]

[no_bridge.reach]                           # each rim walked to its own places, and the hall, the gate, the well, the west rim and the gorge floor sealed from the road: the bridge was the only way over (the same statement with the bridge standing gives 4 not_sealed)
measure = "reach_held"
band    = [9, 9]

[no_bridge.reach_pairs]
measure = "reach_pairs"
band    = [9, 9]

[no_bridge.not_sealed]
measure = "not_sealed"
band    = [0, 0]

