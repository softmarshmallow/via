# The plain kit with its bay re-exported with the model's origin at one end, not the middle
# (packs/make_kit.py, changes/pivot.toml). Written by make_kit.py from packs/plain.toml: edit that.
# The facts file beside it is the one accepted before the re-export.

root = "pivot"

[taxon."structure"]
defaults = { collision = "box" }

# What the kit's pieces share, stated once (spec/assets.md 2.5; lib/building/lay.py rule 11):
# `lay` lays by these, and `check` holds every piece to them (`kit_stated`).
[taxon."structure/plain".defaults.shared]
module = 3.0                     # the bay: a side is whole bays and half bays between its corners
wall   = 0.3                     # every wall piece's thickness
storey = [3.0, 4.0]              # the wall pieces' heights: a storey, and the taller ground storey's
door   = 1.4                     # the doorway the door piece is made for

# The kit's stair, sized to its floor tile (1.5 m): a lane one tile deep, and a landing and a run
# of whole tiles, so a stairwell is whole tiles however many storeys climb it.
[taxon."structure/plain".defaults.shared.stair]
lane    = 1.5
width   = 1.3
run     = 4.5
landing = 1.5

# The bay: 3 m of wall, the module.
[asset.wall]
file   = "wall.glb"
taxon  = "structure/plain"
tags   = ["role:wall"]
params = { pitch = 3.0 }

# The half bay: 1.5 m, a half module, for what whole bays leave.
[asset.wall_half]
file   = "wall_half.glb"
taxon  = "structure/plain"
tags   = ["role:filler"]
params = { pitch = 1.5 }

# The window bay and the vent bay: the bay with an opening, on the bay's footprint. Variants of
# the bay (lib/building/lay.py rule 8): a building asks for them by word, in `fill` or `bays`.
[asset.wall_window]
file   = "wall_window.glb"
taxon  = "structure/plain"
tags   = ["role:wall", "variant:window"]
params = { pitch = 3.0 }

[asset.wall_vent]
file   = "wall_vent.glb"
taxon  = "structure/plain"
tags   = ["role:wall", "variant:vent"]
params = { pitch = 3.0 }

# The outside corner: a post as thick as the wall. It takes its own 0.3 m from each wall.
[asset.corner]
file  = "corner.glb"
taxon = "structure/plain"
tags  = ["role:corner"]

# The inside corner: the notch the two walls leave and 1.2 m of each wall, so with the post's
# 0.3 m an L's sides are whole half bays (lib/building/lay.py rule 6, "Corners"). It is placed by
# the notch's middle, which is the model's own origin, and it claims the L it stands on.
[asset.corner_in]
file   = "corner_in.glb"
taxon  = "structure/plain"
tags   = ["role:corner_in"]
params = { reach = 1.2 }
pivot  = "origin"
footprint = [[-1.35, -0.15], [0.15, -0.15], [0.15, 1.35], [-0.15, 1.35], [-0.15, 0.15], [-1.35, 0.15]]   # the L, not its box

# The door: a frame one half bay wide, for a doorway 1.4 m wide and the 0.1 m `lay` leaves.
[asset.door]
file   = "door.glb"
taxon  = "structure/plain"
tags   = ["role:door"]
params = { pitch = 1.5 }

# ---- the ground storey 4 m high (lib/building/README.md, "Building upward"). A storey takes the
# pieces of its own height, so these stand only where a building says `ground_h = 4`.

[asset.ground_wall]
file   = "ground_wall.glb"
taxon  = "structure/plain"
tags   = ["role:wall", "storey:ground"]
params = { pitch = 3.0 }

[asset.ground_half]
file   = "ground_half.glb"
taxon  = "structure/plain"
tags   = ["role:filler", "storey:ground"]
params = { pitch = 1.5 }

[asset.ground_corner]
file  = "ground_corner.glb"
taxon = "structure/plain"
tags  = ["role:corner", "storey:ground"]

[asset.ground_door]
file   = "ground_door.glb"
taxon  = "structure/plain"
tags   = ["role:door", "storey:ground"]
params = { pitch = 1.5 }

# ---- floors and roofs

# The floor tile: one half bay square, sunk by its thickness so its top is the floor. It tiles a
# storey's floor inside the walls, and a flat roof.
[asset.floor]
file   = "floor.glb"
taxon  = "structure/plain"
tags   = ["role:floor"]
params = { pitch = 1.5 }
sink   = 0.2

# The roof slope: 1.5 m along the eave, 4.8 m in plan from the eave to the ridge, climbing 2.4 m.
# Made for a building 9.6 m deep, as both of the example's are.
[asset.roof_slope]
file   = "roof_slope.glb"
taxon  = "structure/plain"
tags   = ["role:roof_slope"]
params = { pitch = 1.5, span = 4.8 }

# Half a gable: the wall under the roof's edge at each end, 4.8 m long, as thick as the walls.
[asset.roof_gable]
file   = "roof_gable.glb"
taxon  = "structure/plain"
tags   = ["role:roof_gable"]
params = { span = 4.8 }

[material.ground]
colour = [0.5, 0.5, 0.48]
