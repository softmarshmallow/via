# What a kit build measures (docs/research/Modular kit failures in studios.md, section 13: the
# difficulties studios report with modular kits, rebuilt on one plain kit). Measures, never bytes
# (R15): each row names a measure of `measure.py` and the band it must fall in. Taken by
#
#   python3 examples/kit/measure.py BUILD                        # base
#   python3 examples/kit/measure.py BUILD+<c> --base BUILD       # a change, built with --against
#   python3.11 examples/kit/measure.py BUILD+<c> --base BUILD --check <c>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the working tree after
# bf60bb0 with K5 of docs/plan-kits.md (R68, R69, R70; epoch 4), VIA_LIB=lib, Python 3.12 (sdk/python/.venv) for the steps, lib/building's
# `lay` and `check` of the working tree with K2 (a place by `side` and `at`, the kit against
# itself), K3 (variants of the bay) and K4 (the wall over a stairwell on its footing, storeys of
# two heights, floor tiles, roofs) and K5 (a wall stretch is one run that names each station's
# piece). One fresh store: base, then each change with --against base,
# one build each; `window_module` is `window` and `module` together. Every row was measured
# again on 2026-11-23 with K4, when the wall over the hall's stairwell first stood: `open` fell
# by one and `open_sum_mm` by 6000 in every build, and the hall gained a bay's worth of pieces.
# K5 moved six rows, measured the same day: `stub` names all twelve overlaps again, and a
# variant renames no bay. A band is the measured number: not a target, it says where someone looks. The same builds
# before any mend, and after the library's first mends, are in README.md, "The record".

# ------------------------------------------------------------------------------------------ base
# The base: two buildings, every stretch of wall closing, the storey above included (no wall was
# laid over the hall's stairwell before K4: `open` 1, 6 m), and every floor whole tiles.

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]
measure = "warnings"
band    = [0, 0]

[base.pieces]
measure = "pieces"
band    = [54, 54]

[base.wall]
measure = "wall"
band    = [38, 38]

[base.wall_half]
measure = "wall_half"
band    = [2, 2]

[base.corner]
