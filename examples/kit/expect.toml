# What a kit build measures (docs/research/Modular kit failures in studios.md, section 13: the
# difficulties studios report with modular kits, rebuilt on one plain kit). Measures, never bytes
# (R15): each row names a measure of `measure.py` and the band it must fall in. Taken by
#
#   python3 examples/kit/measure.py BUILD                        # base
#   python3 examples/kit/measure.py BUILD+<c> --base BUILD       # a change, built with --against
#   python3.11 examples/kit/measure.py BUILD+<c> --base BUILD --check <c>
#
# Protocol of the numbers below: macOS arm64, release `via` built 2026-11-20 from the working tree
# after 640a7df with K1 of docs/plan-kits.md (R64, R65, epoch 3), VIA_LIB=lib, Python 3.12
# (sdk/python/.venv) for the steps, lib/building's `lay` and `check` of the same tree with K2 (a
# place by `side` and `at`, the kit against itself) and K3 (variants of the bay). One fresh store:
# base, then each change with --against base, one build each; `window_module` is `window` and
# `module` together. Measured once on 2026-11-20 and, with K3's rows and the kit's seventh piece,
# again on 2026-11-22 (release `via` of f529008, after the review of K3), so a band is the measured number: not a target,
# it says where someone looks. The same builds before any mend, and after the library's first mends, are in README.md,
# "The record".

# ------------------------------------------------------------------------------------------ base
# The base: two buildings, every stretch of wall closing.

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]
measure = "warnings"
band    = [0, 0]

[base.pieces]
measure = "pieces"
band    = [53, 53]

[base.wall]
measure = "wall"
band    = [35, 35]

[base.wall_half]
measure = "wall_half"
band    = [4, 4]

[base.corner]
measure = "corner"
band    = [12, 12]

# Joints between two bays of one asset along a side: every one, in a wall of one piece.
[base.alike]
measure = "alike"
band    = [21, 21]

[base.door]
measure = "door"
band    = [2, 2]

[base.open]
measure = "open"
band    = [1, 1]

[base.open_sum_mm]
measure = "open_sum_mm"
band    = [6000, 6000]

[base.overlaps]
measure = "overlaps"
band    = [0, 0]

[base.outside_max_mm]
measure = "outside_max_mm"
band    = [0, 0]

[base.floor_off_mm]
measure = "floor_off_mm"
band    = [0, 0]

[base.stack_over_mm]
measure = "stack_over_mm"
band    = [0, 0]

