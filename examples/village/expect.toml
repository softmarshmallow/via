# What a village build measures (docs/plan-kits.md, K7; docs/research/Modular kit failures in
# studios.md, section 4, "Meeting the ground", and section 13, "House on a slope" and "The larger
# house"). Measures, never bytes (R15): each row names a measure of `measure.py` and the band it
# must fall in. Taken by
#
#   python3 examples/village/measure.py BUILD                        # base
#   python3 examples/village/measure.py BUILD+<c> --base BUILD       # a change, built with --against
#   python3.11 examples/village/measure.py BUILD+<c> --base BUILD --check <c>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the tree at 26cb33f, after the review's fix pass,
# VIA_LIB=lib, Python 3.12 (sdk/python/.venv) for the steps, lib/building's `row`, `lay` and
# `check` of the working tree with K7's three slices (the wall's foot, lay.py rule 13; a storey's
# own outline, rule 14; a gable roof over an L, rule 10). One fresh
# store: the base, then each change with --against the base, one build each. Measured 2026-11-23.
# A band is the measured number: not a target, it says where someone looks.

# T1 of docs/plan-fixes.md, 2026-11-25: check.py reads no ground along a party wall (a neighbour's
# wall stands against it, read from the outlines) or within one post of its ends. Two of the rows'
# houses had ground over their floor only along a party wall: every section's `ground_over` falls by
# two (one in `flush`), and nothing else moved. Measured with the release `via` of e1fc651 and T1's
# library, one fresh store, one build each.

# The fix plan's F2 (docs/plan-fixes.md), 2026-11-24: check.py's rule 13 (R78) says ground over a
# floor off a plot. Every change's `warnings` grew by exactly its new `ground_over` and by nothing
# else, and that row was added: eleven houses stepping with the slope have ground over their floor
# at their uphill wall (up to 0.278 m), twelve with the L. Measured with the release `via` of
# c759f02 and the working tree's lib/building, one fresh store, one build each.

# ------------------------------------------------------------------------------------------ base
# The village on its slope with the kit's base: every house's floor stands over the ground on its
# low side, and the base, 1.5 m deep, reaches the ground under all of it (open_foot_m 0). The
# ground is read on the outline; a stretch against a neighbour is a party wall and left out
# (party_m). Each floor is on the mean of its own ground, so the rows step.

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]
measure = "warnings"
band    = [9, 9]

[base.ground_over]
measure = "ground_over"
band    = [9, 9]

