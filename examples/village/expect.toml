# What a village build measures (docs/plan-kits.md, K7; docs/research/Modular kit failures in
# studios.md, section 4, "Meeting the ground", and section 13, "House on a slope" and "The larger
# house"). Measures, never bytes (R15): each row names a measure of `measure.py` and the band it
# must fall in. Taken by
#
#   python3 examples/village/measure.py BUILD                        # base
#   python3 examples/village/measure.py BUILD+<c> --base BUILD       # a change, built with --against
#   python3.11 examples/village/measure.py BUILD+<c> --base BUILD --check <c>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the tree at e469406,
# VIA_LIB=lib, Python 3.12 (sdk/python/.venv) for the steps, lib/building's `row`, `lay` and
# `check` of the working tree with K7's two slices (the wall's foot, lay.py rule 13; a storey's
# own outline, rule 14). One fresh
# store: the base, then each change with --against the base, one build each. Measured 2026-11-23.
# A band is the measured number: not a target, it says where someone looks.

# ------------------------------------------------------------------------------------------ base
# The village on its slope with the kit's base: every house's floor stands over the ground on its
# low side (0.92 m at most), and the base, 1.5 m deep, reaches the ground under all of it. Each
# floor is on the mean of its own ground, so the rows step: 0.66 m at most between neighbours.

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]
measure = "warnings"
band    = [0, 0]

[base.buildings]
measure = "buildings"
band    = [11, 11]

[base.storeys]
measure = "storeys"
band    = [16, 16]

[base.pieces]
measure = "pieces"
band    = [517, 517]

[base.base]
measure = "base"
band    = [142, 142]

[base.roof]
measure = "roof"
band    = [152, 152]

[base.open]
measure = "open"
band    = [0, 0]

[base.hang_houses]
measure = "hang_houses"
band    = [11, 11]

[base.hang_m]
measure = "hang_m"
band    = [190.05, 190.15]

[base.hang_max_mm]
measure = "hang_max_mm"
band    = [922, 922]

[base.open_foot_m]
measure = "open_foot_m"
band    = [-0.05, 0.05]

[base.open_foot_max_mm]
measure = "open_foot_max_mm"
band    = [0, 0]

[base.buried_max_mm]
measure = "buried_max_mm"
band    = [490, 490]

[base.row_step_max_mm]
measure = "row_step_max_mm"
band    = [660, 660]

[base.door_step_max_mm]
measure = "door_step_max_mm"
band    = [0, 0]

[base.foot_open]
measure = "foot_open"
band    = [0, 0]

[base.base_short]
measure = "base_short"
band    = [0, 0]

[base.off_bound]
measure = "off_bound"
band    = [0, 0]

[base.gave_way]
measure = "gave_way"
band    = [0, 0]

