# What a city build must measure (docs/plan.md, M3; R13, R15, R16, R18). Measures, never bytes (R15):
# each row names a measure of measure.py and the band it falls in. Taken by
#
#   python3 examples/city/measure.py BUILD                       # base
#   python3 examples/city/measure.py BUILD+<c> --base BUILD      # a change, built with --against
#   python3.11 examples/city/measure.py BUILD --check base       # each row against its band
#
# Protocol: macOS arm64 (Apple M4 Pro, shared with other agents' builds), a `via` release binary
# built from the rewrite branch's working tree on 2026-11-15 (after ce470fd, with the other M3
# slice 5 agents' uncommitted lib/ways, lib/town, lib/review and via-doc changes of that hour),
# VIA_LIB=lib, Python 3.12 (sdk/python/.venv), one fresh store, 8 threads; base cold, then each
# change --against base on the same store. One build each, so a band is the measured number: where
# someone looks, not a target. Timings (/usr/bin/time -l): base cold 154 s, 4.7 GB peak;
# move_avenue 185 s, move_bridge 156 s, hand 73 s, each 6.4 to 6.8 GB peak.
#
# bearing_spread is lib/review/form.py's (challenges.md row 59: the spike's city alone 0.45, in
# atlas 0.76; main ways 0.40): its band is wide on purpose, as it moves with the routes.
#
# R13 for lots (M4 slice 1, fixed): move_avenue renamed 212 lots in kept blocks and move_bridge 16
# until a source cut by a network's `within` outline was given its role there (identity.md 2.3,
# roles by travel); both are 0 now.
#
# M3 slice 5 (fix): base and hand re-recorded on the combined tree with this protocol (release
# `via` of that tree, VIA_LIB=lib, one fresh store, base cold 209 s and 5.3 GB peak; hand 81 s,
# move_avenue 188 s, move_bridge 160 s, each 7.6 to 7.8 GB peak). houses.py rule 4 now reads
# keep_out at the posts inside a footprint, as place.keep_out does, so fronts stand 1.55 m behind
# the footway (median; 3.05 before) and more lots hold a row; streets.py step 5b joins the old
# town's cross-street ends to a node within spacing / 4 and drops one shorter. Moved: blocks
# 203 -> 200, lots 2744 -> 2779, streets 95 -> 93, houses 1992 -> 2201, lots_held 1277 -> 1314,
# place.relief 156 -> 190 (houses on the old town's slope: no terraces in the city); hand
# houses_removed 3 -> 2, blocks_kept 203 -> 200. move_avenue and move_bridge in band unchanged.
#
# M4 slice 1 (names): re-recorded with this protocol on the working tree of 2026-11-16 (after
# 7056fc3, with the other M4 slice 1 agents' uncommitted changes of that hour; release `via`,
# VIA_LIB=lib, one fresh store; base cold 126 s and 6.0 GB peak, move_avenue 151 s, move_bridge
# 129 s, hand 56 s, 7.5 to 8.5 GB peak). The grand avenue passes four named places on its line
# (world.toml): it ran from x 661 to 728 for a line at 700, now on it (0 m off, base and
# move_avenue). Moved: blocks 200 -> 186, lots 2779 -> 2739, houses 2201 -> 2291, lots_held
# 1314 -> 1364, bearing_main 0.3448 (three way points) and 0.2878 (four), below its old band
# [0.35, 0.42] since the avenue no longer bends; hand blocks_kept 200 -> 186. lots renamed in kept
# blocks: move_avenue 212 -> 0, move_bridge 16 -> 0 (the fix above; 0 and 0 with three way points
# too).
#
# M5 slice 3 (levels): re-taken 2026-11-17 on a release `via` of the working tree at 01:03 KST (after
# 6f9f332, with the other M5 slice 3 agents' uncommitted changes), VIA_LIB=lib, one fresh store,
# base cold 103 s, each change --against base. The freeway passes over each arterial on a viaduct
# with two loop ramps; the HEAD build (6f9f332, a worktree, same binary, 106 s) gave the "before"
# numbers the rows quote. Every count of blocks, lots and houses is unchanged (houses 2291 both).
# Rows marked OWED fail on purpose until the fix they name lands.
#
# M6 slice 1 (perf): the three houses steps run per block (`for_each = "kind:block"`, layers/town.toml;
# lib/town houses.py "Per block"); the houses are those of the whole-table steps, name for name
# (2291), and `lots_held` is counted from the houses' names (measure.py), since the steps' `rows`
# records, equal for many blocks, merge in diagnostics.json. Times, one run each, release `via`
# (HEAD 277993f with its lib and examples, a worktree; against the working tree of 2026-11-17
# 07:00 KST with the other M6 agents' uncommitted changes), VIA_LIB=lib, fresh store, 14 threads,
# load 12 to 35 from other agents' builds, wall clock: cold 119 -> 128 s; unchanged into the same
# directory 1.8 -> 1.7 s; unchanged into a new directory 17.4 -> 1.1 s (graph.md 6.2, "Into a new
# directory"); move_avenue --against cold 103 -> 106 s, its houses calls 124 -> 29 node-seconds
# (97 of 558 calls ran, 78 of them blocks the avenue renamed). The change is now held up elsewhere:
# 650 `distance` nodes (29 node-seconds), key records written one by one on the engine's thread
# (about 15 s, `sample`), trace replays (13 s), three `prepare` passes (TODO, "From M6 slice 1").
#
# M6 slice 2 (perf): key records written behind on the store's writer threads (graph.md 3.2), the
# ready steps' traces replayed on --threads (graph.md 8), a blob already stored not written again
# (protocol.md 4.1), and the nearest place found among a window's or a 32 m tile's segments
# (geometry.md 3.8). Times, one run each, release `via` of the working tree of 2026-11-17 09:10
# (before) and 09:30 KST (after; both with the other M6 agents' uncommitted changes of then),
# VIA_LIB=lib, fresh store, 14 threads, load 10 to 26 from other agents' builds, wall clock:
# cold 103 -> 64 s; unchanged 1.8 -> 1.6 s; move_avenue --against cold 108 -> 57 s (distance
# 17.7 -> 6.1 node-seconds, steps 42.6 -> 36.5); move_bridge 93 -> 60 s; quay cold 18.0 -> 14.4 s,
# unrelated 15.1 -> 14.1 s. Every build directory equal file for file to the before binary's (the
# manifest's `run` member aside), and clean equals incremental for base, move_avenue and back to
# base (`.previous` and changes.json aside, which name the build compared against). Left (sample
# of move_avenue after): the whole model built again per generate rank for the steps' views
# (CliPlan::new, about 10 s on the engine's thread), three `prepare` passes (about 8 s, most in
# `where` evaluated by networks' features), the steps themselves (36 node-seconds).

