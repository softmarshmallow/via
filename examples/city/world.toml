# ------------------------------------------------------------------------------------------ the skeleton: main ways

# Every main way is routed over the land (R16) by one cost: convex in the slope, 400 a metre
# within 22 m of the river's line (so no way crosses it but on a crossing's deck) and within 50 m
# of the extent (so a way's smoothing, 40 m along it and 80 m for the freeway, reads inside the
# field). An arterial is a main street 13 m kerb to kerb with 4 m footways (the spike's).

[feature.harbor_west]
kind      = "main_street"
starts_at = "harbor_gate_w"
ends_at   = "ix_harbor"
path      = []
width     = 13
footway   = 4
route     = "= 1 + 0.12 * pow(slope('height'), 2) + 400 * (1 - smoothstep(21, 22, abs(x - 1000 - 0.1 * (y - 800)))) + 400 * (1 - smoothstep(46, 50, min(min(x, 1600 - x), min(y, 1600 - y))))"
smooth    = true

[feature.harbor_mid]
kind      = "main_street"
starts_at = "ix_harbor"
ends_at   = "harbor_bridge.start"
path      = []
width     = 13
footway   = 4
route     = "= 1 + 0.12 * pow(slope('height'), 2) + 400 * (1 - smoothstep(21, 22, abs(x - 1000 - 0.1 * (y - 800)))) + 400 * (1 - smoothstep(46, 50, min(min(x, 1600 - x), min(y, 1600 - y))))"
smooth    = true

