# The interchanges (lib/ways, R18; levels since M5 slice 3): where the freeway passes over an
# east-west arterial. The arterial's two pieces arrive at its point by name; the freeway passes over
# it on a viaduct (below). Its plate is `level`, the ground there less 3 m (the ground at its point
# in the build of 6f9f332: 14.59, 16.45, 18.05, read from fields/height.npy), so the arterial dips
# under the deck: flat 16 m round, banked at 1:10 out to 40 m and fading by 44 m. A plate 56 m round
# (the ramps landing on it) took 55 houses of the rows district with its bank to 100 m.
[feature.ix_harbor]
kind  = "interchange"
at    = [480, 400]
level = 11.6
reach = 40
[feature.ix_central]
kind  = "interchange"
at    = [480, 800]
level = 13.45
reach = 40
[feature.ix_north]
kind  = "interchange"
at    = [480, 1350]
level = 15.05
reach = 40

