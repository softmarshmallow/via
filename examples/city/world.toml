name       = "city"
extent     = [0, 0, 1600, 1600]
resolution = 2                              # metres between posts: 640,000 posts; why 2, README "Build"
seed       = 77
include    = ["land", "water", "ways", "town", "review"]   # kinds as data; the core knows none of these words
pack       = "starter"

# A city on a river (docs/plan.md, M3; R13, R15 to R18): the spike's `city` (1.6 km, a river,
# freeways and arterials drawn by hand, districts each with its own street pattern cut into wards
# by the arterials, bridges where an arterial meets the river, ramps where one meets a freeway, lots
# filling blocks), rebuilt in the v1 vocabulary on the new core and lib/. What changed from the
# spike, line by line, is in README.md.
#
# The author writes the land, the river, the city's limits, the places the main ways join (gates
# on the limits, three crossings, three interchanges), the main ways by what they connect, and
# three districts with their street patterns. Nobody writes a street, a ward, a block, a lot or a
# house.
#
# - Arterials and the freeway are written by their ends and routed over the land (R16). An
#   east-west arterial is three pieces: gate to interchange, interchange to the crossing's west end,
#   the crossing's east end to the east gate. A north-south avenue runs gate to gate and crosses the
#   east-west ones where the network of wards nodes them (geometry.md 8.1, Meetings).
# - Every arterial-river meeting is a lib/ways `crossing` the arterial arrives at by name (R18);
#   where the freeway meets an arterial it passes over it on a lib/ways `viaduct`, the arterial
#   taken down onto an `interchange`'s plate beneath, and two loop `ramp`s join the deck to the
#   plate (M5 slice 3, challenge 38: levels).
# - The wards are the faces of the skeleton (main ways, freeway, river, crossings, limits); each
#   district's streets are lib/town's streets step in its own pattern (`grid` at two bearings and
#   spacings, `contour` on the hill), noded with the main ways into blocks; lots fill every block's
#   street sides; houses stand on them (layers/town.toml).
#
# Given, in M4 (the spike's `[given.limits]`, `[given.urban]`, `[given.districts]`): a larger map
# will give this city its limits and its districts, and answer its gates as exits (TODO.md, "From
# the city's exits"). Standalone, the city writes its own: `limits` a square 60 m inside the
# extent, and the three districts below. `urban` (how built up) has no counterpart yet: every lot
# that holds a house gets one.

[layer.dwellings]
file  = "layers/town.toml"
owner = "dwellings"
rank  = 1

# ------------------------------------------------------------------------------------------ fields

# The land: 8 m at the south edge rising 3 m per km north, climbing 1.2 m per 100 m away from the
# river's line (x = 1000 + 0.1 (y - 800), the river's written course: a valley written by its line,
# not as `dist('river')`, townland's lesson), a hill of 24 m round `hill` on the east bank (the
# old town's), and broad lumps of 1.5 m away from the banks.
[field.height]
role = "surface"
base = "= 8 + 0.003 * y + 0.012 * min(abs(x - 1000 - 0.1 * (y - 800)), 500) + 24 * (1 - smoothstep(30, 260, dist('hill', 300))) + 1.5 * fbm(200, 3, seed = 'lumps') * smoothstep(40, 80, abs(x - 1000 - 0.1 * (y - 800)))"

[field.water]                               # lib/water's convention: dry, it is the ground
tags = ["water_level"]
base = "= f('height')"

[field.clearing]                            # ways, decks and plates keep props off it (role:keep_out)
role = "keep_out"
base = "= 0"

# ------------------------------------------------------------------------------------------ the land

[feature.hill]                              # the old town's hill, on the east bank
at = [1260, 1080]

# The river: a written course from the north edge to the south, straight (lib/water's `beck`,
# 30 m of water, 3 m deep). The spike's river was a lake region 70 m wide; a beck has a line, so a
# crossing can stand square to it and move with it (R18).
[feature.river]
kind       = "beck"
width      = 30
depth      = 3
flow       = 1.5
bank_grade = 0.3                            # the bank's cut meets the ground 20 m from the line
path       = [[1080, 1600], [920, 0]]

# The city's limits (M4 will give them: the spike's `[given.limits]`). The gates stand on them.
[feature.limits]
region = [[60, 60], [1540, 60], [1540, 1540], [60, 1540]]

# ------------------------------------------------------------------------------------------ the skeleton: places

