# The crossings (lib/ways, R18): each stands square to the river, its two ends 24 m either side of
# the line (4 m past where the bank's cut meets the ground), so it moves with the river and the
# arterials arrive at its ends by name. Deck 0.5 m over the ground at its ends (8.3 + 0.003 y),
# the water under it at the river's level (about 2.3 m below).
[feature.harbor_bridge_w]
on = { ref = "river", t = 0.75, offset = -24 }
[feature.harbor_bridge_e]
on = { ref = "river", t = 0.75, offset = 24 }

[feature.harbor_bridge]
kind      = "crossing"
starts_at = "harbor_bridge_w"
ends_at   = "harbor_bridge_e"
path      = []
width     = 13                              # the arterial's carriageway and footways
deck_z    = 10.0
crown     = 3                                # 1.42 x the 2 m posts: the posts round each end read `deck_z`
freeboard = 2.3
crosses   = "river"
flow      = "= river.flow"

[feature.central_bridge_w]
