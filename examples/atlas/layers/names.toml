# The names layer: what the player's map names (lib/map, build.md 9.4). Each place is an area on the
# map, its outline the import's footprint as placed (composition.md 4: `<import>.footprint`), found
# by `where` (geometry.md 3.7), so it follows its import when a change moves it. The label is the
# name a player reads; the key is the feature's name, which the game localises. Changes no field.

[feature.area_city]
kind  = "area"
where = "= if(inside('city.footprint'), 1, -1)"
label = "City"

