name       = "atlas"
extent     = [0, 0, 3200, 2560]               # metres: x east, y north; the sea is to the south
resolution = 2                                # the city's spacing; finer worlds are sampled onto it (import.coarser)
chunk      = 128                              # 25 by 20 chunks (build.md 5)
datum      = "sea"                            # quay says the same; the others declare none and are lifted
seed       = 53
include    = ["land", "water", "ways", "terrain", "review", "map"]
pack       = "starter"

# Atlas: every example a player can walk, joined in one map (docs/plan.md M6, challenge 53). Each
# place is its own world, built apart and imported by file (composition.md 2); nothing here edits
# one. This file owns the plain under them (settled by the terrain library, layers/land.toml), the
# imports and where they stand; layers/ways.toml owns the roads that answer their exits, the creek
# and its bridge; layers/views.toml the bookmarks at every join and along the roads.
#
# Left out, and why (README "What is in it"): pistol and sidearm (objects on a bench, not land);
# county and border (each is a composition of worlds that are here themselves: county is quay on a
# parent's land, which atlas now is; border is monastery and its wild, and the wild is here as
# `wild`); strait (two islands joined by a ferry: their slipways are strait's to answer, and its
# sea floor at -14 m under a plain that has no open sea of that depth); ford (its pack `primitive`
# binds `tree_oak`, `house_low` and eight more ids otherwise than `starter`, which every other place
# uses: `import.binding_differs`, composition.md 10); basin (3.2 km a side, larger
# than this map: the plain is settled by the same library instead); station (its pack binds `lamp`
# otherwise than college's and `lamp_post` otherwise than `starter`, and it paints `dry_grass` and
# `path`, which `starter` binds no material for: `import.binding_differs`, `pack.unknown_material`).

[layer.land]
file  = "layers/land.toml"
owner = "land: the river that bends, and the simulation that settles the plain"
rank  = 1

[layer.ways]
file  = "layers/ways.toml"
owner = "ways: the roads between the places, the creek and its bridge"
rank  = 2

[layer.views]
file  = "layers/views.toml"
owner = "views: the bookmarks at the joins and along the roads"
rank  = 3

[layer.names]
file  = "layers/names.toml"
owner = "names: the areas the player's map names (each place, by its footprint)"
rank  = 4

[let]
sea = 2                                       # metres over the datum: the sea's surface (quay's harbour, county's bay)

[budget]                                      # the target: see README "Budget" for where the number comes from
triangles = 100000                            # source triangles per 128 m chunk; README "Budget"

# ------------------------------------------------------------------------------------------ fields

# The plain as first stated: under the sea in the far south, a shore near y = 95, a long gentle
# rise north with low rolls, and uplands in the north third. The terrain step settles it
# (layers/land.toml). Its own field, so the step and the road costs read what it started from.
[field.start]
base = "= sea - 10 + 10 * smoothstep(0, 120, y) + 0.012 * y + 6 * fbm(400, 3, seed = 'rolls') * smoothstep(100, 500, y) + 40 * smoothstep(1800, 2560, y) * (0.5 + 0.5 * fbm(700, 3, seed = 'uplands'))"

[field.height]                                # lib/land: the surface; no unit, as every import's
role = "surface"
base = "= f('start')"

# lib/water: the ground where dry. Its base is the ground read whole, as most places' is, so a place's
# water comes in as its depth over our ground (composition.md 6.2, a field derived from another),
# not at its own zero: a lift moves the ground only (section 5). The sea is a row on it.
[field.water]
tags = ["water_level"]
base = "= f('height')"

[field.water.then.sea]                        # the sea at `sea`, in the south only: an inland hollow
value = "= max(v, sea)"                       # below `sea` (the college's low corner) is not the sea
mask  = "= 1 - smoothstep(160, 260, y)"

# The college declares no water field: it is dry under ours (composition.md 6.2, "An import without
# the derived field"), so the lake the terrain step settles in the plain's hollow there does not
# stand over its lowered lawns (7.2 m deep before, M6 slice 2 review).

[field.clearing]
role = "keep_out"
base = "= 0"

[field.cover]                                 # the imports' woods (glade, relief, vale, wild): brought, not grown here
tags = ["cover"]
base = "= 0"

# The imports' own fields with no use here but their place in the player's data: brought so that a
# reader of the joined map finds them (composition.md 6.2: unmatched, they are dropped with a warning).
[field.forest]                                # massif's woods
tags = ["cover"]
base = "= 0"

[field.grass]                                 # massif's and vale's meadow grass
base = "= 0"

[field.danger]                                # example's
base = "= 0"

[field.survey]                                # relief's surveyed ground, metres
unit = "m"
base = "= 0"

[field.woods]                                 # relief's
base = "= 0"

[field.stone]                                 # relief's
base = "= 0"

[field.hollow]                                # relief's
base = "= 0"

[field.ground]                                # grass; rock on the steep; shingle by the sea; earth on the roads (ways)
type = "weights"
role = "material"

[field.ground.then.grass]
paint = "grass"

[field.ground.then.rock]
paint = "rock"
mask  = "= smoothstep(30, 40, slope('height'))"

[field.ground.then.shore]
paint = "gravel"
mask  = "= (1 - smoothstep(0, 1.5, f('height') - sea)) * (1 - smoothstep(160, 260, y))"

# The roads' earth is returned by a step of the ways layer (layers/ways.toml,
# layers/steps/track.py): a row here (rank 0) sees no feature of the ways layer (rank 2), so
# `dist('kind:road')` found none and no road was painted (M6 slice 2 review).

# ------------------------------------------------------------------------------------------ the places
# `at` is where the import's own (0, 0) lies here. `lift` (composition.md 5): the import declares no
# datum, so its zero is its own; the lift sets its ground on this plain, measured from the first
# build (README "Lifts"). `blend` brings the import's ground whole 24 m inside its edge and fades it
# to the plain's at the edge; the roads in the layer above meet it there.

[import.city]                                 # 1.6 km; its river comes in from the north, fed by the plain's
file  = "../city/world.toml"
at    = [80, 320]
lift  = -2
blend = "= smoothstep(0, 24, d)"

[import.quay]                                 # the harbour town, on this plain's shore (a fill: its land is ours)
file  = "../quay/world.toml"
at    = [1980, 40]
blend = "= smoothstep(0, 16, d)"
give  = { land = "height" }

[import.coast]                                # cliffs and a sea cave, east of the creek's mouth
file  = "../coast/world.toml"
at    = [2330, 0]
lift  = 2                                     # its sea, at its own 0, on ours at 2 (README "Lifts")
blend = "= smoothstep(0, 12, d)"

[import.college]
file  = "../college/world.toml"
at    = [2380, 420]
lift  = -3.5
blend = "= smoothstep(0, 24, d)"

[import.market]
file  = "../market/world.toml"
at    = [2760, 420]
lift  = -16.5
blend = "= smoothstep(0, 16, d)"

[import.glade]
file  = "../glade/world.toml"
at    = [2000, 1000]
lift  = -14
blend = "= smoothstep(0, 16, d)"

[import.relief]
file  = "../relief/world.toml"
at    = [2300, 980]
lift  = -25
blend = "= smoothstep(0, 16, d)"

[import.example]
file  = "../example/world.toml"
at    = [2940, 900]
lift  = -27
blend = "= smoothstep(0, 16, d)"

[import.massif]
file  = "../massif/world.toml"
at    = [1960, 1300]
lift  = -31
blend = "= smoothstep(0, 24, d)"

[import.vale]
file  = "../vale/world.toml"
at    = [2420, 1300]
lift  = -52.5
blend = "= smoothstep(0, 24, d)"

[import.monastery]
file  = "../monastery/world.toml"
at    = [1960, 1760]
lift  = -19
blend = "= smoothstep(0, 24, d)"

[import.townland]
file  = "../townland/world.toml"
at    = [2450, 1900]
lift  = 16
blend = "= smoothstep(0, 24, d)"

[import.wild]                                 # border's wild, alone: its corner kept for a neighbour stays the plain
file  = "../border/wild/world.toml"
at    = [200, 1980]
# Its footprint leaves out the north-east corner it keeps for a neighbour (its own `meet`, x 250 to
# 640, y 220 to 560 in its frame): its two trails end 18 m short of that corner, facing it, so the
# plain's roads answer them from it (layers/ways.toml) and not through its wood, whose trees are its own.
footprint = [[0, 0], [640, 0], [640, 220], [250, 220], [250, 560], [0, 560]]
lift  = 9.5
blend = "= smoothstep(0, 24, d)"

# ------------------------------------------------------------------------------------------ the player map
# lib/map (build.md 9.4): an export step, run after the lints on the finished build, writing
# `export/map/` (build.md 11.4). What each kind of every place is on the map is said here, once for
# the whole: a kind keeps its name across imports (composition.md 4).

[step.map]
when    = "export"
output  = "player_map"                            # build.md 9.4: how a reader finds it
command = ["python", "-m", "viasdk", "lib:map/export.py"]

[step.map.params]
cell    = 2.0                                      # the atlas's own resolution
tile    = 32                                       # 64 m tiles: 50 by 40
reveal  = 8.0
ways    = { freeway = "freeway", viaduct = "freeway", ramp = "freeway", main_street = "street", street = "street", road = "road", lane = "lane", trail = "trail", footpath = "path", crossing = "bridge", cave = "cave" }
under   = ["cave"]                                 # coast's cave runs under its headland
water   = { beck = "stream", terrain_course = "river" }   # the river by the course the terrain step found (lib/terrain), not its stated line (up to 23 m off the wet channel)
regions = { area = "label" }                       # each place, by its footprint (layers/map.toml)
labels  = { crossing = "", cave = "", beck = "", terrain_river = "", tarn = "", lake = "", pond = "", lair = "", enclosure = "", gate = "" }
buildings  = ["building"]                          # the pack's houses, barns and sheds: footprints by their bounds
label_zoom = 1.0                                   # labels kept apart at 1 px a metre: the whole map 3200 px wide
