# An exit forgotten (composition.md 7): the trail to the wild's west exit is taken away, and nothing
# else answers `wild.west_end`. The build fails with `import.exit_unanswered`, whose `data.write`
# is the line to write: `ends_at = "wild.west_end"`. Its view goes with it. (Until M6 slice 2 the
# road to the south exit was taken away; the west trail now ends on that road, so taking the road
# would leave the trail's end on nothing, `identity.unknown_place`, before any exit is checked.)
[feature.west_road]
remove = true

# The trail's approach (layers/ways.toml, M7 slice 1) stands on the trail, so it goes with it, or
# its `on` names nothing (`doc.dangling`) before any exit is checked.
[feature.west_road_approach]
remove = true

[feature.join_wild_west]
remove = true
