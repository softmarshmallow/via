# What a townland build must measure (docs/plan.md, M3; R13, R15, R18). Measures, never bytes (R15):
# each row names a measure of measure.py and the band it falls in. Taken by
#
#   python3 examples/townland/measure.py BUILD                       # base
#   python3 examples/townland/measure.py BUILD+<c> --base BUILD      # a change, built with --against
#   python3.11 examples/townland/measure.py BUILD --check base       # each row against its band
#
# Protocol: macOS arm64, a `via` release binary built from the rewrite branch's working tree at
# 2026-11-15 18:00 KST (after cbecb9d, with the other M3 agents' uncommitted core, lib/town and
# lib/review changes of that hour), Python 3.12 (sdk/python/.venv), one store, base built warm on
# it, each change with --against base, default threads, VIA_LIB=lib, a machine shared with other
# builds (base about 100 s). One build each, so a band is the measured number: where someone looks,
# not a target. lib/town and lib/review were being changed while these were taken: re-record when
# they land. Checked on the settled tree (M3 slice 4, 2026-11-15 20:10 KST, release binary of the
# working tree, one fresh store, base cold 27 s, each change --against base): base 17/17,
# move_crossing, move_hill and edit_west every row in band; nothing re-recorded.
#
# This pass (townland agent, 2026-11-15): the crossing holds the water under its deck (deck_wet 56
# of 192 posts, up to 0.61 m, to 0); the beck's level no longer smooths the deck into the river
# (3.1 m over the line at the deck, 1.6 m beside it, to 0.25 m at most); east_road by two way points
# (484 m to 263 m for a 194 m gap); the old town's streets seeded lower (origin x 258, lot_depth 15,
# cross 45), so one street now ends on the embankment (was 0). Dead ends: lib/review/form.py now
# counts a street ending on a district's outline as `edge_ends` (16), not a dead end (0).
# move_hill builds (0 errors) on this tree; HEAD's world builds too, so its formula.outside_field
# was not the world's.
#
# M3 slice 5 (ways): the embankment now starts at `old_bridge.end` (it stopped 34 m short) and
# rises to the deck's level; the old town's network gains that stretch of frontage, so base lots
# 152 to 144, houses 99 to 95, lots_held 60 to 59, reach pairs 103 to 99 (all held), move_crossing
# houses 100 to 93 and reach 104 to 97 (all held): re-recorded from one build each on this
# protocol, VIA_LIB a copy of lib with only lib/ways and lib/town kinds.toml changed. The meetings
# rows below are measure.py's "meetings" block.
#
# M3 slice 5 (fix): re-recorded on the combined tree (ways, streets and houses together; houses.py
# rule 4 reading keep_out at the posts inside a footprint, so fronts stand 1.05 m behind the
# footway, median, not 1.55; streets.py step 5b), release `via` of that tree, VIA_LIB=lib itself,
# one fresh store, base cold then each change --against base, one build each. Moved: blocks
# 20 -> 18, lots 144 -> 145, streets 14 -> 13, houses 95 -> 97, lots_held 59 -> 58, reach pairs
# 99 -> 101 (all held), place.relief 4 -> 2; move_crossing houses 93 -> 92, reach 97 -> 96;
# move_hill houses 55 -> 56, reach 59 -> 60.

