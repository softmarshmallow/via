[base.deck_wet]                             # M5 slice 2: the deck is the crossing's kind surface
measure = "deck_wet"                        # (lib/ways), so the river runs on beneath it: 78 of 192
band    = [60, 100]                         # posts wet; 0 under the stand-in deck (one build)

[base.street_ends_on_embankment]            # the old town's streets end on the waterfront (R18)
