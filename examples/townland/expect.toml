band    = [1, 1]

[base.errors]
measure = "errors"
band    = [0, 0]

[base.head_grade]                           # R16: the steepest metre of the last 20 m of a way ending on
measure = "head_grade"                      # the crossing; 0.32 before (north_road), now the crossing's
band    = [0, 0.1]                          # `approach` (lib/ways)

[base.way_end_grade]                        # of a way ending on the embankment; 0.33 before (quay_road)
measure = "way_end_grade"
band    = [0, 0.25]

[base.face_pool]                            # the river's depth 1 m off a face of the deck less its depth
measure = "face_pool"                       # 15 m off; 0.25 m before (pooled on both faces)
band    = [-0.1, 0.05]

[base.embankment_end]                       # the steepest post past the embankment's south end: 64.8
measure = "front_end_slope"                 # degrees before, into a dry pit 0.19 m below the river
band    = [0, 30]

[base.embankment_pit]
measure = "front_end_pit"
band    = [0, 0]

[base.embankment_to_bridge]                 # metres from the embankment's end to the crossing's: 33.9
measure = "front_gap"                       # before; it starts at `old_bridge.end` (R18)
band    = [0, 0]

