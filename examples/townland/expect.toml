# What a townland build must measure (docs/plan.md, M3; R13, R15, R18). Measures, never bytes (R15):
# each row names a measure of measure.py and the band it falls in. Taken by
#
#   python3 examples/townland/measure.py BUILD                       # base
#   python3 examples/townland/measure.py BUILD+<c> --base BUILD      # a change, built with --against
#   python3.11 examples/townland/measure.py BUILD --check base       # each row against its band
#
# Protocol: macOS arm64, the `via` release binary of the rewrite branch at 2026-11-15 16:00 KST
# (uncommitted tree after 579475e, with the core pass's made-kind effects and give-way), Python 3.12
# (sdk/python/.venv), one cold store for base, the changes on the same store with --against base,
# default threads, VIA_LIB=lib. One build each, so a band is the measured number: where someone
# looks, not a target. Cold base 105.8 s; each change 104 to 107 s (move_hill fails, below).
#
# Against the spike (FINDINGS 2026-11-13, R18): dead ends 39% before R18, 15% after; decks at the old
# bridge 3 then 1. Here: dead ends 53% (18 of 34; 15 on a district's outline into open land, 3 at
# gates, 0 inside the town), 1 deck, 0 doubled, 0 ways over the water. Worse on dead ends: see README.
#
# move_hill is not recorded: it fails (`formula.outside_field`, north_road's bed sample beyond the
# extent) although the route cost keeps 26 m off the edge and the north gate is 56 m in.

# ------------------------------------------------------------------------------------------ base

[base.blocks]
measure = "block"
band    = [14, 14]

[base.lots]
measure = "lot"
band    = [99, 99]

[base.streets]
measure = "street"
band    = [11, 11]

[base.houses]
measure = "houses"
band    = [66, 66]

[base.lots_held]
measure = "lots_held"
band    = [39, 39]

[base.dead_ends]
measure = "dead_end_count"
band    = [18, 18]

[base.dead_ends_inside]
measure = "dead_end_inside"
band    = [0, 0]

[base.decks]
measure = "decks"
band    = [1, 1]

[base.doubled_decks]
