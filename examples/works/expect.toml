# What a works build measures (docs/plan-kits.md, K9). Our own design: the research found the
# pipe kit as the model of a kit and pipes kept as glue, from one studio, and no account of pipes
# joined freely in three dimensions (docs/research/Modular kit failures in studios.md, sections
# 3, 6 and 12). Measures, never bytes (R15): each row names a measure of `measure.py` and the band
# it must fall in. Taken by
#
#   python3 examples/works/measure.py BUILD --world examples/works/world.toml         # base
#   python3 examples/works/measure.py BUILD+<c> --base BUILD                          # a change, built with --against
#   python3.11 examples/works/measure.py BUILD+<c> --base BUILD --check <c>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the tree at 2d88999 with
# K9's engine slice (a mount's `rise`, R75; joints, R76) and its fix pass, VIA_LIB=lib, Python 3.12
# (sdk/python/.venv) for the steps, lib/building's `lay`, `pipes` and `check` of the working tree
# with K9's second slice (pipe.py) and K9's fix pass. One fresh store: the
# base, then each change with --against the base, one build each. Measured 2026-11-23 in one run
# and checked in a second. A band is the measured number: not a target, it says where someone
# looks.

# ------------------------------------------------------------------------------------------ base
# The works as written: two buildings, two pipes and six room pieces, 64 numbers. `pipes`
# returns 6 legs and 36 pieces; every pipe piece's end lies on the next one's (27 joins, none
# loose). Nine joints that nothing wrote: three flanges in three ports 4.5 m up, and the six doors
# of the ring, the closing one among them. The upper leg's two ends meet its two risers' tops, each 3 m
# above what its riser stands on. Nothing is said but that one leg, at 7.5 m, has no support.

[base.built]
measure = "built"
band    = [1, 1]

[base.instances]
measure = "instances"
