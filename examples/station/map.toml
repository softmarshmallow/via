# The player map (lib/map, build.md 9.4): this table moves into world.toml when the engine runs
# `when = "export"` steps (M6 slice 2; today it is doc.not_yet). Until then
# `tools/map_export.py build/station --step examples/station/map.toml --out build/station.map`
# hands the finished build to it as the engine will (protocol.md 2.2).

[step.map]
when    = "export"
output  = "player_map"                            # build.md 9.4: how a reader finds it
command = ["python", "-m", "viasdk", "lib:map/export.py"]

[step.map.params]
cell   = 0.5                                       # the world's own resolution: rooms are small
tile   = 32                                        # 16 m tiles
ways   = { footpath = "footpath", doorway = "door" }
floors = { storey = "level" }                      # lib/building's floors: one plan per level
rooms  = { room = "storey" }
doors  = { doorway = "sill_z" }
links  = { flight = ["z0", "z1"] }                 # stairs join the floors they reach
walls  = ["structure"]                             # the pack's wall pieces, cut at 1.2 m
labels = { building = "" }
