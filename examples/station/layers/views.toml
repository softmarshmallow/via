# Layer `views` (rank 1): where the station is judged from (R17). One view at each door, at the
# step into the tower and at each stair's foot, and one inside every room. A view inside stands on
# its room's floor with `surface` (surfaces.md 4.1, M5), so its eye is `eye_height` over that floor.

[feature.outside]                             # the station from the east, on the walk
kind       = "bookmark"
at         = [52, 24]
toward     = "lens"
eye_height = 1.7
along      = "walk"                           # the straight line to the lens meets the cottage's
                                              # south side at x = 33.9, where no door is: the walk
                                              # stopped `blocked` at `cottage.floor`'s 0.45 m edge
                                              # (above the walker's 0.3 m step, under the wall). It
                                              # follows the walk in by the front door instead, and
                                              # stops at the kitchen table, which stands across the
                                              # line to the lens (13.9 m short): furniture, not a
                                              # fault; no straight line reaches the tower from here.

[feature.at_front_door]                       # the front door from the walk: the meeting on the porch
kind   = "bookmark"
on     = { ref = "front_door", t = 0.0 }
toward = "kitchen_table"

[feature.at_back_door]                        # the back door from the yard, looking in through it
kind   = "bookmark"                           # down the bunk room to the partition's opening (the
on     = { ref = "back_door", t = 0.0 }       # door and the opening are both at x = 33.5), so the
toward = "kitchen_bunks_wall"                 # walk goes through the door, not the wall

[feature.in_porch]
kind    = "bookmark"
at      = [38.6, 31.5]                        # in the door's line, 1.2 m in from the wall
toward  = "stove"
surface = "cottage.floor"

[feature.in_kitchen]
kind    = "bookmark"
at      = [36.0, 30.6]                        # off the barrels along the south wall
toward  = "kitchen_shelf"
surface = "cottage.floor"

[feature.in_bunks]
kind    = "bookmark"
at      = [36.0, 35.2]
toward  = "bunk_a"
surface = "cottage.floor"

[feature.in_passage]                          # down the passage to the step into the tower
kind    = "bookmark"
at      = [29.4, 32]
toward  = "tower_step.start"
surface = "cottage.floor"

[feature.in_store]                            # the store, from the step, toward stair_1's foot
kind    = "bookmark"
at      = [22.4, 31.7]
toward  = "stair_1.start"
surface = "tower_0.floor"

[feature.in_living]
kind    = "bookmark"
at      = [20.4, 33.0]                        # across the room, 2.6 m from the table
toward  = "living_table"
surface = "tower_1.floor"

[feature.at_stair_2]                          # the foot of the stair up from the living room
kind    = "bookmark"
at      = [20.0, 30.6]
toward  = "stair_2.end"
surface = "tower_1.floor"

# Up the spirals on foot: each walk follows its flight's points (`along`, build.md 15.1), from just
# before its foot on the floor below to its end, then on to a thing on the floor above. A straight
# walk toward the top would take a chord of the 122 degree arc and leave the tread.

[feature.up_stair_1]                          # the store up to the living room
kind    = "bookmark"
at      = [20.28, 34.48]
toward  = "living_chest"
along   = "stair_1"
surface = "tower_0.floor"

[feature.up_stair_2]                          # the living room up to the watch room
kind    = "bookmark"
at      = [19.95, 29.45]
toward  = "watch_desk"
along   = "stair_2"
surface = "tower_1.floor"

[feature.up_stair_3]                          # the watch room up to the lantern
kind    = "bookmark"
at      = [20.28, 34.48]
toward  = "lens"
along   = "stair_3"
surface = "tower_2.floor"

[feature.in_watch]
kind    = "bookmark"
at      = [21.0, 34.6]
toward  = "telescope"
surface = "tower_2.floor"

[feature.in_lantern]
kind    = "bookmark"
at      = [21.4, 29.5]
toward  = "lens"
surface = "tower_3.floor"

[feature.down_step]                           # from the passage down the step into the store: the walk
kind    = "bookmark"                          # crosses the 1.1 m gap in the cottage and tower walls
at      = [26.0, 32.05]                       # clear of the passage's crates
toward  = "store_lamp"                        # the line crosses x = 23.3 at y = 32.3
surface = "cottage.floor"

# The net loft (laid by `lay`): its storeys are `lay#net_loft_s*`, a produced name text may not
# write (R3). The foot stands by `at` on the ground and looks up the flight along the north wall to
# the top, so its walk climbs it. `loft_top` is what it looks at: its `at` carries a height (3.5 m,
# the upper floor's level to the nearest half metre), so it stands on the floor nearest that
# height, `lay#net_loft_s1` (surfaces.md 4.1, R65), looks back down the flight, and its walker
# starts on that floor and walks down it. Before R65 its eye was written 5.2 m over the ground to
# clear the floor: at 1.7 its eye was under it, all grey, its walk blocked at the rooms' wall.

[feature.loft_foot]
kind   = "bookmark"
at     = [54.0, 45.6]
toward = "loft_top"

[feature.loft_top]
kind   = "bookmark"
at     = [46.8, 45.6, 3.5]
toward = "loft_foot"

[feature.out_front]                           # out through the front door: the walk leaves the floor
kind    = "bookmark"                          # for the ground at the sill's height
at      = [38.0, 31.5]
toward  = "walk.start"
surface = "cottage.floor"
