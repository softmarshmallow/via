# The station's pack: primitives only, no files (assets.md 6). The shipped packs hold no furniture,
# so the dressing is drawn as boxes, cylinders, spheres and cones of the right size; swapping in a
# pack with models of these ids changes no world text (assets.md 1, R30).
#
# Sizes are [x, y, z] metres, front +y. A wall piece is long along y, so a run member (facing along
# its run) lies along the wall.

[taxon."structure/wall"]
[taxon."structure/roof"]
defaults = { solidity = "none" }           # a roof claims no ground: it is over the rooms, and
                                           # place.overlap reads plan footprints only
[taxon."structure"]
defaults = { collision = "box" }

[taxon."furniture"]
defaults = { collision = "box" }

[taxon."prop"]
defaults = { collision = "box" }

[taxon."light"]
defaults = { solidity = "none" }

[taxon."plant"]
defaults = { solidity = "none" }

# ------------------------------------------------------------------------------------- structure

[asset.wall]                    # a cottage wall piece, one metre of wall
primitive = "box"
size      = [0.2, 1.0, 2.8]
taxon     = "structure/wall"
