# The station's measures and their bands (measure.py says how each is taken). Taken on the M5
# slice 2 shared tree (uncommitted, after 152bf1f), release build, one run each, resolution 0.5,
# Python 3.9 for the steps and 3.13 for measure.py; `wall_gave_way` and `open_above_door_mm` on
# the M5 slice 3 shared tree (uncommitted, after 6f9f332), release build, one run, Python 3.12 for
# the steps and 3.13 for measure.py. The counts take in the net loft that
# lib/building's `lay` lays (2 storeys, 3 rooms, 1 flight, 1 doorway, 4 meetings).

[base]
protocol = { text = "via build world.toml; via query world.toml surfaces_at --in stair_points.json; measure.py --surfaces" }
storeys          = { band = [7, 7] }
rooms            = { band = [11, 11] }
flights          = { band = [5, 5] }
doorways         = { band = [3, 3] }
meetings         = { band = [16, 16] }
gap_max_mm       = { band = [0, 0] }
doors_in         = { band = [3, 3] }        # indoors reachable through a door: two doors in, one to the loft
floors_joined    = { band = [7, 7] }        # every floor is stepped onto by some path
unreached        = { band = [0, 0] }        # every storey and room reached from the ground
checked_meetings = { band = [16, 16] }
stair_surfaces   = { band = [5, 5] }        # at stair_1's middle: ground, store, stair_1, watch, stair_3
dressing         = { band = [60, 400] }
off_floor        = { band = [0, 0] }        # every hand set, run and instance on its floor (102 at slice 1)
shell_gave_way   = { band = [0, 0] }        # overlap by level (rules.md 8.1; 10 at slice 1)
wall_gave_way    = { band = [0, 0] }        # no wall member gives way to dressing (8 at slice 2: a 2.8 m hole)
open_above_door_mm = { band = [0, 0] }      # the tower's doorway is the ground storey's height (9350 at slice 2)
door_narrow      = { band = [0, 0] }        # the lint's clear width at each door (check.py rule 5)
doors_measured   = { band = [3, 3] }
clear_min_mm     = { band = [1100, 3000] }  # every door and the step 1.1 m clear (0.20 m at slice 1)
meshes           = { band = [12, 12] }      # a floor per storey, a tread per flight
laid             = { band = [100, 140] }    # the loft's walls and corners
laid_off_floor   = { band = [0, 0] }        # each on its storey's floor
in_flight        = { band = [0, 0] }        # no dressing on a flight's line below its tread (M5 close)

[move_stair]
wall_gave_way    = { band = [0, 0] }
in_flight        = { band = [0, 0] }        # the living table moved with the stair (1 at slice 3: up_stair_2 blocked)
meetings         = { band = [16, 16] }
gap_max_mm       = { band = [0, 0] }
unreached        = { band = [0, 0] }        # the rooms the moved stair serves still reached
floors_joined    = { band = [7, 7] }
off_floor        = { band = [0, 0] }        # the watch room's things follow its floor

[close_passage]
in_flight        = { band = [0, 0] }
unreached        = { band = [8, 8] }        # the tower's four storeys and four rooms sealed
unreached_names  = { text = "lantern living store tower_0 tower_1 tower_2 tower_3 watch" }
doors_in         = { band = [3, 3] }        # the cottage's two doors and the loft's still in
checked_meetings = { band = [15, 15] }
meetings         = { band = [15, 15] }      # meets.json drops tower_step.end with the lint

# The player map (lib/map, build.md 9.4), from `examples/station/map.toml`: M6 slice 1 tree, macOS
# arm64, a release `via` of that tree, the base build, then
#   sdk/python/.venv/bin/python tools/map_export.py B --step examples/station/map.toml --out M
#   python3 tools/map_render.py B M --out PNG --ppm 10 --expect examples/station/expect.toml
# (map_export.py stands in for the engine's export runner until `when = "export"` runs.)
[map]
floors           = { band = [4, 4] }        # ground floors (0.3, 0.309, 0.45 m), then the tower's 3.55, 6.7, 9.85
links            = { band = [5, 5] }        # three spirals, the loft's flight, the tower's step
walls            = { band = [250, 320] }    # 283: wall pieces through each floor's 1.2 m cut
footprints       = { band = [3, 3] }        # cottage, loft, tower: the lowest floor's surfaces
classes          = { band = [7, 7] }
way_on_cells_min = { band = [1, 1] }        # every 0.25 m of each way's line lies on a way's cell
