# ------------------------------------------------------------------------------------------ the net loft
# A second building, laid by lib/building's `lay` from one feature beside the hand-written ones: two
# storeys of the pack's kit (`structure/kit`), a door on the south side, a straight flight along
# the north wall, the ground floor cut into two rooms. lay's wall between rooms leaves no gap for a
# flight (the walk up it was blocked at 2.89 m when the cut stood at x = 49.3), so the cut is west
# of the flight. Everything it makes is named `lay#net_loft_*`.

[feature.net_loft]
kind     = "building"
region   = [[44, 40], [54.6, 40], [54.6, 46.5], [44, 46.5]]   # counter-clockwise from the south-west
storeys  = 2
doors    = [{ storey = 0, t = 0.04386, width = 1 }]    # x = 45.5, west of the rooms' cut
stair    = { t = 0.526316, width = 1, run = 5 }       # 0.9 m along the north wall from its corner
rooms    = [{ storey = 0, shares = [1, 2] }, { storey = 1, shares = [1] }]   # cut at x = 47.53, clear of the flight
kit      = "structure/kit"

# ------------------------------------------------------------------------------------------ steps

[step.lay]                                    # one call per building (lib/building/kinds.toml)
when     = "generate"
worker   = true
for_each = "kind:building"
command  = ["python", "-m", "viasdk", "lib:building/lay.py"]

[step.check]                                  # lib/building's lint: reach between surfaces and rooms,
when    = "lint"                              # and the clear width at each door between the pack's
worker  = true                                # wall pieces (rule 5); it reads what `lay` made
checks  = ["lay"]
command = ["python", "-m", "viasdk", "lib:building/check.py"]
params  = { kits = ["structure/wall", "structure/kit"] }

# ------------------------------------------------------------------------------------------ walls and roofs
# Runs along the storeys' outlines (rules.md runs; `on` a storey stands on its floor, surfaces.md
# 4.1), `offset` inward. The tower's shell is one ring of full-height pieces on its ground floor:
# an upper storey has no floor under its stairwell for a piece to stand on (lib/building README).
# Each run ends short of a doorway or the step by half its piece's length plus 0.55 m, so 1.1 m
# stays clear between the pieces either side (a 1 m way and 0.1 m, lay's `margin`); the building
# check measures it at each door (`door_narrow`), measure.py at the step (`clear_min_mm`).

[run.tower_wall]                              # leaves the 1 m step 1.1 m clear at bearing 90
asset   = "tower_shell"
on      = { ref = "tower_0", span = [0.055, 0.945], offset = 0.15 }
spacing = 0.8
ends    = "both"

[run.cottage_wall_south]                      # from the passage's west end round to the front door
