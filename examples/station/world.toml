name       = "station"
extent     = [0, 0, 64, 64]                   # metres: x east, y north
resolution = 0.5
seed       = 5
include    = ["building", "review"]
pack       = "pack.toml"                      # primitives: the shipped packs hold no furniture

# Station: a lighthouse and its keeper's cottage, inside (docs/plan.md M5: "indoors reachable through
# a door"; challenges 14, 15). The spike's world of the same name, written again in the v1
# vocabulary on lib/building's kinds (storey, room, doorway, flight, footpath): every floor is a
# kind surface of a storey, every way between floors is a meeting (spec/surfaces.md 4.4, 6.4).
#
# The tower is four round storeys stacked, joined by three spiral flights that hug its wall; each
# upper storey leaves out its stairwell (a notch over the flight below it). The cottage is one
# storey of four rooms, 0.15 m above the tower's ground floor, joined to it by a step through the
# passage. Two doors lead in from the ground, the front door at the porch and the back door at the
# bunk room; the tower is reached only through the cottage.
#
# Written by hand, not by lib/building's `lay` step (README "Not built yet"): `lay` lays rectangular
# buildings with straight flights; a round tower with spiral flights is this world's text. The net
# loft, further down, is the other way: one `building` feature that `lay` lays.
#
# Heights are world metres (surfaces.md 9, item 11). The ground is near 0.

[layer.views]
file  = "layers/views.toml"
owner = "views"
rank  = 1

# ------------------------------------------------------------------------------------------ fields

[field.height]
role = "surface"
base = "= 0.05 * fbm(20, 2, seed = 'ground')"

[field.ground]
type = "weights"
role = "material"

[field.ground.then.grass]
paint = "dry_grass"

[field.ground.then.path]
paint = "path"
mask  = "= 1 - smoothstep(0.8, 1.6, dist('kind:footpath', 4))"

