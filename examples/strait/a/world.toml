name       = "a"
extent     = [0, 0, 224, 224]
resolution = 1
datum      = "sea"                          # height zero is the sea's surface (composition.md 5)
seed       = 31
include    = ["land", "water", "ways", "review"]
pack       = "starter"

# A, the home island: one island, built and checked by itself (`via build a/world.toml`). It knows
# nothing of the strait it will stand in. Its road runs east to a slipway on its shore, and the
# slipway is an exit (lib/ways `slipway`, composition.md 7): a parent that imports this island must
# say what leaves from there. Built alone, nothing does, and nothing is said.

[let]
sea = 0                                     # metres: the water's surface, the datum

# ------------------------------------------------------------------------------------------ fields

[field.height]                              # land inside the isle's outline rising to a low crown;
role = "surface"                            # the sea bed outside it falling to 5.5 m in 25 m
base = "= if(inland > 0, 0.5 * smoothstep(0, 3, inland) + 0.09 * min(inland, 30) + 6 * smoothstep(22, 70, inland) + 1.5 * fbm(40, 3, seed = 'hills') * smoothstep(10, 40, inland), -0.22 * min(-inland, 25))"

[field.height.let]                          # metres inside the shore (negative out at sea), the
inland = "= sdist('isle', 60) + 4 * fbm(80, 2, seed = 'shore')"   # shore wavering by 5 m

[field.water]                               # lib/water's convention: dry, it is the ground
tags = ["water_level"]
base = "= max(f('height'), sea)"

[field.clearing]
role = "keep_out"
base = "= 0"

[field.ground]                              # lib/land/ground.md's rows, and sand at the water
type = "weights"
role = "material"

[field.ground.then.grass]
paint = "grass"

[field.ground.then.meadow]
paint = "meadow"
mask  = "= smoothstep(-0.1, 0.25, fbm(50, 3, seed = 'meadow'))"

[field.ground.then.sand]
paint = "sand"
mask  = "= 1 - smoothstep(1.2, 2.4, f('height') - sea)"

[field.ground.then.rock]
paint = "rock"
mask  = "= smoothstep(30, 38, slope('height'))"

[field.ground.then.track]
paint = "earth"
mask  = "= 1 - smoothstep(2.5, 3.2, dist('kind:lane', 6))"

# ------------------------------------------------------------------------------------------ the land

[feature.isle]                              # the island's outline: the height reads its distance
region = [[184, 112], [183.2, 131.9], [174.9, 151.4], [155.2, 163.2], [133.1, 168], [112, 174], [88.4, 174.5], [68.4, 163.7], [56.1, 147], [43.5, 131.2], [36.4, 112], [43.5, 92.8], [57.2, 77.7], [68.8, 60.8], [88.2, 48.9], [112, 50], [133.6, 54.8], [156, 59.8], [170.2, 75.6], [180.5, 92.8]]

# ------------------------------------------------------------------------------------------ the ways

[feature.slip]                              # where the ferry lands: an exit (lib/ways)
kind = "slipway"
at   = [186, 108]

[feature.quay_road]                         # from the chapel down to the slipway, ending on it by name
kind    = "lane"
path    = [[72, 116], [116, 113], [156, 110]]
ends_at = "slip"

# ------------------------------------------------------------------------------------------ built

[instance.chapel]
asset  = "house_wide"                       # the starter pack has no chapel
ground = "pad"
margin = 1
on     = { ref = "quay_road", t = 0.04, offset = 15 }
face   = "toward"

[instance.harbour_house]
asset  = "house_low"
ground = "pad"
margin = 1
on     = { ref = "quay_road", t = 0.72, offset = 11 }
face   = "toward"

[instance.store]
asset  = "barn"
ground = "pad"
margin = 1
on     = { ref = "quay_road", t = 0.55, offset = -13 }
face   = "toward"

# ------------------------------------------------------------------------------------------ growth

[scatter.woods]                             # trees on the island's higher ground, off steep faces
assets  = [{ id = "tree_oak", weight = 3 }, { id = "tree_pine", weight = 1 }]
spacing = 7
density = "= smoothstep(-0.2, 0.2, fbm(60, 3, seed = 'wood')) * smoothstep(1.5, 3.5, f('height')) * (1 - smoothstep(24, 32, slope('height')))"
scale   = [0.8, 1.3]

# ------------------------------------------------------------------------------------------ views

[feature.at_slip]                           # road and slipway, built alone
kind   = "bookmark"
on     = { ref = "quay_road", t = 0.9 }
toward = "slip"
