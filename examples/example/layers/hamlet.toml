# Layer `hamlet` (rank 1): what is built. It stands on the land (layer `world`) and may name what
# is there; the land may not name anything here (a layer refers downward only, documents.md 5).
# Every table is keyed by its id (R1), so a change names exactly one thing.

# ------------------------------------------------------------------------------------------ by hand
# Each house is placed by the thing it belongs to, so it follows when that thing moves. `ground =
# "pad"` lends its footprint, grown by `margin`, to lib/land's pad kind as the feature
# `<instance>.ground`: the ground under it is levelled and kept clear of trees.

[instance.cottage_a]
asset  = "house_low"
ground = "pad"
margin = 1
on     = { ref = "lane_west", t = 0.22, offset = 12 }   # 12 m to the left of the lane, going east
face   = "toward"                                       # its front to the lane

[instance.cottage_b]
asset  = "house_low"
ground = "pad"
margin = 1
on     = { ref = "lane_west", t = 0.30, offset = -12 }
face   = "toward"

[instance.church]                           # at the head of its path, its door down the path
asset  = "house_wide"                       # (the starter pack has no church: gap, README)
ground = "pad"
margin = 1
at     = [108.5, 166]
face   = 204                                # a bearing: clockwise from north

[instance.mill]                             # by the beck, turned to the water; on it, so it follows the beck
asset  = "barn"
ground = "pad"
margin = 1
on     = { ref = "beck", t = 0.43, offset = -12 }
face   = "toward"

[instance.farm]                             # over the bridge, by the barley
asset  = "barn"
ground = "pad"
margin = 1
on     = { ref = "lane_east", t = 0.32, offset = -14 }
face   = "toward"

[instance.inn]                              # on the green's own level: the green is its ground,
asset = "house_wide"                        # so it asks for no pad (a region's `offset` is inward)
on    = { ref = "green", t = 0.62, offset = 7 }
face  = "toward"

# ------------------------------------------------------------------------------------------ the row
# A row of town houses over the bridge, fronts to the lane: one `run` (rules.md 5), four members
# with half a step free at each end of `span`, so at t = 0.6, 0.7, 0.8 and 0.9 of the lane. Each
# member is `east_row#r<k>` and has its own pad; the row follows the lane when it moves.

[run.east_row]
asset  = "house_row"
ground = "pad"
on     = { ref = "lane_east", span = [0.55, 0.95], offset = 11 }
count  = 4
face   = "toward"

# Lamps along the far side of the same lane, about every 10 m, one at each end (`ends = "both"`):
# `spacing` is stretched so they fill the stretch evenly.
[run.lamps]
asset   = "lamp_post"
on      = { ref = "lane_east", span = [0.05, 0.95], offset = -3 }
spacing = 10
ends    = "both"

# Market stalls along the green's south edge, 3 m in from it (a region's outline runs
# counter-clockwise from its least vertex, so its left is inward). Stand-ins: the starter pack has
# no stall (README, gaps).
[run.stalls]
asset = "box_small"
on    = { ref = "green", span = [0.08, 0.3], offset = 3 }
count = 4
face  = "along"

# The well with its bench, as one unit (rules.md 4): placed by `square`, its items are
# `square.well` and `square.bench`, in the square's frame. Stand-ins: a box for the well, a log
# for the bench (no well or bench in the starter pack).
[set.well_corner.item.well]
asset = "box_small"

[set.well_corner.item.bench]
asset = "log"
at    = [0, -3]

[instance.square]                           # on the green
set = "well_corner"
at  = [96, 92]

# ------------------------------------------------------------------------------------------ steps

# This project's own generate step (tools/moisture.py): the distance to water, as a field `wet`.
# Declared here, it reads this layer and those below it; the dress layer above reads its field.
[step.moisture]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "../tools/moisture.py"]
params  = { reach = 40 }
