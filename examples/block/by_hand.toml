# ------------------------------------------------------------------------------------------ steps

[step.lay]                                    # one call per building (lib/building/kinds.toml)
when     = "generate"
worker   = true
for_each = "kind:building"
command  = ["python", "-m", "viasdk", "lib:building/lay.py"]

[step.check]
when    = "lint"
worker  = true
checks  = ["lay"]
command = ["python", "-m", "viasdk", "lib:building/check.py"]
params  = { kits = ["structure/city"] }

# ------------------------------------------------------------------------------------------ views

[feature.look_block]
at = [48, 39.4]

[feature.look_south]
at = [48, 22]

[feature.over]                                # the whole block from the south, above
kind       = "bookmark"
at         = [48, 2]
toward     = "look_block"
eye_height = 45

[feature.street]                              # the south row from the street, at eye height
kind   = "bookmark"
at     = [30, 4]
toward = "look_south"

[feature.corner]                              # the south-west corner from outside
kind   = "bookmark"
at     = [8, 6]
toward = "look_block"
