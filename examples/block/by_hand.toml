name       = "block"
extent     = [0, 0, 96, 80]                   # metres: x east, y north
resolution = 0.5
seed       = 7
include    = ["building", "review"]
pack       = "packs/city.toml"                # the city kit, beside the world (packs/make_kit.py)

# One city block as an author writes it with what the building library had before K6 of
# docs/plan-kits.md: twelve `building` features, each a region in metres worked out by hand so that
# its sides close on the kit (README.md, "By hand"). It is kept beside world.toml, which is the
# same block written as rows, so that what the build says of this one can be measured again.
#
# The block is 60 by 46.8 m. A row of five buildings stands along its south side and another along
# its north, each building 12.6 m deep (four bays and two posts); one building 21.6 m long closes
# each of the west and east sides between them; a yard is left in the middle. A building's side is
# 3 m for each bay and 0.6 m for its two corner posts, so every x and y below is a sum of those.
# Its door is 4.05 m along its street side (a bay, then the door's half bay), and its stair
# climbs the kit's 6 m along its yard side from 1.8 m (a landing of one floor tile).

# ------------------------------------------------------------------------------------------ fields

[field.height]                                # level ground: the kit, not the land, is the subject
role = "surface"
base = "= 10"

[field.ground]
type = "weights"
role = "material"

[field.ground.then.ground]
paint = "ground"

# ------------------------------------------------------------------------------------------ buildings

[feature.s0]                  # the south-west corner: fronts south and west
kind     = "building"
region   = [[18, 16], [30.6, 16], [30.6, 28.6], [18, 28.6]]
storeys  = 4
storey_h = 3.3
ground_h = 4.5
roof     = "flat"
doors    = [{ storey = 0, side = 0, at = 4.05 }]
stair    = { side = 2, at = 1.8 }
kit      = "structure/city"

