# What a block build measures (docs/plan-kits.md, K6; docs/research/Modular kit failures in
# studios.md, sections 7, 8 and 11). Measures, never bytes (R15): each row names a measure of
# `measure.py` and the band it must fall in. Taken by
#
#   python3 examples/block/measure.py BUILD --world examples/block/world.toml             # base
#   python3 examples/block/measure.py BUILD+<c> --world ... --base BUILD                  # a change, built with --against
#   python3.11 examples/block/measure.py BUILD+<c> --world ... --base BUILD --check <c>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the working tree after
# e469406 with K7's second slice of docs/plan-kits.md (a storey's own outline), VIA_LIB=lib, Python 3.12
# (sdk/python/.venv) for the steps, lib/building's `row`, `lay` and `check` of the working tree.
# One fresh store for `world.toml` and one for `by_hand.toml`: the base, then each change with
# --against the base, one build each. Measured again 2026-11-23 with K7's second slice, which
# added `setback`; no other row moved. A band is the measured number: not a
# target, it says where someone looks. `hand_setback` is not here: it was written before the key
# existed, as an author guessed it, and is exit 1 (`params`), with no build to measure.

# ------------------------------------------------------------------------------------------ base
# The block as four rows: every wall closes, no shopfront on the yard, no two neighbours alike.
# Four openings still face a neighbour: one bay of two north buildings' backs, on two storeys each,
# where the building round the corner stands against 3 m of the back (a side has one word).
# 68 blank bays look out over a lower neighbour's roof: a party wall is blank to its top.

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]
measure = "warnings"
band    = [0, 0]

[base.buildings]
measure = "buildings"
band    = [12, 12]

[base.storeys]
measure = "storeys"
band    = [48, 48]

[base.pieces]
measure = "pieces"
band    = [1230, 1230]

[base.tiles]
measure = "tiles"
band    = [3719, 3719]

[base.parapet]
measure = "parapet"
band    = [248, 248]

[base.open]
measure = "open"
band    = [0, 0]

[base.open_sum_mm]
measure = "open_sum_mm"
band    = [0, 0]

[base.party_windows]
