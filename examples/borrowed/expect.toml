# What a borrowed-kit build measures (docs/plan-kits.md, K10; examples/borrowed/README.md).
# Measures, never bytes (R15): each row names a measure of `measure.py` and the band it must
# fall in, or the value it must equal. Taken by
#
#   python3 examples/borrowed/measure.py BUILD --world world.toml                     # base
#   python3 examples/borrowed/measure.py BUILD+<c> --base BUILD --world world.toml --change changes/<c>.toml
#   python3.11 examples/borrowed/measure.py ... --check <section>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the tree at 9b8c2c8 (no
# engine change since), VIA_LIB=lib, Python 3.12 (sdk/python/.venv) for the steps, lib/building's
# `row`, `lay` and `check` of the working tree with K10's mends (a flat roof's own tile; a
# stretch shorter than any piece beside a gap goes, and the wall either side of a door piece is
# judged as it stands; a building of blocks as deep as its two corners) and K10's review's fix
# pass (roofs and corners measured from the models' triangles, not their boxes).
# Kenney's Modular Buildings 2.1, fetched by fetch.py (SHA-256 47e16146...), and the window
# block re-exported by packs/make_revised.py. One fresh store: the base, then each change with
# --against the base, one build each, then the base again on that store (`warm`). Recorded from
# one run and checked against a second, 2026-11-24. A band is the measured number: not a target,
# it says where someone looks.

# The fix plan's F2 (docs/plan-fixes.md), 2026-11-24: in `handed_over` the check is now skipped, so
# its two `kit_deck` are not said. check.py reads the ground along every building since F2 (rules
# 13, 14), and that build's ground is part of what failed (`pack.unknown_material`), so the lint
# gate skips the whole check (spec/diagnostics.md 4), its kit rules with it. Filed in TODO.md: the
# ground's rules as a lint of their own.

# The fix plan's F3 (docs/plan-fixes.md), 2026-11-24: a building takes its kit's storey and plinth,
# a door on its side's middle needs no `at`, and a door's `storey` is 0 unless written, so the
# world no longer writes them. The written numbers fell; nothing built moved.

# ------------------------------------------------------------------------------------------ base
# The base: three buildings and a row from Kenney's blocks, every wall closed, every flat roof
# covered once. The cottage's hipped roof is open over the bevel of each of its four corners, as
# Kenney made the hip and the corner block (55 dm2 inside the outline, 81 in the eaves, read from
# the models' triangles: README.md, "The bevels"); every building corner is cut on its outer side
# and no parapet corner is cut, which a corner or a hip turned the wrong way changes. The four
# `door_narrow` are the kit's size, not a fault of the fit: a doorway 0.5 m high under a block
# (README.md, "Scale"). The cottage has no door: two blocks deep, it has no inside (`unreached`).

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]
measure = "warnings"
band    = [5, 5]

[base.instances]
measure = "instances"
band    = [178, 178]

[base.blocks]
