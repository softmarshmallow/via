# ------------------------------------------------------------------------------------------ handed_over
# BEFORE: the kit as handed over (packs/plain.toml). The pack binds no ground and the build stops;
# what it said first is the fit: the hip and the slope stated at the span their block has and not
# their box (`kit_deck`), so the hip and the slopes stand in each other (`place.crowded`); the
# doorway the library's 1 m and no whole blocks beside it (`gap_wide`, 1.9 m open); the wide window,
# which the plain pack does not name.

[handed_over.errors]
measure = "errors"
band    = [1, 1]

[handed_over.unknown_material]
measure = "unknown_material"
band    = [1, 1]

[handed_over.kit_deck]
