# The layer above the court (world.toml): the steps that read what `courts` returned.

[step.lay]                                    # one call per building (lib/building/kinds.toml)
when     = "generate"
worker   = true
for_each = "kind:building"
command  = ["python", "-m", "viasdk", "lib:building/lay.py"]

[step.check]
when    = "lint"
worker  = true
checks  = ["lay", "courts"]
command = ["python", "-m", "viasdk", "lib:building/check.py"]
params  = { kits = ["structure/timber", "structure/yard"] }
