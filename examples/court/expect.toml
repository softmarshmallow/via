# What a court build measures (docs/plan-kits.md, K8: the East Asian half). Our own design: the
# research found no developer's account of East Asian building from pieces (docs/research/Modular
# kit failures in studios.md, section 12). Measures, never bytes (R15): each row names a measure
# of `measure.py` and the band it must fall in. Taken by
#
#   python3 examples/court/measure.py BUILD --world examples/court/world.toml         # base
#   python3 examples/court/measure.py BUILD+<c> --base BUILD                          # a change, built with --against
#   python3 examples/court/measure.py HAND --world examples/court/by_hand.toml        # by_hand.toml, built alone
#   python3.11 examples/court/measure.py BUILD+<c> --base BUILD --check <c>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the tree at 26cb33f,
# VIA_LIB=lib, Python 3.12 (sdk/python/.venv) for the steps, lib/building's `court`, `lay` and
# `check` of the working tree with K8's second slice (a hipped roof, eaves and roof pieces by
# span, lay.py rule 17; a wall on the ground, rule 18; the floor under posts, rule 15; court.py)
# and the mends of K8's one review (lib/building/test_k8fix.py).
# One fresh store: the base, then each change with --against the base, one build each;
# by_hand.toml in a store of its own. Measured 2026-11-23 in one run and checked in a second. A
# band is the measured number: not a target, it says where someone looks.

# ------------------------------------------------------------------------------------------ base
# The court written about its axis (lib/building/court.py): one `court` table, 22 numbers. The
# step returns four buildings: the yard, of no storeys, its 54 pieces on the ground; the main hall
# and two side halls, laid by posts (40 posts, 31 panels) and floored from post middle to post
# middle; three hipped roofs that stand 1.35 m beyond their walls and cover their 432 m2 once.
# Every piece has its image across the axis, to the millimetre. Nothing is said.

