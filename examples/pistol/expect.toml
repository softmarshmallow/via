# What a pistol build must measure, per state (challenge 47; docs/plan.md M5 "the measured object
# matches its published numbers"). Measures, never bytes (R15): each row names a measure of
# measure.py and the band it must fall in. A section is a state: `rest` or `racked`, then
# `+<accessory>` for each overlay fitted (accessories/<name>.toml), and measure.py checks that the
# build's own state and accessories are those (read from the build, spec/assets.md 12.4):
#
#   via build examples/pistol/world.toml [--change examples/pistol/changes/racked.toml] \
#       [--change examples/pistol/accessories/<a>.toml ...] --out BUILD --store STORE
#   python3.12 examples/pistol/measure.py BUILD --check racked+optic
#
# Protocol of the numbers below: macOS arm64, release `via` built from the working tree after
# 1a69ad4 (M5 slice 3) with the M5 close agents' edits as of 2026-11-17 03:30, VIA_LIB=lib, one
# store for all nine builds, each built once from the world with its change files (no --against).
# Millimetres. Every size is exact by construction (make_pack.py writes the parts from
# published.toml, so a band is one number): `length`, `width`, `height` the pistol's own parts
# (taxon `part/`), `added_*` what the accessories add beyond them. Sources differ on the published
# length by up to 9 mm (published.toml); the band is still the one used, since the pack is built
# from it.


# ------------------------------------------------------------------------------------------ rest
# the published numbers exactly

[rest.errors]
measure = "errors"
band    = [0, 0]

[rest.length]
measure = "length"
band    = [219, 219]

[rest.width]
measure = "width"
band    = [33, 33]

[rest.height]
measure = "height"
band    = [140, 140]

[rest.off_length]
measure = "off_length"
band    = [0, 0]

[rest.off_width]
measure = "off_width"
band    = [0, 0]

[rest.off_height]
measure = "off_height"
band    = [0, 0]

[rest.sight_radius]
measure = "sight_radius"
band    = [165, 165]

[rest.added_length]
measure = "added_length"
band    = [0, 0]

[rest.added_height]
measure = "added_height"
band    = [0, 0]

[rest.added_width]
measure = "added_width"
