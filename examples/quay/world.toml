name    = "quay"
extent  = [0, 0, 256, 256]
seed    = 7
include = ["land", "water", "town", "review"]   # kinds as data; the core knows none of these words
pack    = "starter"

# A small harbour town on a slope down to the water (docs/plan.md, M3). The land falls south to a
# harbour; a waterfront owns the bank (R18) and the streets end on it; one main way comes down from
# the gate at the top of the town to the quay, written by its ends and routed over the land (R16).
# The local streets are lib/town's step; the core nodes them, the main way and the waterfront into
# a network whose areas are blocks, and cuts lots along the blocks' street and quay sides
# (geometry.md 8). Houses and the views at the meetings (R17) are the layer above (layers/town.toml),
# since a step reads a cells table only from a layer above it (geometry.md 8.3).

[layer.dwellings]
file  = "layers/town.toml"
owner = "dwellings"
rank  = 1

[let]
sea   = 2                                   # metres: the harbour's water
quay  = 3.5                                 # metres: the deck, a metre and a half above the water

# ------------------------------------------------------------------------------------------ fields

[field.height]                              # a slope rising north from the harbour, a hill on it
role = "surface"
base = "= quay + 0.15 * (y - 46) - 6 * (1 - smoothstep(30, 46, y)) + 9 * (1 - smoothstep(0, 70, dist('hill', 90))) + 1.2 * fbm(70, 3, seed = 'lumps') * smoothstep(46, 70, y)"

[field.water]                               # lib/water's convention: dry, it is the ground
tags = ["water_level"]
base = "= f('height')"

[field.clearing]                            # pads, ways and the quay keep props off it (role:keep_out)
role = "keep_out"
base = "= 0"

# ------------------------------------------------------------------------------------------ the land

[feature.hill]                              # the hill's top: the height rises about it; `move_hill` moves it
at = [176, 150]

[feature.harbour]                           # scenery: the water over the ground below `sea`
kind         = "lake"
water_height = 2
region       = [[0, 0], [256, 0], [256, 46], [0, 46]]

[feature.quay]                              # the waterfront: owns the bank; the land on its left
kind  = "waterfront"
level = 3.5
bank  = 3                                   # the land meets the deck's level at its line here, so
path  = [[4, 46], [252, 46]]                # the deck's fade stays within the apron (3 m): the
                                            # houses facing the quay stand on their own terraces
                                            # (anchored, the fade overrode them: 18 `place.relief`)

# ------------------------------------------------------------------------------------------ the town

[feature.old_town]                          # the district the local streets fill; its foot is the quay
region = [[24, 46], [232, 46], [232, 196], [24, 196]]

[feature.gate]                              # where the main way comes in, above the town
at = [140, 212]

[feature.quay_head]                         # where the main way meets the quay (R18: a named meeting)
on = { ref = "quay", t = 0.42 }

# The main way: what it connects, routed over the land (R16). Its cost reads `height`, which reads
# `hill`: the placer places what a cost reads, through fields, first (derived.md 3 step 1), so the
# hill's name no longer has to sort before the way's. The cost is convex in the slope (degrees;
# 0.12 is about 400 per unit grade squared): a 4 degree post costs 3, an 8 degree one 9, so the
# course keeps to the gentler ground rather than crossing the hill's flank. It is not a cost of the
# course's own grade: on an even fall it still runs straight down (a direction-aware cost is owed).
# `smooth` rounds the eight-neighbour staircase off (derived.md 3 step 6).
[feature.high_street]
kind      = "main_street"
starts_at = "gate"
ends_at   = "quay_head"
path      = []
route     = "= 1 + 0.12 * pow(slope('height'), 2)"
smooth    = true

[step.streets]                              # local streets inside the district, down to the quay
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "lib:town/streets.py"]
params  = { district = "old_town", shore = "quay", origin = [128, 98], spacing = 50, cross = 70, lot_depth = 24 }

[network.town]                              # the core nodes them; every area is a block
from   = ["high_street", "kind:street", "quay"]
within = "old_town"
kind   = "block"

[cells.lots]                                # lots along each block's street and quay sides
within     = "town"
frontage   = ["high_street", "kind:street", "quay"]
spacing    = 11
depth      = 24
min_length = 6
min_area   = 60                             # a corner wedge or sliver smaller merges into its neighbour
kind       = "lot"

[step.review]                               # lib/review's measures; it checks the streets step (authority.md 7)
when   = "lint"
command = ["python", "-m", "viasdk", "lib:review/checks.py"]
checks = ["streets"]

# lib/review's reach lint (reach.py): a walker's body, and the places it must reach from the quay's
# head: every house's door, every view on land and the gate. The harbour's guide point must stay
# out of a walker's reach. Every profile key is stated; the lint assumes no body.
[step.reach]
when    = "lint"
command = ["python", "-m", "viasdk", "lib:review/reach.py"]

[step.reach.params]
reach = [
  { profile = "walker", from = "quay_head", to = [{ mount = "door", assets = ["@building/house"] }] },
  { profile = "walker", from = "quay_head", to = ["gate", "way_water", "street_quay", "street_street", "lot_street", "way_street", "from_gate", "wall_deck"] },
]
sealed = [{ profile = "walker", from = "quay_head", to = ["look_harbour"] }]

[step.reach.params.profiles.walker]         # metres
grade = 0.5                                 # about 27 degrees, a steep path
step  = 0.2                                 # a stair's riser
width = 0.6                                 # shoulders
wade  = 0.3                                 # boots
reach = 2                                   # a door's step, a view's few paces
