# Layer `town` (rank 1): what stands on the lots, and the views at the meetings. A step reads the
# lots (a cells table) only from a layer above the one that declares it (geometry.md 8.3).

[step.houses]                               # rows of town houses along each lot's frontage
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "lib:town/houses.py"]
# Each lot's frontage holds a row of `house_row` and `house_narrow` wall to wall, the gaps at the
# lots' edges (`gap` each end) and at junctions (lib/town/houses.py rules 2 and 4). `setback` is the
# least: each row stands back from its street's centre line until it is clear of the street's
# keep_out (the carriageway and its footways, lib/town `verge`), so a house's front is on the
# footway's back edge whatever the street's width. `terrace` (lib/town) levels each run of houses
# on one floor: a terrace of this layer changes `height`, which the streets step below reads in its
# own layer's view, where the terrace is not (authority.md 4.4). `max_cut` and `grade` are the
# terrace kind's own: a run whose terrace would move the land beside it by more than its
# `max_change` is left out (houses.py rule 7).
# A lot no row fits takes a corner house with its partner across a block corner's bisector
# (`corner`, rule 2c), else a row of 5 m deep houses (`fallback`, rule 2b): 57 of the 136 lots
# were empty, too small, before (M5 slice 3).
params  = { lots = "lots", setback = 0.5, gap = 0.25, terrace = "terrace", max_cut = 3, grade = 0.7, assets = ["house_row", "house_narrow"], fallback = ["house_shallow"], corner = ["house_corner"], streets = ["high_street", "kind:street", "quay"] }

# The town wall: a stone wall a metre outside the old town's west, north and east sides, down to
# the quay (lib/town/kit.py, the starter pack's wall kit). It leaves a gap wherever the land keeps
# things out (the ways that leave the town, the quay's deck), with an end pier either side; a
# corner pier at the two top corners; bays and fillers between, joints spread; on the slope each
# piece stands level, cut into fillers where a bay's end would leave its 0.5 m footing.
[feature.town_wall]
path = [[23, 47], [23, 197], [233, 197], [233, 47]]

[step.wall]
when    = "generate"
worker  = true
command = ["python", "-m", "viasdk", "lib:town/kit.py"]
params  = { runs = ["town_wall"], kit = "structure/wall", side = "left" }

[step.review_houses]                        # the houses step returns terraces, which change the
when    = "lint"                            # ground: a lint must check it (authority.md 7)
command = ["python", "-m", "viasdk", "lib:review/checks.py"]
checks  = ["houses"]

# The paint (lib/land/ground.md's rows, lib/town's paved rows), here so its street rows read the
# streets the step returns below this layer. A street paints its carriageway in setts and its
# footways in flags, each edge over one post (0.5 m), from the kinds' widths: `main_street` 6.5 m
# with 2 m footways, `street` 4.5 m with 1.5 m (lib/town/kinds.toml).
[field.ground]
type = "weights"
role = "material"

[field.ground.then.grass]
paint = "grass"

[field.ground.then.pavement]                # the footways, to the house fronts (rows go by order,
                                            # rank, then id: `footway` sorted before `grass`, which
                                            # painted over it)
paint = "flags"
mask  = "= max(1 - smoothstep(5.0, 5.5, dist('kind:main_street', 8)), 1 - smoothstep(3.5, 4.0, dist('kind:street', 6)))"

[field.ground.then.paved_apron]             # each terrace and the metre of apron it carries out
paint = "flags"                             # to the footway: a door opens onto flags, not grass
mask  = "= 1 - smoothstep(0, 0.5, dist('kind:terrace', 2))"

[field.ground.then.street]                  # the carriageway, kerb to kerb
paint = "setts"
mask  = "= max(1 - smoothstep(3.0, 3.5, dist('kind:main_street', 8)), 1 - smoothstep(2.0, 2.5, dist('kind:street', 6)))"

[field.ground.then.shore]                   # the harbour's bed: `order = 1` puts it and the rows
                                            # below after the street rows (authority.md 4.1 orders
order = 1                                   # rows by order, rank, then id), so a street stops at
paint = "gravel"                            # the deck
mask  = "= 1 - smoothstep(0, 1, f('height') - sea + 0.5)"

[field.ground.then.wall]                    # the quay wall's face: stone from the deck's water edge
order = 1                                   # (sd = -8) down to its foot; the deck's flags come after
paint = "rock"
mask  = "= 1 - smoothstep(1, 1.5, abs(sdist('quay', 20) + 8.75))"

[field.ground.then.wharf]                   # the deck and `apron` metres of quayside behind it, flagged
order = 1
paint = "flags"
mask  = "= smoothstep(-8.25, -7.75, sdist('quay', 20)) * (1 - smoothstep(3, 3.5, sdist('quay', 20)))"

# ------------------------------------------------------------------------------------------ views
# Where the build is judged: from eye height at every kind of meeting (R17). Each stands on the
# meeting or a step off it, and looks at a guide point written for it (a bookmark's `toward` takes a
# name, and produced names are not written in text, identity.md 3). Meetings of generated streets
# are selected from the network (`{ of, class, near }`), so the view follows its junction when the
# streets move (move_hill).

[feature.look_harbour]                      # guides: places the views look at
at = [112, 18]

[feature.look_up_d]
at = [198, 84]

[feature.look_along]
at = [162, 127]

[feature.look_lots]
at = [70, 64]

[feature.look_west]
at = [60, 99]

[feature.way_water]                         # way and water: the main way's foot on the quay
kind   = "bookmark"
on     = { ref = "high_street", t = 0.97 }
toward = "look_harbour"

[feature.street_quay]                       # street and waterfront: on the deck, up a street that ends on it
kind   = "bookmark"
at     = [198, 42]
toward = "look_up_d"

[feature.street_street]                     # street and street: a cross street's T on a contour street,
kind   = "bookmark"                         # looking along the contour street past the T
on     = { of = "town", class = "junction", near = [134.3, 142.4] }
toward = "look_along"

[feature.lot_street]                        # lot and street: from a street down to the quay, to a lot's house
kind   = "bookmark"
at     = [58.8, 80]
toward = "look_lots"

[feature.way_street]                        # way and street: the main way crossing the low contour street
kind   = "bookmark"
on     = { of = "town", class = "junction", near = [106, 100] }
toward = "look_west"

[feature.from_gate]                         # the town from the gate, above
kind       = "bookmark"
at         = [140, 208]
toward     = "quay_head"
eye_height = 3

# The town kit's corners and wedges (M5 slice 3): a corner house each side of a street's foot on
# the quay, each fronting one way and turning its side door to the other (houses.py rule 2c); a
# shallow house on a wedge between two contour streets (rule 2b).
[feature.look_corner]
at = [58.8, 70]

[feature.look_wedge]
at = [158.6, 103]

[feature.corner_houses]                     # on the quay's apron at the street's foot, up the street
kind   = "bookmark"
at     = [58.8, 47]
toward = "look_corner"

[feature.wedge_house]                       # on the contour street, at a shallow house's door
kind   = "bookmark"
at     = [158.6, 95.5]
toward = "look_wedge"

# The quay wall: the deck's water side drops `wall` metres (lib/town, `waterfront`). One view on the
# deck looks along the wall's top; one from the water, at a boat's eye, looks at its face.
[feature.look_wall_east]                    # on the deck, 2 m in from the wall's edge (was 37: in
at = [236, 40]                              # the water, so the view looked down past the wall)

[feature.look_wall_face]
at = [104, 40]

[feature.wall_deck]                         # on the deck, by its water edge, along the wall
kind   = "bookmark"
at     = [40, 40]
toward = "look_wall_east"

[feature.wall_face]                         # from the water, 13 m out: the ground there is the
kind       = "bookmark"                     # harbour's bed, so the eye is raised to a metre over
at         = [92, 25]                       # the water (`sea`)
toward     = "look_wall_face"
eye_height = 9
