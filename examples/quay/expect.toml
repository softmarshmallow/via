# What a quay build must measure (docs/plan.md, M3; R13's four obligations). Measures, never bytes
# (R15): each row names a measure of `measure.py` and the band it must fall in. Taken by
#
#   python3 examples/quay/measure.py BUILD                      # base
#   python3 examples/quay/measure.py BUILD+<c> --base BUILD     # a change, built with --against
#   python3.11 examples/quay/measure.py BUILD --check base       # each row against its band
#   ... --run FILE                                               # FILE from build --diagnostics FILE:
#                                                                # the run's records (R13 obligation 3)
#
# Protocol of the numbers below: macOS arm64 (M4 Pro), the `via` of the rewrite branch at
# 2026-11-15 (uncommitted tree after 9b1e23c, M3 slice 3, with the s4 town pass: terraces level at
# the footway, stepped where it climbs, down streets ending on a main way they cross, free street
# ends joined, form.py's edge ends; release profile), Python 3.12 (sdk/python/.venv) for the steps, a fresh store for
# base, the changes on the same store with --against base, one build each, default threads; VIA_LIB=lib. Measured once, so the bands are the measured number:
# a band is not a target, it says where someone looks.

# M3 slice 5 (ways): the quay's `ends` hold changes the ground the streets step reads near the quay,
# so lots, houses, terraces, doors_off (+2) and place.relief (+1) were re-recorded from one build
# each (this protocol; VIA_LIB a copy of lib with only lib/ways and lib/town kinds.toml changed, so
# lib/town/streets.py as of 2026-11-15 evening).

# M3 slice 5 (fix): every band below re-recorded on the combined tree (ways, streets and houses
# together: streets.py step 4b and `max_grade`, houses.py's floor held within 0.3 m of the footway,
# rule 4 reading keep_out at the posts inside a footprint, step 5b's cross-street ends), this
# protocol with VIA_LIB=lib itself, release `via` of that tree, one fresh store; base, then each
# change --against base once. The rows that moved: blocks 11 -> 9, lots 138 -> 136, rest 28 -> 27,
# streets 6 -> 5 (x0_140 is not laid: too steep, no slant fits), houses 128 -> 110, lots_held
# 77 -> 64, terraces 86 -> 77, doors_level 103 -> 110, doors_off 14 -> 0; move_hill lot_removed
# 102 -> 110, lot_added 66 -> 70, houses_removed 96 -> 84, identity.reselected 1 -> 2; unrelated
# lot_removed 3 -> 4, houses_removed_west 1 -> 0.

# M6 slice 1 (perf), times only (wall clock, one run each, release `via` of HEAD db28af7 with its
# lib and examples, a worktree, against the working tree of 2026-11-17 07:00 KST; fresh store, 14
# threads, load 12 to 35 from other agents' builds): cold 15.1 -> 18.9 s; unchanged into the same
# directory 0.2 -> 0.2 s; unchanged into a new directory 2.1 -> 0.2 s (graph.md 6.2, "Into a new
# directory"); unrelated --against cold 15.8 -> 16.5 s. Every row below holds. The houses step still
# reads the whole table here (7 s of unrelated): `for_each = "kind:block"` as in city is owed.

# M4 slice 1 (names): `names.rs` gives a cut its roles by travel, so 18 more of base's 136 lots
# keep their names across move_hill (44 kept against 26; every kept lot's outline is byte-identical
# in base and change: the review on foot, 2026-11-16). Only move_hill's three name-diff rows moved:
# lot_removed 110 -> 92, lot_added 70 -> 52, houses_removed 84 -> 67. Same protocol, release `via`
# of the working tree after eb8af62 with the M4 slice 1 diff, 2026-11-16, one fresh store, one
# build each, other agents building at the same time; the review on foot measured the same three
# numbers on its own build.
# M4 slice 3 (`given.land`, gate `entry`): every band re-checked, none moved: base 19/19, clear_one
# 2/2, pin_one 3/3, unrelated 5/5, move_hill 7/7 (east_gate section's protocol, below). Heights
# within 2e-6 m of the HEAD world's (the change review), plus `fields/land.npy`.

# M5 slice 3 (town kit: corner houses, shallow houses in wedges, the town wall as a kit run):
# release `via` of the working tree after 8ca8e83 with the slice 3 diff, VIA_LIB=lib, Python 3.12
# (sdk/python/.venv), one fresh store, base then each change --against base, one build each, other
# agents building at the same time, 2026-11-17. The rows that moved: houses 110 -> 127, lots_held
# 64 -> 90 (18 by 9 corner houses, 8 by shallow houses), terraces 77 -> 94, doors_level 110 -> 125
# (doors_off stays 0), views 8 -> 10 (corner_houses, wedge_house); move_hill houses_removed 67 -> 80
# (base has 17 houses more to move); unrelated houses_removed_west 0 -> 1 (below). New rows: the
# empty lots, the corner and wedge lots, and the town wall.

# ------------------------------------------------------------------------------------------ base

[base.blocks]                               # areas of `town`: the streets, the main way and the quay
measure = "block"
band    = [9, 9]

[base.lots]
measure = "lot"
band    = [136, 136]

[base.rest]                                 # what no frontage reaches (cells' rest pieces)
measure = "rest"
band    = [27, 27]

[base.streets]                              # 2 contour streets, 2 cross streets, 2 down to the quay
measure = "street"
band    = [5, 5]

[base.houses]                               # houses in rows along the lots' frontage (lib/town
measure = "houses"                          # houses.py rules 2 and 4): 52 detached houses, one per
band    = [127, 127]                        # lot, before the rows; 123 before the s4 town pass (its
                                            # rule 7 now reads the terrace's own padded outline at
                                            # the footway's level, and raises a floor up to 1.5 m
                                            # before leaving a run out: 2 left out, was 9)

[base.lots_held]                            # lots with a house; the rest are `step.houses.small`:
measure = "lots_held"                       # corner triangles and wedges no 8.6 m deep house fits,
band    = [90, 90]                          # and corner houses inside a cross street's keep_out
                                            # (64 before M5 slice 3's corner and shallow houses)

[base.empty_lots]                           # lots with no house: 72 before M5 slice 3 (57 `small`,
measure = "empty"                           # 15 left out for the land). Of the 46 left: lots
band    = [46, 46]                          # between two streets 10 m apart (no house clears both
                                            # footways), corners beside the main street's wider
                                            # keep_out, and the steep lots of rule 7

[base.corner_lots]                          # lots held by a corner house (houses.py rule 2c), two
measure = "corner_lots"                     # a house: the two triangles a block's corner bisector
band    = [18, 18]                          # cuts; 9 corner houses, 7 more pairs found too small
                                            # once both streets' keep_out is cleared

[base.wedge_lots]                           # lots held by a row of 4.5 m deep `house_shallow`
measure = "fallback_lots"                   # (rule 2b) where no 8 m deep house stands clear
band    = [8, 8]

[base.wall_pieces]                          # the town wall (lib/town/kit.py): 219 bays, 7 fillers,
measure = "kit_pieces"                      # 12 end piers (two path ends, five gaps), 2 corner piers
band    = [240, 240]

[base.wall_corners]
measure = "kit_corner"
band    = [2, 2]

[base.wall_gaps]                            # where a way leaves the town (high_street, s0, s1, the
measure = "kit_gaps"                        # cross streets near the edges) and the quay's deck
band    = [7, 7]

[base.wall_closes]                          # every stretch closes (kit.py rule 5)
measure = "kit_open"
band    = [0, 0]

[base.wall_footing]                         # no piece's end off its 0.5 m footing (rule 6); the
measure = "kit_steep"                       # slope is gentle enough that no bay is cut to fillers
band    = [0, 0]                            # (kit_split 0) and neighbours step 0.41 m at most

[base.terraces]                             # one level terrace per run of houses wall to wall, cut
measure = "terraces"                        # where the footway climbs more than 0.6 m (houses.py
band    = [94, 94]                          # rule 8): 74 before, one per run

[base.keep_out]                             # every row clear of its street's carriageway and
measure = "place.keep_out"                  # footways (7 before the rows were pushed back by the
band    = [0, 0]                            # keep_out they read)

[base.unowned]                              # every meeting is owned by the network or a named point (R18)
measure = "geom.unowned_crossing"
band    = [0, 0]

[base.dead_ends]                            # lib/review/form.py's dead ends: ends on nothing inside
measure = "dead_end_count"                  # the town ("Dead end and edge end"; the world declares
band    = [0, 0]                            # the form lint)

[base.edge_ends]                            # ends where a way leaves the town, apart: s0 and s1 at
measure = "edge_ends"                       # the district's west and east edges, the main way at
band    = [5, 5]                            # the gate

[base.core_dead_ends]                       # the core's own count over the network (geom.dead_end
measure = "geom.dead_end_count"             # records' count): an end on the outline is a junction
band    = [0, 0]                            # there, so it agrees

[base.doors_level]                          # doors within 0.3 m of the ground 3 m out (measure.py,
measure = "doors_level"                     # "Doors"): 10 of 123 before the s4 town pass, when each
band    = [125, 125]                        # terrace stood at its own mean

[base.doors_off]                            # doors more than 1 m off it: 91 of 123 before the s4
measure = "doors_off"                       # pass, 14 after it (floors raised up to 1.5 m); 0 since
band    = [0, 0]                            # slice 5 holds a floor within 0.3 m of its footway

[base.views]                                # one per kind of meeting, one from the gate, two at the wall
measure = "bookmarks"                       # (+ corner_houses and wedge_house, M5 slice 3)
band    = [10, 10]

[base.unlevelled]                           # houses on terraces (lib/town `terrace`, one per run)
measure = "place.relief"                    # standing on more relief than their asset allows
band    = [9, 9]                            # (0.6 m); 50 with one lib/land pad per house in rows;
                                            # 9 before the s4 town pass. Most are a step between two
                                            # floors of a stepped row under a party wall: the step
                                            # falls within one 0.5 m post cell of the footprint

[base.way_end_grade]                        # R16: a way's end is level with the deck it ends on. The
measure = "way_end_grade"                   # steepest metre of the last 20 m of a way ending on the
band    = [0, 0.35]                         # quay (measure.py, "meetings"); 1.14 before (high_street
                                            # fell 2.38 m in its last 3 m). 0.34 is d35/d175's first
                                            # 2 m, where the deck's 3 m `bank` fade is concave

[base.way_end_drop3]                        # metres it falls in its last 3 m: at most `end_grade` (0.2)
measure = "way_end_drop3"                   # over 3 m
band    = [0, 0.6]

[base.wall_ends]                            # the steepest post past each end of the quay within 12 m:
measure = "front_end_slope"                 # 80.8 degrees before (the wall ran round the end); the
band    = [0, 36]                           # wall now fades over each end's tenth

[base.reach]                                # lib/review reach (a worker since M5): every door, the side
measure = "reach_held"                      # doors and the eight places from quay_head, and
band    = [145, 145]                        # look_harbour sealed: every stated pair holds

[base.reach_pairs]                          # 127 doors, 9 side doors, 8 places, 1 sealed
measure = "reach_pairs"
band    = [145, 145]

[base.side_doors]                           # corner houses' `side` mounts, each walked to (M5:
measure = "side_doors"                      # reach names `mount = ["door", "side"]`;
band    = [9, 9]                            # before, only `door`: TODO town kit)

[base.unreached]
measure = "reach_unreached"
band    = [0, 0]

# ------------------------------------------------------------------------------------------ R13

[clear_one.house_gone]                      # 1. a clear on a lot removes its row (two houses)
measure = "houses_removed"
band    = [2, 2]

[clear_one.lots_kept]
measure = "lot_removed"
band    = [0, 0]

[clear_one.reach]                           # every pair holds (two doors fewer)
measure = "reach_held"
band    = [143, 143]

[pin_one.house_replaced]                    # 2. a pin inside a cell replaces the houses it overlaps
                                            # (the shed stands across a party wall: two)
measure = "houses_removed"
band    = [2, 2]

[pin_one.reported]                          # and says so (identity.pin_removed)
measure = "identity.pin_removed"
band    = [1, 1]

[pin_one.lots_kept]
measure = "lot_removed"
band    = [0, 0]

[pin_one.reach]                             # every pair holds (two doors fewer)
measure = "reach_held"
band    = [143, 143]

# 3. placed on a generated street: the views `street_street` and `way_street` stand on network
# junctions (`{ of = "town", class = "junction", near }`); `bookmarks` above counts them placed.

[unrelated.lots_west]                       # 4. a distant edit: no lot west of x = 200 m renamed
measure = "lot_removed_west"
band    = [0, 0]

[unrelated.rest_west]
measure = "rest_added_west"
band    = [0, 0]

[unrelated.blocks]
measure = "block_removed"
band    = [0, 0]

[unrelated.lots_east]                       # the east end does change
measure = "lot_removed"
band    = [4, 4]

[unrelated.houses_west]                     # one house west of 200 m goes: its lot (175.9, 139.7)
measure = "houses_removed_west"             # keeps its name but its shape moves with `s1`'s thinned
band    = [1, 1]                            # points, and the house no longer fit (1 until slice 5).
                                            # M5 slice 3: 1 again, `h48422ba69c7929ee_2`, a shallow
                                            # house (rule 2b) at (134.6, 139.7) on a lot empty before:
                                            # the lot keeps its name, its outline goes 83 -> 87
                                            # points under the east edit, and the house no longer
                                            # stands clear (the core's cells, TODO M5 slice 3)

[unrelated.reach]                           # every pair holds (138 of 138)
measure = "reach_held"
band    = [138, 138]

# ------------------------------------------------------------------------------------------ move_hill

[move_hill.streets_kept]                    # the hill moves under the town: `s0` now ends on the main
measure = "street_removed"                  # way, which goes round the hill's east side, and the east
band    = [2, 2]                            # streets `d175` and `x0_140` are not laid

[move_hill.lots_resettled]                  # the contours move, so the lots between them do
measure = "lot_removed"
band    = [92, 92]

[move_hill.lots_new]                        # 63 before the s4 town pass: `d105`, a street down
measure = "lot_added"                       # from s0 that crosses the main way, now ends on the
band    = [52, 52]                          # way (streets.py step 6) instead of being dropped

[move_hill.street_down_to_way]              # that street
measure = "street_added"
band    = [1, 1]

[move_hill.houses_moved_out]                # of base's 127 (92 before the s4 town pass; 67 of 110
measure = "houses_removed"                  # before M5 slice 3's corner and shallow houses)
band    = [80, 80]

[move_hill.wall_closes]                     # the wall's gaps move with the streets; every stretch
measure = "kit_open"                        # still closes (an end pier at a gap slides into it,
band    = [0, 0]                            # kit.py rule 5: 3.75 m between a corner and a gap was
                                            # open with fixed caps)

[move_hill.views_reselected]                # `way_street` follows its junction 14.3 m and says so;
measure = "identity.reselected"             # since slice 5 two views resolve to one new block
                                            # (2): a run diagnostic, from --run (build --diagnostics)
band    = [2, 2]

[move_hill.way_end_grade]                   # R16, as in base
measure = "way_end_grade"
band    = [0, 0.35]

[move_hill.reach]                           # every pair holds (102 of 102; 2 side doors)
measure = "reach_held"
band    = [102, 102]


# ------------------------------------------------------------------------------------------ east_gate
# A second exit (lib/town `entry`) at (244, 120), for `county`'s `forgotten_exit`. Built alone it
# writes no field and nothing answers it, so the town is unchanged and nothing is said. Measured
# M4 slice 3 (fix pass, 2026-11-16): release `via` of the working tree after 479978b with the slice 3
# diff, VIA_LIB=lib, Python 3.12 (sdk/python/.venv), one fresh store, base then east_gate
# --against base, one build each, other agents building at the same time.

[east_gate.lots_kept]
measure = "lot_removed"
band    = [0, 0]

[east_gate.houses_kept]
measure = "houses_removed"
band    = [0, 0]

[east_gate.streets_kept]
measure = "street_removed"
band    = [0, 0]

[east_gate.errors]
measure = "errors"
band    = [0, 0]

[east_gate.reach]                           # as base
measure = "reach_held"
band    = [145, 145]
