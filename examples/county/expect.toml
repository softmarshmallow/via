# What a county build must measure (docs/plan.md M4: the town as a fill on simulated land; an import
# moved and turned; a forgotten exit says what to write). Measures, never bytes (R15). Taken by
#
#   python3 examples/county/measure.py BUILD                                         # base
#   python3 examples/county/measure.py BUILD+<c> --run BUILD+<c>.run.json            # a change
#   python3.13 examples/county/measure.py ... --check <section>                      # the bands
#
# Protocol (M4 slice 3, 2026-11-16): macOS arm64, release `via` of the rewrite working tree after
# 479978b with the slice 3 diffs, VIA_LIB=lib, one fresh store: the county, then each change with
# `--against` the county base on the same store; one build each, other agents building at the same
# time. Measured once, so each band is the measured number: it says where someone looks.
# Base 7.8 s wall, 0.84 GB peak; move_town 11.1 s; forgotten_exit 7.3 s.

# ------------------------------------------------------------------------------------------ base

[base.errors]
measure = "errors"
band    = [0, 0]

[base.road_off]                             # the road ends on the exit it answers (R9)
measure = "road_off"
band    = [0, 0]

[base.gate_ground_off]                      # the gate stands on the joined ground
measure = "gate_ground_off"
band    = [0, 0.01]

[base.deck_off]                             # the quay's deck at 3.5 m: 1.5 at its faded ends
measure = "deck_off"                        # (lib/town waterfront ends fade), on the county's shore
band    = [1.5, 1.5]

[base.seam]
measure = "seam"
band    = [0, 0]

[base.wet_views]                            # one: quay's own `wall_face`, a view from the water by design
measure = "wet_views"
band    = [1, 1]

[base.toward_off]
measure = "toward_off"
band    = [0, 0]

[base.town_streets]                         # the town's own steps run in the county's build (M4 slice 4,
measure = "town_streets"                    # composition.md 12): 2 streets on the county's land, against
band    = [2, 2]                            # quay's 5 alone; measured once, release, 2026-11-16

[base.town_instances]                       # its houses and its wall (quay alone holds more: fewer
measure = "town_instances"                  # lots here). 324 = 249 pieces of the town wall (quay's
band    = [324, 324]                        # `wall` step, lib/town kit.py, M5 slice 3) + 75 houses
                                            # (68 before slice 3's corner and shallow houses, rules
                                            # 2b, 2c). Re-banded M6 slice 1, 2026-11-17: release
                                            # `via` of the working tree after db28af7 with other M6
                                            # slice 1 diffs, one fresh store, county base, every
                                            # county row passing; from its import, not a fault

# ------------------------------------------------------------------------------------------ move_town

[move_town.ran_import_town]                 # a fill moved reads its land again: the town re-runs
measure = "ran_import_town"                 # (composition.md 12, "a fill moved"); whole, as the
band    = [1, 1]                            # import is built eagerly in `prepare`

[move_town.ran_placed_town]                 # the frame and the five places the county names
measure = "ran_placed_town"
band    = [6, 6]

[move_town.shapes_ran]                      # only what names a place of the town
measure = "shapes_ran"
band    = ["at_gate", "from_gate", "join_road", "join_shore", "join_west", "north_road"]

[move_town.fields_ran]                      # every field chunk: no `brought` node per chunk yet
measure = "fields_ran"
band    = [1280, 1280]

[move_town.road_off]
measure = "road_off"
band    = [0, 0]

[move_town.seam]                            # one: 14 pairs at 1.61 where the turned quay meets the bay
measure = "seam_grade"                      # (TODO "a turned import notches sheer ground")
band    = [1.607, 1.607]

# ------------------------------------------------------------------------------------------ forgotten_exit

[forgotten_exit.unanswered]                 # import.exit_unanswered on town.east_gate
measure = "unanswered"
band    = [1, 1]

[forgotten_exit.write]                      # with the line that answers it
measure = "unanswered_write"
band    = ["ends_at = \"town.east_gate\""]

# ------------------------------------------------------------------------------------------ M4 slice 4
# Protocol (M4 slice 4, label brought, 2026-11-16): macOS arm64, release `via` of HEAD b8c0b02 with
# this slice's import.rs and resolve.rs hunks only (paint brought, a derived field's offset, wall
# cells read at the nearest post; composition.md 6.2), VIA_LIB=lib, each world and import alone on a
# fresh store, each change built --against the base on its store. One build each, other agents
# building at the same time. Before these hunks: materials earth, grass, gravel and rock; walk_wet
# 0.

[base.walk_wet]
measure = "walk_wet"
band    = [0, 0]

[base.materials]                    # the town's setts and flags brought
measure = "materials"
band    = ["earth", "flags", "grass", "gravel", "rock", "setts"]

[base.wall_mid]                     # unturned: every wall runs post to post
measure = "wall_mid"
band    = [0, 0]

[move_town.wall_mid]                # turned 8 degrees: 203 posts half-way down a wall before wall
measure = "wall_mid"                # cells, 122 with them (the rest in cells under 2 m: slopes)
band    = [122, 122]

[move_town.walk_wet]
measure = "walk_wet"
band    = [0, 0]

[move_town.materials]
measure = "materials"
band    = ["earth", "flags", "grass", "gravel", "rock", "setts"]
