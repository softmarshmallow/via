# basin's revised pack: the starter pack's models (lib/packs/starter), re-bound from here, with one
# revision made after its facts were accepted. The facts file beside it, revised.facts.toml, was
# written by `via pack accept examples/basin/packs/revised.toml` before the revision, so it holds
# the oak as the starter pack ships it. The revision: tree_oak's trunk footprint 1 m square to
# 1.6 m square (`footprint` below), a declared placement fact, so every build with this pack raises
# asset.revised naming every oak it places until someone accepts it (assets.md 4.2). Requested by
# changes/revised_oak.toml.

root = "../../../lib/packs/starter"

[taxon."building/house"]
[taxon."building/shed"]
[taxon."building"]
defaults = { collision = "box", max_relief = 0.6 }

[taxon."plant/tree"]
defaults = { collision = "hull" }

[taxon."plant/bush"]
[taxon."plant/fern"]
[taxon."plant"]
defaults = { solidity = "none" }

[taxon."rock"]
defaults = { collision = "hull" }

[taxon."prop/box"]
[taxon."prop/lamp"]
[taxon."prop/fence"]
[taxon."prop"]
defaults = { collision = "box" }

[asset.house_low]
file      = "house_low.glb"
taxon     = "building/house"
footprint = [[-4, -3], [4, -3], [4, 3], [-4, 3]]   # the walls, not the eaves

[asset.house_low.mount.door]
at = [0, 3]

[asset.house_wide]
file      = "house_wide.glb"
taxon     = "building/house"
footprint = [[-5.5, -3.5], [5.5, -3.5], [5.5, 3.5], [-5.5, 3.5]]

[asset.house_wide.mount.door]
at = [0, 3.5]

[asset.shed_gable]
file  = "shed_gable.glb"
taxon = "building/shed"

[asset.tree_oak]
file      = "tree_oak.glb"
detail    = ["tree_oak_low.glb"]
taxon     = "plant/tree"
solidity  = "solid"
footprint = [[-0.8, -0.8], [0.8, -0.8], [0.8, 0.8], [-0.8, 0.8]]   # revised: the trunk and its root flare

[asset.tree_oak_large]
file      = "tree_oak_large.glb"
taxon     = "plant/tree"
solidity  = "solid"
footprint = [[-0.6, -0.6], [0.6, -0.6], [0.6, 0.6], [-0.6, 0.6]]
tags      = ["landmark"]

[asset.tree_pine]
file      = "tree_pine.glb"
taxon     = "plant/tree"
solidity  = "solid"
footprint = [[-0.4, -0.4], [0.4, -0.4], [0.4, 0.4], [-0.4, 0.4]]
tags      = ["winter"]

[asset.bush_round]
file  = "bush_round.glb"
taxon = "plant/bush"

[asset.bush_wide]
file  = "bush_wide.glb"
taxon = "plant/bush"

[asset.fern_low]
file  = "fern_low.glb"
taxon = "plant/fern"

[asset.rock_a]
file  = "rock_a.glb"
taxon = "rock"

[asset.rock_b]
file  = "rock_b.glb"
taxon = "rock"

[asset.box_small]
file  = "box_small.glb"
taxon = "prop/box"

[asset.lamp_post]
file  = "lamp_post.glb"
taxon = "prop/lamp"

[asset.fence_post]
file  = "fence_post.glb"
taxon = "prop/fence"

[material.grass]
colour = [0.2, 0.4, 0.1]

[material.rock]
colour = [0.45, 0.43, 0.4]

[material.sand]
colour = [0.76, 0.7, 0.5]

[material.gravel]
colour = [0.36, 0.33, 0.28]
