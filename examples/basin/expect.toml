# basin's expectations: the measures each build is compared by, against the spike's exported
# results in fixtures/oracle/basin*/ (docs/plan.md: measures, never bytes; R15). Raster bytes,
# scatter positions and found courses differ by design; what must agree is where the water runs,
# what the facts hold to, and what a change moves.
#
# Each [measure.<id>]:
#   build    the build measured: "base", or a change's name
#   what     the measure, in words
#   oracle   the spike's number, with `source` (file and where in it)
#   within   how far from `oracle` the v1 build may be, in the measure's unit
#   measured the v1 number, with `protocol`
#
# Protocol of every `measured` below (2026-11-14, macOS arm64, release build, one run each,
# default threads): `via build` on the M2 engine, each change built `--against` the base, read and
# compared by `python examples/basin/measure.py BUILD_ROOT`. A course point at `t` is measured along
# the course's path as the step returns it; heights are the settled ground, bilinear between posts.
# Positions in metres.
#
# NOT HOLDING since M2 (found by the M7 slice 1 on-foot review, re-taken in its fix pass):
# ground_tarn_view, ground_middle and mouth_moves are OUT of their oracle bands on every commit
# since M2. Their 2026-11-14 `measured` values came from a state never committed: the committed
# `layers/gen/terrain/` (56ca49e) holds that state's `eroded`, while a fresh run of the terrain step
# on the same `before` (bit-equal) gives an `eroded` up to 16.88 m away, on 56ca49e, 9ef43c9,
# 8f7b169, 277993f and the M7 slice 1 tree alike (release `via` and `via-terrain` of each, one
# fresh store, one run each; ground at (1260, 1740) 44.36 on every one). Not the M7 cutover, not
# the river's `width`. The re-taken `measured` below are the working tree's at 18:41 KST
# 2026-11-17 (release, fresh store, one run each, every change `--against` the base); the bands
# are unchanged. Which state the old numbers came from, and whether the bands or the land move,
# is owed (TODO, "From M7 slice 1").
#
# How the spike's views map to v1: its bm_bank, bm_valley, bm_haven and bm_head eyes and look
# points stood on its found course at t = 0.55 (offset 14), 0.80 (offset 40), 0.85 and 0.03
# (offset -30), and looked at it at t = 0.40, 0.35, 0.85 and 0.30; so the look points are course
# points at those t. v1's views are judged at eye height (R17) and stand elsewhere: on_bank stands
# where bm_bank stood (t = 0.55, offset 14) and looks at t = 0.40.

[measure.course_ends]
build    = "base"
what     = "Where the course the water took from the spring ends"
oracle   = "sea"
source   = "basin/diagnostics.json: no terrain finding; the spike's course reached the sea"
measured = "sea"

[measure.course_t040]
build    = "base"
what     = "The course's point at t = 0.40, metres"
oracle   = [1854.6, 1925.4]
source   = "basin/measures.json /bookmarks bm_bank look"
within   = 40
measured = [1868.2, 1928.4]

