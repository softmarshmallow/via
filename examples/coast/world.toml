name       = "coast"
extent     = [0, 0, 200, 160]                 # metres: x east, y north; the sea is to the south
resolution = 0.5
seed       = 23
include    = ["land", "water", "ways", "review", "map"]
pack       = "starter"

# Coast: a headland that ends at the sea in a sheer cliff, a sea cave under it, and east of it a
# harbour beach where a beck runs down to the sea under a bridge (docs/plan.md M5; challenges 7
# and 8). The spike's coast written again in the v1 vocabulary: everything that is not the terrain
# is a kind surface of a named feature (spec/surfaces.md 1, R25), and where two surfaces meet is a
# meeting (3.3).
#
# - The cliff says it is sheer: two `sheer_cliff`s (lib/land) whose face is a kind surface drawn
#   along their line, the terrain's own step cut away under it (surfaces.md 1.3). The terrain alone
#   would draw a 20 m step stair-stepped at the 0.5 m posts.
# - The cave (lib/land `cave`, surfaces.md 6.5) is a floor under the headland, 20 m below its top,
#   with its mouth cut open. The cave owns its mouth (R18): the two faces end at its jambs by name,
#   so the face is open wherever the cave is (`changes/move_cave.toml`).
# - The bridge (lib/ways `crossing`) owns a deck that is its kind surface, so the beck runs on
#   beneath it (`changes/long_deck.toml` lengthens it).

[layer.views]
file  = "layers/views.toml"
owner = "views"
rank  = 1

# ------------------------------------------------------------------------------------------ fields

# The land is read from the cliff's line (`coast`, left of the nearer face positive): the beach rises
# 0.06 a metre to the face's foot, 1.5 m (the sea, level 0, 25 m out), and the headland's top stands
# at 21.5 m behind it, rising 0.02 a metre with a little noise. East of x = 128 it all falls to
# the low land by x = 150, where the beach carries on rising inland. The cliff's `step` writes the
# face's own drop; this is the land each side of it.
[field.height]
role = "surface"
base = "= mix(if(coast < 0, 1.5 + 0.06 * coast, 21.5 + 0.02 * coast + 1.5 * fbm(40, 3, seed = 'top') * smoothstep(0, 25, coast)), 1.5 + 0.06 * (y - 70), smoothstep(128, 150, x))"

[field.height.let]                            # metres from the nearer face, left of it positive
coast = "= if(dist('west_face', 80) < dist('east_face', 80), sdist('west_face', 80), sdist('east_face', 80))"

[field.water]                                 # lib/water: dry, it is the ground; the sea at 0
tags = ["water_level"]
base = "= max(f('height'), 0)"

# No `keep_out` field: nothing is scattered here, and the crossing's `clear` would refuse the
# parapet's posts on its own deck (place.keep_out on each: the run stands on the terrain under the
# deck, TODO "a run `on` a thing with one surface").

[field.ground]
type = "weights"
role = "material"

[field.ground.then.grass]
paint = "grass"

[field.ground.then.sand]                      # the beach, to 2.5 m over the sea
paint = "sand"
mask  = "= 1 - smoothstep(2.5, 3.5, f('height'))"

[field.ground.then.rock]                      # the cliff's brink and the headland's flank
paint = "rock"
mask  = "= smoothstep(30, 40, slope('height'))"

# ------------------------------------------------------------------------------------------ the cliff and the cave

# The cave runs north under the headland from its mouth on the beach at the cliff's foot. The
# mouth is on a post (lib/land `cave`), at the foot's level, so the beach meets the floor at gap 0.
[feature.sea_cave]
kind = "cave"
path = [[100, 70], [100, 80], [104, 92], [110, 100]]
z0   = 1.5
z1   = 3.0

# The cliff's face, west and east of the mouth: its foot along the line, the headland on its left,
# oblique to the posts. Each ends at a jamb of the cave by name (R18), so the faces leave the mouth
# open and follow it.
[feature.west_face]
kind    = "sheer_cliff"
path    = [[0, 63], [36, 71.3], [68, 66.1]]
ends_at = "sea_cave.left_jamb"
foot_z  = 1.5
top_z   = 21.5

[feature.east_face]
kind      = "sheer_cliff"
starts_at = "sea_cave.right_jamb"
path      = [[113, 73.7], [124, 71.2]]
foot_z    = 1.5
top_z     = 21.5

# ------------------------------------------------------------------------------------------ the harbour

[feature.beck]                                # down the low land to the sea
kind  = "beck"
width = 5
path  = [[172, 160], [168, 120], [172, 80], [170, 30]]

# The bridge: its two ends on the beck's banks, 8 m either side of its line, so it is square to the
# water and moves with it. The deck is 0.6 m over the ground at its ends.
[feature.bridge_west]
on = { ref = "beck", t = 0.5, offset = -8 }

[feature.bridge_east]
on = { ref = "beck", t = 0.5, offset = 8 }

[feature.harbour_bridge]
kind      = "crossing"
starts_at = "bridge_west"
ends_at   = "bridge_east"
path      = []
crosses   = "beck"
width     = 4
deck_z    = 3.6

[feature.shore_west]                          # from the headland's flank to the bridge
kind    = "lane"
path    = [[146, 96]]
ends_at = "harbour_bridge.start"

[feature.shore_east]                          # from the bridge on east
kind      = "lane"
starts_at = "harbour_bridge.end"
path      = [[198, 94]]

# ------------------------------------------------------------------------------------------ steps

[step.parapet]                                # lib/ways: the deck's two rows of posts
when     = "generate"
worker   = true
for_each = "kind:crossing"
command  = ["python", "-m", "viasdk", "lib:ways/parapet.py"]
params   = { asset = "fence_post", spacing = 2 }

[step.crossings]                              # lib/ways: water under the deck, its ends met
when    = "lint"
worker  = true
command = ["python", "-m", "viasdk", "lib:ways/check.py"]

# The player map (lib/map, build.md 9.4): an export step, run after the lints on the finished
# build, writing `export/map/` (build.md 11.4).

[step.map]
when    = "export"
output  = "player_map"                            # build.md 9.4: how a reader finds it
command = ["python", "-m", "viasdk", "lib:map/export.py"]

[step.map.params]
cell   = 1.0
ways   = { lane = "lane", crossing = "bridge", cave = "cave" }
under  = ["cave"]                                  # the cave runs under the headland
water  = { beck = "stream" }
labels = { crossing = "", cave = "", sheer_cliff = "", beck = "" }
