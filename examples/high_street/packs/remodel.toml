# Written by make_cases.py from kenney.toml: the windows block swapped for Kenney's large window. Do not edit; edit kenney.toml.

# Kenney's Modular Buildings 2.1 (CC0 1.0, www.kenney.nl; credit is not required, and given here)
# at a person's size: the pack examples/high_street is laid by (the fix plan's T1). The models are
# the ones examples/borrowed/fetch.py fetches into examples/borrowed/packs/kenney/, never
# committed; this file and kenney.facts.toml (written by `via pack accept`) are.
#
# The kit is made at a quarter of a person's size: a doorway 0.25 wide and 0.5 high, a storey
# 0.625 (examples/borrowed/README.md, "Scale"). `scale = 4` reads every model four times larger
# (spec/assets.md 2.4), so a doorway is 1 m by 2 m, a storey 2.5 m and a block 4 m. What the kit
# states is in metres, so it is stated here at this size: this is not an include of borrowed's
# pack, whose `shared` lengths are the kit's own units read as metres (docs/plan-fixes.md, T1).
#
# What this pack says that the kit as handed over does not, each for a reason K10 found
# (examples/borrowed/README.md, "What the pack states"): `front = "+x"` on the corner, the hip and
# the parapet's corner; the doorway's width, `shared.door`; the flat roof's tile as a roof piece;
# how far the slanted roof reaches past the wall, `shared.eaves`.

root = "../../borrowed/packs/kenney"

[material.ground]
colour = [0.45, 0.5, 0.4]

[material.grass]
colour = [0.27, 0.42, 0.2]

[material.flags]
colour = [0.62, 0.6, 0.56]

[material.setts]
colour = [0.38, 0.36, 0.34]

[taxon."structure"]
defaults = { collision = "box", scale = 4 }

[taxon."structure/kenney".defaults.shared]
module = 4.0                     # a building block's side in plan
wall   = 4.0                     # a block is the wall: a building is blocks round its outline
storey = 2.5                     # a building block's height
plinth = 0                       # no base: a block stands its floor on the ground
door   = 1.0                     # the doorway through the door block
eaves  = 0.556                   # how far the slanted roof reaches past the wall's face
# The kit has no stair, and its blocks are closed, so a building has no inside to climb. lay
# asks a stair of every building of two storeys (lay.py rule 3), so one is stated: borrowed's
# house's, at this size. It lays no piece; it is a stairwell no one sees (TODO, lib/building).
stair  = { width = 1.6, run = 8.0, landing = 1.0 }

# The bay: a block, plain on every face, and three with windows on their front.
[asset.block]
file  = "building-block.glb"
taxon = "structure/kenney"
tags  = ["role:wall"]

[asset.window]
file  = "building-window.glb"
taxon = "structure/kenney"
tags  = ["role:wall", "variant:window"]

[asset.windows]
file  = "building-window-large.glb"
taxon = "structure/kenney"
tags  = ["role:wall", "variant:windows"]

[asset.wide]
file  = "building-window-wide.glb"
taxon = "structure/kenney"
tags  = ["role:wall", "variant:wide"]

[asset.corner]
file  = "building-corner.glb"
taxon = "structure/kenney"
tags  = ["role:corner"]
front = "+x"
plan  = true                     # its bevel measured, so `check` holds its turn (fix plan F5b)

[asset.door]
file  = "building-door.glb"
taxon = "structure/kenney"
tags  = ["role:door"]

[asset.roof_tile]
file  = "roof-flat-center.glb"
taxon = "structure/kenney"
tags  = ["role:roof_flat"]

[asset.slope]
file  = "roof-slanted.glb"
taxon = "structure/kenney"
tags  = ["role:roof_slope"]

[asset.hip]
file  = "roof-slanted-corner-a.glb"
taxon = "structure/kenney"
tags  = ["role:roof_hip"]
front = "+x"

[asset.parapet]
file  = "roof-flat-border-side.glb"
taxon = "structure/kenney"
tags  = ["role:wall", "storey:parapet"]

[asset.parapet_corner]
file  = "roof-flat-border-corner.glb"
taxon = "structure/kenney"
tags  = ["role:corner", "storey:parapet"]
front = "+x"
