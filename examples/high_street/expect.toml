# What a high_street build measures (docs/plan-fixes.md, T1: a market street of Kenney's kit at a
# person's size, challenge 33). Measures, never bytes (R15): each row names a measure of
# measure.py and the band it must fall in. Taken by
#
#   python3 examples/high_street/measure.py BUILD --world examples/high_street/world.toml --run BUILD.run.json   # base
#   python3 examples/high_street/measure.py BUILD+<c> --base BUILD --run BUILD+<c>.run.json                      # a change, built with --against
#   python3.11 examples/high_street/measure.py ... --check <section>
#
# Protocol of the numbers below: macOS arm64, release `via` built from the tree at e1fc651 (F6)
# with T1's one engine mend (`build.pack_root_far` for a pack whose root climbs), VIA_LIB=lib of the
# working tree with T1's library changes and its review's fix pass (row.py rules 10 and 11, a row's
# fault said at that row; a plot kept off a party wall, its own ground level over every plot's
# bank; check reading a party wall from the outlines), Python 3.12 (sdk/python/.venv) for the steps,
# Kenney's models as examples/borrowed/fetch.py fetches them (SHA-256 of the zip in its README).
# One fresh store: the base, then each change with --against the base, one build each. Measured
# 2026-11-25 in one run and checked in a second. A band is the measured number: not a target, it
# says where someone looks. A time's band is wide: it is the machine's, and the row says only that
# the build finished in that time.


# ------------------------------------------------------------------------------------------ base
# The street as written: 19 feature tables and 78 numbers (the streets, five frontage lines,
# five rows on their lines, three views on the streets). The rows return 49 houses of one to three
# storeys, 12 to 20 m across their fronts, every door on its street, no two houses in one place;
# 2320 pieces. No warning: each house stands on its own level plot, the lane's terrace steps at
# its party walls, and every post inside every house is its plot's level (read from the height
# field, once, by T1's fix pass: within 0.000001 m).

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]
