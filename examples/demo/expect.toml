# What a demo build measures (docs/design/demo.md; D of docs/plan-fixes.md). Measures, never bytes
# (R15): each row names a measure of measure.py and the band it must fall in. The hero picture and
# the sweep read every figure they show from these measures (compose.py). Taken by
#
#   python3 examples/demo/sweep.py OUT          # the base and every step, built, drawn, measured
#   python3.11 examples/demo/measure.py OUT/builds/base --world examples/demo/world.toml --run OUT/builds/base.run.json --check base
#   python3.11 examples/demo/measure.py OUT/builds/y165 --base OUT/builds/base --run OUT/builds/y165.run.json --check north
#
# Protocol of the numbers below: macOS arm64 (Apple M4 Pro), release `via` built from 421f3c8 (`build_ms` of a build, `nodes_ran` the run record's `ran`: nodes run again, not counting the 70 or so only recomputed),
# VIA_LIB=lib of 30bc488 with D's knobs (row.py rule 12, after its review's fix), Python 3.12 (sdk/python/.venv) for the steps, Kenney's models as
# examples/borrowed/fetch.py fetches them and the starter pack's own. sweep.py's order on one fresh
# store: the base (the high street at y = 125), then the step at 165 (`north`, which
# changes/north.toml is), then 130, 135 ... 160, each a build of its own change, none `--against`.
# So `north` is the change built straight after the base, as README.md's commands build it.
# Measured 2026-11-25 in one run. A band is the measured number: not a target, it says where
# someone looks. A time's band is wide: it is the machine's, and the row says only that the build
# finished in that time.
#
# The knobs (`knob_<name>` sections): each change file of changes/ turned alone, built by
# timelapse.py on its own fresh store after its eight timelapse states, measured against that
# store's base (the same world, the same build digest as the sweep's base:
# 8199a6edc5115380...).


# ------------------------------------------------------------------------------------------ base
# The world as written: the high street at y = 125. Every house a row laid, every tree a scatter.

[base.errors]
measure = "errors"
band    = [0, 0]

[base.warnings]
measure = "warnings"
band    = [0, 0]

[base.rows]
measure = "rows"
band    = [5, 5]

[base.buildings]
