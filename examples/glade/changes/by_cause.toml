[field.steep]
base = "= smoothstep(20, 28, slope('height'))"
[scatter.trees]
spacing = 12
scale = [0.9, 1.35]
clump = { members = [2, 5], radius = 6.5, shrink = 0.4 }
[scatter.bushes]
spacing = 3.2
density = "= 0.55 * smoothstep(0.1, 0.5, fbm(18, 2, seed = 'thicket'))"
scale = [0.6, 1.3]
clump = { around = "trees", radius = 5 }
[scatter.banks]
assets = ["@plant/bush"]
spacing = 3.2
density = "= max(0.5 * smoothstep(5, 7, dist('stream', 12)) * (1 - smoothstep(8, 11, dist('stream', 12))), 0.6 * smoothstep(5, 7, dist('track', 12)) * (1 - smoothstep(8, 10, dist('track', 12))))"
scale = [0.6, 1.3]
[scatter.tufts]
assets = ["fern_low"]
spacing = 1.2
density = "= 0.8"
scale = [0.7, 1.3]
clump = { around = "bushes", radius = 1.6 }
[scatter.stones]
spacing = 3.6
density = "= max(0.7 * (1 - smoothstep(5, 9, dist('stream', 12))) * smoothstep(-0.1, 0.4, fbm(9, 2, seed = 'pebbles')), 0.5 * f('steep'))"
scale = [0.4, 1]
clump = { members = [0, 3], radius = 2.2, shrink = 0.5 }
[scatter.logs]
spacing = 7
density = "= 0.5 * smoothstep(0.15, 0.4, f('cover')) * (1 - smoothstep(0.55, 0.8, f('cover')))"
clump = { around = "trees", radius = 7 }
