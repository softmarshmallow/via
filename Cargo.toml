[workspace]
resolver = "2"
members = [
    # The engine, in rings from the centre outward (docs/layers.md): the substrate (num, diag, doc,
    # expr, geom, raster, graph), the model, the door (proto, step) and the command (cli). A crate
    # depends only on its own ring or one nearer the centre, and the model and the door not on
    # each other; `python3 tools/layers_check.py` reads every manifest and holds it.
    "crates/via-num",
    "crates/via-diag",
    "crates/via-doc",
    "crates/via-expr",
    "crates/via-geom",
    "crates/via-raster",
    "crates/via-graph",
    "crates/via-model",
    "crates/via-proto",
    "crates/via-cli",
    "crates/via-step",
    # Repository checks (deny-list, maths through via-num, the function table).
    "crates/xtask",
    # The library ring, outside the deny-list: lib/terrain's program, the erosion model carried over
    # from the old workspace (docs/plan.md, "Carried over"; spec/protocol.md 8). It links the door
    # and the substrate, never the model.
    "crates/via-terrain",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
# rayon: the erosion model's parallel loops (via-terrain), at any thread count the same bits.
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
insta = { version = "1", features = ["json"] }

via-num = { path = "crates/via-num" }
via-diag = { path = "crates/via-diag" }
via-doc = { path = "crates/via-doc" }
via-expr = { path = "crates/via-expr" }
via-geom = { path = "crates/via-geom" }
via-raster = { path = "crates/via-raster" }
via-graph = { path = "crates/via-graph" }
via-model = { path = "crates/via-model" }
via-proto = { path = "crates/via-proto" }
via-step = { path = "crates/via-step" }
via-terrain = { path = "crates/via-terrain" }

# Applied by every crate with `[lints] workspace = true`, via-terrain included.
[workspace.lints.clippy]
# R26 and numbers.md 8: every float operation beyond the allow-list goes through via-num. The list
# itself is clippy.toml. via-num opts in too: it computes through libm, not these methods, and any
# use it does need is a local `#[allow]` with its reason.
disallowed_methods = "deny"

[profile.release]
debug = true

[profile.dev]
opt-level = 2
